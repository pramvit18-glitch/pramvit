<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f3">
<title>สั่งเครป</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  /* ===================== ธีม =====================
     ลอกค่ามาจาก index.html ทั้งชุด ห้ามแก้ให้ต่างกัน
     ลูกค้ากับแม่ค้าต้องเห็นแอปหน้าตาเดียวกัน ไม่ใช่คนละเว็บ
     พื้นเทาอ่อน + การ์ดขาวมนไม่มีเส้นขอบมีเงานุ่ม + สีหลักแดง · ไม่มีโหมดมืด */
  :root{
    --page:#eef0f3;          /* พื้นหลังหน้า เทาอ่อน */
    --bg:#ffffff;            /* พื้นผิวการ์ด / ช่องกรอก */
    --soft:#f4f5f7;          /* แถบอ่อน พื้นช่องกรอก */
    --tint:#fdecec;          /* แดงอ่อนมาก */
    --line:#e5e7ea;
    --line-2:#eef0f3;

    --ink:#16181c;           /* ดำอมน้ำเงิน อ่านสบายกว่าดำล้วน */
    --ink-2:#4b5059;
    --muted:#8d939c;

    --brand:#d32b2b;
    --brand-d:#a81f1f;
    --brand-l:#f6b9b9;
    --brand-mid:#e8605f;
    --r:12px;
    --r-pill:999px;
    --sh-card:0 6px 22px rgba(22,24,28,.07), 0 1px 3px rgba(22,24,28,.05);
    --sh-lift:0 10px 30px rgba(22,24,28,.12);

    --good:#15803d;  --good-ink:#15803d;  --good-bg:#edf7f0;
    --warn:#a16207;  --warn-ink:#8a5a06;  --warn-bg:#fdf6e3;
    --bad:#b91c1c;   --bad-ink:#b91c1c;   --bad-bg:#fdeeee;

    --ease:cubic-bezier(.2,.9,.3,1);
    /* โค้งสปริง: วิ่งเลยจุดหมายไปนิดแล้วถอยมานิ่ง ทำให้รู้สึกมีชีวิต (ชุดเดียวกับแอปร้าน) */
    --spring:cubic-bezier(.34,1.56,.64,1);
    --tap-in:.06s;
    --tap-out:.34s;
    color-scheme: light;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--page); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Thai', 'Sarabun', sans-serif;
    font-size:15px; line-height:1.5;
    padding-bottom:calc(120px + env(safe-area-inset-bottom, 0px));
  }
  .shell{max-width:640px; margin:0 auto; padding:0 18px}

  /* ===================== หัวหน้า ===================== */
  .appbar{
    display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px;
    padding:12px 0 4px;
  }
  .titles{min-width:0}
  .titles h1{
    margin:0; font-size:25px; font-weight:800; letter-spacing:-.025em; line-height:1.2;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .titles p{
    margin:2px 0 0; font-size:12px; color:var(--muted); font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .appbar-ic{
    width:42px; height:42px; flex:0 0 auto; border-radius:var(--r); display:grid; place-items:center;
    background:linear-gradient(145deg, var(--brand-mid), var(--brand-d)); color:#fff;
    box-shadow:0 6px 16px rgba(211,43,43,.3);
  }
  .appbar-ic svg{width:20px; height:20px}

  /* ===================== การ์ด ===================== */
  .card{
    background:var(--bg); border-radius:var(--r); box-shadow:var(--sh-card);
    padding:18px; margin-bottom:14px;
  }
  .card:last-child{margin-bottom:0}
  .card-head{display:flex; align-items:flex-start; gap:12px; margin-bottom:14px}
  .ic-tile{
    width:38px; height:38px; flex:0 0 auto; border-radius:var(--r);
    background:var(--tint); color:var(--brand); display:grid; place-items:center;
  }
  .card-head-t{flex:1; min-width:0}
  .card-head-t h2{margin:0; font-size:16px; font-weight:800; letter-spacing:-.02em}
  .card-head-t p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .card-head-t p:empty{display:none}
  .head-tag{
    flex:0 0 auto; align-self:center; font-size:11.5px; font-weight:800; color:var(--brand);
    background:var(--bg); border:1.5px solid var(--brand-l); border-radius:var(--r-pill);
    padding:4px 11px; white-space:nowrap; letter-spacing:.02em;
  }
  .hint{margin:12px 0 0; font-size:12.5px; color:var(--muted); line-height:1.6}

  .note{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--soft); color:var(--ink-2);
    border-radius:var(--r); padding:13px 15px; font-weight:700; font-size:13.5px; line-height:1.55;
  }
  .note + .note{margin-top:10px}
  .note.bad{background:var(--bad-bg); color:var(--bad-ink)}
  .note.ok{background:var(--good-bg); color:var(--good-ink)}
  .note.warn{background:var(--warn-bg); color:var(--warn-ink)}
  .note svg{flex:0 0 auto; margin-top:1px}

  /* ===================== รายการเมนู ===================== */
  .list{display:flex; flex-direction:column}
  .li{
    display:flex; align-items:center; gap:12px; width:100%;
    border:none; background:none; font:inherit; color:inherit; text-align:left;
    padding:12px 10px; margin:0 -10px; border-radius:var(--r);
    border-bottom:1px solid var(--line-2); cursor:pointer; transition:background .14s;
  }
  .li:last-of-type{border-bottom:none}
  .li:hover{background:var(--soft)}
  .av{
    width:38px; height:38px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center;
    background:var(--tint); color:var(--brand-d); font-weight:800; font-size:15px;
  }
  /* ข้างในเป็น <span> เพราะอยู่ใน <button> ต้องสั่ง block เอง
     ไม่งั้นชื่อเมนูกับคำอธิบายไหลไปอยู่บรรทัดเดียวกัน */
  .li-main{flex:1; min-width:0; display:block}
  .li-title{display:block; font-weight:700; font-size:15px}
  .li-sub{display:block; font-size:12.5px; color:var(--muted); margin-top:2px}
  .pricetag{
    margin-left:7px; font-size:12px; font-weight:800; color:var(--brand-d);
    background:var(--tint); border-radius:var(--r-pill); padding:2px 9px; white-space:nowrap;
  }
  .li-end{display:flex; align-items:center; gap:9px; flex:0 0 auto}
  .li-p{font-weight:800; font-size:15px; font-variant-numeric:tabular-nums}
  .li-chev{color:var(--muted); display:grid; place-items:center}
  .li-del{
    width:30px; height:30px; border-radius:var(--r); border:1px solid var(--line);
    background:var(--bg); color:var(--muted); cursor:pointer; display:grid; place-items:center;
  }
  .li-del:hover{color:var(--bad); border-color:var(--bad)}

  /* ===================== ชิปเลือกไส้ =====================
     ชื่อคลาสต้องเป็น .tops .top เหมือนแอปร้าน จะได้ลอกกฎมาใช้ได้ตรง ๆ */
  .gname{font-size:11px; color:var(--muted); font-weight:800; letter-spacing:.09em;
         text-transform:uppercase; margin:18px 0 9px}
  .gname:first-child{margin-top:4px}
  .tops{display:flex; flex-wrap:wrap; gap:8px}
  .tops .top{
    border:1.5px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:var(--r-pill); padding:9px 15px; cursor:pointer; font:inherit;
    font-weight:700; font-size:13.5px; transition:.16s;
  }
  .tops .top b{color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums}
  .tops .top:hover{border-color:var(--brand)}
  .tops .top::before{content:'✓'; margin-right:5px; font-weight:900; opacity:0; transition:opacity .12s}
  .tops .top.on{background:var(--tint); border-color:var(--brand); color:var(--brand-d)}
  .tops .top.on b{color:var(--brand-d)}
  .tops .top.on::before{opacity:1}

  /* ===================== ปุ่ม ===================== */
  .btn{
    cursor:pointer; border:none; background:var(--bg); box-shadow:var(--sh-card);
    color:var(--ink); padding:13px 20px; border-radius:var(--r-pill);
    font-weight:800; font-size:14.5px; transition:.16s; display:inline-flex;
    align-items:center; gap:7px; justify-content:center;
  }
  .btn:active{transform:scale(.975)}
  .btn:hover{color:var(--brand)}
  .btn.primary{background:var(--brand); color:#fff; box-shadow:0 8px 20px rgba(211,43,43,.3)}
  .btn.primary:hover{background:var(--brand-d); color:#fff}
  .btn.primary:disabled{opacity:.5; box-shadow:none}
  .btn.ghost{background:transparent; box-shadow:none; color:var(--ink-2)}
  .btn.ghost:hover{background:var(--soft); color:var(--ink)}
  .btn.block{width:100%}
  .btn svg{width:16px; height:16px}

  /* ===================== ตัวนับจำนวน ===================== */
  .qrow{display:flex; align-items:center; gap:14px; margin-top:20px}
  .qrow > span{flex:1; font-weight:800}
  .qbtn{
    width:40px; height:40px; border-radius:50%; border:1.5px solid var(--line); cursor:pointer;
    background:var(--bg); color:var(--ink); font-size:20px; font-weight:800; line-height:1;
    display:grid; place-items:center; transition:.16s;
  }
  .qbtn:hover:not(:disabled){border-color:var(--brand); color:var(--brand)}
  .qbtn:active:not(:disabled){transform:scale(.92)}
  .qbtn:disabled{opacity:.35; cursor:default}
  .qn{min-width:34px; text-align:center; font-size:19px; font-weight:800; font-variant-numeric:tabular-nums}

  /* ===================== ฟอร์ม ===================== */
  .f{display:flex; flex-direction:column; gap:6px; min-width:0}
  .f + .f{margin-top:14px}
  .f label{font-size:12px; color:var(--ink-2); font-weight:700}
  input,textarea{
    font:inherit; width:100%; color:var(--ink); background:var(--soft);
    border:1px solid var(--line); border-radius:var(--r); padding:12px 13px; transition:.16s;
  }
  input:focus,textarea:focus{
    outline:none; border-color:var(--brand); background:var(--bg);
    box-shadow:0 0 0 3px var(--tint);
  }
  textarea{resize:vertical}

  /* ===================== แถบรวมเงินล่างจอ =====================
     ทรงเดียวกับแถบเมนูล่างของแอปร้าน: แคปซูลขาวลอยเหนือพื้น */
  .bar{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(10px + env(safe-area-inset-bottom, 0px));
    width:calc(100% - 24px); max-width:604px; z-index:25;
    display:flex; align-items:center; gap:12px;
    background:var(--bg); border-radius:var(--r); box-shadow:var(--sh-lift);
    padding:10px 10px 10px 18px;
  }
  .bar[hidden]{display:none}
  .bar-t{flex:1; min-width:0}
  .bar-t b{display:block; font-size:19px; font-weight:800; font-variant-numeric:tabular-nums;
           letter-spacing:-.03em}
  .bar-t span{display:block; font-size:11.5px; color:var(--muted); font-weight:700}

  /* ===================== กล่องเลือกไส้ ===================== */
  dialog{
    border:none; padding:0; color:var(--ink); background:var(--bg);
    width:100%; max-width:640px; max-height:92dvh; overflow:auto;
    margin:auto auto 0; border-radius:var(--r) var(--r) 0 0;
    padding-bottom:env(safe-area-inset-bottom, 0px);
    box-shadow:0 -10px 50px rgba(22,24,28,.25);
  }
  dialog::backdrop{
    background:rgba(22,24,28,.34);
    -webkit-backdrop-filter:blur(7px) saturate(.9);
    backdrop-filter:blur(7px) saturate(.9);
  }
  dialog[open]{animation:sheet .3s cubic-bezier(.17,.84,.26,1)}
  dialog[open]::backdrop{animation:dlgfade .26s ease}
  /* เลื่อนเข้ามาจากขวา ให้ตรงกับแอปร้าน (ดูคู่มือหัวข้อ "หน้าตาต้องเหมือนแอปร้าน") */
  @keyframes sheet{from{transform:translateX(100%)} to{transform:translateX(0)}}
  @keyframes dlgfade{from{opacity:0} to{opacity:1}}

  .dlg-grip{width:38px; height:4px; border-radius:var(--r-pill); background:var(--line); margin:11px auto 7px}
  .dlg-head{padding:3px 20px 13px; display:flex; align-items:flex-start; gap:12px}
  .dlg-head-t{flex:1; min-width:0}
  .dlg-head h3{margin:0; font-size:21px; font-weight:800; letter-spacing:-.035em; line-height:1.25}
  .dlg-head p{margin:4px 0 0; font-size:13px; color:var(--muted); line-height:1.5}
  .dlg-x{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%; cursor:pointer;
    border:none; background:var(--soft); color:var(--ink-2);
    display:grid; place-items:center; transition:.16s;
  }
  .dlg-x svg{width:16px; height:16px}
  .dlg-x:hover{background:var(--tint); color:var(--brand-d)}
  .dlg-body{padding:0 20px}
  .dlg-foot{padding:18px 20px 22px; display:flex; gap:10px}
  .dlg-foot .btn{flex:1; padding:14px 18px; font-size:15px}
  .dlg-foot .btn.primary{flex:1.5}
  .dlg-foot .btn.ghost{flex:0 1 auto; padding-left:18px; padding-right:18px}

  /* ===================== หน้ารอคิว ===================== */
  .qbig{text-align:center; padding:10px 0 4px}
  .qbig b{display:block; font-size:62px; font-weight:800; line-height:1; letter-spacing:-.05em; color:var(--brand)}
  .qbig span{display:block; font-size:12.5px; color:var(--muted); font-weight:700; margin-top:9px}
  .steps{display:flex; gap:8px; margin:20px 0 16px}
  .step{flex:1; text-align:center; font-size:11.5px; font-weight:800; color:var(--muted)}
  .step i{display:block; height:5px; border-radius:var(--r-pill); background:var(--line); margin-bottom:8px}
  .step.on{color:var(--brand)}
  .step.on i{background:var(--brand)}

  /* ---------- ภาพเคลื่อนไหวตอนรอคิว ----------
     ลูกค้ายืนจ้องหน้านี้อยู่ ถ้านิ่งสนิทจะไม่แน่ใจว่าแอปยังทำงานอยู่ไหม
     ขยับเฉพาะจุดที่บอกสถานะ ไม่ขยับทั้งหน้าจนลายตา */

  /* รอร้านกดรับ: จุดสามจุดเด้งไล่กัน แบบเดียวกับตอนอีกฝ่ายพิมพ์อยู่ในแชต */
  /* ต้องเจาะจงกว่า .qbig b ไม่งั้นโดน display:block ของเลขคิวทับ แล้วจุดหายไปเลย
     (i เป็น inline โดยปริยาย ถ้าไม่ได้อยู่ใน flex มันจะไม่กินความกว้าง-สูงที่ตั้งไว้) */
  .qbig b.dots{display:flex; gap:11px; justify-content:center; padding:14px 0 10px; font-size:0}
  .qbig b.dots i{
    display:block; width:14px; height:14px; border-radius:50%; background:var(--brand-l);
    animation:dot 1.25s var(--ease) infinite;
  }
  .qbig b.dots i:nth-child(2){animation-delay:.16s}
  .qbig b.dots i:nth-child(3){animation-delay:.32s}
  @keyframes dot{
    0%,70%,100%{transform:translateY(0);      background:var(--brand-l)}
    35%        {transform:translateY(-9px);   background:var(--brand)}
  }

  /* กำลังทำ: แถบขั้นตอนที่ทำอยู่มีแสงวิ่งผ่าน บอกว่ายังเดินหน้าอยู่ */
  .step.cur i{
    background:linear-gradient(90deg, var(--brand) 0%, var(--brand) 35%,
               var(--brand-l) 50%, var(--brand) 65%, var(--brand) 100%);
    background-size:260% 100%;
    animation:flow 1.6s linear infinite;
  }
  @keyframes flow{from{background-position:140% 0} to{background-position:-140% 0}}

  /* เลขคิวหายใจเบา ๆ ตอนร้านกำลังทำของเรา */
  .qbig b.live{animation:breathe 2.1s var(--ease) infinite}
  @keyframes breathe{
    0%,100%{transform:scale(1)}
    50%    {transform:scale(1.07)}
  }

  /* ของเสร็จ: ไอคอนเด้งเข้ามาทีเดียว ไม่วนซ้ำ จะได้ไม่กวนตอนอ่าน */
  .empty.thanks .empty-ic{animation:pop .5s var(--spring) both}
  @keyframes pop{
    from{transform:scale(.6); opacity:0}
    to  {transform:scale(1);  opacity:1}
  }

  /* การ์ดออเดอร์ค่อย ๆ ลอยขึ้นมาตอนเปิดหน้า ไม่ใช่โผล่ตึงเดียว */
  .card.rise{animation:rise .34s var(--ease) both}
  .card.rise:nth-of-type(2){animation-delay:.05s}
  .card.rise:nth-of-type(3){animation-delay:.1s}
  @keyframes rise{
    from{transform:translateY(10px); opacity:0}
    to  {transform:translateY(0);    opacity:1}
  }

  .sumrow{display:flex; align-items:center; gap:12px; padding:13px 0; border-top:1px solid var(--line)}
  .sumrow b{flex:0 0 auto; font-size:17px; font-weight:800; font-variant-numeric:tabular-nums}
  .sumrow span{flex:1; font-weight:800}

  .empty{text-align:center; padding:40px 10px; color:var(--muted); font-size:13.5px}
  .empty-ic{width:62px; height:62px; margin:0 auto 16px; border-radius:var(--r);
            background:var(--tint); color:var(--brand); display:grid; place-items:center}
  .empty-ic svg{width:30px; height:30px}
  .empty h3{margin:0 0 7px; font-size:18px; font-weight:800; color:var(--ink); letter-spacing:-.03em}
  .empty p{margin:0 auto; max-width:300px; line-height:1.65}

  /* หน้า "สั่งไม่ได้ตอนนี้" — ลูกค้าต้องเห็นแล้วรู้ทันที ไม่ต้องอ่าน
     รูปใหญ่กว่าปกติเท่าตัว เพราะทั้งหน้ามีอยู่แค่นี้ */
  /* คำขอบคุณหลังลูกค้าสั่งเสร็จ — เด่นแต่ไม่กินที่เท่าหน้า "สั่งไม่ได้" */
  .empty.thanks{padding:30px 14px 26px}
  .empty.thanks .empty-ic{width:76px; height:76px; border-radius:22px; margin-bottom:18px}
  .empty.thanks .empty-ic svg{width:38px; height:38px}
  .empty.thanks h3{font-size:21px; margin-bottom:8px}
  .empty.thanks p{font-size:14px}

  /* ป้ายพาไปดูคิวของตัวเอง (อยู่บนหน้าเลือกของ) */
  .banner{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    border:none; font:inherit; color:inherit; cursor:pointer; padding:14px 16px;
  }
  .banner-t{display:block; font-size:15px; font-weight:800; letter-spacing:-.01em}
  .banner-s{display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin-top:2px}

  .empty.big{padding:56px 14px 60px}
  .empty.big .empty-ic{width:96px; height:96px; border-radius:26px; margin-bottom:22px}
  .empty.big .empty-ic svg{width:46px; height:46px}
  .empty.big h3{font-size:23px; margin-bottom:10px}
  .empty.big p{font-size:14.5px; max-width:260px}

  .foot[hidden]{display:none}
  .foot{text-align:center; font-size:12px; color:var(--muted); padding:16px 0 4px; font-weight:600}

  /* แตะแล้วยุบลงนิดเหมือนแอปร้าน จะได้รู้สึกว่าแอปรับรู้ว่าเรากด */
  .li:active, .tops .top:active{transform:scale(.985); transition:transform var(--tap-in) var(--ease)}
  .li, .tops .top{transition:transform var(--tap-out) var(--ease), background .14s, border-color .16s}

  @media(prefers-reduced-motion:reduce){
    .qbig b.dots i, .step.cur i, .qbig b.live, .empty.thanks .empty-ic, .card.rise{animation:none}
    .step.cur i{background:var(--brand)}
    dialog[open], dialog[open]::backdrop{animation:none}
    dialog::backdrop{-webkit-backdrop-filter:none; backdrop-filter:none}
  }
</style>
</head>
<body>

<div class="shell">
  <header class="appbar">
    <div class="titles">
      <h1 id="shopName">กำลังโหลด…</h1>
      <p id="shopSub">ขอสักครู่นะครับ</p>
    </div>
    <span class="appbar-ic" id="appbarIc" aria-hidden="true"></span>
  </header>
  <div id="view"></div>
  <p class="foot" id="foot">สั่งแล้วมารับที่ร้าน · จ่ายเงินตอนรับของ</p>
</div>

<div class="bar" id="bar" hidden>
  <div class="bar-t"><b id="barTotal">฿0</b><span id="barCount">ยังไม่ได้เลือกอะไร</span></div>
  <button class="btn primary" id="barBtn" onclick="goSend()">สั่งเลย</button>
</div>

<dialog id="dlg"><div id="sheet"></div></dialog>

<script>
/* ===================== หน้าสำหรับลูกค้าสั่งของ =====================
   แยกจากแอปแม่ค้าคนละไฟล์คนละลิงก์ หน้านี้ไม่มีข้อมูลต้นทุนหรือยอดขายเลย
   เห็นแค่ชื่อร้าน เมนู ราคา และออเดอร์ของตัวเอง

   ที่เก็บออเดอร์กลางคือ Firebase Realtime Database คุยกันผ่าน REST ธรรมดา
   จึงไม่ต้องโหลด SDK ไม่ต้องมี build step เหมือนกับแอปแม่ค้า */

// ที่เก็บออเดอร์กลาง — ต้องตรงกับใน index.html
// ใส่แค่ชื่อโปรเจกต์ Firebase ก็พอ เดี๋ยวหา URL เต็ม (ที่มีชื่อโซนปนอยู่) ให้เอง
const CLOUD_PROJECT = 'pramvit-order';
const CLOUD_BASE    = 'https://pramvit-order-default-rtdb.asia-southeast1.firebasedatabase.app';   // ที่เก็บจริง (ถ้าว่าง จะไล่หาจาก CLOUD_PROJECT เอง)
const BASE_CACHE    = 'crepe-order-base';  // จำ URL ที่หาเจอไว้ ลูกค้าคนเดิมจะได้ไม่ต้องหาซ้ำ

// เปิดจากเครื่องตัวเองตอนทดสอบเท่านั้น จึงจะยอมให้ลิงก์ชี้ที่เก็บเองได้
// ไม่งั้นใครก็สร้างลิงก์ปลอมที่โชว์เมนูมั่ว ๆ ใต้ที่อยู่เว็บของร้านได้
const isLocal = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);

const qs    = new URLSearchParams(location.search);
const SHOP  = (qs.get('s') || '').trim();
let   BASE  = ((isLocal && qs.get('c')) || CLOUD_BASE || '').replace(/\/+$/, '');

/* URL จริงของ Firebase มีชื่อโซนปนอยู่ เช่น
     https://pramvit-order-default-rtdb.asia-southeast1.firebasedatabase.app
   แทนที่จะฝังตายตัวแล้วพังถ้าร้านย้ายโซน ให้ลองยิงดูทีละโซนว่าอันไหนมีจริง
   ตอบ 200 = อ่านได้ · 401 = มีจริงแต่กฎไม่ให้อ่านตรงนั้น · 404 = ไม่มี ลองโซนถัดไป
   หาเจอแล้วจำไว้ในเครื่อง ลูกค้าคนเดิมเปิดรอบหน้าจะได้ไม่ต้องหาใหม่ */
const RTDB_ZONES = ['asia-southeast1', '', 'us-central1', 'europe-west1'];

async function findBase(){
  if(BASE) return BASE;
  try{ const c = localStorage.getItem(BASE_CACHE); if(c) return (BASE = c); }catch(e){}
  if(!CLOUD_PROJECT) return '';

  for(const z of RTDB_ZONES){
    const u = z ? `https://${CLOUD_PROJECT}-default-rtdb.${z}.firebasedatabase.app`
                : `https://${CLOUD_PROJECT}-default-rtdb.firebaseio.com`;
    try{
      const res = await fetch(`${u}/.json?shallow=true`);
      if(res.status === 200 || res.status === 401){
        BASE = u;
        try{ localStorage.setItem(BASE_CACHE, u); }catch(e){}
        return u;
      }
    }catch(e){}
  }
  return '';
}

const el  = id => document.getElementById(id);
const n   = v => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const baht = v => n(v).toLocaleString('th-TH', {maximumFractionDigits:2});

// ค่าที่เอาไปใส่ใน onclick ต้องกันทั้ง ' และ \ ไม่งั้นชื่อไส้ที่มีเครื่องหมายพวกนี้
// จะทำให้ปุ่มตายแบบไม่มี error (กับดักเดียวกับในแอปร้าน)
function jsq(s){
  return String(s == null ? '' : s)
    .replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"')
    .replace(/</g, '\\u003c').replace(/\r?\n/g, ' ');
}

/* ---------- ไอคอน (ชุดเดียวกับแอปร้าน) ---------- */
const SVG = {
  cart:'<path d="M3 4h2.2l2.3 10.5h9.4L19 7H6.2"/><circle cx="9.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/>',
  store:'<path d="M4 10h16v10H4z"/><path d="M4 10 6 4h12l2 6"/><path d="M9 20v-6h6v6"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h10"/>',
  ing:'<path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9.5 8a2.5 2.5 0 0 1 5 0"/>',
  check:'<path d="m5 13 4 4L19 7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  chev:'<path d="m9 5 7 7-7 7"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  today:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>',
  sum:'<path d="M5 20v-7M12 20V5M19 20v-4"/>'
};
const icon = (k,s=18) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${SVG[k]||''}</svg>`;

function cardHead(ic, title, sub, right){
  return `<div class="card-head">
    <span class="ic-tile">${icon(ic,18)}</span>
    <div class="card-head-t">
      <h2>${title}</h2>
      ${sub ? `<p>${sub}</p>` : ''}
    </div>
    ${right || ''}
  </div>`;
}

// ตัวอักษรแทนเมนูในวงกลม — ข้ามสระหน้าของไทย จะได้ไม่ซ้ำกันหมด (เหมือนแอปร้าน)
function initial(name){
  const t = String(name || '').trim();
  if(!t) return '?';
  const m = t.match(/[^\sเ-ไ]/);
  return (m ? m[0] : t[0]);
}

/* ---------- คุยกับที่เก็บออเดอร์ ---------- */
async function cloud(method, path, body){
  if(!BASE) throw new Error('ยังไม่ได้ตั้งที่เก็บออเดอร์');
  const res = await fetch(`${BASE}/${path}.json`, {
    method,
    headers: body === undefined ? undefined : {'Content-Type':'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if(!res.ok) throw new Error('ต่อไม่ติด (' + res.status + ')');
  return res.json();
}

/* ---------- สถานะหน้าจอ ---------- */
let menu = null;          // ใบเมนูที่แม่ค้าเผยแพร่ไว้
let cart = [];            // ของที่ลูกค้าเลือกไว้
let sentList = [];        // [{id, at}] ออเดอร์ที่ส่งไปแล้ว เรียงเก่าไปใหม่
let mineMap = {};         // {id: ออเดอร์ที่อ่านกลับมาจากที่เก็บ}
let mode = 'menu';        // 'menu' = กำลังเลือกของ · 'queue' = กำลังดูคิวของตัวเอง
let poll = null;

const SENT_KEY = 'crepe-order-sent-' + SHOP;
const KEEP_MS  = 6*3600*1000;   // จำออเดอร์ของตัวเองไว้ 6 ชม. (ตรงกับที่ฝั่งร้านลบทิ้ง)

function saveSent(){
  try{ localStorage.setItem(SENT_KEY, JSON.stringify(sentList)); }catch(e){}
}
// ออเดอร์ที่ยังไม่จบ — ใช้ตัดสินว่าต้องถามที่เก็บต่อไหม และโชว์ป้ายค้างไหม
const liveOrders = () => sentList.filter(x => {
  const o = mineMap[x.id];
  return !o || (o.status !== 'done' && o.status !== 'rej');
});

/* ===================== เริ่มทำงาน ===================== */
start();

async function start(){
  el('appbarIc').innerHTML = icon('cart', 20);
  await findBase();

  if(!SHOP || !BASE){
    head('ลิงก์ไม่ถูกต้อง', 'ลองสแกน QR ที่หน้าร้านอีกครั้ง');
    el('view').innerHTML = `<div class="card">
      <div class="note bad">${icon('x',17)}<span>ลิงก์นี้ไม่ได้บอกว่าเป็นร้านไหน ขอ QR หรือลิงก์จากทางร้านใหม่อีกครั้งนะครับ</span></div>
    </div>`;
    return;
  }

  // เคยสั่งค้างไว้ไหม (รีเฟรชหน้าแล้วต้องยังเห็นคิวของตัวเอง)
  try{
    const raw = JSON.parse(localStorage.getItem(SENT_KEY) || '[]');
    // ของเดิมเคยเก็บเป็นออเดอร์เดียว ไม่ใช่รายการ — รับได้ทั้งสองแบบ
    const arr = Array.isArray(raw) ? raw : [raw];
    sentList = arr.filter(x => x && x.id && Date.now() - n(x.at) < KEEP_MS);
    if(sentList.length !== arr.length) saveSent();
  }catch(e){ sentList = []; }

  try{
    menu = await cloud('GET', `s/${SHOP}/menu`);
  }catch(e){
    head('ต่อไม่ติด', 'เน็ตอาจหลุดอยู่');
    el('view').innerHTML = `<div class="card">
      <div class="note bad">${icon('x',17)}<span>ตอนนี้โหลดเมนูไม่ได้ ลองเช็กสัญญาณแล้วรีเฟรชหน้านี้อีกครั้งครับ</span></div>
    </div>`;
    return;
  }

  if(!menu || !Array.isArray(menu.menus) || !menu.menus.length){
    head('ยังไม่เปิดรับออเดอร์', 'สั่งที่หน้าร้านได้เลย');
    el('view').innerHTML = `<div class="card">
      <div class="note">${icon('store',17)}<span>ทางร้านยังไม่ได้เปิดให้สั่งผ่านหน้านี้ สั่งที่หน้าร้านได้เลยครับ</span></div>
    </div>`;
    return;
  }

  head(menu.name || 'สั่งของ', menu.branch || 'เลือกของที่อยากได้ แล้วกดสั่ง');

  if(sentList.length){ watchMine(); } else { draw(); }
}

function head(title, sub){
  el('shopName').textContent = title;
  el('shopSub').textContent  = sub || '';
}

/* ===================== หน้าเลือกของ ===================== */
function draw(){
  // ร้านปิด หรือแม่ค้ากดหยุดรับออเดอร์ทางนี้ = สั่งไม่ได้
  // taking ไม่มีค่า (ใบเมนูเก่าก่อนมีฟีเจอร์นี้) ให้ถือว่ารับอยู่
  const taking = menu.taking !== false;
  if(!menu.open || !taking){
    el('view').innerHTML = closedView(
      !menu.open ? 'ตอนนี้ร้านปิดอยู่'           : 'ยังไม่เปิดรับออเดอร์',
      !menu.open ? 'กลับมาใหม่ตอนร้านเปิดนะครับ' : 'ตอนนี้สั่งที่หน้าร้านได้เลยครับ');
    bar();
    return;
  }

  el('foot').hidden = false;
  mode = 'menu';
  el('view').innerHTML = `
    ${myOrdersBanner()}
    <div class="card">
      ${cardHead('menu', 'เลือกของที่อยากได้', 'แตะที่เมนู แล้วเลือกไส้กับจำนวน')}
      <div class="list">
        ${menu.menus.map((m, i) => `
          <button type="button" class="li" onclick="pick(${i})">
            <span class="av">${esc(initial(m.name))}</span>
            <span class="li-main">
              <span class="li-title">${esc(m.name)}</span>
              <span class="li-sub">${addonText(m)}</span>
            </span>
            <span class="li-end">
              <span class="li-p">฿${baht(m.price)}</span>
              <span class="li-chev">${icon('chev',16)}</span>
            </span>
          </button>`).join('')}
      </div>
    </div>
    ${cartCard()}`;
  bar();
}

/* สั่งไม่ได้ = ไม่โชว์เมนูเลย เหลือรูปใหญ่กับข้อความเดียว
   เจ้าของอยากให้ลูกค้าเห็นปุ๊บรู้ปั๊บ ไม่ต้องอ่านอะไรเยอะ
   ถ้าโชว์เมนูค้างไว้ ลูกค้าจะพยายามกดสั่งแล้วงงว่าทำไมกดไม่ได้ */
function closedView(title, sub){
  el('foot').hidden = true;        // ยังสั่งไม่ได้ บรรทัดนี้ไม่เกี่ยวแล้ว
  return `<div class="card">
    <div class="empty big">
      <div class="empty-ic">${icon('store',46)}</div>
      <h3>${esc(title)}</h3>
      <p>${esc(sub)}</p>
    </div>
  </div>`;
}

/* สั่งไปแล้วแต่กลับมาเลือกของเพิ่ม ต้องมีทางกลับไปดูคิวของตัวเองเสมอ
   ไม่งั้นลูกค้าจะคิดว่าออเดอร์แรกหายไปแล้ว */
function myOrdersBanner(){
  if(!sentList.length) return '';
  const nos = sentList.map(x => mineMap[x.id]).filter(o => o && o.no).map(o => o.no);
  const live = liveOrders().length;
  return `<button type="button" class="card banner" onclick="goQueue()">
    <span class="ic-tile">${icon('today',18)}</span>
    <span class="card-head-t">
      <span class="banner-t">${live ? 'ออเดอร์ของคุณกำลังทำอยู่' : 'ดูออเดอร์ที่สั่งไปแล้ว'}</span>
      <span class="banner-s">${nos.length ? 'คิวที่ ' + nos.map(x => esc(String(x))).join(', ')
                                           : 'รอร้านกดรับออเดอร์'} · แตะเพื่อดู</span>
    </span>
    <span class="li-chev">${icon('chev',16)}</span>
  </button>`;
}

function addonText(m){
  const gs = m.groups || [];
  if(!gs.length) return 'ไม่มีไส้ให้เลือก';
  const total = gs.reduce((s,g) => s + (g.items||[]).length, 0);
  return `เลือกไส้ได้ ${total} อย่าง`;
}

function cartCard(){
  if(!cart.length) return '';
  return `
    <div class="card">
      ${cardHead('cart', 'ที่เลือกไว้', 'แตะถังขยะเพื่อเอาออก',
        `<span class="head-tag">${cartCount()} ชิ้น</span>`)}
      <div class="list">
        ${cart.map((c, i) => `
          <div class="li" style="cursor:default">
            <span class="av">${esc(String(c.qty))}</span>
            <div class="li-main">
              <div class="li-title">${esc(c.name)}</div>
              ${c.addons.length ? `<div class="li-sub">${esc(c.addons.map(a => a.name).join(' · '))}</div>` : ''}
            </div>
            <div class="li-end">
              <span class="li-p">฿${baht(c.total)}</span>
              <button type="button" class="li-del" onclick="dropLine(${i})" aria-label="เอาออก">${icon('trash',15)}</button>
            </div>
          </div>`).join('')}
      </div>
    </div>`;
}

function dropLine(i){ cart.splice(i, 1); draw(); }

/* ---------- กล่องเลือกไส้ + จำนวน ---------- */
let edit = null;    // {mi, qty, picked:Set(ชื่อไส้)}

function pick(mi){
  edit = { mi, qty:1, picked:new Set() };
  drawSheet();
  el('dlg').showModal();
}

function drawSheet(){
  const m = menu.menus[edit.mi];
  const gs = m.groups || [];
  el('sheet').innerHTML = `
    <div class="dlg-grip"></div>
    <div class="dlg-head">
      <span class="ic-tile">${icon('ing',18)}</span>
      <div class="dlg-head-t">
        <h3>${esc(m.name)}</h3>
        <p id="sheetSub">${sheetSub()}</p>
      </div>
      <button type="button" class="dlg-x" onclick="dlg.close()" aria-label="ปิด">${icon('x',16)}</button>
    </div>
    <div class="dlg-body">
      ${gs.length ? gs.map(g => `
        <div class="gname">${esc(g.name)}</div>
        <div class="tops">
          ${(g.items||[]).map(it => `
            <button type="button" class="top${edit.picked.has(it.name) ? ' on' : ''}"
                    onclick="tog('${jsq(it.name)}', this)">
              ${esc(it.name)}${n(it.price) ? ` <b>+${baht(it.price)}</b>` : ''}
            </button>`).join('')}
        </div>`).join('')
      : `<div class="note">${icon('menu',17)}<span>เมนูนี้ไม่มีไส้ให้เลือก กดใส่ตะกร้าได้เลย</span></div>`}
      <div class="qrow">
        <span>จำนวน</span>
        <button type="button" class="qbtn" onclick="bump(-1)" ${edit.qty <= 1 ? 'disabled' : ''}>−</button>
        <span class="qn" id="qn">${edit.qty}</span>
        <button type="button" class="qbtn" onclick="bump(1)">+</button>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn ghost" onclick="dlg.close()">ยกเลิก</button>
      <button type="button" class="btn primary" onclick="addToCart()">${icon('plus',16)} ใส่ตะกร้า</button>
    </div>`;
}

function sheetSub(){
  const picked = [...edit.picked];
  if(!picked.length) return 'แตะเลือกไส้ที่อยากได้ เลือกได้หลายอย่าง';
  const extra = picked.reduce((s, nm) => s + n(findAddon(nm).price), 0);
  return picked.join(' · ') + (extra ? ` · +${baht(extra)} บาท` : '');
}

function findAddon(name){
  const m = menu.menus[edit.mi];
  for(const g of (m.groups || []))
    for(const it of (g.items || []))
      if(it.name === name) return it;
  return { name, price:0 };
}

function tog(name, btn){
  if(edit.picked.has(name)) edit.picked.delete(name); else edit.picked.add(name);
  // เปลี่ยนสีเฉพาะปุ่มที่กด ไม่วาดใหม่ทั้งกล่อง จะได้ไม่เด้งกลับขึ้นบนตอนเลื่อนหาไส้หวาน
  if(btn) btn.classList.toggle('on', edit.picked.has(name));
  el('sheetSub').textContent = sheetSub();
}

function bump(d){
  edit.qty = Math.max(1, edit.qty + d);
  drawSheet();
}

function addToCart(){
  const m = menu.menus[edit.mi];
  const addons = [...edit.picked].map(nm => ({ name:nm, price:n(findAddon(nm).price) }));
  const each = n(m.price) + addons.reduce((s,a) => s + a.price, 0);
  // id ติดไปด้วย เพื่อให้ฝั่งแม่ค้าผูกกลับเข้าเมนูเดิมได้ตอนบันทึกเป็นยอดขาย
  cart.push({ id:m.id, name:m.name, qty:edit.qty, price:n(m.price), addons, total: each * edit.qty });
  el('dlg').close();
  draw();
}

/* ---------- แถบรวมเงินล่างจอ ---------- */
const cartTotal = () => cart.reduce((s,c) => s + n(c.total), 0);
const cartCount = () => cart.reduce((s,c) => s + n(c.qty), 0);

function bar(){
  const b = el('bar');
  if(mode !== 'menu' || !cart.length || !menu.open){ b.hidden = true; return; }
  b.hidden = false;
  el('barTotal').textContent = '฿' + baht(cartTotal());
  el('barCount').textContent = `${cartCount()} ชิ้น`;
}

/* ===================== ส่งออเดอร์ ===================== */
function goSend(){
  el('sheet').innerHTML = `
    <div class="dlg-grip"></div>
    <div class="dlg-head">
      <span class="ic-tile">${icon('cart',18)}</span>
      <div class="dlg-head-t">
        <h3>ส่งออเดอร์</h3>
        <p>รวม ${cartCount()} ชิ้น ฿${baht(cartTotal())} · จ่ายตอนมารับของ</p>
      </div>
      <button type="button" class="dlg-x" onclick="dlg.close()" aria-label="ปิด">${icon('x',16)}</button>
    </div>
    <div class="dlg-body">
      <div class="f">
        <label for="who">ชื่อที่ให้เรียก (ไม่ใส่ก็ได้)</label>
        <input type="text" id="who" maxlength="20" placeholder="เช่น โอ๋">
      </div>
      <div class="f">
        <label for="note">บอกอะไรร้านเพิ่มไหม (ไม่ใส่ก็ได้)</label>
        <textarea id="note" rows="2" maxlength="120" placeholder="เช่น ไม่เอาผัก เผ็ดน้อย"></textarea>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn ghost" onclick="dlg.close()">ย้อนกลับ</button>
      <button type="button" class="btn primary" id="sendBtn" onclick="send()">ส่งเลย</button>
    </div>`;
  el('dlg').showModal();
}

async function send(){
  const btn = el('sendBtn');
  if(!btn || btn.disabled) return;
  btn.disabled = true; btn.textContent = 'กำลังส่ง…';

  const body = {
    at: Date.now(),
    items: cart.map(c => ({ id:c.id, name:c.name, qty:c.qty, price:c.price, addons:c.addons, total:c.total })),
    total: cartTotal(),
    who: (el('who').value || '').trim().slice(0, 20),
    note: (el('note').value || '').trim().slice(0, 120),
    status: 'new'
  };

  try{
    const res = await cloud('POST', `s/${SHOP}/orders`, body);
    sentList.push({ id: res.name, at: body.at });   // ต่อท้าย ไม่ทับของเดิม
    saveSent();
    cart = [];
    el('dlg').close();
    watchMine();
  }catch(e){
    btn.disabled = false; btn.textContent = 'ส่งเลย';
    alert('ส่งไม่สำเร็จ เน็ตอาจหลุด ลองกดส่งอีกครั้งนะครับ');
  }
}

/* ===================== หน้ารอคิว =====================
   ลูกค้าสั่งซ้ำได้ แต่ออเดอร์เก่าต้องไม่หายไปไหน
   (ของเดิมกด "สั่งเพิ่ม" แล้วคิวเดิมหายเลย ลูกค้าไม่รู้ว่าของตัวเองถึงไหนแล้ว) */
function watchMine(){
  mode = 'queue';
  drawMine();
  bar();
  if(poll) clearInterval(poll);
  // ถามที่เก็บทุก 4 วินาที พอทุกออเดอร์จบแล้วหยุดเอง
  poll = setInterval(refreshMine, 4000);
  refreshMine();
}

async function refreshMine(){
  const live = liveOrders();
  if(!live.length){ clearInterval(poll); return; }
  // ถามเฉพาะออเดอร์ที่ยังไม่จบ ที่จบแล้วไม่ต้องถามซ้ำให้เปลืองโควตา
  for(const x of live){
    try{ mineMap[x.id] = await cloud('GET', `s/${SHOP}/orders/${x.id}`); }catch(e){}
  }
  if(mode === 'queue') drawMine(); else draw();
  if(!liveOrders().length) clearInterval(poll);
}

const STEPS = [['new','ส่งแล้ว'], ['cook','กำลังทำ'], ['done','รับได้เลย']];

function drawMine(){
  el('foot').hidden = false;
  const done = sentList.length && sentList.every(x => mineMap[x.id] && mineMap[x.id].status === 'done');
  const live = liveOrders().length;

  // คำขอบคุณ — ลูกค้าจะได้รู้สึกว่าทางร้านรับรู้แล้วจริง ๆ ไม่ใช่กดส่งไปแล้วเงียบ
  const t = done ? ['ขอบคุณที่อุดหนุนนะครับ', 'มารับของที่ร้านได้เลย']
          : live ? ['ขอบคุณที่สั่งนะครับ',    'ทางร้านได้รับออเดอร์ของคุณแล้ว']
                 : ['ขอบคุณที่แวะมานะครับ',   ''];

  el('view').innerHTML = `
    <div class="card rise">
      <div class="empty thanks">
        <div class="empty-ic">${icon(done ? 'check' : 'cart', 46)}</div>
        <h3>${t[0]}</h3>
        ${t[1] ? `<p>${t[1]}</p>` : ''}
      </div>
    </div>
    ${sentList.map(x => queueCard(mineMap[x.id])).join('')}
    <div class="card">
      <button class="btn ghost block" onclick="backToMenu()">${icon('plus',16)} สั่งเพิ่มอีกออเดอร์</button>
    </div>`;
}

// การ์ดของออเดอร์หนึ่งใบ — เลขคิว ขั้นตอน และรายการที่สั่ง
function queueCard(o){
  const st = (o && o.status) || 'new';

  if(st === 'rej'){
    return `<div class="card">
      ${cardHead('x', 'ออเดอร์นี้ร้านรับไม่ไหว', 'ขอโทษด้วยนะครับ')}
      <div class="note bad">${icon('x',17)}<span>ทางร้านรับออเดอร์นี้ไม่ไหวครับ${o && o.why ? ' — ' + esc(o.why) : ''}</span></div>
    </div>`;
  }

  const at = STEPS.findIndex(x => x[0] === st);
  const items = (o && Array.isArray(o.items)) ? o.items : [];

  return `<div class="card rise">
    ${cardHead('today',
      st === 'done' ? 'ของเสร็จแล้ว' : st === 'cook' ? 'ร้านกำลังทำอยู่' : 'รอร้านกดรับออเดอร์',
      st === 'done' ? 'มารับที่ร้านได้เลยครับ'
      : st === 'cook' ? 'อีกสักครู่นะครับ'
      : 'ส่งให้ร้านแล้ว รอสักครู่',
      o ? `<span class="head-tag">฿${baht(o.total)}</span>` : '')}
    <div class="qbig">
      ${o && o.no ? `<b class="${st === 'cook' ? 'live' : ''}">${esc(String(o.no))}</b><span>เลขคิวของคุณ</span>`
                  : `<b class="dots"><i></i><i></i><i></i></b><span>ยังไม่ได้เลขคิว</span>`}
    </div>
    <div class="steps">
      ${STEPS.map((x, i) => `<div class="step ${i <= at ? 'on' : ''}${
        i === at && st !== 'done' ? ' cur' : ''}"><i></i>${x[1]}</div>`).join('')}
    </div>
    ${items.length ? `<div class="list">
      ${items.map(it => `
        <div class="li" style="cursor:default">
          <span class="av">${esc(String(it.qty))}</span>
          <div class="li-main">
            <div class="li-title">${esc(it.name)}</div>
            ${(it.addons||[]).length ? `<div class="li-sub">${esc(it.addons.map(a => a.name).join(' · '))}</div>` : ''}
          </div>
          <span class="li-p">฿${baht(it.total)}</span>
        </div>`).join('')}
    </div>
    <div class="sumrow"><span>รวม · จ่ายตอนมารับของ</span><b>฿${baht(o.total)}</b></div>` : ''}
  </div>`;
}

// กลับไปหน้าเลือกของ โดย **ไม่** ทิ้งออเดอร์เดิม กดกลับมาดูคิวได้ตลอด
function backToMenu(){
  mode = 'menu';
  cart = [];
  draw();
}
function goQueue(){ watchMine(); }

</script>
</body>
</html>

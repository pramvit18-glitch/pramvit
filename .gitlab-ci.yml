# GitLab CI — เอาเว็บขึ้น GitLab Pages ให้ฟรี
# ได้ URL: https://pramvit18-group.gitlab.io/crepecost/
#
# หมายเหตุ: ที่นี่ build ไฟล์ .ipa ไม่ได้ เพราะ GitLab ให้เครื่อง Mac เฉพาะแพ็กเกจเสียเงิน
#          ถ้าจะทำ .ipa ให้ push ไป GitHub ด้วย (ดู IPA.md)

image: node:20-alpine

pages:
  stage: deploy
  script:
    - node tools/build-www.js
    - rm -rf public
    - mv www public
  artifacts:
    paths:
      - public
  only:
    - main

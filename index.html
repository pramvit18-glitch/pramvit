<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ต้นทุนเครป">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<title>คำนวณต้นทุนร้านเครป</title>
<style>
  /* ===================== ธีมขาว–ส้ม (เรียบ) ===================== */
  :root{
    --page:#eef0f3;          /* พื้นหลังหน้า เทาอ่อน */
    --bg:#ffffff;            /* พื้นผิวการ์ด / ช่องกรอก */
    --soft:#f4f5f7;          /* แถบอ่อน พื้นช่องกรอก */
    --tint:#fdecec;          /* แดงอ่อนมาก */
    --line:#e5e7ea;
    --line-2:#eef0f3;

    --ink:#16181c;           /* ดำอมน้ำเงิน อ่านสบายกว่าดำล้วน */
    --ink-2:#4b5059;
    --muted:#8d939c;

    --brand:#d32b2b;        /* สีหลัก ใช้กับตัวเลขใหญ่และปุ่มหลัก */
    --brand-d:#a81f1f;      /* แดงเข้ม สำหรับตัวหนังสือเล็ก */
    --brand-l:#f6b9b9;      /* แดงอ่อน */
    --brand-mid:#e8605f;    /* แดงกลาง */

    --r-card:22px;           /* ความมนของการ์ด */
    --r-pill:999px;
    --sh-card:0 6px 22px rgba(22,24,28,.07), 0 1px 3px rgba(22,24,28,.05);
    --sh-lift:0 10px 30px rgba(22,24,28,.12);

    --good:#15803d;  --good-ink:#15803d;  --good-bg:#edf7f0;
    --warn:#a16207;  --warn-ink:#8a5a06;  --warn-bg:#fdf6e3;
    --bad:#b91c1c;   --bad-ink:#b91c1c;   --bad-bg:#fdeeee;

    --nav-h:62px;
    color-scheme: light;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0; min-height:100%; color:var(--ink);
    background:var(--page);
    background-image:
      radial-gradient(120% 60% at 85% -5%, rgba(255,255,255,.95), rgba(255,255,255,0) 60%),
      radial-gradient(90% 50% at 10% 8%, rgba(255,255,255,.75), rgba(255,255,255,0) 55%),
      linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,0) 35%);
    background-attachment:fixed;
    font-family:"Sarabun","Leelawadee UI","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.65; -webkit-text-size-adjust:100%;
  }

  /* ===================== โครง: ขาวล้วน คอลัมน์เดียว ===================== */
  .shell{
    width:100%; max-width:640px; margin:0 auto; min-height:100dvh;
    padding-top:env(safe-area-inset-top, 0px);
  }

  .appbar{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
    background:transparent; padding:14px 18px 12px;
    display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px;
  }
  .appbar::after{
    content:''; position:absolute; left:0; right:0; top:0; bottom:0; z-index:-1;
    background:var(--page); opacity:0; transition:opacity .2s;
  }
  .appbar.stuck::after{opacity:.92}
  .appbar-ic{
    width:42px; height:42px; flex:0 0 auto; border-radius:13px; display:grid; place-items:center;
    background:linear-gradient(145deg, var(--brand-mid), var(--brand-d)); color:#fff;
    box-shadow:0 6px 16px rgba(211,43,43,.3);
  }
  .appbar-ic svg{width:20px; height:20px}
  .titles{min-width:0; text-align:center}
  .titles h1{
    font-size:17px; margin:0; font-weight:800; line-height:1.25;
    letter-spacing:.08em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .titles p{
    margin:2px 0 0; font-size:12px; color:var(--muted); font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .titles p[hidden]{display:none}
  .appbar-act{display:flex; gap:8px; align-items:center}
  .icon-btn{
    width:40px; height:40px; flex:0 0 auto; border-radius:50%; cursor:pointer;
    border:none; background:var(--bg); color:var(--ink-2);
    box-shadow:var(--sh-card);
    display:grid; place-items:center; transition:.16s;
  }
  .icon-btn:hover{color:var(--brand)}
  .icon-btn.open{color:var(--good-ink); background:var(--good-bg)}
  .icon-btn[hidden]{display:none}
  .icon-btn:active{transform:scale(.93)}
  .icon-btn svg{width:18px; height:18px}

  main{padding:4px 20px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px))}

  /* ===================== ตัวเลขสำคัญของแต่ละหน้า ===================== */
  .headline{padding:4px 0 22px; border-bottom:1px solid var(--line)}
  .headline .k{font-size:13px; color:var(--muted); font-weight:600}
  .headline .v{
    font-size:40px; font-weight:800; letter-spacing:-.04em; line-height:1.15;
    color:var(--brand); margin:2px 0 4px; font-variant-numeric:tabular-nums;
  }
  .headline .v small{font-size:16px; font-weight:700; color:var(--ink-2); margin-left:8px; letter-spacing:0}
  .headline .s{font-size:13px; color:var(--ink-2); line-height:1.55}
  .headline.is-bad .v{color:var(--bad)}
  .headline:empty{display:none}

  /* ===================== ส่วนเนื้อหา: หัวข้อ + เส้นคั่น ===================== */
  .card, .block{
    background:var(--bg); border-radius:var(--r-card); box-shadow:var(--sh-card);
    padding:18px; margin-bottom:14px;
  }
  .card:last-child, .block:last-child{margin-bottom:0}
  .card > h2, .block > h2{font-size:16px; font-weight:800; margin:0 0 3px; letter-spacing:-.02em}
  .card > h2 + .sub, .block > h2 + .sub{margin:0 0 14px; font-size:13px; color:var(--muted); line-height:1.5}
  .sec{
    font-size:11px; color:var(--muted); font-weight:800; letter-spacing:.09em;
    text-transform:uppercase; margin:24px 0 10px;
  }
  .sec:first-child{margin-top:0}

  /* หัวข้อที่มีปุ่มเพิ่มอยู่ขวา */
  .head-row{display:flex; align-items:flex-start; gap:12px; margin-bottom:3px}
  .head-row h2{flex:1; margin:0!important}

  /* ===================== แถบเมนู ===================== */
  .bottomnav{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(10px + env(safe-area-inset-bottom, 0px));
    width:calc(100% - 24px); max-width:560px; z-index:25; display:flex;
    background:var(--bg); border-radius:26px; box-shadow:var(--sh-lift);
    padding:6px;
  }
  .bottomnav button{
    flex:1; border:none; background:none; cursor:pointer; font:inherit;
    padding:8px 2px 7px; color:var(--muted); font-size:11px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    transition:color .16s; position:relative;
  }
  .bottomnav button svg{width:21px; height:21px; position:relative; z-index:1}
  /* วงกลมจาง ๆ หลังไอคอนของเมนูที่เลือกอยู่ */
  .bottomnav button::before{
    content:''; position:absolute; top:4px; left:50%; transform:translateX(-50%);
    width:40px; height:30px; border-radius:var(--r-pill); background:var(--tint);
    opacity:0; transition:opacity .16s;
  }
  .bottomnav button.on::before{opacity:1}
  .bottomnav button.on{color:var(--brand)}
  /* จุดเล็ก ๆ ใต้ชื่อเมนูที่เลือกอยู่ */
  .bottomnav button.on::after{
    content:''; width:5px; height:5px; border-radius:50%; background:var(--brand);
  }

  /* ===================== ปุ่ม ===================== */
  button{font:inherit}
  .btn{
    cursor:pointer; border:none; background:var(--bg); box-shadow:var(--sh-card);
    color:var(--ink); padding:13px 20px; border-radius:var(--r-pill);
    font-weight:800; font-size:14.5px; transition:.16s; display:inline-flex;
    align-items:center; gap:7px; justify-content:center;
  }
  .btn:active{transform:scale(.975)}
  .btn:hover{color:var(--brand)}
  .btn.primary{background:var(--brand); color:#fff; box-shadow:0 8px 20px rgba(211,43,43,.3)}
  .btn.primary:hover{background:var(--brand-d); color:#fff}
  .btn.ghost{background:transparent; box-shadow:none; color:var(--ink-2)}
  .btn.ghost:hover{background:var(--soft); color:var(--ink)}
  .btn.danger{color:var(--bad-ink)}
  .btn.danger:hover{color:var(--bad)}
  .btn.sm{padding:9px 14px; font-size:13px}
  .btn.block{width:100%}
  .btn svg{width:16px; height:16px}
  .btnrow{display:flex; flex-wrap:wrap; gap:9px}
  .btn.back{border:none; background:none; color:var(--brand); padding:0 0 14px; font-weight:700}

  /* ===================== ฟอร์ม ===================== */
  .f{display:flex; flex-direction:column; gap:6px; min-width:0}
  .f label{font-size:12px; color:var(--ink-2); font-weight:700}
  input,select,textarea{
    font:inherit; width:100%; color:var(--ink); background:var(--soft);
    border:1px solid var(--line); border-radius:11px; padding:12px 13px; transition:.16s;
  }
  input:focus,select:focus,textarea:focus{
    outline:none; border-color:var(--brand); background:var(--bg);
    box-shadow:0 0 0 3px var(--tint);
  }
  input[type=number]{text-align:right; font-variant-numeric:tabular-nums; font-weight:700}
  textarea{font-family:ui-monospace,Consolas,monospace; font-size:12px; resize:vertical}
  .grid{display:grid; gap:13px}
  .g2{grid-template-columns:1fr 1fr}
  .g-auto{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
  .f.wide{grid-column:1/-1}

  /* ===================== ตัวเลขย่อย (ไม่มีกล่อง) ===================== */
  .quick{display:flex; gap:0; margin:0}
  .quick .q{flex:1; padding:0 14px; border-left:1px solid var(--line)}
  .quick .q:first-child{padding-left:0; border-left:none}
  .quick .q .k{font-size:11.5px; color:var(--muted); font-weight:600}
  .quick .q .v{font-size:18px; font-weight:800; margin-top:1px; letter-spacing:-.03em;
               font-variant-numeric:tabular-nums}

  .tiles{display:grid; gap:0 14px; grid-template-columns:1fr 1fr}
  .tile{padding:12px 0; border-bottom:1px solid var(--line-2)}
  .tile .lbl{font-size:11.5px; color:var(--muted); font-weight:600}
  .tile .val{font-size:19px; font-weight:800; margin-top:1px; letter-spacing:-.03em}
  .tnum{font-variant-numeric:tabular-nums}
  .good{color:var(--good-ink)} .warn{color:var(--warn-ink)} .bad{color:var(--bad-ink)}

  /* ===================== รายการ ===================== */
  .list{display:flex; flex-direction:column}
  .li, .li-read{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:14px 0; border:none; background:none; border-bottom:1px solid var(--line-2);
    font:inherit; color:inherit;
  }
  .li{cursor:pointer; transition:background .14s; padding-left:10px; padding-right:10px;
      margin:0 -10px; border-radius:10px}
  .li:hover{background:var(--soft)}
  .li:focus-visible{outline:2px solid var(--brand); outline-offset:-2px}
  .li:last-of-type, .li-read:last-of-type{border-bottom:none}
  .li-main{flex:1; min-width:0}
  .li-title{font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .li-sub{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  .li-end{display:flex; align-items:center; gap:9px; flex:0 0 auto}
  .li-del{
    width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg); color:var(--muted); cursor:pointer; display:grid; place-items:center;
  }
  .li-del:hover{color:var(--bad); border-color:var(--bad)}
  .li-chev{color:var(--muted); opacity:.4; flex:0 0 auto}
  .av{display:none}                      /* ดีไซน์เรียบ ไม่ใช้วงกลมไอคอนแล้ว */

  .row-head{display:flex; align-items:center; gap:10px}
  .chip{
    display:inline-flex; align-items:center; padding:4px 10px; border-radius:8px;
    background:var(--soft); color:var(--ink-2); font-size:12px; font-weight:700;
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .status{padding:4px 11px; border-radius:8px; font-size:12.5px; font-weight:700; white-space:nowrap}
  .status.is-good{background:var(--good-bg); color:var(--good-ink)}
  .status.is-warn{background:var(--warn-bg); color:var(--warn-ink)}
  .status.is-bad{background:var(--bad-bg); color:var(--bad-ink)}

  /* ===================== หน้าว่าง ===================== */
  .empty{text-align:center; padding:40px 10px; color:var(--muted); font-size:13.5px}
  .empty-ic{width:62px; height:62px; margin:0 auto 16px; border-radius:20px;
            background:var(--tint); color:var(--brand); display:grid; place-items:center}
  .empty-ic svg{width:30px; height:30px}
  .empty h3{margin:0 0 7px; font-size:18px; font-weight:800; color:var(--ink); letter-spacing:-.03em}
  .empty p{margin:0 auto 18px; max-width:300px; line-height:1.65}

  /* ===================== ขั้นตอนเริ่มใช้ ===================== */
  .steps{display:flex; flex-direction:column}
  .step{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:15px 0; border:none; border-bottom:1px solid var(--line-2);
    background:none; cursor:pointer; font:inherit; color:inherit;
  }
  .step:last-child{border-bottom:none}
  .step:hover .step-label{color:var(--brand)}
  .step.done{cursor:default}
  .step-no{width:30px; height:30px; flex:0 0 auto; border-radius:10px; background:var(--tint);
           color:var(--brand-d); display:grid; place-items:center; font-weight:800; font-size:14px}
  .step.done .step-no{background:var(--good); color:#fff}
  .step-main{flex:1; min-width:0; display:block}
  .step-label{display:block; font-weight:700; font-size:15px}
  .step.done .step-label{color:var(--muted); text-decoration:line-through}
  .step-sub{display:block; font-size:12.5px; color:var(--muted); line-height:1.45}

  /* ===================== กราฟ (บาง เรียบ) ===================== */
  .split{display:flex; gap:2px; height:10px; margin:14px 0 11px}
  .split i{display:block; height:100%; background:var(--line)}
  .split i:first-child{border-radius:5px 0 0 5px}
  .split i:last-child{border-radius:0 5px 5px 0}
  .split i.only{border-radius:5px}
  .seg-cost{background:var(--brand)!important}
  .seg-profit{background:var(--brand-l)!important}
  .seg-loss{background:var(--bad)!important}
  .legend{display:flex; flex-wrap:wrap; gap:7px 18px; font-size:12.5px; color:var(--ink-2)}
  .legend span{display:inline-flex; align-items:center; gap:7px}
  .legend i{width:9px; height:9px; border-radius:3px; flex:0 0 auto}
  .legend b{color:var(--ink); font-variant-numeric:tabular-nums}

  .meter{height:7px; border-radius:99px; overflow:hidden; background:var(--line-2)}
  .meter>i{display:block; height:100%; border-radius:99px; background:var(--brand); transition:width .4s ease}
  .meter.is-good>i{background:var(--good)}
  .meter.is-warn>i{background:var(--warn)}
  .meter.is-bad>i{background:var(--bad)}

  .rank{display:flex; flex-direction:column; gap:18px}
  .rank-row{display:grid; grid-template-columns:1fr auto; gap:6px 10px; align-items:center}
  .rank-name{font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rank-val{text-align:right; font-weight:800; font-variant-numeric:tabular-nums; font-size:15px}
  .rank-row .meter{grid-column:1/-1}
  .rank-sub{grid-column:1/-1; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}

  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th,td{text-align:right; padding:11px 8px; border-bottom:1px solid var(--line-2)}
  th:first-child,td:first-child{text-align:left; padding-left:0}
  th:last-child,td:last-child{padding-right:0}
  th{color:var(--muted); font-size:11px; font-weight:800; white-space:nowrap;
     text-transform:uppercase; letter-spacing:.06em}
  tbody tr:last-child td{border-bottom:none}
  td.n{font-variant-numeric:tabular-nums}
  .scroll{overflow-x:auto}
  .scroll table{min-width:430px}

  /* ===================== กล่องข้อความ ===================== */
  .verdict{border-radius:12px; padding:14px 16px; font-size:13.5px; line-height:1.6; margin:0 0 16px}
  .verdict b:first-child{display:block; font-size:16px; margin-bottom:3px; letter-spacing:-.02em}
  .verdict.is-good{background:var(--good-bg); color:var(--good-ink)}
  .verdict.is-warn{background:var(--warn-bg); color:var(--warn-ink)}
  .verdict.is-bad{background:var(--bad-bg); color:var(--bad-ink)}
  .note{background:var(--soft); border-left:3px solid var(--brand); border-radius:0 10px 10px 0;
        padding:13px 15px; font-size:13px; color:var(--ink-2); margin-top:12px; line-height:1.6}
  .hint{color:var(--muted); font-size:12.5px; margin:12px 0 0; line-height:1.55}
  .panel{background:var(--soft); border-radius:12px; padding:15px}

  details{margin-top:14px}
  details>summary{cursor:pointer; list-style:none; color:var(--brand); font-weight:700;
                  font-size:13.5px; padding:9px 0; display:flex; align-items:center; gap:8px}
  details>summary::-webkit-details-marker{display:none}
  details>summary::after{content:'▾'; font-size:11px; transition:transform .2s}
  details[open]>summary::after{transform:rotate(180deg)}

  /* ===================== หน้าเลือกของ ===================== */
  .picks{display:flex; flex-direction:column}
  .pick{display:grid; grid-template-columns:26px 1fr; gap:8px 13px; align-items:center;
        padding:14px 10px; margin:0 -10px; border-bottom:1px solid var(--line-2); border-radius:10px}
  .pick:last-child{border-bottom:none}
  .pick.on{background:var(--tint)}
  .pick-box{width:26px; height:26px; border-radius:8px; border:2px solid var(--line);
            background:var(--bg); color:transparent; cursor:pointer; padding:0;
            display:grid; place-items:center; transition:.15s}
  .pick.on .pick-box{background:var(--brand); border-color:var(--brand); color:#fff}
  .pick-main{cursor:pointer; min-width:0}
  .pick-qtyrow{grid-column:2/-1; display:flex; align-items:center; gap:10px}
  .pick-qty{width:100px; flex:0 0 auto; padding:9px 11px}
  .pick-unit{font-size:12.5px; color:var(--muted); font-weight:600; flex:0 0 auto}
  .pick-cost{margin-left:auto; font-size:13.5px; font-weight:800; color:var(--brand-d);
             font-variant-numeric:tabular-nums}

  .savebar{
    position:sticky; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px);
    background:var(--bg); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; box-shadow:0 6px 24px rgba(22,24,28,.1); margin-top:18px;
  }
  .savebar .btnrow .btn{flex:1}
  .recipe-sum{margin-bottom:12px; line-height:1.5}
  .recipe-sum b{display:block; font-size:15px; letter-spacing:-.02em}
  .recipe-sum span{font-size:12.5px; color:var(--muted)}

  /* ===================== หน้าต่างกรอก ===================== */
  dialog{
    border:none; padding:0; color:var(--ink); background:var(--bg);
    width:100%; max-width:640px; max-height:92dvh; overflow:auto;
    margin:auto auto 0; border-radius:28px 28px 0 0;
    padding-bottom:env(safe-area-inset-bottom, 0px);
    box-shadow:0 -10px 50px rgba(22,24,28,.25);
  }
  dialog::backdrop{background:rgba(22,24,28,.4)}
  dialog[open]{animation:sheet .24s cubic-bezier(.2,.9,.3,1)}
  @keyframes sheet{from{transform:translateY(100%)} to{transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){ dialog[open]{animation:none} }
  .dlg-grip{width:38px; height:4px; border-radius:99px; background:var(--line); margin:12px auto 0}
  .dlg-head{padding:14px 20px 0; display:flex; align-items:flex-start; gap:12px}
  .dlg-head-t{flex:1; min-width:0}
  .dlg-head h3{margin:0; font-size:19px; font-weight:800; letter-spacing:-.03em}
  .dlg-head p{margin:4px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5}
  .dlg-head p:empty{display:none}
  .dlg-tag{
    margin-left:4px; vertical-align:2px; cursor:pointer; font:inherit;
    font-size:12px; font-weight:800; color:var(--brand-d);
    background:none; border:none; padding:0; text-decoration:underline;
    text-underline-offset:3px; text-decoration-thickness:1.5px;
  }
  .dlg-tag.on{background:var(--tint); border-radius:99px; padding:4px 10px; text-decoration:none}
  .dlg-x{
    flex:0 0 auto; width:34px; height:34px; border-radius:50%; cursor:pointer;
    border:none; background:var(--soft); color:var(--ink-2);
    display:grid; place-items:center; transition:.16s;
  }
  .dlg-x svg{width:16px; height:16px}
  .dlg-x:hover{background:var(--tint); color:var(--brand-d)}
  .dlg-x:active{transform:scale(.92)}
  .dlg-body{padding:17px 20px 0; display:grid; gap:13px; grid-template-columns:1fr 1fr}
  .dlg-live{grid-column:1/-1; background:var(--tint); color:var(--brand-d); border-radius:11px;
            padding:12px 14px; font-size:13.5px; font-weight:700; line-height:1.5;
            font-variant-numeric:tabular-nums}
  .dlg-err{grid-column:1/-1; color:var(--bad-ink); font-size:12.5px; font-weight:700}
  .dlg-err:empty{display:none}
  .dlg-foot{padding:18px 20px 22px; display:flex; gap:10px}
  .dlg-foot .btn{flex:1; padding:13px 18px}

  .gloss{display:flex; flex-direction:column; gap:16px}
  .gloss-row{display:flex; flex-direction:column; gap:4px}
  .gloss-k{font-weight:800; font-size:15px; color:var(--brand-d); letter-spacing:-.02em}
  .gloss-v{font-size:13.5px; color:var(--ink-2); line-height:1.6}

  /* ===================== จอใหญ่: แท็บข้อความใต้หัวข้อ ===================== */
  @media(min-width:760px){
    .shell{max-width:780px; min-height:100dvh}
    .appbar{padding:26px 28px 10px}
    .appbar::after{display:none}
    .titles h1{font-size:22px}
    main{padding:0 36px 80px}
    .headline{padding-top:18px}

    .bottomnav{
      position:static; transform:none; width:max-content; max-width:none;
      background:var(--bg); border-radius:var(--r-pill); box-shadow:var(--sh-card);
      margin:10px 36px 16px; padding:5px; gap:2px;
    }
    .bottomnav button{
      flex:0 0 auto; height:auto; padding:9px 18px; flex-direction:row; gap:8px;
      font-size:14px; color:var(--muted); border-radius:var(--r-pill); transition:.16s;
    }
    .bottomnav button svg{width:17px; height:17px}
    .bottomnav button:hover{color:var(--ink-2)}
    .bottomnav button.on{color:var(--brand); background:var(--tint)}
    /* วงกลมกับจุดเป็นของแถบแนวตั้งบนมือถือ จอใหญ่ไม่ต้องใช้ */
    .bottomnav button::before,
    .bottomnav button.on::after{display:none}

    .tiles{grid-template-columns:repeat(4,1fr)}
    .pick{grid-template-columns:26px 1fr auto}
    .pick-qtyrow{grid-column:3}
    .savebar{bottom:20px}
    .scroll table{min-width:0}
    dialog{max-width:540px; margin:auto; border-radius:20px; animation:none; padding-bottom:0}
    .dlg-grip{display:none}
  }

  /* ===================== สมุดรายวัน ===================== */
  .daybtns{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .daybtn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
    padding:22px 12px; border-radius:16px; border:1.5px solid var(--line);
    background:var(--bg); cursor:pointer; font:inherit; font-weight:800; font-size:16px;
    color:var(--ink); transition:.16s;
  }
  .daybtn svg{width:22px; height:22px}
  .daybtn:active{transform:scale(.97)}
  .daybtn.in{background:var(--good-bg); border-color:transparent; color:var(--good-ink)}
  .daybtn.in:hover{border-color:var(--good)}
  .daybtn.out{background:var(--tint); border-color:transparent; color:var(--brand-d)}
  .daybtn.out:hover{border-color:var(--brand)}

  .amt{font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap}
  .amt.in{color:var(--good-ink)}
  .amt.out{color:var(--brand-d)}

  /* เลือกเมนูตอนบันทึกการขาย */
  .pills{display:flex; flex-wrap:wrap; gap:8px}
  .pill{
    border:1.5px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:12px; padding:10px 14px; cursor:pointer; font:inherit;
    font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:8px;
    transition:.16s;
  }
  .pill b{color:var(--muted); font-weight:700; font-size:12.5px; font-variant-numeric:tabular-nums}
  .pill:hover{border-color:var(--brand)}
  .pill.on{background:var(--brand); border-color:var(--brand); color:#fff}
  .pill.on b{color:rgba(255,255,255,.8)}

  .stepper{display:flex; align-items:center; gap:0; width:fit-content;
           border:1.5px solid var(--line); border-radius:12px; overflow:hidden}
  .stepper button{
    width:46px; height:46px; border:none; background:var(--soft); color:var(--ink);
    font-size:22px; font-weight:700; cursor:pointer; line-height:1;
  }
  .stepper button:hover{background:var(--tint); color:var(--brand-d)}
  .stepper span{min-width:62px; text-align:center; font-weight:800; font-size:19px;
                font-variant-numeric:tabular-nums}

  /* ต้องมี .tops นำหน้าทุกข้อ เพราะคลาส "top" ไปชนกับ .rankx-no.top (เลขอันดับ 1)
     ถ้าไม่กั้น เลข 1 จะโดนเครื่องหมายถูกของชิปไส้เบียดจนมองไม่เห็น */
  .tops{display:flex; flex-wrap:wrap; gap:8px}
  .tops .top{
    border:1.5px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:99px; padding:9px 15px; cursor:pointer; font:inherit;
    font-weight:700; font-size:13.5px; transition:.16s;
  }
  .tops .top b{color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums}
  .tops .top:hover{border-color:var(--brand)}
  .tops .top::before{content:'✓'; margin-right:5px; font-weight:900; opacity:0; transition:opacity .12s}
  .tops .top.on{background:var(--tint); border-color:var(--brand); color:var(--brand-d)}
  .tops .top.on b{color:var(--brand-d)}
  .tops .top.on::before{opacity:1}

  /* ย้อนหลังรายวัน */
  .days{display:flex; flex-direction:column}
  .day{
    display:grid; grid-template-columns:76px 1fr auto; gap:4px 12px; align-items:center;
    padding:12px 10px; margin:0 -10px; border:none; background:none; cursor:pointer;
    border-bottom:1px solid var(--line-2); border-radius:10px; font:inherit; color:inherit;
    text-align:left; transition:background .14s;
  }
  .day:last-child{border-bottom:none}
  .day:hover{background:var(--soft)}
  .day-d{font-weight:700; font-size:13.5px}
  .day-bar{height:8px; border-radius:99px; background:var(--line-2); overflow:hidden}
  .day-bar>i{display:block; height:100%; border-radius:99px; background:var(--brand)}
  .day-v{font-weight:800; font-size:14px; font-variant-numeric:tabular-nums; text-align:right}
  .day-n{grid-column:2/-1; font-size:11.5px; font-variant-numeric:tabular-nums}


  


/* ===================== หน้าขายแบบ POS ===================== */
  .posgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
  .posbtn{
    display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between;
    gap:10px; min-height:84px; padding:14px; border-radius:14px;
    border:1.5px solid var(--line); background:var(--bg); cursor:pointer;
    font:inherit; color:inherit; text-align:left; transition:.14s;
  }
  .posbtn:hover{border-color:var(--brand); background:var(--tint)}
  .posbtn:active{transform:scale(.96)}
  .posbtn-n{font-weight:800; font-size:14.5px; line-height:1.35}
  .posbtn-p{font-weight:800; font-size:17px; color:var(--brand-d);
            font-variant-numeric:tabular-nums}

  .bill{display:flex; flex-direction:column}
  .billhead{
    display:flex; align-items:center; justify-content:space-between;
    margin:16px 0 8px; font-size:13px; font-weight:800; color:var(--ink);
  }
  .billclear{
    display:inline-flex; align-items:center; gap:5px; cursor:pointer; font:inherit;
    font-size:12px; font-weight:800; color:var(--muted);
    border:none; background:none; padding:4px 6px; border-radius:var(--r-pill);
  }
  .billclear:hover{color:var(--bad); background:var(--bad-bg)}
  .billclear svg{width:13px; height:13px}
  .dlg-bill{background:var(--soft); border-radius:18px; padding:8px}
  .bill{display:flex; flex-direction:column; gap:8px}
  .bill-line{
    display:grid; grid-template-columns:1fr auto auto; gap:8px 12px; align-items:center;
    background:var(--bg); border-radius:16px; padding:12px 14px; box-shadow:var(--sh-card);
  }
  .bl-main{min-width:0; grid-column:1 / -1}
  .bl-name{font-weight:800; font-size:15px; display:flex; align-items:center; gap:8px}
  .bl-name .bl-sum{margin-left:auto; font-size:16px; color:var(--brand)}
  .bl-add{
    margin-top:4px; font-size:12px; color:var(--ink-2); font-weight:600;
    font-variant-numeric:tabular-nums; line-height:1.5;
  }
  .bl-top{
    margin-top:8px; padding:6px 12px; cursor:pointer; font:inherit; font-size:12px; font-weight:800;
    border:1.5px dashed var(--brand-l); border-radius:var(--r-pill);
    background:var(--bg); color:var(--brand);
  }
  .bl-top:hover{background:var(--brand); border-color:var(--brand); border-style:solid; color:#fff}
  .bl-top.on{border-style:solid; border-color:var(--line); background:var(--soft); color:var(--ink-2)}
  .bl-top.on:hover{border-color:var(--brand); background:var(--tint); color:var(--brand)}
  .bl-qty{
    grid-column:1; justify-self:start;
    display:flex; align-items:center; gap:2px; background:var(--soft);
    border-radius:var(--r-pill); padding:3px;
  }
  .bl-qty button{
    width:32px; height:32px; border:none; background:var(--bg); color:var(--ink);
    font-size:18px; font-weight:800; cursor:pointer; line-height:1; border-radius:50%;
    box-shadow:0 1px 3px rgba(22,24,28,.1);
  }
  .bl-qty button:hover{background:var(--brand); color:#fff}
  .bl-qty span{min-width:30px; text-align:center; font-weight:800; font-variant-numeric:tabular-nums}
  .bl-sum{font-weight:800; font-size:15px; font-variant-numeric:tabular-nums}
  .bl-del{
    grid-column:3; justify-self:end;
    width:34px; height:34px; border-radius:50%; border:none;
    background:var(--soft); color:var(--muted); cursor:pointer; display:grid; place-items:center;
  }
  .bl-del:hover{color:#fff; background:var(--bad)}
  .btn[disabled]{opacity:.45; pointer-events:none}

  /* ข้อความแจ้งผลมุมล่าง */
  .toast{
    position:fixed; left:auto; bottom:auto; margin:0;
    top:calc(env(safe-area-inset-top, 0px) + 14px);
    right:14px; transform:translateY(-12px);
    max-width:min(calc(100vw - 28px), 380px); width:max-content; text-align:left;
    background:var(--ink); color:#fff; padding:13px 18px; border-radius:12px;
    border:none; overflow:visible;
    font-weight:700; font-size:14px; line-height:1.45; z-index:60; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; box-shadow:0 10px 30px rgba(22,24,28,.32);
  }
  /* ตอนใช้ popover เบราว์เซอร์ตั้ง display:none ให้เอง ต้องเปิดกลับเอง */
  .toast:popover-open{display:block}
  .toast::backdrop{background:none}
  .toast.on{opacity:1; transform:translateY(0)}
  @media(min-width:760px){ .toast{top:22px; right:22px; max-width:420px} }


  /* ===================== หน้าขาย: เมนูซ้าย บิลขวา ===================== */
  .poswrap{display:grid; grid-template-columns:1fr; gap:0}
  .billbox{padding:22px 0 0; border-top:1px solid var(--line)}
  .billfoot{margin-top:16px; padding-top:16px; border-top:1px solid var(--line)}
  .billfoot .btnrow .btn{flex:1}

  @media(min-width:860px){
    /* จอกว้างพอ: เมนูอยู่ซ้าย บิลอยู่ขวาและติดหน้าจอตอนเลื่อน */
    .poswrap{grid-template-columns:1fr 340px; gap:0 30px; align-items:start}
    .billbox{
      position:sticky; top:20px; padding:20px;
      border:1px solid var(--line); border-top:1px solid var(--line);
      border-radius:16px; background:var(--bg);
      box-shadow:0 6px 24px rgba(22,24,28,.07);
      max-height:calc(100dvh - 40px); display:flex; flex-direction:column;
    }
    .billbox .bill{overflow-y:auto; flex:1 1 auto; min-height:60px}
    .billfoot{flex:0 0 auto}
    .posgrid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  }

  @media(max-width:859px){
    /* จอแคบ: บิลอยู่ล่าง แต่ยอดรวมกับปุ่มรับเงินติดขอบจอไว้ */
    .billfoot{
      position:sticky; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px);
      background:var(--bg); border:1px solid var(--line); border-radius:14px;
      padding:14px 16px; box-shadow:0 6px 24px rgba(22,24,28,.1); margin-top:18px;
    }
  }


  /* ===================== หมวดหมู่ในหน้าขาย ===================== */
  .possearch{
    position:relative; display:flex; align-items:center; margin-bottom:12px;
  }
  .possearch-ic{
    position:absolute; left:13px; display:grid; place-items:center; color:var(--muted); pointer-events:none;
  }
  .possearch-ic svg{width:16px; height:16px}
  .possearch input{
    width:100%; border:1px solid var(--line); border-radius:12px; background:var(--soft);
    padding:12px 14px 12px 38px; font:inherit; font-size:14px; color:var(--ink);
  }
  .possearch input::placeholder{color:var(--muted)}
  .possearch input:focus{outline:none; border-color:var(--brand); background:var(--bg)}

  .cats{
    display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none}
  .cat{
    flex:0 0 auto; border:1px solid var(--line); background:var(--bg); color:var(--ink-2);
    border-radius:99px; padding:8px 15px; cursor:pointer; font:inherit;
    font-weight:700; font-size:13.5px; white-space:nowrap; transition:.16s;
  }
  .cat b{color:var(--muted); font-weight:700; font-size:12px; margin-left:4px}
  .cat:hover{border-color:var(--brand); color:var(--brand)}
  .cat.on{background:var(--brand); border-color:var(--brand); color:#fff;
          box-shadow:0 6px 16px rgba(211,43,43,.28)}
  .cat.hot{display:inline-flex; align-items:center; gap:5px}
  .cat.hot svg{width:13px; height:13px}
  .cat.on b{color:rgba(255,255,255,.75)}

  /* ปุ่มเมนูที่อยู่ในบิลแล้ว ให้เห็นชัดว่ากดไปกี่จาน */
  .posbtn{position:relative}
  .posbtn.has{border-color:var(--brand); background:var(--tint)}
  .posbtn-c{
    position:absolute; top:-7px; right:-7px; min-width:24px; height:24px; padding:0 6px;
    border-radius:99px; background:var(--brand); color:#fff;
    font-size:12.5px; font-weight:800; display:grid; place-items:center;
    box-shadow:0 2px 6px rgba(211,43,43,.4);
  }


  /* ===================== หน้าขาย: จัดใหม่ให้เป็นแคชเชียร์ ===================== */
  .posgrid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:9px}
  .posbtn{min-height:76px; padding:12px; gap:6px; border-radius:13px}
  .posbtn-n{font-size:13.5px; line-height:1.3}
  .posbtn-p{font-size:19px}

  .bill-top{display:flex; align-items:center; gap:10px; margin-bottom:12px}
  .bill-top h2{margin:0; font-size:16px; font-weight:800}
  .bill-n{flex:1; font-size:12.5px; color:var(--muted); font-weight:700}
  .bill-empty{
    text-align:center; color:var(--muted); font-size:13.5px; line-height:1.7;
    padding:26px 8px; border:1px dashed var(--line); border-radius:12px;
  }
  .bill-empty span{font-size:12px; opacity:.85}

  .bill-total{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:12px; padding-top:2px;
  }
  .bill-total span{font-size:14px; color:var(--ink-2); font-weight:700}
  .bill-total b{font-size:28px; font-weight:800; letter-spacing:-.03em;
                font-variant-numeric:tabular-nums; color:var(--ink)}
  .bill-total b small{font-size:14px; font-weight:700; color:var(--ink-2); margin-left:4px}
  .btn.pay{padding:15px 18px; font-size:16px}
  .btn.pay[disabled]{opacity:.45; cursor:default; box-shadow:none}
  .billfoot .btn.ghost{margin-top:8px; font-size:13.5px; padding:9px}

  @media(min-width:860px){
    .posgrid{grid-template-columns:repeat(auto-fill,minmax(126px,1fr))}
    .poswrap{grid-template-columns:1fr 320px}
  }


  /* บิลคอลัมน์แคบ: ชื่ออยู่บรรทัดบนเต็มความกว้าง ปุ่มกับยอดอยู่บรรทัดล่าง ชื่อจะได้ไม่ตัดคำแตก */
  .bill-line{grid-template-columns:1fr auto auto; gap:8px 10px}
  .bill-line .bl-main{grid-column:1/-1}
  .bl-name{line-height:1.35}
  .bl-qty{justify-self:start}
  .bl-sum{justify-self:end}

  /* แถบข้อมูลตัวอย่างไม่ต้องโผล่ตอนกำลังขาย */
  .hide-banner #banner{display:none}


  /* ===================== เมนูในหน้าขาย: แบบรายการ ===================== */
  .poslist{display:flex; flex-direction:column; gap:8px}
  .posrow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:13px 14px; border:1.5px solid transparent; background:var(--bg); cursor:pointer;
    border-radius:16px; box-shadow:var(--sh-card);
    font:inherit; color:inherit; transition:.14s;
  }
  .posrow:hover{transform:translateY(-1px); box-shadow:var(--sh-lift)}
  .posrow:active{transform:scale(.99)}
  .posrow:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
  .posrow.has{border-color:var(--brand); background:var(--tint)}
  .posrow-m{flex:1; min-width:0}
  .posrow-n{display:block; font-weight:800; font-size:15px; line-height:1.3}
  .posrow-top{
    display:flex; align-items:center; gap:6px; margin-top:4px;
    font-size:11.5px; font-weight:700; color:var(--muted);
  }
  .posrow-top::before{
    content:''; width:6px; height:6px; border-radius:99px; background:var(--brand-l); flex:0 0 auto;
  }
  .posrow.has .posrow-top{color:var(--brand)}
  .posrow.has .posrow-top::before{background:var(--brand)}
  .posrow-c{
    flex:0 0 auto; min-width:26px; height:26px; padding:0 8px; border-radius:99px;
    background:var(--brand); color:#fff; font-size:13px; font-weight:800;
    display:grid; place-items:center; box-shadow:0 4px 10px rgba(211,43,43,.3);
  }
  .posrow-p{
    flex:0 0 auto; font-weight:800; font-size:16px; color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .posrow.has .posrow-p{color:var(--brand)}
  .posrow-add{
    flex:0 0 auto; width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
    background:var(--brand); color:#fff;
  }
  .posrow.has .posrow-add{background:var(--brand-d)}


  /* ===================== กราฟ ===================== */
  .chart{margin:4px -4px 0; overflow:hidden}
  .chart .cday{cursor:pointer}
  .chart .cday:hover .cday-bg,
  .chart .cday:focus-visible .cday-bg{opacity:1}
  .chart .cday:focus{outline:none}
  .chart .cday:focus-visible .cday-bg{stroke:var(--brand); stroke-width:1.5}
  .chart svg{display:block; width:100%; height:auto}
  .chart text{font-family:inherit}


  /* ===================== ปุ่มสั่งสินค้าหน้าขาย ===================== */
  .orderbtn{
    display:flex; align-items:center; justify-content:center; gap:12px;
    width:100%; padding:20px; margin-bottom:18px; border:none; border-radius:var(--r-pill);
    background:var(--brand); color:#fff; cursor:pointer; font:inherit;
    font-weight:800; font-size:18px; letter-spacing:-.01em;
    box-shadow:0 10px 26px rgba(211,43,43,.3); transition:transform .14s, box-shadow .18s;
  }
  .orderbtn svg{width:25px; height:25px}
  .orderbtn:hover{box-shadow:0 14px 32px rgba(211,43,43,.4)}

  /* หน้าต่างสั่งสินค้าให้สูงได้เต็มที่ รายการเมนูเลื่อนในตัวเอง */

  .card-head-t{flex:1; min-width:0}
  .card-head-t h2{margin:0; font-size:16px; font-weight:800; letter-spacing:-.02em}

    padding:11px 13px; font:inherit; color:inherit; transition:.16s;

  .shoprow-main:hover{border-color:var(--brand); background:var(--soft)}

  .shoprow-m{flex:1; min-width:0}
  .shoprow-n{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-weight:800; font-size:14.5px; letter-spacing:-.02em;

  .shoprow-s{

    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .shoprow .btn.sm{flex:0 0 auto; padding:9px 11px}

  /* ชื่อร้านบนหัว กดเพื่อสลับร้าน */
  .shopswitch{
    display:inline-flex; align-items:center; gap:5px; margin:2px auto 0; padding:0;
    border:none; background:none; cursor:pointer; font:inherit;
    font-size:12px; color:var(--muted); font-weight:600; max-width:100%;
  }
  .shopswitch > span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .shopswitch svg{width:13px; height:13px; flex:0 0 auto}
  .shopswitch b{
    flex:0 0 auto; font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:99px;
    background:var(--tint); color:var(--brand-d);
  }
  .shopswitch:hover{color:var(--brand-d)}

  .shopcard{display:flex; align-items:center; gap:13px}
  .lockcard{display:flex; align-items:center; gap:13px}
  .shopswitch.fixed{cursor:default}
  .shopswitch.fixed:hover{color:var(--muted)}
  .ic-tile.big{width:46px; height:46px; border-radius:14px;
    background:linear-gradient(145deg, var(--brand), var(--brand-d)); color:#fff}
  .ic-tile.big svg{width:20px; height:20px}
  .shopcard-m{flex:1; min-width:0}
  .shopcard-n{font-size:16px; font-weight:800; letter-spacing:-.02em; display:flex;
              align-items:center; gap:8px; flex-wrap:wrap}
  .shopcard-s{margin-top:3px; font-size:12px; color:var(--muted); font-weight:600;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .statepill{
    font-size:11px; font-weight:800; padding:3px 9px; border-radius:99px;
    background:var(--soft); color:var(--muted);
  }

  .pricetag{
    margin-left:7px; font-size:11.5px; font-weight:800; padding:2px 8px; border-radius:99px;
    background:var(--tint); color:var(--brand-d); vertical-align:1px;
  }

  .navlist{
    display:flex; flex-direction:column; gap:2px;
    background:var(--soft); border-radius:18px; padding:6px;
  }
  .navrow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
    border:none; background:none; font:inherit; color:inherit;
    padding:11px 10px; margin:0; border-radius:14px; transition:background .14s;
  }
  .navrow:hover{background:var(--bg)}
  .navrow:active{transform:scale(.99)}
  .navrow .ic-tile{width:34px; height:34px; border-radius:11px}
  .navrow .ic-tile svg{width:17px; height:17px}
  .navrow-m{flex:1; min-width:0}
  .navrow-t{display:block; font-weight:700; font-size:14.5px}
  .navrow-s{display:block; margin-top:2px; font-size:12px; color:var(--muted); font-weight:600;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tone-o{background:var(--tint); color:var(--brand-d)}
  .tone-w{background:var(--warn-bg); color:var(--warn-ink)}
  .tone-g{background:var(--good-bg); color:var(--good-ink)}
  .tone-r{background:var(--bad-bg); color:var(--bad-ink)}
  .navrow .tone-r ~ .navrow-m .navrow-t{color:var(--bad-ink)}

  /* ===================== ย้อนหลัง ===================== */
  .mnav{display:flex; align-items:center; gap:10px}
  .mnav-b{
    width:34px; height:34px; flex:0 0 auto; border-radius:11px; cursor:pointer;
    border:1px solid var(--line); background:var(--bg); color:var(--ink-2);
    display:grid; place-items:center; transition:.16s;
  }
  .mnav-b svg{width:16px; height:16px}
  .mnav-b:hover:not(:disabled){border-color:var(--brand); color:var(--brand)}

  .mnav-t{flex:1; min-width:0; text-align:center; font-size:17px; font-weight:800; letter-spacing:-.02em}

  .mbox{display:flex; flex-direction:column; gap:2px; background:var(--soft);
        border-radius:18px; padding:6px}
  .mbox-row{
    display:flex; align-items:center; gap:10px; padding:11px 12px;
    background:var(--bg); border-radius:14px;
  }
  .mbox-ic{
    width:28px; height:28px; flex:0 0 auto; border-radius:50%;
    display:grid; place-items:center;
  }
  .mbox-ic svg{width:15px; height:15px}
  .mbox-row.in .mbox-ic{background:var(--good-bg); color:var(--good-ink)}
  .mbox-row.out .mbox-ic{background:var(--tint); color:var(--brand)}
  .mbox-row.net .mbox-ic{background:var(--soft); color:var(--ink-2)}
  .mbox-k{flex:1; min-width:0; font-size:13px; font-weight:700; color:var(--ink-2);
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mbox-row b{
    flex:0 0 auto; font-size:17px; font-weight:800; font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;

  .mbox-row.in b{color:var(--good-ink)}
  .mbox-row.out b{color:var(--brand)}

  .mbox-row.net .mbox-ic{background:rgba(255,255,255,.14); color:#fff}
  .mbox-row.net b{color:#fff}
  .mbox-row.net b.bad{color:#ff8f8f}

  .mon3{display:flex; gap:10px; margin-top:16px}
  .mon3 > div{
    flex:1; min-width:0; background:var(--soft); border-radius:13px; padding:12px 13px;
  }
  .mon3 span{display:block; font-size:11.5px; color:var(--muted); font-weight:700; line-height:1.35}
  .mon3 b{
    display:block; margin-top:4px; font-size:18px; font-weight:800; letter-spacing:-.03em;
    color:var(--brand-d); font-variant-numeric:tabular-nums;
  }
  .mon3 b.good{color:var(--good-ink)}
  .mon3 b.bad{color:var(--bad-ink)}

  .dayx{display:flex; flex-direction:column; gap:10px}
  .dayx-row{
    display:flex; flex-direction:column; gap:9px; width:100%; text-align:left; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:var(--bg);
    padding:13px 14px; font:inherit; color:inherit; transition:.16s;
  }
  .dayx-row:hover{border-color:var(--brand); background:var(--soft)}
  .dayx-row:active{transform:scale(.995)}
  .dayx-top{display:flex; align-items:center; gap:9px}
  .dayx-d{flex:0 0 auto; font-weight:800; font-size:14.5px}
  .dayx-net{
    flex:1; min-width:0; font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:99px;
    background:var(--tint); color:var(--brand-d); justify-self:start;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .dayx-net.good{background:var(--good-bg); color:var(--good-ink)}
  .dayx-net.bad{background:var(--bad-bg); color:var(--bad-ink)}
  .dayx-v{
    flex:0 0 auto; margin-left:auto; font-weight:800; font-size:16px;
    font-variant-numeric:tabular-nums;
  }
  .dayx-bar{display:block; height:7px; border-radius:99px; background:var(--line-2); overflow:hidden}
  .dayx-bar i{
    display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg, var(--brand-mid), var(--brand));
  }

  .seeall{
    width:100%; margin-top:14px; padding:12px; cursor:pointer; font:inherit;
    font-size:13px; font-weight:800; color:var(--brand-d);
    background:var(--tint); border:1px dashed var(--brand); border-radius:12px;
  }
  .seeall:hover{background:var(--brand); border-style:solid; color:#fff}

  /* การ์ดหลัก ไล่เฉดส้ม */
  .hero-card{
    background:var(--bg); color:var(--ink); border-radius:var(--r-card);
    padding:18px; position:relative; overflow:hidden; box-shadow:var(--sh-card);
  }
  .hero-main{position:relative; z-index:1}
  .hero-row{display:flex; align-items:center; gap:12px; margin-bottom:18px}
  .hero-card .hero-row{justify-content:space-between}
  .shoppill{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    border:1.5px solid var(--line); border-radius:var(--r-pill); padding:6px 13px; font:inherit;
    font-size:12.5px; font-weight:800; background:var(--bg); color:var(--ink-2);
  }
  .shoppill.on{border-color:var(--brand-l); color:var(--brand)}
  .shoppill i{width:7px; height:7px; border-radius:99px; background:var(--muted)}
  .shoppill.on i{background:#13a05a; box-shadow:0 0 0 3px rgba(19,160,90,.22)}
  .shoppill:active{transform:scale(.95)}

  .hero-grid{display:flex; align-items:flex-end; gap:16px}
  .hero-big{flex:1; min-width:0}
  .hero-big span{display:block; font-size:12px; color:var(--muted); font-weight:700;
                 letter-spacing:.06em; text-transform:uppercase}
  .hero-big b{
    display:block; font-size:40px; font-weight:800; letter-spacing:-.04em; line-height:1.1;
    font-variant-numeric:tabular-nums; margin-top:2px; color:var(--ink);
  }
  .hero-side{flex:0 0 auto; display:flex; flex-direction:column; gap:10px; text-align:right}
  .hero-side span{display:block; font-size:11px; color:var(--muted); font-weight:700}
  .hero-side b{display:block; font-size:16px; font-weight:800; font-variant-numeric:tabular-nums}
  .hero-ic{width:40px; height:40px; border-radius:13px; background:var(--tint); color:var(--brand);
           display:grid; place-items:center; flex:0 0 auto}
  .hero-k{font-size:15px; font-weight:800; letter-spacing:-.02em}
  .hero-sub{font-size:12px; color:var(--muted); font-weight:600}
  .hero-nums{display:flex; gap:0}
  .hero-nums > div{flex:1; padding-right:16px}
  .hero-nums > div + div{border-left:1px solid var(--line); padding-left:16px}
  .hero-nums span{display:block; font-size:11px; color:var(--muted); font-weight:700;
                  letter-spacing:.05em; text-transform:uppercase}
  .hero-nums b{display:block; font-size:28px; font-weight:800; letter-spacing:-.03em;
               font-variant-numeric:tabular-nums; line-height:1.25; color:var(--ink)}
  .hero-note{position:relative; z-index:1; margin-top:14px; padding-top:12px;
             border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-2); font-weight:600}

  /* การ์ดสถิติสีพาสเทล */
  .stat-card{border-radius:var(--r-card); padding:16px 16px 10px; position:relative;
             overflow:hidden; box-shadow:var(--sh-card)}
  .stat-card.tint-o{background:var(--tint)}
  .stat-card.tint-g{background:var(--soft)}
  .stat-k{font-size:12.5px; font-weight:700; color:var(--ink-2)}
  .stat-v{font-size:26px; font-weight:800; letter-spacing:-.03em; margin-top:2px;
          font-variant-numeric:tabular-nums}

  .stat-chart{margin:6px -6px -4px}

  .rankx{display:flex; flex-direction:column; gap:14px}

  .rankx-no{
    width:28px; height:28px; min-width:28px; flex:0 0 auto; padding:0 4px;
    border-radius:99px; background:var(--soft);
    color:var(--ink-2); display:grid; place-items:center; font-weight:800; font-size:13px;
  }
  .rankx-no.top{background:var(--brand); color:#fff; box-shadow:0 3px 9px rgba(211,43,43,.35)}
  .rankx-main{flex:1; min-width:0}
  .rankx-n{font-weight:700; font-size:14px; margin-bottom:6px; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap}
  .rankx-v{flex:0 0 auto; text-align:right; font-weight:800; font-size:14.5px;
           font-variant-numeric:tabular-nums}
  .rankx-v span{display:block; font-size:11.5px; color:var(--muted); font-weight:600}

  .mon-nums{display:flex; gap:0}
  .mon-nums > div{flex:1}
  .mon-nums > div + div{border-left:1px solid var(--line-2); padding-left:14px}
  .mon-nums > div{padding-right:14px}
  .mon-nums span{display:block; font-size:11.5px; color:var(--muted); font-weight:600}
  .mon-nums b{display:block; font-size:19px; font-weight:800; letter-spacing:-.025em;
              font-variant-numeric:tabular-nums}

  @media(min-width:760px){
    .dash{grid-template-columns:repeat(2,1fr); gap:16px}
    .dash-a{grid-column:1/-1}
    .dash-d{grid-column:1/-1}
  }
  @media(min-width:1040px){
    .dash{grid-template-columns:repeat(4,1fr)}
    .dash-a{grid-column:span 2; grid-row:span 2}
    .dash-b{grid-column:span 1}
    .dash-c{grid-column:span 1}
    .dash-d{grid-column:span 2}
    .dash-e{grid-column:span 2}
    .dash-f{grid-column:span 2}
    .dash-g{grid-column:span 2}
    .dash-h{grid-column:span 2}
    .dash-i{grid-column:span 2}
  }


  /* ===================== หน้าขาย ===================== */
  .salewrap{display:grid; grid-template-columns:1fr; gap:14px}
  .sale-side{display:flex; flex-direction:column; gap:14px}

  /* ปุ่มสั่งสินค้า อยู่ในการ์ดหลัก เป็นปุ่มขาวบนพื้นส้ม */
  .hero-card .orderbtn{
    position:relative; z-index:1; width:100%; margin:18px 0 0;
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:16px; border:none; border-radius:var(--r-pill);
    background:var(--brand); color:#fff; cursor:pointer; font:inherit;
    font-weight:800; font-size:16px; box-shadow:0 10px 24px rgba(211,43,43,.3);
    transition:transform .14s;
  }
  .hero-card .orderbtn svg{width:20px; height:20px}
  .hero-card .orderbtn:active{transform:scale(.97)}
  .hero-card .orderbtn:hover{background:var(--brand-d)}

    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:13px 10px; margin:0 -10px; border:none; background:none; cursor:pointer;
    border-bottom:1px solid var(--line-2); border-radius:12px;
    font:inherit; color:inherit; transition:background .14s;
  }
  .billrow:last-child{border-bottom:none}
  .billrow:hover{background:var(--soft)}
  .billrow:focus-visible{outline:2px solid var(--brand); outline-offset:-2px}
  .billrow-t{
    flex:0 0 auto; width:50px; height:30px; border-radius:9px; background:var(--tint);
    color:var(--brand-d); display:grid; place-items:center;
    font-size:12px; font-weight:800; font-variant-numeric:tabular-nums;
  }
  .billrow-m{flex:1; min-width:0}
  .billrow-n{font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .billrow-s{font-size:12px; color:var(--muted)}
  .billrow-v{
    flex:0 0 auto; font-weight:800; font-size:15.5px; color:var(--ink);
    font-variant-numeric:tabular-nums;
  }

  @media(min-width:1000px){
    .salewrap{grid-template-columns:330px 1fr; gap:18px; align-items:start}
    .sale-side{position:sticky; top:16px}
  }


  /* ===================== หน้าต่างสั่งสินค้า: กระชับขึ้น ===================== */
  dialog{max-height:88dvh}
  .dlg-body .cats{margin:0 0 8px; padding-bottom:10px}
  .dlg-body .poslist{max-height:min(38vh, 300px); overflow-y:auto; margin:0 -4px; padding:0 4px}

  /* แถวเมนูในหน้าต่างเล็กลง กดได้เยอะขึ้นโดยไม่ต้องเลื่อน */
  .dlg-body .posrow{padding:10px; gap:10px}
  .dlg-body .posrow-n{font-size:14px}
  .dlg-body .posrow-p{font-size:15.5px}
  .dlg-body .posrow-add{width:26px; height:26px; border-radius:8px}
  .dlg-body .posrow-add svg{width:14px; height:14px}
  .dlg-body .posrow-c{min-width:21px; height:21px; font-size:11.5px}

  /* บิลเลื่อนในกรอบของตัวเอง */
  .dlg-bill{max-height:min(30vh, 250px); overflow-y:auto; padding:8px}
  .dlg-body .bill-line{padding:10px 0; gap:6px 10px}
  .dlg-body .bl-name{font-size:14px}
  .dlg-body .bl-qty button{width:30px; height:30px; font-size:17px}
  .dlg-body .bl-qty span{min-width:28px; font-size:14px}
  .dlg-body .bl-top{font-size:11.5px; padding:3px 9px; margin-top:4px}

  /* ยอดรวมกับปุ่มติดอยู่ล่างหน้าต่างเสมอ ไม่ต้องเลื่อนหา */
  .dlg-sum-l{display:inline-flex; align-items:center; gap:7px}
  .dlg-sum-l svg{width:15px; height:15px; color:var(--brand-d)}
  .dlg-foot .btn.wide{flex:2}
  .dlg-sum{
    position:sticky; bottom:0; z-index:2; background:var(--bg);
    display:flex; align-items:baseline; justify-content:space-between;
    padding:12px 0 2px; margin-top:4px; border-top:1px solid var(--line);
  }
  .dlg-sum span{font-size:13px; color:var(--ink-2); font-weight:700}
  .dlg-sum-l b{font-size:13px; font-weight:800; color:var(--ink); margin-left:2px}
  .dlg-sum-r b{font-size:24px; font-weight:800; letter-spacing:-.03em;
               font-variant-numeric:tabular-nums; color:var(--brand-d); margin-left:6px}
  .dlg-foot{position:sticky; bottom:0; z-index:3; background:var(--bg); padding-top:12px}

  @media(min-width:720px){
    /* จอกว้าง: เมนูเรียง 2 คอลัมน์ในหน้าต่าง เห็นเยอะขึ้นอีก */
    .dlg-body .poslist{display:grid; grid-template-columns:1fr 1fr; gap:0 14px; align-content:start}
    .dlg-body .posrow{margin:0}
  }

<body>
<div class="shell">

<header class="appbar" id="appbar">

    <h1 id="pageTitle">ภาพรวม</h1>
    <button type="button" class="shopswitch" id="pageSub" onclick="shopHub()" hidden></button>

<script>
/* ===================== ข้อมูล ===================== */
const KEY = 'crepe-cost-v1';        // ของเดิม เก็บร้านเดียว (ยังอ่านไว้เผื่อย้ายข้อมูล)
const HUB = 'crepe-hub-v1';         // ของใหม่ เก็บได้หลายร้าน

// store = ก้อนใหญ่ที่เก็บทุกร้าน / db = ร้านที่กำลังใช้อยู่ (โค้ดที่เหลือใช้ db เหมือนเดิม)
let store = null;
const UNITS = ['กรัม','มิลลิลิตร','ชิ้น','แผ่น','ใบ','ช้อนโต๊ะ'];

const blank = () => ({
  ingredients: [],
  menus: [],
  groups: [],              // ชุดไส้/ท็อปปิ้งที่ใช้ร่วมกัน                 // {id,name,price,addons:[{id,name,price}],items:[]}
  sales: [],                 // {id, d:'YYYY-MM-DD', t:'HH:MM', menuId, name, qty, addons:[{name,price}], total}
  expenses: [],              // {id, d:'YYYY-MM-DD', t:'HH:MM', note, amount}
  fixed: { rent:0, electric:0, gas:0, water:0, other:0, days:26, labor:0 },
  targetMargin: 65,
  shopName: 'ร้านเครป',      // โชว์ใต้หัวข้อหน้าขาย แก้ได้ที่ตั้งค่า
  shopBranch: '',
  shopOpen: 1                // ป้ายบอกว่าตอนนี้เปิดร้านอยู่ไหม
});

/* ---------- วันที่ ---------- */
const pad2 = v => String(v).padStart(2,'0');
const dayKey = (dt = new Date()) => `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
const nowTime = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thaiDate(key, withYear){
  const [y,m,d] = key.split('-').map(Number);
  return `${d} ${TH_MON[m-1]}${withYear ? ' ' + (y+543).toString().slice(-2) : ''}`;
}
const monthKey = key => key.slice(0,7);
function thaiMonth(mk){
  const [y,m] = mk.split('-').map(Number);
  return `${TH_MON[m-1]} ${y+543}`;
}

/* ---------- สรุปของวัน / เดือน ---------- */
function sumDay(key){
  const sale = (db.sales||[]).filter(x => x.d === key).reduce((a,x) => a + n(x.total), 0);
  const exp  = (db.expenses||[]).filter(x => x.d === key).reduce((a,x) => a + n(x.amount), 0);
  return { sale, exp, net: sale - exp };
}
function sumMonth(mk){
  const sale = (db.sales||[]).filter(x => monthKey(x.d) === mk).reduce((a,x) => a + n(x.total), 0);
  const exp  = (db.expenses||[]).filter(x => monthKey(x.d) === mk).reduce((a,x) => a + n(x.amount), 0);
  const days = new Set([...(db.sales||[]), ...(db.expenses||[])].filter(x => monthKey(x.d) === mk).map(x => x.d));
  return { sale, exp, net: sale - exp, days: days.size };
}
// รายการทั้งหมดของวันนั้น เรียงเวลาใหม่สุดขึ้นก่อน
function entriesOf(key){
  const a = (db.sales||[]).filter(x => x.d === key).map(x => ({...x, kind:'sale'}));
  const b = (db.expenses||[]).filter(x => x.d === key).map(x => ({...x, kind:'exp'}));
  return [...a,...b].sort((x,y) => String(y.t||'').localeCompare(String(x.t||'')));
}
function allDays(){
  const set = new Set([...(db.sales||[]), ...(db.expenses||[])].map(x => x.d));
  return [...set].sort().reverse();
}

let db = load();
applyShopLink();
let tab = 'today';

// ทำให้ข้อมูลร้านหนึ่งร้านอยู่ในรูปที่ใช้ได้เสมอ
function fixShop(raw, fallbackName){
  const d = migrateGroups(Object.assign(blank(), raw || {}));
  if(!d.id) d.id = uid();
  if(!String(d.shopName || '').trim()) d.shopName = fallbackName || 'ร้านของฉัน';
  return d;
}

function load(){
  try{
    const hub = localStorage.getItem(HUB);
    if(hub){
      const st = JSON.parse(hub);
      if(st && Array.isArray(st.shops) && st.shops.length){
        store = { shops: st.shops.map((x,i) => fixShop(x, 'ร้านที่ ' + (i+1))), active: st.active };
        if(st.locked && st.shops.some(x => x.id === st.locked)) store.locked = st.locked;
        if(st.pin && st.pin.h) store.pin = st.pin;          // รหัสคนดูแลเป็นของเครื่อง ไม่ใช่ของร้านใดร้านหนึ่ง
        if(!store.shops.some(x => x.id === store.active)) store.active = store.shops[0].id;
        if(store.locked) store.active = store.locked;      // เครื่องที่ผูกไว้ เปิดมาเจอร้านนั้นเสมอ
        return store.shops.find(x => x.id === store.active);
      }
    }
    // ยังไม่เคยมีหลายร้าน — ย้ายของเดิมเข้ามาเป็นร้านแรก
    const raw = localStorage.getItem(KEY);
    const first = raw ? fixShop(JSON.parse(raw), 'ร้านเครป')
                      : fixShop(seedHistory(buildDemo()), 'ร้านเครป');
    store = { shops:[first], active: first.id };
    return first;
  }catch(e){
    const first = fixShop(seedHistory(buildDemo()), 'ร้านเครป');
    store = { shops:[first], active: first.id };
    return first;
  }
}
/* ===================== ชุดไส้ที่ใช้ร่วมกันหลายเมนู =====================
   เดิมไส้ถูกก๊อปเก็บไว้ในแต่ละเมนู แก้ทีต้องไล่แก้ทุกเมนู
   เปลี่ยนเป็นเก็บเป็น "ชุด" ไว้ที่เดียว แล้วเมนูแค่บอกว่าใช้ชุดไหนบ้าง */
function migrateGroups(d){
  const hasLegacy = (d.menus||[]).some(m => (m.addons||[]).length);
  if(Array.isArray(d.groups) && d.groups.length && !hasLegacy) return d;
  if(!hasLegacy){ d.groups = d.groups || []; return d; }
  if(!Array.isArray(d.groups)) d.groups = [];
  const groups = d.groups;
  (d.menus||[]).forEach(m => {
    const ids = Array.isArray(m.groupIds) ? [...m.groupIds] : [];
    (m.addons||[]).forEach(a => {
      const gname = a.group || 'ท็อปปิ้ง';
      let g = groups.find(x => x.name === gname);
      if(!g) groups.push(g = {id:uid(), name:gname, items:[]});
      if(!g.items.some(x => x.name === a.name && n(x.price) === n(a.price)))
        g.items.push({id:uid(), name:a.name, price:n(a.price)});
      if(!ids.includes(g.id)) ids.push(g.id);
    });
    m.groupIds = ids;
    delete m.addons;                 // ย้ายเข้าในชุดแล้ว
  });
  d.groups = groups;
  return d;
}

// ไส้ทั้งหมดที่เมนูนี้เลือกได้ (รวมของเก่าที่ยังไม่ได้ย้าย)
function menuAddons(m){
  if(!m) return [];
  const out = [];
  (m.groupIds||[]).forEach(gid => {
    const g = (db.groups||[]).find(x => x.id === gid);
    if(g) g.items.forEach(it => out.push({id:it.id, name:it.name, price:n(it.price), group:g.name}));
  });
  (m.addons||[]).forEach(a => { if(!out.some(x => x.name === a.name)) out.push(a); });
  return out;
}
const findGroup = id => (db.groups||[]).find(g => g.id === id);

let saveWarned = false;
function save(){
  try{
    localStorage.setItem(HUB, JSON.stringify(store));
    saveWarned = false;
  }catch(e){
    // ที่เก็บเต็ม หรือเบราว์เซอร์ปิดการเก็บข้อมูลไว้ — ของที่กรอกจะหายตอนปิดแอป
    // ต้องบอกให้รู้ ไม่ใช่เงียบ แต่บอกครั้งเดียวพอ ไม่ให้เด้งรัวทุกการกระทำ
    if(!saveWarned){
      saveWarned = true;
      if(typeof toast === 'function') toast('บันทึกลงเครื่องไม่ได้ — รีบกดสำรองข้อมูลเก็บไว้');
    }
  }
}
// เปลี่ยนข้อมูลของร้านที่กำลังใช้อยู่ทั้งก้อน (ชื่อร้านกับ id ยังเป็นของเดิม)
function setShopData(data){
  const keep = { id: db.id, shopName: db.shopName, shopBranch: db.shopBranch, shopOpen: db.shopOpen };
  const next = Object.assign(blank(), data, keep);
  const i = store.shops.findIndex(x => x.id === keep.id);
  if(i >= 0) store.shops[i] = next; else store.shops.push(next);
  db = next; save();
}
const curShop = () => store.shops.find(x => x.id === store.active) || store.shops[0];

/* ===================== ลิงก์เฉพาะร้าน =====================
   ส่งลิงก์คนละอันให้แต่ละร้าน เปิดในมือถือตัวเองครั้งเดียว
   เครื่องนั้นจะผูกกับร้านนั้นร้านเดียว ไม่เห็นร้านอื่น ไม่ต้อง login
   (เป็นการกันพลาดกันงง ไม่ใช่ระบบความปลอดภัย — ใครแก้ URL เองก็ยังเปลี่ยนได้) */
function isLocked(){
  return !!store.locked && store.shops.some(x => x.id === store.locked);
}

/* ===================== รหัสคนดูแล =====================
   ของที่แก้แล้วกระทบเงิน (เมนู ราคา ชุดไส้ ลบบิล ล้างข้อมูล ฯลฯ) ต้องใส่รหัสก่อน
   หน้าขายกับ Dashboard ใช้ได้เลยไม่ต้องใส่อะไร ลูกน้องเปิดมาก็ขายได้ทันที

   หมายเหตุตามตรง: รหัสถูกกวนไว้ไม่ให้อ่านเจอตอนเปิดดูข้อมูลในเครื่อง
   แต่ไม่ใช่การเข้ารหัสจริง และข้อมูลทั้งหมดก็อยู่ในเครื่องนั้นอยู่แล้ว
   มันมีไว้กันคนในร้านเผลอแก้ ไม่ได้มีไว้กันคนที่ตั้งใจเจาะ */
const PIN_MINUTES = 10;         // ใส่รหัสครั้งเดียว ทำงานต่อได้กี่นาที
let adminUntil = 0;

function pinHash(pin, salt){
  const txt = String(salt || '') + '|' + String(pin || '');
  let a = 0x811c9dc5, b = 0x01000193;
  for(let r = 0; r < 600; r++){
    for(let i = 0; i < txt.length; i++){
      a ^= txt.charCodeAt(i) + r;
      a = Math.imul(a, b) >>> 0;
      a = ((a << 13) | (a >>> 19)) >>> 0;
    }
  }
  return a.toString(16).padStart(8,'0');
}
const hasPin = () => !!(store.pin && store.pin.h);
const isAdmin = () => !hasPin() || Date.now() < adminUntil;
function openAdmin(){ adminUntil = Date.now() + PIN_MINUTES * 60000; }
function lockAdmin(){ adminUntil = 0; render(); toast('ล็อกแล้ว'); }
function pinBtnTap(){ isAdmin() ? lockAdmin() : askPin(null); }

// ใส่ไว้ต้นฟังก์ชันของคนดูแล — ถ้ายังไม่ได้ปลดล็อกจะถามรหัสแล้วค่อยทำต่อให้เอง
function adminOk(retry){
  if(isAdmin()) return true;
  askPin(retry);
  return false;
}

function askPin(onOk){
  openDialog({
    title:'ใส่รหัสคนดูแล',
    sub:'ส่วนนี้แก้แล้วกระทบยอดเงิน เลยขอรหัสก่อน',
    fields:[{k:'pin', label:'รหัส', value:'', placeholder:'ตัวเลข 4-6 หลัก', wide:true}],
    saveLabel:'ยืนยัน',
    check: v => pinHash(v.pin, store.pin.s) === store.pin.h ? null : 'รหัสไม่ถูก ลองใหม่อีกที',
    save: () => {
      openAdmin();
      render();
      if(typeof onOk === 'function') setTimeout(onOk, 60);
    }
  });
}

function pinDialog(){
  if(hasPin() && !adminOk(() => pinDialog())) return;
  const setting = hasPin();
  openDialog({
    title: setting ? 'เปลี่ยนรหัสคนดูแล' : 'ตั้งรหัสคนดูแล',
    sub:'ใช้ตอนจะแก้เมนู ราคา ชุดไส้ ลบบิล หรือล้างข้อมูล',
    fields:[
      {k:'pin', label:'รหัสใหม่', value:'', placeholder:'ตัวเลข 4-6 หลัก', wide:true},
      {k:'pin2', label:'ใส่รหัสใหม่อีกครั้ง', value:'', placeholder:'ให้ตรงกับข้างบน', wide:true}
    ],
    saveLabel: setting ? 'เปลี่ยนรหัส' : 'ตั้งรหัส',
    check: v => {
      const a = String(v.pin || '').trim();
      if(!/^[0-9]{4,6}$/.test(a)) return 'ใส่เป็นตัวเลข 4-6 หลัก';
      if(a !== String(v.pin2 || '').trim()) return 'รหัสสองช่องไม่ตรงกัน';
      return null;
    },
    save: v => {
      const salt = uid() + uid();
      store.pin = { s: salt, h: pinHash(String(v.pin).trim(), salt) };
      openAdmin(); save(); render();
      toast(setting ? 'เปลี่ยนรหัสแล้ว' : 'ตั้งรหัสแล้ว — ของสำคัญถูกล็อกไว้ให้แล้ว');
    }
  });
}

function clearPin(){
  if(!adminOk(() => clearPin())) return;
  askConfirm('เอารหัสออก', 'หลังจากนี้ใครก็แก้เมนู ราคา และลบบิลได้โดยไม่ต้องใส่รหัส', 'เอาออก', () => {
    delete store.pin; adminUntil = 0; save(); render(); toast('เอารหัสออกแล้ว');
  });
}

function applyShopLink(){
  let q;
  try{ q = new URLSearchParams(location.search); }catch(e){ return; }
  const id = (q.get('shop') || '').trim();
  if(!id) return;
  const name = (q.get('n') || '').trim();
  const branch = (q.get('b') || '').trim();

  let x = store.shops.find(v => v.id === id);
  if(!x){
    const only = store.shops.length === 1 ? store.shops[0] : null;
    const fresh = fixShop(blank(), name || 'ร้านของฉัน');
    fresh.id = id;
    fresh.shopName = name || 'ร้านของฉัน';
    fresh.shopBranch = branch;
    // เครื่องใหม่ที่มีแต่ข้อมูลตัวอย่าง ให้แทนที่ไปเลย จะได้ไม่มีร้านขยะค้าง
    if(only && only.isDemo) store.shops = [fresh]; else store.shops.push(fresh);
    x = fresh;
  }else{
    if(name) x.shopName = name;
    if(branch) x.shopBranch = branch;
  }
  store.active = x.id;
  store.locked = x.id;
  db = x; save();
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
}

function shopLink(id){
  const x = store.shops.find(v => v.id === id); if(!x) return '';
  const base = location.origin + location.pathname;
  const q = new URLSearchParams();
  q.set('shop', x.id);
  if(String(x.shopName||'').trim()) q.set('n', x.shopName);

}

// ตัวอักษรแทนรายการในวงกลม — ข้ามสระหน้าของไทยเพื่อให้แต่ละรายการต่างกันจริง
function initial(name){
  const t = String(name || '').trim();
  if(!t) return '?';
  const m = t.match(/[^sเ-ไ]/);   // ตัวแรกที่ไม่ใช่ เ แ โ ใ ไ
  return (m ? m[0] : t[0]);
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function n(v){ const x = parseFloat(v); return isFinite(x) ? x : 0; }
// เจ้าของร้านคิดเป็นบาทเต็ม ไม่ได้คิดเป็นสตางค์ — แสดงทศนิยมเฉพาะตอนเงินน้อยกว่า 10 บาท
function baht(v){
  const x = n(v);
  // เลขกลม ๆ ไม่ต้องมีจุดทศนิยม (5 ไม่ใช่ 5.00) · เลขน้อยกว่า 10 ที่มีเศษค่อยโชว์สตางค์
  if(Number.isInteger(x)) return x.toLocaleString('th-TH');
  return Math.abs(x) < 10
    ? x.toLocaleString('th-TH',{minimumFractionDigits:2, maximumFractionDigits:2})
    : Math.round(x).toLocaleString('th-TH');
}
function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// ค่าที่ต้องไปอยู่ใน onclick="fn('...')" ต้องหนี ' และ \ ด้วย
// ไม่งั้นชื่อแบบ ไข่'พิเศษ จะทำให้สตริง JS ขาด ปุ่มกดไม่ติดแบบเงียบ ๆ
function jsq(s){
  return esc(String(s ?? '').replace(/[\r\n]+/g, ' ').replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
// เงินติดลบต้องเป็น -฿400 ไม่ใช่ ฿-400
function money(v){ const x = n(v); return (x < 0 ? '-฿' : '฿') + baht(Math.abs(x)); }

// ราคาต่อหน่วยมักเป็นเลขจุดทศนิยมยาว ๆ (0.0450) คนทั่วไปอ่านยาก
// ถ้าต่ำกว่า 1 บาทให้บอกเป็นสตางค์แทน
function perUnit(ing){
  const c = unitCost(ing), u = esc(ing.unit);
  if(c === 0) return 'ยังไม่ได้ใส่ราคา';
  if(c < 1) return `${u}ละ ${(c*100).toFixed(c < 0.1 ? 1 : 0)} สตางค์`;
  return `${u}ละ ${baht(c)} บาท`;
}

/* ===================== การคำนวณ ===================== */
const unitCost = ing => n(ing.packQty) > 0 ? n(ing.packPrice) / n(ing.packQty) : 0;
const findIng = id => db.ingredients.find(i => i.id === id);

function menuCost(m){
  return (m.items||[]).reduce((s,it) => {
    const ing = findIng(it.ingId);
    return s + (ing ? unitCost(ing) * n(it.qty) : 0);
  }, 0);
}
const profit = m => n(m.price) - menuCost(m);
const marginPct = m => n(m.price) > 0 ? profit(m) / n(m.price) * 100 : 0;
const suggestPrice = m => {
  const mg = n(db.targetMargin);
  return mg < 100 ? menuCost(m) / (1 - mg/100) : 0;
};

function fixedPerMonth(){
  const f = db.fixed;
  return n(f.rent)+n(f.electric)+n(f.gas)+n(f.water)+n(f.other) + n(f.labor)*n(f.days);
}
const fixedPerDay = () => n(db.fixed.days) > 0 ? fixedPerMonth() / n(db.fixed.days) : 0;

function avgProfit(){
  const list = db.menus.filter(m => n(m.price) > 0);
  if(!list.length) return 0;
  return list.reduce((s,m) => s + profit(m), 0) / list.length;
}
const breakEven = () => avgProfit() > 0 ? fixedPerDay() / avgProfit() : 0;

/* ภาพรวมทั้งร้านต่อวัน — คิดจากยอดขายโดยประมาณของแต่ละเมนู */
function daily(){
  let revenue = 0, food = 0, plates = 0;
  db.menus.forEach(m => {
    const q = n(m.qtyPerDay);
    if(q <= 0) return;
    plates  += q;
    revenue += n(m.price) * q;
    food    += menuCost(m) * q;
  });
  const fixed = fixedPerDay();
  const gross = revenue - food;          // กำไรก่อนหักค่าเช่า/ค่าไฟ
  const net   = gross - fixed;           // กำไรสุทธิจริง ๆ
  const perPlate = plates > 0 ? gross / plates : avgProfit();
  return {
    revenue, food, fixed, gross, net, plates, perPlate,
    need: perPlate > 0 ? fixed / perPlate : 0,   // ต้องขายกี่จานถึงคุ้ม
    month: net * n(db.fixed.days)
  };
}
const hasSales = () => db.menus.some(m => n(m.qtyPerDay) > 0);

// บอกสถานะเป็นคำ คนอ่านไม่ต้องตีความสีเอง
function statusWord(m){
  if(n(m.price) <= 0) return {word:'ยังไม่ได้ใส่ราคา', lv:'warn'};
  if(profit(m) < 0)   return {word:'ขาดทุน', lv:'bad'};
  const lv = level(marginPct(m));
  return {word: lv==='good' ? 'กำไรดี' : lv==='warn' ? 'กำไรพอใช้' : 'กำไรน้อย', lv};
}

// ระดับของกำไร: ถึงเป้า / ใกล้เป้า / ต่ำไป  — ใช้คู่กับตัวเลขเสมอ ไม่ให้สีสื่อความหมายลำพัง
// เกณฑ์ตามมาตรฐานร้านอาหารทั่วไป ไม่ผูกกับเป้าที่ผู้ใช้ตั้ง
// (เป้าที่ตั้งเอาไว้ใช้คำนวณ "ราคาที่แนะนำ" อย่างเดียว)
function level(mg){
  if(mg >= 60) return 'good';   // กำไรดี
  if(mg >= 45) return 'warn';   // พอใช้
  return 'bad';                 // น้อยไป
}

// ตัวเลขสำคัญของแต่ละแท็บ แสดงไว้บนสุดของหน้า
function headStat(){
  if(tab === 'sale') return null;      // หน้าขายใช้พื้นที่ทั้งหมดกับเมนูและบิล
  if(recipeDraft) return {k:'กำลังเลือกของที่ใช้', v:'', s:'ติ๊กของที่ใช้ แล้วใส่จำนวนต่อ 1 จาน'};

  if(order) return {k:'กำลังเปิดบิล', v: baht(orderTotal()), u:'บาท',
                    s: orderCount() ? `${orderCount()} จานในบิลนี้` : 'กดเมนูที่ลูกค้าสั่ง'};
  if(tab === 'today') return null;    // การ์ดหลักบน Dashboard บอกอยู่แล้ว ไม่ต้องซ้ำ

  if(tab === 'hist') return null;     // การ์ดเดือนบอกครบแล้ว
  if(tab === 'setup') return null;    // การ์ดร้านบอกครบแล้ว
  if(tab === 'more'){
    return {k:'อื่น ๆ', v:'', s:'ของที่นาน ๆ ใช้ที'};
  }
  if(tab === 'ing'){
    const c = db.ingredients.length;
    return {k:'ของที่ซื้อมา', v:String(c), u:'อย่าง',
            s: c ? 'แตะที่รายการเพื่อแก้ราคาหรือปริมาณ' : 'ยังไม่ได้ใส่ของที่ซื้อมา'};
  }
  if(tab === 'menu'){
    const ms = db.menus.filter(m => (m.items||[]).length);
    const avg = ms.length ? ms.reduce((a,m)=>a+marginPct(m),0)/ms.length : 0;
    if(openMenuId){
      const m = findMenu(openMenuId);
      if(m) return {k:'กำไรของเมนูนี้', v: n(m.price)>0 ? marginPct(m).toFixed(0) : '–', u:'%',
                    s: n(m.price)>0 ? `ขาย ${baht(m.price)} · ค่าของ ${baht(menuCost(m))} · เหลือ ${baht(profit(m))} บาท` : 'ยังไม่ได้ใส่ราคาขาย'};
    }
    return {k:'เมนูที่ขาย', v:String(db.menus.length), u:'เมนู',
            s: ms.length ? `กำไรเฉลี่ย ${avg.toFixed(0)}% ต่อจาน` : 'ยังไม่ได้ใส่ว่าแต่ละเมนูใช้ของอะไร'};
  }
  if(tab === 'fixed'){
    const be = breakEven();
    return {k:'รายจ่ายประจำเดือน', v: baht(fixedPerMonth()), u:'บาท',
            s: be ? `ต้องขายวันละ ${Math.ceil(be)} จาน ถึงจะไม่ขาดทุน` : 'ใส่ค่าเช่า ค่าไฟ ค่าแก๊ส ให้ครบ'};
  }
  if(!db.menus.length) return {k:'ยินดีต้อนรับ', v:'', s:'เริ่มจากใส่ของที่ซื้อมา แล้วแอปจะคิดกำไรให้เอง'};
  if(!hasSales()) return {k:'ภาพรวมร้าน', v:'', s:'ใส่ยอดขายต่อวัน แล้วจะรู้ว่าเดือนนี้เหลือเท่าไหร่'};
  const d = daily();
  return {k: d.net>=0 ? 'กำไรสุทธิเดือนนี้' : 'ขาดทุนเดือนนี้',
          v: baht(Math.abs(d.month)), u:'บาท',
          s: d.net>=0 ? `วันละ ${baht(d.net)} บาท จากการขาย ${d.plates} จาน`
                      : `ขาดทุนวันละ ${baht(-d.net)} บาท — ต้องขายเพิ่ม`};
}

function render(){
  const t = TABS.find(x => x[0] === tab) || ['','ภาพรวม','dash'];
  document.getElementById('pageTitle').textContent = t[3] || t[1];
  document.getElementById('appbarIc').innerHTML = icon(t[2] || 'dash', 19);
  const sub = document.getElementById('pageSub');
  const many = !isLocked() && store.shops.length > 1;
  sub.innerHTML = `<span>${esc(shopLine())}</span>`
    + (isLocked() ? '' : icon('down',13))
    + (many ? `<b>${store.shops.length} ร้าน</b>` : '');
  sub.classList.toggle('fixed', isLocked());
  sub.disabled = isLocked();
  sub.hidden = !shopLine();

  const hs = headStat();
  document.getElementById('headStat').innerHTML = !hs ? '' :
    `<div class="k">${hs.k}</div>` +
    (hs.v ? `<div class="v">${hs.v}${hs.u ? `<small>${hs.u}</small>` : ''}</div>` : '') +
    `<div class="s">${hs.s}</div>`;

  const pb = document.getElementById('pinBtn');
  pb.hidden = !hasPin();
  pb.classList.toggle('open', isAdmin());
  pb.title = isAdmin() ? 'ปลดล็อกอยู่ — แตะเพื่อล็อก' : 'ล็อกอยู่ — แตะเพื่อปลดล็อก';

  document.body.classList.toggle('hide-banner', tab === 'sale');

  const neg = tab === 'dash' && db.menus.length && hasSales() && daily().net < 0;
  document.getElementById('headStat').classList.toggle('is-bad', !!neg);

  document.getElementById('tabsBottom').innerHTML = TABS.map(([k,l,ic]) =>
    `<button class="${tab===k?'on':''}" onclick="go('${k}')" aria-label="${l}">
       ${icon(ic,22)}<span>${l}</span></button>`).join('');

  renderBanner();
  document.getElementById('view').innerHTML =
    tab==='sale'  ? viewPOS()   :
    tab==='today' ? viewToday() :
    tab==='setup' ? viewSetup() :
    tab==='hist'  ? viewHist()  :
    tab==='menu'  ? viewMenu()  :
    tab==='ing'   ? viewIng()   :
    tab==='fixed' ? viewFixed() :
    tab==='dash'  ? viewDash()  : viewMore();
}
const ADMIN_TABS = ['ing','fixed','dash','menu'];   // เครื่องมือของคนดูแล ไม่ใช่ของหน้าร้าน
function go(t){
  if(ADMIN_TABS.includes(t) && !adminOk(() => go(t))) return;

}

  });
}

/* ===================== หน้าต่างกรอกข้อมูล ===================== */
const dlg = document.getElementById('dlg');
let dlgCfg = null;

// fields: [{k, label, type:'text'|'number'|'select', value, options, placeholder, wide, step}]
// ปุ่มใน <form> ที่ไม่ได้ใส่ type จะเป็น submit โดยปริยาย กดแล้วกล่องปิดทันที
// บังคับให้เป็นปุ่มธรรมดาทั้งหมด เหลือแต่ปุ่มบันทึกที่ตั้ง type="submit" ไว้เอง
function plainButtons(){
  const body = document.getElementById('dlgBody');
  if(body && body.querySelectorAll) body.querySelectorAll('button:not([type])').forEach(b => b.type = 'button');
}

function openDialog(cfg){
  dlgCfg = cfg;
  document.getElementById('dlgTitle').innerHTML = esc(cfg.title)
    + (cfg.tag ? ` <button type="button" class="dlg-tag${cfg.tag.on ? ' on' : ''}" onclick="${cfg.tag.fn}">${esc(cfg.tag.label)}</button>` : '');
  document.getElementById('dlgSub').textContent = cfg.sub || '';

  const foot = document.getElementById('dlgFoot');
  const defFoot = '<button type="button" class="btn ghost" id="dlgCancel" onclick="dlg.close()">ยกเลิก</button>'
                + '<button type="submit" class="btn primary" id="dlgSave">บันทึก</button>';

  // ปุ่มท้ายกล่องแบบกำหนดเอง
  if(cfg.foot){
    foot.innerHTML = cfg.foot.map(b =>
      '<button type="button" class="btn ' + (b.cls||'') + '" onclick="' + b.fn + '">' + b.label + '</button>').join('');
  }else{
    foot.innerHTML = defFoot;
    if(cfg.extraFoot){
      foot.insertAdjacentHTML('beforeend',
        '<button type="button" class="btn ' + (cfg.extraFoot.cls||'') + '" onclick="' + cfg.extraFoot.fn + '">'
        + cfg.extraFoot.label + '</button>');
    }
  }

  const saveBtn = document.getElementById('dlgSave');
  if(saveBtn && cfg.saveLabel) saveBtn.textContent = cfg.saveLabel;

  // โหมดอ่านอย่างเดียว เช่น หน้าอธิบายคำศัพท์ หรือหน้าถามยืนยัน
  // (เช็กว่าส่ง html มาหรือเปล่า ไม่ใช่เช็กว่ามีเนื้อหา — ข้อความว่างก็ยังถือว่าโหมดนี้)
  if(cfg.html !== undefined){
    document.getElementById('dlgBody').innerHTML = `<div style="grid-column:1/-1">${cfg.html}</div>`;
    plainButtons();
    if(!cfg.foot) foot.innerHTML = '<button type="button" class="btn primary" onclick="dlg.close()">เข้าใจแล้ว</button>';
    if(!dlg.open) dlg.showModal();
    return;
  }

  document.getElementById('dlgBody').innerHTML = cfg.fields.map(f => {
    const cls = `f${f.wide ? ' wide' : ''}`;
    if(f.type === 'select'){
      return `<div class="${cls}"><label for="dlg_${f.k}">${f.label}</label>
        <select id="dlg_${f.k}" data-k="${f.k}">${f.options.map(o =>
          `<option value="${esc(o.value)}" ${o.value===f.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;
    }
    const t = f.type === 'number' ? 'number' : 'text';
    return `<div class="${cls}"><label for="dlg_${f.k}">${f.label}</label>
      <input id="dlg_${f.k}" data-k="${f.k}" type="${t}" ${f.type==='number'?'step="any" inputmode="decimal"':''}
        value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder||'')}"></div>`;
  }).join('')
    + (cfg.live ? `<div class="dlg-live" id="dlgLive"></div>` : '')
    + `<div class="dlg-err" id="dlgErr"></div>`;

  plainButtons();
  if(cfg.live) dlg.addEventListener('input', dlgLive);
  dlgLive();
  if(!dlg.open) dlg.showModal();
  const first = dlg.querySelector('[data-k]');
  if(first) setTimeout(() => first.focus(), 60);
}

function dlgValues(){
  const v = {};
  dlg.querySelectorAll('[data-k]').forEach(el => {
    const f = dlgCfg.fields.find(x => x.k === el.dataset.k);
    v[el.dataset.k] = f && f.type === 'number' ? n(el.value) : el.value;
  });
  return v;
}
function dlgLive(){
  const box = document.getElementById('dlgLive');
  if(!box || !dlgCfg || !dlgCfg.live) return;
  box.innerHTML = dlgCfg.live(dlgValues());
}
function dlgSubmit(e){
  e.preventDefault();
  if(typeof dlgCfg.save !== 'function') return false;   // กล่องอ่านอย่างเดียว ไม่มีอะไรให้บันทึก
  const v = dlgValues();
  const err = dlgCfg.check ? dlgCfg.check(v) : null;
  if(err){ document.getElementById('dlgErr').textContent = err; return false; }
  dlg.removeEventListener('input', dlgLive);
  dlg.close();
  dlgCfg.save(v);
  return false;
}
// กดกากบาท = ทำแบบเดียวกับปิดกล่อง (บางกล่องต้องย้อนกลับไปหน้าต่างสั่งสินค้า ไม่ใช่ทิ้งบิล)
function dlgDismiss(){ dlg.close(); }   // ที่เหลือให้ตัวดักเหตุการณ์ close จัดการ จะได้ไม่ทำซ้ำ
dlg.addEventListener('close', () => {
  dlg.removeEventListener('input', dlgLive);
  // มีหน้าต่างใหม่เปิดแทนไปแล้ว = ไม่ใช่การปิดจริง อย่าไปยุ่งกับค่าของหน้าต่างใหม่
  if(dlg.open) return;
  const back = dlgCfg && dlgCfg.onDismiss;
  dlgCfg = {};                       // กัน onDismiss ทำงานซ้ำตอนกล่องถัดไปเปิด
  if(typeof back === 'function') back();
});

/* --------- แท็บ 1: วัตถุดิบ --------- */

      </div>
      <div class="li-end">

      <h2>วัตถุดิบที่ซื้อมา</h2>
      <button class="btn sm primary" onclick="addIng()">${icon('plus',14)} เพิ่ม</button>
    </div>
    <p class="sub">${db.ingredients.length ? 'แตะที่รายการเพื่อแก้ไข' : 'กรอกตามบิลที่ซื้อจริง เดี๋ยวแอปคิดให้เองว่าตกหน่วยละเท่าไหร่'}</p>
    <div class="list">
      ${rows || `<div class="empty">
        <div class="empty-ic">${icon('box',34)}</div>
        <h3>เริ่มจากของที่ซื้อมา</h3>
        <p>กรอกตามบิล เช่น แป้งเครป 1,000 กรัม 45 บาท แล้วแอปจะคิดให้เองว่าตกกรัมละเท่าไหร่</p>
        <button class="btn primary" onclick="addIng()">${icon('plus',16)} เพิ่มของชิ้นแรก</button>

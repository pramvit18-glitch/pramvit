    .posgrid{grid-template-columns:repeat(auto-fill,minmax(126px,1fr))}
    .poswrap{grid-template-columns:1fr 320px}
  }


  /* บิลคอลัมน์แคบ: ชื่ออยู่บรรทัดบนเต็มความกว้าง ปุ่มกับยอดอยู่บรรทัดล่าง ชื่อจะได้ไม่ตัดคำแตก */
  .bill-line{grid-template-columns:1fr auto auto; gap:8px 10px}
  .bill-line .bl-main{grid-column:1/-1}
  .bl-name{line-height:1.35}
  .bl-qty{justify-self:start}
  .bl-sum{justify-self:end}

  /* แถบข้อมูลตัวอย่างไม่ต้องโผล่ตอนกำลังขาย */
  .hide-banner #banner{display:none}


  /* ===================== เมนูในหน้าขาย: แบบรายการ ===================== */
  .poslist{display:flex; flex-direction:column; gap:8px}
  .posrow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:13px 14px; border:1.5px solid transparent; background:var(--bg); cursor:pointer;
    border-radius:var(--r); box-shadow:var(--sh-card);
    font:inherit; color:inherit; transition:.14s;
  }
  .posrow:hover{transform:translateY(-1px); box-shadow:var(--sh-lift)}
  .posrow:active{transform:scale(.99)}
  .posrow:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
  .posrow.has{border-color:var(--brand); background:var(--tint)}
  .posrow-m{flex:1; min-width:0}
  .posrow-n{display:block; font-weight:800; font-size:15px; line-height:1.3}
  .posrow-top{
    display:flex; align-items:center; gap:6px; margin-top:4px;
    font-size:11.5px; font-weight:700; color:var(--muted);
  }
  .posrow-top::before{
    content:''; width:6px; height:6px; border-radius:var(--r-pill); background:var(--brand-l); flex:0 0 auto;
  }
  .posrow.has .posrow-top{color:var(--brand)}
  .posrow.has .posrow-top::before{background:var(--brand)}
  .posrow-c{
    flex:0 0 auto; min-width:26px; height:26px; padding:0 8px; border-radius:var(--r-pill);
    background:var(--brand); color:#fff; font-size:13px; font-weight:800;
    display:grid; place-items:center; box-shadow:0 4px 10px rgba(193,0,22,.3);
  }
  .posrow-p{
    flex:0 0 auto; font-weight:800; font-size:16px; color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .posrow.has .posrow-p{color:var(--brand)}
  .posrow-add{
    flex:0 0 auto; width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
    background:var(--brand); color:#fff;
  }
  .posrow.has .posrow-add{background:var(--brand-d)}


  /* ===================== กราฟ ===================== */
  .chart{margin:4px -4px 0; overflow:hidden}
  .chart .cday{cursor:pointer}
  .chart .cday:hover .cday-bg,
  .chart .cday:focus-visible .cday-bg{opacity:1}
  .chart .cday:focus{outline:none}
  .chart .cday:focus-visible .cday-bg{stroke:var(--brand); stroke-width:1.5}
  .chart svg{display:block; width:100%; height:auto}
  .chart text{font-family:inherit}


  /* ===================== หน้าขาย =====================
     หน้านี้ใช้ยืนขายหน้าร้าน เลยเอาของที่ต้องกดขึ้นก่อน สรุปตัวเลขย่อให้เหลือแถบเดียว */
  .possum{
    background:var(--bg); border-radius:var(--r); box-shadow:var(--sh-card);
    padding:16px 18px; margin-bottom:14px;
  }
  .possum-top{display:flex; align-items:center; gap:12px; margin-bottom:12px}
  .possum-top > div{flex:1; min-width:0}
  .possum-k{font-size:15px; font-weight:800; letter-spacing:-.02em}
  .possum-d{font-size:12px; color:var(--muted); font-weight:600}
  /* ยอดใหญ่กับตัวเลขย่อยอยู่บรรทัดเดียวกัน ฐานตัวอักษรตรงกัน ไม่เว้นช่องโหว่กลางการ์ด */
  .possum-n{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
  .possum-v{
    flex:1 1 auto; font-size:38px; font-weight:800; letter-spacing:-.04em; line-height:1.05;
    font-variant-numeric:tabular-nums;
  }
  .possum-v small{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.05em;
                  text-transform:uppercase; display:block; margin-bottom:2px}
  .possum-x{flex:0 0 auto; display:flex; gap:18px}
  .possum-x span{display:block; font-size:11px; color:var(--muted); font-weight:700}
  .possum-x b{display:block; font-size:16px; font-weight:800; font-variant-numeric:tabular-nums}

  /* ปุ่มเมนู กดแล้วเปิดบิลพร้อมใส่เมนูนั้นให้เลย ลดจำนวนครั้งที่ต้องกด */
  .qmenu{display:grid; grid-template-columns:repeat(auto-fill, minmax(168px,1fr)); gap:10px}
  /* การ์ดเมนูตาม mockup: ชื่อบรรทัดบน · บรรทัดล่างเป็นคำบอกเรื่องไส้ซ้าย ราคาขวา
     เลิกใช้วงกลมตัวอักษรย่อ (.qmenu-av) — ในแบบไม่มี และชื่อเมนูร้านนี้สื่อกว่าตัวย่อ */
  .qmenu-b{
    display:flex; flex-direction:column; align-items:stretch; gap:6px;
    text-align:left; cursor:pointer; font:inherit;
    border:1px solid var(--line); background:var(--bg); border-radius:var(--r);
    padding:13px; color:var(--ink); transition:border-color .14s, background .14s;
  }
  .qmenu-b:hover{border-color:var(--brand); background:var(--tint)}
  .qmenu-b:active{background:var(--tint)}
  /* ชื่อกับราคาเป็น <span> ในกล่องธรรมดา ไม่ได้เป็น flex item เลยไม่ถูกแปลงเป็นบล็อกให้เอง
     ถ้าปล่อยเป็น inline: ellipsis ใช้ไม่ได้ ชื่อยาวจะดันปุ่มกว้างจนทั้งหน้าล้นจอ
     และชื่อกับราคาจะไปอยู่บรรทัดเดียวกัน ทั้งที่ออกแบบให้ราคาอยู่ใต้ชื่อ */
  .qmenu-n, .qmenu-p{display:block}
  .qmenu-n{
    font-size:14px; font-weight:800; line-height:1.35;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .qmenu-r{display:flex; align-items:baseline; gap:8px}
  .qmenu-s{
    flex:1 1 auto; min-width:0; font-size:11.5px; font-weight:700; color:var(--muted);
    line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .qmenu-p{
    flex:0 0 auto; font-size:15px; color:var(--brand); font-weight:800;
    font-variant-numeric:tabular-nums;
  }
  /* เมนูที่ปิดรับทาง QR วันนี้ — ยังกดขายหน้าร้านได้ตามปกติ จึงไม่ทำให้ดูเหมือนปุ่มตาย */
  .qmenu-b.out{border-style:dashed}
  .qmenu-out{
    font-size:11px; font-weight:700; color:var(--warn-ink); background:var(--warn-bg);
    border-radius:var(--r-pill); padding:3px 9px; align-self:flex-start;
  }

  /* ===================== ปุ่มสั่งสินค้าหน้าขาย ===================== */
  .orderbtn{
    display:flex; align-items:center; justify-content:center; gap:12px;
    width:100%; padding:20px; margin-bottom:18px; border:none; border-radius:var(--r-pill);
    background:var(--brand); color:#fff; cursor:pointer; font:inherit;
    font-weight:800; font-size:18px; letter-spacing:-.01em;
    box-shadow:none; transition:transform .14s, background .18s;
  }
  .orderbtn svg{width:25px; height:25px}
  .orderbtn:hover{background:var(--brand-mid)}
  .orderbtn:active{transform:scale(.97)}

  /* หน้าต่างสั่งสินค้าให้สูงได้เต็มที่ รายการเมนูเลื่อนในตัวเอง */
  .dlg-body .poslist{max-height:46vh; overflow-y:auto; margin:0 -4px; padding:0 4px}
  .dlg-body .cats{margin-bottom:6px}


  /* ===================== Dashboard แบบการ์ดหลายใบ ===================== */
  .dash{display:grid; grid-template-columns:1fr; gap:14px}
  .dash > *{min-width:0}   /* เหตุผลเดียวกับ .salewrap — กันของข้างในดันคอลัมน์จนล้นจอ */
  .dash .card{padding:18px; border:none; border-radius:var(--r); box-shadow:var(--sh-card)}

  /* ไอคอน + ข้อความอยู่แถวบนเสมอ ส่วนป้ายกับปุ่มตกลงแถวล่างเมื่อที่ไม่พอ
     ไม่งั้นคำอธิบายจะถูกบีบจนเหลือคอลัมน์แคบ ๆ แล้วตัดคำมั่ว */
  .card-head{
    display:flex; flex-wrap:wrap; align-items:flex-start; gap:10px 12px; margin-bottom:14px;
  }
  .card-head > .ic-tile{order:1}
  .card-head-t{order:2; flex:1 1 60%; min-width:150px}
  .card-head > .head-tag, .card-head > .btn{order:3}
  .card-head > .head-tag ~ .btn{margin-left:0}
  .card-head .btn{flex:0 0 auto; align-self:center}
  /* ป้ายกับปุ่มที่ตกลงมาแถวล่าง ให้ชิดซ้ายเป็นกลุ่มเดียวกัน */
  .card-head > .head-tag{align-self:center}
  .ic-tile{
    width:38px; height:38px; flex:0 0 auto; border-radius:var(--r);
    background:var(--tint); color:var(--brand); display:grid; place-items:center;
  }
  .card-head-t{flex:1; min-width:0}
  .card-head-t h2{margin:0; font-size:16px; font-weight:800; letter-spacing:-.02em}
  .card-head-t p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
  .card-head-t p:empty{display:none}
  .mnav .head-tag{flex:0 0 auto}
  .head-tag{
    flex:0 0 auto; align-self:center; font-size:11.5px; font-weight:800; color:var(--brand);
    background:var(--bg); border:1.5px solid var(--brand-l); border-radius:var(--r-pill);
    padding:4px 11px; white-space:nowrap; letter-spacing:.02em;
  }
  /* ===================== ตั้งค่า ===================== */
  .shoplist{display:flex; flex-direction:column; gap:8px}
  .shoprow{display:flex; align-items:center; gap:8px}
  .shoprow-main{
    flex:1; min-width:0; display:flex; align-items:center; gap:12px; text-align:left; cursor:pointer;
    border:1px solid var(--line); border-radius:var(--r); background:var(--bg);
    padding:11px 13px; font:inherit; color:inherit; transition:.16s;
  }
  .shoprow-main:hover{border-color:var(--brand); background:var(--soft)}
  .shoprow.on .shoprow-main{border-color:var(--brand); background:var(--tint)}
  .shoprow-m{flex:1; min-width:0}
  .shoprow-n{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-weight:800; font-size:14.5px; letter-spacing:-.02em;
  }
  .shoprow-n em{
    font-style:normal; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:var(--r-pill);
    background:var(--brand); color:#fff;
  }
  .shoprow-s{
    display:block; margin-top:3px; font-size:11.5px; color:var(--muted); font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .shoprow .btn.sm{flex:0 0 auto; padding:9px 11px}

  /* ชื่อร้านบนหัว กดเพื่อสลับร้าน */
  .shopswitch{
    display:inline-flex; align-items:center; gap:5px; margin:2px auto 0; padding:0;
    border:none; background:none; cursor:pointer; font:inherit;
    font-size:12px; color:var(--muted); font-weight:600; max-width:100%;
  }
  .shopswitch > span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .shopswitch svg{width:13px; height:13px; flex:0 0 auto}
  .shopswitch b{
    flex:0 0 auto; font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:var(--r-pill);
    background:var(--tint); color:var(--brand-d);
  }
  .shopswitch:hover{color:var(--brand-d)}
  .shopswitch[hidden]{display:none}

  .shopcard{display:flex; align-items:center; gap:13px}
  .lockcard{display:flex; align-items:center; gap:13px}
  .shopswitch.fixed{cursor:default}
  .shopswitch.fixed:hover{color:var(--muted)}
  .ic-tile.big{width:46px; height:46px; border-radius:var(--r);
    background:linear-gradient(145deg, var(--brand), var(--brand-d)); color:#fff}
  .ic-tile.big svg{width:20px; height:20px}
  .shopcard-m{flex:1; min-width:0}
  .shopcard-n{font-size:16px; font-weight:800; letter-spacing:-.02em; display:flex;
              align-items:center; gap:8px; flex-wrap:wrap}
  .shopcard-s{margin-top:3px; font-size:12px; color:var(--muted); font-weight:600;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .statepill{
    font-size:11px; font-weight:800; padding:3px 9px; border-radius:var(--r-pill);
    background:var(--soft); color:var(--muted);
  }
  .statepill.on{background:var(--good-bg); color:var(--good-ink)}

  .pricetag{
    margin-left:7px; font-size:11.5px; font-weight:800; padding:2px 8px; border-radius:var(--r-pill);
    background:var(--tint); color:var(--brand-d); vertical-align:1px;
  }

  .navlist{
    display:flex; flex-direction:column; gap:2px;
    background:var(--soft); border-radius:var(--r); padding:6px;
  }
  .navrow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
    border:none; background:none; font:inherit; color:inherit;
    padding:11px 10px; margin:0; border-radius:var(--r); transition:background .14s;
  }
  .navrow:hover{background:var(--bg)}
  .navrow:active{transform:scale(.99)}
  .navrow .ic-tile{width:34px; height:34px; border-radius:var(--r)}
  .navrow .ic-tile svg{width:17px; height:17px}
  .navrow-m{flex:1; min-width:0}
  .navrow-t{display:block; font-weight:700; font-size:14.5px}
  .navrow-s{display:block; margin-top:2px; font-size:12px; color:var(--muted); font-weight:600;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tone-o{background:var(--tint); color:var(--brand-d)}
  .tone-w{background:var(--warn-bg); color:var(--warn-ink)}
  .tone-g{background:var(--good-bg); color:var(--good-ink)}
  .tone-r{background:var(--bad-bg); color:var(--bad-ink)}
  .navrow .tone-r ~ .navrow-m .navrow-t{color:var(--bad-ink)}

  /* ===================== ย้อนหลัง ===================== */
  .mnav{display:flex; align-items:center; gap:10px}
  .mnav-b{
    width:34px; height:34px; flex:0 0 auto; border-radius:var(--r); cursor:pointer;
    border:1px solid var(--line); background:var(--bg); color:var(--ink-2);
    display:grid; place-items:center; transition:.16s;
  }
  .mnav-b svg{width:16px; height:16px}
  .mnav-b:hover:not(:disabled){border-color:var(--brand); color:var(--brand)}
  .mnav-b:disabled{opacity:.32; cursor:default}
  .mnav-t{flex:1; min-width:0; text-align:center; font-size:17px; font-weight:800; letter-spacing:-.02em}

  /* เดิมเป็น ขาว(การ์ด) → เทา(.mbox) → ขาว(.mbox-row) สามชั้นสลับสี เห็นเป็นการ์ดซ้อนการ์ด
     เอาพื้นของ .mbox ออก แล้วให้สามบรรทัดเรียงกันโดยคั่นด้วยเส้นแทน เหลือชั้นเดียว */
  .mbox{display:flex; flex-direction:column; background:var(--soft);
        border-radius:var(--r); padding:2px 14px}
  .mbox-row{
    display:flex; align-items:center; gap:10px; padding:12px 0;
  }
  .mbox-row + .mbox-row{border-top:1px solid var(--line)}
  .mbox-ic{
    width:28px; height:28px; flex:0 0 auto; border-radius:50%;
    display:grid; place-items:center;
  }
  .mbox-ic svg{width:15px; height:15px}
  .mbox-row.in .mbox-ic{background:var(--good-bg); color:var(--good-ink)}
  .mbox-row.out .mbox-ic{background:var(--tint); color:var(--brand)}
  .mbox-row.net .mbox-ic{background:var(--bg); color:var(--ink)}
  .mbox-k{flex:1; min-width:0; font-size:13px; font-weight:700; color:var(--ink-2);
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mbox-row b{
    flex:0 0 auto; font-size:17px; font-weight:800; font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;
  }
  .mbox-row.in b{color:var(--good-ink)}
  .mbox-row.out b{color:var(--brand)}
  /* บรรทัด "เหลือ" เป็นบรรทัดสรุป ทำให้เด่นด้วยตัวหนังสือเข้มกับเลขใหญ่ขึ้น
     ของเดิมใส่พื้นสีดำไว้ แต่กล่อง .mbox มี padding ซ้ายขวา 14px พื้นดำเลยกินไม่เต็มกล่อง
     เห็นเป็นแท่งดำมุมเหลี่ยมลอยอยู่ข้างใน แถมแอปนี้ตั้งใจไม่มีโหมดมืด จึงเอาพื้นดำออก */
  .mbox-row.net .mbox-k{color:var(--ink)}
  .mbox-row.net b{font-size:19px; color:var(--ink)}
  .mbox-row.net b.bad{color:var(--bad)}

  .mon3{display:flex; gap:10px; margin-top:16px}
  .mon3 > div{
    flex:1; min-width:0; background:var(--soft); border-radius:var(--r); padding:12px 13px;
  }
  .mon3 span{display:block; font-size:11.5px; color:var(--muted); font-weight:700; line-height:1.35}
  .mon3 b{
    display:block; margin-top:4px; font-size:18px; font-weight:800; letter-spacing:-.03em;
    color:var(--brand-d); font-variant-numeric:tabular-nums;
  }
  .mon3 b.good{color:var(--good-ink)}
  .mon3 b.bad{color:var(--bad-ink)}

  .dayx{display:flex; flex-direction:column; gap:10px}
  .dayx-row{
    display:flex; flex-direction:column; gap:9px; width:100%; text-align:left; cursor:pointer;
    border:1px solid var(--line); border-radius:var(--r); background:var(--bg);
    padding:13px 14px; font:inherit; color:inherit; transition:.16s;
  }
  .dayx-row:hover{border-color:var(--brand); background:var(--soft)}
  .dayx-row:active{transform:scale(.995)}
  .dayx-top{display:flex; align-items:center; gap:9px}
  .dayx-d{flex:0 0 auto; font-weight:800; font-size:14.5px}
  .dayx-net{
    flex:1; min-width:0; font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:var(--r-pill);
    background:var(--tint); color:var(--brand-d); justify-self:start;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .dayx-net.good{background:var(--good-bg); color:var(--good-ink)}
  .dayx-net.bad{background:var(--bad-bg); color:var(--bad-ink)}
  .dayx-v{
    flex:0 0 auto; margin-left:auto; font-weight:800; font-size:16px;
    font-variant-numeric:tabular-nums;
  }
  .dayx-bar{display:block; height:7px; border-radius:var(--r-pill); background:var(--line-2); overflow:hidden}
  .dayx-bar i{
    display:block; height:100%; border-radius:var(--r-pill);
    background:linear-gradient(90deg, var(--brand-mid), var(--brand));
  }

  .seeall{
    width:100%; margin-top:14px; padding:12px; cursor:pointer; font:inherit;
    font-size:13px; font-weight:800; color:var(--brand-d);
    background:var(--tint); border:1px dashed var(--brand); border-radius:var(--r);
  }
  .seeall:hover{background:var(--brand); border-style:solid; color:#fff}

  /* การ์ดหลัก ไล่เฉดส้ม */
  .hero-card{
    background:var(--bg); color:var(--ink); border-radius:var(--r);
    padding:18px; position:relative; overflow:hidden; box-shadow:var(--sh-card);
  }
  .hero-main{position:relative; z-index:1}

  @media(min-width:760px){
    .dash{grid-template-columns:repeat(2,1fr); gap:16px}

  /* ต้องวัดจาก "ที่ที่เนื้อหาได้จริง" ไม่ใช่ความกว้างจอ
     จอ 1280 - รางเมนู 84 - ช่องไฟ 26 - ขอบ 44 = เนื้อหาราว 1,126px ถึงจะพอแตก 4 คอลัมน์
     เดิมใช้ 1040 แล้วการ์ดเบียดกันหมด (ตอนนั้นยังไม่มี sidebar ด้วยซ้ำ) */
  @media(min-width:1280px){
    /* 3 คอลัมน์ ไม่ใช่ 4 — เพราะแต่ละแท็บย่อยมีการ์ด 2-4 ใบ
       ถ้าใช้ 4 คอลัมน์จะมีแถวที่เหลือที่ว่างยาวข้างขวาเสมอ ดูเหมือนหน้ายังโหลดไม่เสร็จ
       จัดเป็น 3 แล้วทุกแท็บลงตัวพอดีแถว: (2+1) และ (1+2) */
    .dash{grid-template-columns:repeat(3,1fr)}
    .dash-a{grid-column:span 2}
    .dash-b{grid-column:span 1}
    /* ลองย้ายกราฟไปซ้ายแล้วกลับแย่กว่า: กริดวางของตามลำดับ พอบังคับการ์ดเล็กไปคอลัมน์ 3
       กราฟที่ต้องกิน 2 คอลัมน์เลยไม่ย้อนกลับมาเติมแถวเดิม ตกไปขึ้นแถวใหม่ทั้งแถว
       ปล่อยให้ไหลตามลำดับแบบนี้ลงตัวที่สุดแล้ว */
    .dash-c{grid-column:span 1}
    .dash-d{grid-column:span 2}
    .dash-e{grid-column:span 2}
    .dash-f{grid-column:span 1}
    .dash-g{grid-column:span 1}
    .dash-h{grid-column:span 2}
    .dash-i{grid-column:span 2}

  /* ===================== หน้าขาย ===================== */
  /* grid item มี min-width:auto โดยปริยาย ถ้าของข้างในกว้างเกินจะดันคอลัมน์จนหน้าล้นจอ
     min-width:0 บอกว่ายอมให้หดได้ ของข้างในต้องไปจัดการตัวเองด้วย overflow */
  .salewrap{display:grid; grid-template-columns:1fr; gap:14px}

  .sale-side{display:flex; flex-direction:column; gap:14px}
  /* ของที่เอามาวางในนี้ (ปุ่มเปิดบิล หัวข้อย่อย การ์ดสรุป) พกมาร์จิ้นของตัวเองมาด้วย
     ซึ่งถูกต้องตอนอยู่หน้าอื่นที่เรียงแบบธรรมดา แต่พอมาอยู่ในกล่องที่มี gap จะบวกกันสองชั้น
     ล้างทิ้งให้หมด ปล่อยให้ gap เป็นคนคุมระยะคนเดียว */
  .sale-side > *{margin-top:0; margin-bottom:0}
  /* ฝั่งเมนู (การ์ดเลือกเมนู + การ์ดบิลวันนี้) */

  /* หัวคอลัมน์ของบิลวันนี้ — คอลัมน์ต้องตรงกับ .billrow
     ซ่อนบนจอแคบ เพราะแถวบิลบนมือถือเป็นสองบรรทัด หัวคอลัมน์จะไม่ตรงกับอะไรเลย */

  /* ปุ่มสั่งสินค้า อยู่ในการ์ดหลัก เป็นปุ่มขาวบนพื้นส้ม */

  .billrow-t{

    color:var(--brand-d); display:grid; place-items:center;

  .billrow-m{flex:1; min-width:0}
  .billrow-n{font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .billrow-s{font-size:12px; color:var(--muted)}
  .billrow-v{
    flex:0 0 auto; font-weight:800; font-size:15.5px; color:var(--ink);

  @media(min-width:1000px){
    /* ตาม mockup: เมนูอยู่ฝั่งกว้าง แถบสรุปกับปุ่มเปิดบิลอยู่ฝั่งแคบขวา
       **ลำดับใน HTML ห้ามขยับ** (แถบสรุปยังมาก่อน) ไม่งั้นมือถือจะเห็นเมนูขึ้นก่อน
       ซึ่งผิดจากที่เจ้าของสั่งว่าหน้ามือถือไม่ต้องแก้ — ย้ายด้วย grid-column เท่านั้น */

  /* ยอดรวมกับปุ่มติดอยู่ล่างหน้าต่างเสมอ ไม่ต้องเลื่อนหา */

  @media(min-width:720px){

  /* ===================== จอคอม =====================
     เจ้าของบอกว่าบนมือถือสวยแล้ว แต่เปิดบนคอมไม่สวย — ไล่ดูแล้วเจอสาเหตุ

     `@media` วัดจาก **ความกว้างของจอ** ไม่ใช่ความกว้างของเปลือกแอป
     แต่เปลือกถูกล็อกไว้ที่ 780px พอเปิดบนคอมกว้าง 1440
     แดชบอร์ดเลยสลับไปใช้แบบ 4 คอลัมน์ ทั้ง ๆ ที่มีที่จริงแค่ ~700px
     ได้การ์ดผอมเบียดกัน และการ์ดใบใหญ่ถูกสั่งให้กินสองแถว เลยยืดสูงจนว่างเปล่าครึ่งใบ

     แก้สองอย่าง: ให้เปลือกกว้างขึ้นจริงบนจอใหญ่ และห้ามการ์ดยืดตามความสูงของแถว */
  @media(min-width:1120px){
    /* จอคอมใช้เมนูข้าง (sidebar) แทนแถบเม็ดยาบนหัว — เจ้าของเลือกเอง
       .shell มีลูกตรง ๆ แค่ 3 ตัว (appbar · bottomnav · main) จึงจัดเป็นกริดได้เลย
       ไม่ต้องแก้ HTML — แถบเดิมบนมือถือยังเป็นแถบลอยล่างเหมือนเดิมทุกอย่าง */
    /* รางเมนูชิดขอบจอซ้ายและยาวเต็มความสูง แบบแอปบนคอมทั่วไป
       เปลือกจึงต้องกว้างเต็มจอ แล้วไปจำกัดความกว้างที่ "เนื้อหา" แทน
       (ถ้าจำกัดที่เปลือก รางจะลอยอยู่กลางอากาศ ไม่ชิดขอบ — ลองแล้วดูแปลก) */
    .shell{
      max-width:none; display:grid; align-items:start;
      grid-template-columns:84px minmax(0,1fr);
      grid-template-areas:
        "nav head"
        "nav main";
      gap:0; padding:0;
    }
    .appbar{grid-area:head; width:100%; max-width:var(--wide); margin:0 auto; padding:26px 28px 10px}
    main{grid-area:main; width:100%; max-width:var(--wide); margin:0 auto; padding:0 28px 80px}

    .bottomnav{
      grid-area:nav;
      /* กลับมาเป็น sticky ต้องล้าง left/bottom ของ "แถบลอยกลางจอ" บนมือถือให้หมดด้วย
         ไม่งั้นมันเอา left:50% มาใช้ต่อ แล้วเมนูข้างไปโผล่กลางจอทับเนื้อหา (เจอมาแล้ว) */
      /* กดของในกล่องย่อยแล้วต้อง blur() ด้วย (อยู่ที่ onclick) ไม่งั้น :focus-within
         ยังเป็นจริง กล่องเลยค้างเปิดอยู่ทั้งที่เมาส์ออกไปแล้ว */
      position:sticky; top:0; left:auto; right:auto; bottom:auto; transform:none;
      flex-direction:column; align-items:stretch; width:84px; max-width:none;
      height:100dvh; justify-content:flex-start;
      margin:0; padding:14px 8px; gap:2px;
      border-radius:0; background:var(--bg);
      box-shadow:1px 0 0 var(--line), 3px 0 20px rgba(22,24,28,.05);
    }
    .bottomnav > .navitem{flex:0 0 auto}
    .bottomnav button{
      flex-direction:column; justify-content:center; width:100%;
      padding:10px 2px 8px; gap:5px; font-size:10.5px; border-radius:var(--r);
    }
    .bottomnav button svg{width:21px; height:21px}

    /* ===== กล่องเมนูย่อยตอนเอาเมาส์ชี้ =====
       เปิดด้วย CSS ล้วน ไม่ต้องมีสถานะใน JS ให้พัง
       ต้องเปิดตอนชี้ที่ "ตัวครอบ" ไม่ใช่ที่ปุ่ม ไม่งั้นพอเมาส์ออกจากปุ่มเพื่อจะไปกดในกล่อง
       กล่องจะหายก่อนเมาส์ไปถึง · :focus-within เผื่อคนใช้คีย์บอร์ด */
    .navfly{
      display:block; position:absolute; left:calc(100% + 10px); top:-8px; z-index:40;
      width:280px; padding:12px; border-radius:var(--r);
      background:var(--bg); box-shadow:var(--sh-lift);
      opacity:0; visibility:hidden; transform:translateX(-6px);
      transition:opacity .14s, transform .14s, visibility .14s;
    }
    .navitem:hover > .navfly, .navitem:focus-within > .navfly{
      opacity:1; visibility:visible; transform:translateX(0);
    }
    /* สะพานใส ๆ คั่นช่องว่าง 10px ไม่งั้นเมาส์ลอดช่องแล้วกล่องปิดกลางทาง */
    .navfly::before{content:''; position:absolute; left:-12px; top:0; bottom:0; width:12px}
    .navfly-h{

    .bottomnav .navfly-b{

    .chart svg{max-width:620px; margin:0 auto}

  @media(min-width:1280px){
    /* หัวหน้าแรกวางสองคอลัมน์ ไม่งั้นแถววันกับแถวทางลัดถูกยืดข้ามจอ
       เหลือไอคอน 5 อันกองซ้ายแล้วว่างยาวไปถึงขอบขวา ดูโล่งจนเหมือนหน้าพัง
       ใช้ > เจาะเฉพาะลูกตรง ๆ เพราะ .home-sec มีซ้ำอยู่ข้างใน #hiliteWrap ด้วย */
    /* สามคอลัมน์: ทางลัด | ขายดี | ปฏิทิน+สถานะ
       เคยจัดสองคอลัมน์แล้วคอลัมน์ซ้ายกว้าง 694px แต่ของในนั้นใช้จริงแค่ 256-340
       เหลือที่ว่างยาวเป็นแถบ ๆ · แบ่งสามแล้วแต่ละกองได้ ~346px พอดีของที่มี */
    #homeBody{
      display:grid; align-items:start; gap:0 26px;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      /* หมายเหตุ: บล็อก "รางซ้าย" ท้ายไฟล์ทับกฎกลุ่มนี้ทั้งหมดเมื่อจอกว้างพอ
         เก็บไว้เป็นทางถอยสำหรับเบราว์เซอร์ที่ยังไม่รองรับ :has() */
      /* คอลัมน์ที่กินสองแถว (ทางลัด · ขายดี) ไหลเองได้ตามเนื้อหา
         ไม่โดนความสูงของปฏิทินในแถวแรกดันให้ห่าง */
      /* ลำดับตามภาพที่เจ้าของส่งมา: สถานะเต็มแถว → ทางลัด|ขายดี → แถบวัน → การ์ดชุดใหญ่
         **ลำดับใน HTML ห้ามขยับ** ไม่งั้นหน้ามือถือสลับที่ตามไปด้วย
         (มือถือไม่ได้ใช้กริด เรียงตาม HTML ตรง ๆ) จึงย้ายด้วย grid-area เอา */
      grid-template-areas:
        "status status"
        "qw     hil"
        "wk     wk";
    }
    /* จอกว้างพอ: ปฏิทินขึ้นมาอยู่แถวเดียวกับอีกสองกอง
       เดิมปฏิทินกินเต็มแถวของตัวเองทั้งที่ใช้ความกว้างจริงไม่ถึงครึ่ง
       แล้วดันของข้างล่างลงไปอีก ~160px โดยเปล่าประโยชน์ */
    @media(min-width:1460px){
      #homeBody{
        grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr);
        grid-template-areas:
          "status status status"
          "qw     hil    wk";
      }
      /* คอลัมน์แคบลงจากเดิม (549 → 461) ของที่เคยเรียงแถวเดียวเลยตกลงมาเป็นสองแถว
         ไอคอนทางลัดกว้างจริงแค่ 68px ลดขั้นต่ำลงให้กลับไปเรียงแถวเดียวเหมือนเดิม */
      #homeBody .quick{grid-template-columns:repeat(auto-fit, minmax(84px, 1fr))}
    }
    #homeBody > #quickWrap{grid-area:qw}
    #homeBody > #hiliteWrap{grid-area:hil}
    /* ใช้ 24px ให้ตรงกับจังหวะหัวข้อทั้งแอป (check-space คุมไว้ ใส่ 22 แล้วตกทันที) */
    #homeBody > .wk{grid-area:wk; margin-top:24px}
    #homeBody > #statusRow{grid-area:status}
    /* การ์ดสถานะสองใบเรียงข้างกันเต็มความกว้าง เหมือนในภาพที่เจ้าของส่งมา */
    #homeBody > #statusRow{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}

    /* แผง "ขาย" ของหน้าแรก จัดตามภาพที่เจ้าของส่งมา
       ซ้าย = ยอดขาย + (บิล|เฉลี่ยต่อบิล) · ขวา = กราฟ 7 วัน · ล่าง = ตารางของที่ซื้อมา
       **บอกตำแหน่งตรง ๆ ด้วย grid-area** เพราะปล่อยให้ไหลเองแล้วกราฟที่สูงกว่ามาก
       ทำให้เหลือรูโหว่ใต้การ์ดเล็ก (เจ้าของเคยบอกว่า "โล่งเยอะเลย")
       **ต้องเจาะที่ .home-sale เท่านั้น** หน้าภาพรวมใช้ 3 คอลัมน์ ห้ามโดนทับ */
    .dash.home-sale{
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      grid-template-areas: "a d" "p d" "t t";
    }
    .dash.home-sale > .dash-a{grid-area:a}
    .dash.home-sale > .dash-pair{grid-area:p; grid-template-columns:1fr 1fr}
    .dash.home-sale > .dash-d{grid-area:d}
    .dash.home-sale > .hd-t{grid-area:t; display:block}
    /* ช่องค้นหาเป็น "ปุ่มกด" ไม่ใช่เนื้อหา ยาวเต็มจอแล้วดูเป็นแถบว่างเปล่า */
    .hsearch{max-width:620px}

    /* สองแถวนี้เป็นแถวปัดข้างบนมือถือ ของเลยกองชิดซ้ายเป็นก้อนเดียว
       พอมาอยู่บนคอมที่คอลัมน์กว้าง 694px มันใช้จริงแค่ 340 กับ 256
       เหลือที่ว่างยาว 354-438px — เจ้าของบอกว่า "โล่งเยอะเลย"
       จอคอมไม่ต้องปัด จึงเปลี่ยนเป็นกริดกระจายเต็มคอลัมน์ไปเลย */
    /* **เฉพาะ .quick เท่านั้น** — .hil เป็นตารางเรียงลงมาแล้ว (เลขอันดับ · ชื่อ · ยอด · แถบ)
       ถ้ามัดรวมกันไว้ แถวตารางจะถูกยัดลงช่องกว้าง 96px เรียงข้างกัน
       แล้วเนื้อหาล้นออกไปทับการ์ดสถานะข้างบน (เจ้าของเจอเองกับตา ส่งภาพมาให้ดู) */
    .quick{
      display:grid; grid-auto-flow:row; overflow:visible;
      grid-template-columns:repeat(auto-fit, minmax(96px, 1fr));
      gap:16px 10px;
    }
    /* ตารางเมนูขายดียังเรียงลงมาคอลัมน์เดียวเหมือนบนมือถือ */
    .hil{display:flex; flex-direction:column; overflow:visible}
    /* ถาดวันยังเลื่อนได้เหมือนเดิม แค่ไม่ต้องล้นออกไปชนขอบจอ */
    .wk-row{margin:0; padding-left:0; padding-right:0}
    .quick-b{width:auto; min-width:0}
    /* **ห้ามใส่ .hil-b span ตรงนี้** แถวตารางมี <span> ที่เป็นแถบความยาวกับกล่องซ้อนอยู่
       ถ้าสั่ง ellipsis + nowrap ทุก span แถบจะถูกบีบจนหาย และยอดเงินกับจำนวนจานทับกัน
       ชื่อเมนูมี ellipsis ของตัวเองอยู่แล้วที่ .hil-n */
    .quick-b span{
      max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    /* สองแถวนี้ยื่นออกนอกขอบไว้ให้ปัดบนมือถือ พออยู่ในคอลัมน์ต้องดึงกลับ ไม่งั้นล้นออกข้าง */
    .quick{margin:0; padding-left:0; padding-right:0}
    /* บนมือถือหัวข้อดันปุ่มไปสุดขอบขวา พอแบ่งสองคอลัมน์ ปุ่มจะไปจ่ออยู่ติดปฏิทิน
       เหมือนเป็นปุ่มของปฏิทิน ให้ปุ่มมาอยู่ติดหัวข้อของตัวเองแทน */
    #homeBody .home-sec h2{flex:0 0 auto}
  }

  /* ===================== จอใหญ่: ใช้พื้นที่ให้คุ้ม =====================
     เดิมตรึงเนื้อหาไว้ 1180px ทุกจอ เปิดบนจอ 1920 เหลือขอบว่างข้างละ ~320px
     ตารางของที่ซื้อมาที่มีหลายคอลัมน์ก็ถูกบีบจนตัวหนังสือตัดบรรทัด */
  @media(min-width:1600px){ :root{ --wide:1420px } }
  @media(min-width:1850px){ :root{ --wide:1560px } }

  /* ===================== จอคอม: รางการ์ดซ้าย + เนื้อหาขวา =====================
     ตามแบบที่เจ้าของส่งมา — เมนูของฉันกับปฏิทินเป็นการ์ดยืนอยู่ซ้ายตลอด
     เนื้อหาที่เหลือ (ค้นหา สถานะ ขายดี แผงตัวเลข) ไหลอยู่ฝั่งขวา

     ใช้ :has() ครอบทั้งก้อนโดยตั้งใจ — ถ้าเบราว์เซอร์ไม่รองรับ กฎทั้งหมดถูกทิ้ง
     แล้วหน้าตกกลับไปเป็นแบบเรียงลงมาแบบเดิม ไม่พัง
     และเงื่อนไข :not([hidden]) ทำให้แท็บอื่น (ขาย/ย้อนหลัง/ตั้งค่า) ที่ซ่อนหัวหน้าแรก
     ไม่เหลือคอลัมน์ว่าง 300px ค้างอยู่ */
  @media(min-width:1280px){
    main:has(> #homeTop:not([hidden])){
      display:grid; align-items:start;
      grid-template-columns:300px minmax(0,1fr); gap:0 24px;
    }
    /* ละลายกล่องครอบสองชั้น ให้ของข้างในไปเป็นช่องของกริดโดยตรง */
    main:has(> #homeTop:not([hidden])) > #homeTop,
    main:has(> #homeTop:not([hidden])) #homeBody{display:contents}

    main:has(> #homeTop:not([hidden])) #homeRail{
      /* **ต้องกินหลายแถว ไม่ใช่ '1 / -1'** — grid-row:1/-1 นับจากเส้นของกริดที่ประกาศไว้
         ซึ่งกริดนี้ไม่ได้ประกาศแถวไว้เลย -1 เลยกลายเป็นเส้นที่ 1 = กินแถวเดียว
         รางสูง ~435px แถวที่ 1 เลยสูงตามราง แล้วของในคอลัมน์ขวา (ช่องค้นหา การ์ดสถานะ ฯลฯ)
         ถูกดันไปเริ่มที่แถวถัดไป เกิดช่องว่างใหญ่ด้านบนขวา (เจ้าของเจอเองกับตา)
         ซ้ำร้ายคือ main มีลูกที่มองไม่เห็นอยู่ก่อน (#orderInbox, #headStat) ซึ่งนับเป็นช่องด้วย
         span 99 ทำให้รางพาดทุกแถว คอลัมน์ขวาจึงเรียงชิดบนได้ตามปกติ */
      grid-column:1; grid-row:1 / span 99;
      display:flex; flex-direction:column; gap:14px;
      position:sticky; top:16px;
    }
    /* **ต้องมี grid-row:auto ด้วย** ไม่ใช่แค่ grid-column
       #statusRow กับ #hiliteWrap พก grid-area:status / grid-area:hil จากบล็อกสามคอลัมน์มาด้วย
       (บล็อกนั้นก็ >=1280 เหมือนกัน) ซึ่งตั้ง grid-row ไปเป็นชื่อแถวที่ไม่มีในกริดของราง
       ผลคือของสองก้อนไปกองอยู่แถวเดียวกันแล้วทับกัน และขึ้นก่อนช่องค้นหาด้วย */
    main:has(> #homeTop:not([hidden])) .hsearch,
    main:has(> #homeTop:not([hidden])) #searchRes,
    main:has(> #homeTop:not([hidden])) #statusRow,
    main:has(> #homeTop:not([hidden])) #hiliteWrap,
    main:has(> #homeTop:not([hidden])) > #view{grid-column:2; grid-row:auto}

    /* ของในรางเป็นการ์ดขาวเหมือนในแบบ — บนมือถือยังเป็นส่วนเปล่า ๆ เหมือนเดิม */
    main:has(> #homeTop:not([hidden])) #quickWrap,
    main:has(> #homeTop:not([hidden])) #homeRail .wk{
      background:var(--bg); border-radius:var(--r); box-shadow:var(--sh-card);
      padding:16px; margin:0;
    }
    /* หัวข้อในการ์ดไม่ต้องเว้นบนอีก การ์ดมี padding ให้แล้ว */
    main:has(> #homeTop:not([hidden])) #homeRail .home-sec,
    main:has(> #homeTop:not([hidden])) #homeRail .wk-head{margin-top:0}
    /* ช่องค้นหาเต็มคอลัมน์ขวา ไม่ต้องจำกัด 620 อีก เพราะคอลัมน์แคบลงแล้ว */
    main:has(> #homeTop:not([hidden])) .hsearch{max-width:none}
    /* ในรางกว้าง 268px ปล่อย auto-fit จะได้ 3 ช่อง กองสูงเกินไป
       ตรึงเป็น 4 ช่องเหมือนในแบบที่เจ้าของส่งมา */
    main:has(> #homeTop:not([hidden])) #homeRail .quick{
      grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px 6px;
    }
    /* ปฏิทินในรางกว้างแค่ ~268px ถาดวันยังปัดได้เหมือนบนมือถือ */
    main:has(> #homeTop:not([hidden])) #homeRail .wk-row{
      overflow-x:auto; scrollbar-width:none;
    }
    main:has(> #homeTop:not([hidden])) #homeRail .wk-row::-webkit-scrollbar{display:none}
  }

  /* ===================== จอกว้าง: รางเมนูกางเป็นชื่อเต็ม =====================
     ตาม mockup TIGER OpenSpace — รางขาวกว้าง ไอคอนอยู่ซ้าย ชื่ออยู่ขวา
     ตัวที่เลือกเป็นแคปซูลแดงจาง ไม่ใช่วงกลมทึบลอยขึ้นแบบแถบบนมือถือ

     เริ่มที่ 1360 ไม่ใช่ 1120 เพราะรางกินที่ไป 248px (เดิม 84px)
     จอ 1280 เนื้อหาจะเหลือแค่ ~976px ซึ่งแดชบอร์ด 3 คอลัมน์เริ่มอึดอัด
     จึงให้จอขนาดนั้นใช้รางไอคอนแคบของเดิมต่อไป
     (กฎเดิมวัดจากความกว้างจอ ไม่ได้วัดจากที่ที่เนื้อหาได้จริง — จดไว้ในคู่มือแล้ว) */
  @media(min-width:1360px){
    .shell{grid-template-columns:248px minmax(0,1fr)}
    .bottomnav{width:248px; padding:16px 12px 20px; gap:3px}

    /* หัวข้อกลุ่มของราง ใส่ด้วย ::before จึงไม่ต้องแตะ HTML และไม่โผล่บนมือถือ */
    .bottomnav::before{
      content:'ใช้ทุกวัน';
      padding:2px 12px 8px; font-size:11.5px; font-weight:800;
      color:var(--muted); letter-spacing:.01em;
    }

    /* เจาะ [data-tab] เพราะในแถบมีปุ่มของกล่องเมนูย่อยปนอยู่ด้วย
       และต้องชนะ .bottomnav button ที่สั่งเรียงเป็นคอลัมน์ไว้ */
    .bottomnav button[data-tab]{
      flex-direction:row; justify-content:flex-start; align-items:center;
      gap:11px; padding:11px 12px; font-size:14px; font-weight:700;
      text-align:left; border-radius:var(--r); color:var(--ink);
      transition:background .16s, color .16s, transform var(--tap-out) var(--spring);
    }
    .bottomnav button[data-tab] span{flex:1 1 auto; text-align:left}
    .bottomnav button[data-tab] svg{width:20px; height:20px; flex:0 0 auto}
    /* วงกลมทึบลอยขึ้นเป็นของแถบบนมือถือ รางกว้างใช้แคปซูลแดงจางแทน */
    .bottomnav button[data-tab]::before{display:none}
    .bottomnav button[data-tab]:hover{background:var(--soft); color:var(--ink)}
    .bottomnav button[data-tab].on{background:var(--tint); color:var(--brand)}
    .bottomnav button[data-tab].on:hover{background:var(--tint)}
    .bottomnav button[data-tab].on svg{color:var(--brand); transform:none}
    /* กดแล้วไม่ยุบทั้งปุ่ม ปุ่มกว้างขนาดนี้ยุบแล้วดูเหมือนหน้ากระตุก */
    .bottomnav button[data-tab]:active{transform:none; background:var(--tint)}

    /* กล่องเมนูย่อยเกาะขอบขวาของรางที่กว้างขึ้นแล้ว */
    .navfly{left:calc(100% + 8px); top:-6px}
 
    /* แถบหัวเป็นแผ่นขาวพาดเต็มความกว้างของฝั่งเนื้อหา ตาม mockup
       ตัวหนังสือยังต้องตรงแนวกับเนื้อหาข้างล่าง จึงคิดระยะขอบด้วยสูตรเดียวกับ main
       ((ความกว้างราง − --wide) / 2 + 28) ไม่ใช่ตั้ง padding ตายตัว */
    .appbar{
      max-width:none; margin:0;
      padding:14px max(28px, calc((100% - var(--wide)) / 2 + 28px));
      background:var(--bg);
      box-shadow:0 1px 0 var(--line), 0 4px 4px rgba(239,239,239,.4);
    }

    /* ตารางเมนูขายดีบนจอกว้างยืดเป็นแถวเดียว แถบความยาวได้คอลัมน์ของตัวเอง
       จอแคบยังเป็นสองบรรทัด (ชื่อ+ยอดบรรทัดบน · แถบบรรทัดล่าง) ไม่งั้นบีบจนอ่านไม่ออก */
    .hil-b{
      grid-template-columns:22px minmax(0,1fr) auto 150px;
      grid-template-areas:"no name val bar";
      gap:0 14px; padding:11px 10px;
    }

    /* หัวการ์ดมีเส้นคั่นบาง ๆ ตามระบบดีไซน์
       เจาะ main เพื่อไม่ให้ไปโดนหัวกล่อง (dialog) ซึ่งมีเส้นคั่นของตัวเองอยู่แล้ว */
    main .card-head{padding-bottom:12px; border-bottom:1px solid var(--line)}
  }

</style>
</head>

<script>
/* ===================== ข้อมูล ===================== */
const KEY = 'crepe-cost-v1';        // ของเดิม เก็บร้านเดียว (ยังอ่านไว้เผื่อย้ายข้อมูล)
const HUB = 'crepe-hub-v1';         // ของใหม่ เก็บได้หลายร้าน

// ที่เก็บออเดอร์กลาง (ดูหัวข้อ "ให้ลูกค้าสั่งเอง")
// ต้องประกาศไว้บนสุด เพราะ applyShopLink() ที่รันตอนเปิดแอปก็ใช้ตัวนี้
const CLOUD_PROJECT = 'pramvit-order';  // ชื่อโปรเจกต์ Firebase — ต้องตรงกับใน order.html
const CLOUD_BASE = 'https://pramvit-order-default-rtdb.asia-southeast1.firebasedatabase.app';   // ที่เก็บจริงของร้าน (ถ้าว่าง จะไปไล่หาจาก CLOUD_PROJECT เอง)
const CLOUD_KEY  = 'crepe-cloud';   // ที่เก็บที่ตั้งเองจากหน้าตั้งค่า (ของเครื่องนี้)

/* เตือนให้สำรองข้อมูลทุกกี่วัน — ข้อมูลอยู่ในเครื่องเดียว ไม่มีบัญชีผู้ใช้
   มือถือหาย ตกน้ำ หรือเผลอล้างข้อมูลเบราว์เซอร์ = ยอดขายกับต้นทุนหายหมด
   และการสำรองต้องกดเอง ซึ่งไม่มีใครนึกถึงจนกว่าจะสายไปแล้ว */
const BK_NAG_DAYS = 7;

// store = ก้อนใหญ่ที่เก็บทุกร้าน / db = ร้านที่กำลังใช้อยู่ (โค้ดที่เหลือใช้ db เหมือนเดิม)
let store = null;
const UNITS = ['กรัม','มิลลิลิตร','ชิ้น','แผ่น','ใบ','ช้อนโต๊ะ'];

const blank = () => ({
  ingredients: [],
  menus: [],
  groups: [],              // ชุดไส้/ท็อปปิ้งที่ใช้ร่วมกัน                 // {id,name,price,addons:[{id,name,price}],items:[]}
  sales: [],                 // {id, d:'YYYY-MM-DD', t:'HH:MM', menuId, name, qty, addons:[{name,price}], total}
  expenses: [],              // {id, d:'YYYY-MM-DD', t:'HH:MM', note, amount}
  fixed: { rent:0, electric:0, gas:0, water:0, other:0, days:26, labor:0 },
  targetMargin: 65,
  shopName: 'ร้านเครป',      // โชว์ใต้หัวข้อหน้าขาย แก้ได้ที่ตั้งค่า
  shopBranch: '',
  shopOpen: 1,               // ป้ายบอกว่าตอนนี้เปิดร้านอยู่ไหม
  orderOn: 0,                // เปิดให้ลูกค้าสั่งเองผ่าน QR อยู่ไหม
  orderKey: '',              // รหัสช่องรับออเดอร์ของร้านนี้ (อยู่ในลิงก์ที่ให้ลูกค้า)
  queueNo: 0,                // เลขคิวล่าสุดของวันนี้
  queueDay: '',              // คิวนับใหม่ทุกวัน เก็บไว้ว่านับของวันไหนอยู่
  troubles: []               // ประวัติออเดอร์มีปัญหา (ไม่รับ · ยอดไม่ตรง · สลิปซ้ำ) เก็บในเครื่อง
});

/* ---------- วันที่ ---------- */
const pad2 = v => String(v).padStart(2,'0');
const dayKey = (dt = new Date()) => `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
const nowTime = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thaiDate(key, withYear){
  const [y,m,d] = key.split('-').map(Number);
  return `${d} ${TH_MON[m-1]}${withYear ? ' ' + (y+543).toString().slice(-2) : ''}`;
}
const monthKey = key => key.slice(0,7);
function thaiMonth(mk){
  const [y,m] = mk.split('-').map(Number);
  return `${TH_MON[m-1]} ${y+543}`;
}

/* ---------- สรุปของวัน / เดือน ---------- */
function sumDay(key){
  const sale = (db.sales||[]).filter(x => x.d === key).reduce((a,x) => a + n(x.total), 0);
  const exp  = (db.expenses||[]).filter(x => x.d === key).reduce((a,x) => a + n(x.amount), 0);
  return { sale, exp, net: sale - exp };
}
function sumMonth(mk){
  const sale = (db.sales||[]).filter(x => monthKey(x.d) === mk).reduce((a,x) => a + n(x.total), 0);
  const exp  = (db.expenses||[]).filter(x => monthKey(x.d) === mk).reduce((a,x) => a + n(x.amount), 0);
  const days = new Set([...(db.sales||[]), ...(db.expenses||[])].filter(x => monthKey(x.d) === mk).map(x => x.d));
  return { sale, exp, net: sale - exp, days: days.size };
}
function allDays(){
  const set = new Set([...(db.sales||[]), ...(db.expenses||[])].map(x => x.d));
  return [...set].sort().reverse();
}

let db = load();
// applyShopLink() ย้ายไปเรียกตอนท้ายไฟล์ ห้ามเรียกตรงนี้ —
// มันเรียก save() ซึ่งแตะตัวแปรที่ประกาศอยู่ล่างกว่าบรรทัดนี้ (temporal dead zone)
// สคริปต์ทั้งแอปจะล้มกลางคันแบบเงียบ ๆ ทันทีที่มีใครเปิดลิงก์ร้าน
let tab = 'today';

// ทำให้ข้อมูลร้านหนึ่งร้านอยู่ในรูปที่ใช้ได้เสมอ
function fixShop(raw, fallbackName){
  const d = migrateGroups(Object.assign(blank(), raw || {}));
  if(!d.id) d.id = uid();
  if(!String(d.shopName || '').trim()) d.shopName = fallbackName || 'ร้านของฉัน';
  return d;
}

function load(){
  try{
    const hub = localStorage.getItem(HUB);
    if(hub){
      const st = JSON.parse(hub);
      if(st && Array.isArray(st.shops) && st.shops.length){
        store = { shops: st.shops.map((x,i) => fixShop(x, 'ร้านที่ ' + (i+1))), active: st.active };
        if(st.locked && st.shops.some(x => x.id === st.locked)) store.locked = st.locked;
        if(st.pin && st.pin.h) store.pin = st.pin;          // รหัสคนดูแลเป็นของเครื่อง ไม่ใช่ของร้านใดร้านหนึ่ง
        if(n(st.bkAt)) store.bkAt = n(st.bkAt);              // สำรองข้อมูลครั้งล่าสุดเมื่อไหร่ (ของเครื่องเหมือนกัน)
        if(Array.isArray(st.tourSeen)) store.tourSeen = st.tourSeen;   // ดูทัวร์ไหนจบไปแล้วบ้าง
        if(!store.shops.some(x => x.id === store.active)) store.active = store.shops[0].id;
        if(store.locked) store.active = store.locked;      // เครื่องที่ผูกไว้ เปิดมาเจอร้านนั้นเสมอ
        return store.shops.find(x => x.id === store.active);
      }
    }
    // ยังไม่เคยมีหลายร้าน — ย้ายของเดิมเข้ามาเป็นร้านแรก
    const raw = localStorage.getItem(KEY);
    const first = raw ? fixShop(JSON.parse(raw), 'ร้านเครป')
                      : fixShop(seedHistory(buildDemo()), 'ร้านเครป');
    store = { shops:[first], active: first.id };
    return first;
  }catch(e){
    const first = fixShop(seedHistory(buildDemo()), 'ร้านเครป');
    store = { shops:[first], active: first.id };
    return first;
  }
}
/* ===================== ชุดไส้ที่ใช้ร่วมกันหลายเมนู =====================
   เดิมไส้ถูกก๊อปเก็บไว้ในแต่ละเมนู แก้ทีต้องไล่แก้ทุกเมนู
   เปลี่ยนเป็นเก็บเป็น "ชุด" ไว้ที่เดียว แล้วเมนูแค่บอกว่าใช้ชุดไหนบ้าง */
function migrateGroups(d){
  const hasLegacy = (d.menus||[]).some(m => (m.addons||[]).length);
  if(Array.isArray(d.groups) && d.groups.length && !hasLegacy) return d;
  if(!hasLegacy){ d.groups = d.groups || []; return d; }
  if(!Array.isArray(d.groups)) d.groups = [];
  const groups = d.groups;
  (d.menus||[]).forEach(m => {
    const ids = Array.isArray(m.groupIds) ? [...m.groupIds] : [];
    (m.addons||[]).forEach(a => {
      const gname = a.group || 'ท็อปปิ้ง';
      let g = groups.find(x => x.name === gname);
      if(!g) groups.push(g = {id:uid(), name:gname, items:[]});
      if(!g.items.some(x => x.name === a.name && n(x.price) === n(a.price)))
        g.items.push({id:uid(), name:a.name, price:n(a.price)});
      if(!ids.includes(g.id)) ids.push(g.id);
    });
    m.groupIds = ids;
    delete m.addons;                 // ย้ายเข้าในชุดแล้ว
  });
  d.groups = groups;
  return d;
}

/* ===================== รหัสคนดูแล =====================
   ของที่แก้แล้วกระทบเงิน (เมนู ราคา ชุดไส้ ลบบิล ล้างข้อมูล ฯลฯ) ต้องใส่รหัสก่อน
   หน้าขายกับ Dashboard ใช้ได้เลยไม่ต้องใส่อะไร ลูกน้องเปิดมาก็ขายได้ทันที

   หมายเหตุตามตรง: รหัสถูกกวนไว้ไม่ให้อ่านเจอตอนเปิดดูข้อมูลในเครื่อง
   แต่ไม่ใช่การเข้ารหัสจริง และข้อมูลทั้งหมดก็อยู่ในเครื่องนั้นอยู่แล้ว
   มันมีไว้กันคนในร้านเผลอแก้ ไม่ได้มีไว้กันคนที่ตั้งใจเจาะ */
const PIN_MINUTES = 10;         // ใส่รหัสครั้งเดียว ทำงานต่อได้กี่นาที
let adminUntil = 0;

function pinHash(pin, salt){
  const txt = String(salt || '') + '|' + String(pin || '');
  let a = 0x811c9dc5, b = 0x01000193;
  for(let r = 0; r < 600; r++){
    for(let i = 0; i < txt.length; i++){
      a ^= txt.charCodeAt(i) + r;
      a = Math.imul(a, b) >>> 0;
      a = ((a << 13) | (a >>> 19)) >>> 0;
    }
  }
  return a.toString(16).padStart(8,'0');
}

function applyShopLink(){
  let q;
  try{ q = new URLSearchParams(location.search); }catch(e){ return; }
  const id = (q.get('shop') || '').trim();
  if(!id) return;
  const name = (q.get('n') || '').trim();
  const branch = (q.get('b') || '').trim();

  // เจ้าของส่งลิงก์ร้านมาพร้อมที่เก็บออเดอร์ เครื่องนี้จะได้รับออเดอร์ได้เลยไม่ต้องตั้งเอง
  const cb = (q.get('cb') || '').trim().replace(/\/+$/, '');
  if(/^https:\/\/[\w.-]+/.test(cb)){ try{ localStorage.setItem(CLOUD_KEY, cb); }catch(e){} }

  // รหัสช่องรับออเดอร์ของร้าน ต้องติดมากับลิงก์ด้วย
  // ไม่งั้นเครื่องที่รับลิงก์ไปจะสร้างรหัสใหม่ของตัวเอง กลายเป็นคนละช่องกับ QR
  // ที่ติดไว้หน้าร้านแล้ว ลูกค้าสแกนสั่งเข้าไปก็ไม่มีใครเห็น
  const okey = (q.get('k') || '').trim();
  const oon  = q.get('o') === '1';

  let x = store.shops.find(v => v.id === id);
  if(!x){
    const only = store.shops.length === 1 ? store.shops[0] : null;
    const fresh = fixShop(blank(), name || 'ร้านของฉัน');
    fresh.id = id;
    fresh.shopName = name || 'ร้านของฉัน';
    fresh.shopBranch = branch;
    // เครื่องใหม่ที่มีแต่ข้อมูลตัวอย่าง ให้แทนที่ไปเลย จะได้ไม่มีร้านขยะค้าง
    if(only && only.isDemo) store.shops = [fresh]; else store.shops.push(fresh);
    x = fresh;
  }else{
    if(name) x.shopName = name;
    if(branch) x.shopBranch = branch;
  }
  if(okey){ x.orderKey = okey; x.orderOn = oon ? 1 : 0; }
  store.active = x.id;
  store.locked = x.id;
  db = x; save();
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
}

function shopLink(id){

  if(String(x.shopName||'').trim()) q.set('n', x.shopName);
  if(String(x.shopBranch||'').trim()) q.set('b', x.shopBranch);
  // พารหัสช่องรับออเดอร์ไปด้วย เครื่องปลายทางจะได้ฟังช่องเดียวกับ QR ที่ติดหน้าร้านไว้
  if(x.orderKey){ q.set('k', x.orderKey); if(x.orderOn) q.set('o', '1'); }
  // ที่เก็บออเดอร์ติดไปกับลิงก์ด้วย เฉพาะตอนที่ตั้งเองไว้ไม่ตรงกับค่าในตัวแอป

  return base + '?' + q.toString();
}

/* ===================== หน้าต่างกรอกข้อมูล ===================== */
const dlg = document.getElementById('dlg');
let dlgCfg = null;

/* iOS Safari จะไม่ยิง :active ให้ element ทั่วไป ถ้าทั้งหน้าไม่มีใครฟัง touch เลย
   เราปิด -webkit-tap-highlight-color ไว้ด้วย บนไอโฟนเลยไม่มีปฏิกิริยาอะไรสักอย่าง
   listener เปล่า ๆ ตัวนี้แก้ได้ทั้งหมด ไม่ได้ทำอะไรนอกจากทำให้ iOS ยอมยิง :active */
document.addEventListener('touchstart', () => {}, {passive:true});

/* สั่นสั้น ๆ ตอนแตะของที่กดได้ ช่วยให้รู้สึกว่าปุ่ม "ติด"
   ตามตรง: Android/Chrome รองรับ ส่วน iOS Safari ไม่รองรับ Vibration API เลย
   บนไอโฟนจึงไม่สั่น แต่ไม่พังอะไร เพราะเช็ก navigator.vibrate ก่อนเรียกทุกครั้ง */
const TAPPABLE = '.btn,.icon-btn,.orderbtn,.bottomnav button,.cat,.dseg-b,.qmenu-b,'
               + '.quick-b,.hil-b,.wk-d,.li,.navrow,.seeall,.posbtn,.srow-a,.ord-slip,.home-sec button';
document.addEventListener('pointerdown', e => {
  if(!navigator.vibrate) return;
  const el = e.target.closest && e.target.closest(TAPPABLE);
  if(el && !el.disabled) navigator.vibrate(8);
}, {passive:true});

/* ---------- หน้าต่างแบบแผ่นเลื่อน: เส้นคั่นหัว + ลากลงเพื่อปิด ---------- */
// เส้นใต้หัวหน้าต่างโผล่เฉพาะตอนเลื่อนดูเนื้อหา จะได้รู้ว่ายังมีของอยู่ข้างบน
dlg.addEventListener('scroll', () => dlg.classList.toggle('scrolled', dlg.scrollTop > 4), {passive:true});

// ลากแถบขีดบนหัวลงเพื่อปิด — ลากไม่ถึงครึ่งทางก็เด้งกลับที่เดิม
(() => {
  const grip = document.getElementById('dlgGrip');
  if(!grip || !grip.addEventListener) return;
  const CLOSE_AT = 110;              // ลากเกินเท่านี้ (พิกเซล) ถือว่าตั้งใจปิด
  let from = null;

  const move = e => {
    if(from === null) return;
    const dy = Math.max(0, e.clientY - from);
    dlg.style.setProperty('--drag', dy + 'px');
  };
  const end = e => {
    if(from === null) return;
    const dy = Math.max(0, e.clientY - from);
    from = null;
    dlg.classList.remove('dragging');
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', end);
    window.removeEventListener('pointercancel', end);
    if(dy > CLOSE_AT){ dlgDismiss(); return; }
    dlg.classList.add('snapback');
    dlg.style.setProperty('--drag', '0px');
    setTimeout(() => dlg.classList.remove('snapback'), 240);
  };

  grip.addEventListener('pointerdown', e => {
    // จอใหญ่เป็นกล่องลอยกลางจอ ไม่ได้เป็นแผ่นเลื่อน เลยไม่ต้องลาก
    if(window.matchMedia && window.matchMedia('(min-width:760px)').matches) return;
    from = e.clientY;
    dlg.classList.remove('snapback');
    dlg.classList.add('dragging');
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  });
})();

// fields: [{k, label, type:'text'|'number'|'select', value, options, placeholder, wide, step}]
// ปุ่มใน <form> ที่ไม่ได้ใส่ type จะเป็น submit โดยปริยาย กดแล้วกล่องปิดทันที
// บังคับให้เป็นปุ่มธรรมดาทั้งหมด เหลือแต่ปุ่มบันทึกที่ตั้ง type="submit" ไว้เอง
function plainButtons(){
  const body = document.getElementById('dlgBody');
  if(body && body.querySelectorAll) body.querySelectorAll('button:not([type])').forEach(b => b.type = 'button');
}

function openDialog(cfg){
  // ปิดแล้วเปิดกล่องใหม่ทันทีมีหลายจุด (เช่น "เพิ่มรายจ่าย" ในกล่องสรุปวัน)
  // ถ้าไม่ยกเลิกการปิดที่ค้างอยู่ กล่องใหม่จะเลื่อนหายออกไปตามกล่องเก่า
  if(dlgClosing) abortDlgClose();
  dlgCfg = cfg;
  const ic = document.getElementById('dlgIcon');
  ic.hidden = !cfg.icon;
  ic.innerHTML = cfg.icon ? icon(cfg.icon, 19) : '';
  // tone: 'r' แดง (ลบ/อันตราย) · 'w' เหลือง (เตือน) · 'g' เขียว (สำเร็จ) · ไม่ใส่ = แดงอ่อนปกติ
  ic.className = 'ic-tile' + (cfg.tone ? ' tone-' + cfg.tone : '');
  // ล้างสถานะเลื่อน/ลาก เฉพาะตอนเปิดหน้าต่างใหม่เท่านั้น
  // หน้าต่างสั่งสินค้าเรียก openDialog() ซ้ำทุกครั้งที่กด +/− เพื่อวาดบิลใหม่
  // ถ้าล้างทุกครั้ง หน้าต่างจะดีดกลับขึ้นบนสุดทุกครั้งที่กดเพิ่มจำนวน
  if(!dlg.open){
    dlg.classList.remove('scrolled','dragging','snapback');
    dlg.style.removeProperty('--drag');
    dlg.scrollTop = 0;
  }
  document.getElementById('dlgTitle').innerHTML = esc(cfg.title)
    + (cfg.tag ? ` <button type="button" class="dlg-tag${cfg.tag.on ? ' on' : ''}" onclick="${cfg.tag.fn}">${esc(cfg.tag.label)}</button>` : '');
  document.getElementById('dlgSub').textContent = cfg.sub || '';

  const foot = document.getElementById('dlgFoot');
  const defFoot = '<button type="button" class="btn ghost" id="dlgCancel" onclick="dlg.close()">ยกเลิก</button>'
                + '<button type="submit" class="btn primary" id="dlgSave">บันทึก</button>';

  // ปุ่มท้ายกล่องแบบกำหนดเอง
  if(cfg.foot){
    foot.innerHTML = cfg.foot.map(b =>
      '<button type="button" class="btn ' + (b.cls||'') + '" onclick="' + b.fn + '">' + b.label + '</button>').join('');
  }else{
    foot.innerHTML = defFoot;
    if(cfg.extraFoot){
      foot.insertAdjacentHTML('beforeend',
        '<button type="button" class="btn ' + (cfg.extraFoot.cls||'') + '" onclick="' + cfg.extraFoot.fn + '">'
        + cfg.extraFoot.label + '</button>');
    }
  }

  const saveBtn = document.getElementById('dlgSave');
  if(saveBtn && cfg.saveLabel) saveBtn.textContent = cfg.saveLabel;

  // โหมดอ่านอย่างเดียว เช่น หน้าอธิบายคำศัพท์ หรือหน้าถามยืนยัน
  // (เช็กว่าส่ง html มาหรือเปล่า ไม่ใช่เช็กว่ามีเนื้อหา — ข้อความว่างก็ยังถือว่าโหมดนี้)
  if(cfg.html !== undefined){
    document.getElementById('dlgBody').innerHTML = `<div style="grid-column:1/-1">${cfg.html}</div>`;
    plainButtons();
    if(!cfg.foot) foot.innerHTML = '<button type="button" class="btn primary" onclick="dlg.close()">เข้าใจแล้ว</button>';
    if(!dlg.open) showSheet();
    return;
  }

  document.getElementById('dlgBody').innerHTML = cfg.fields.map(f => {
    const cls = `f${f.wide ? ' wide' : ''}`;
    if(f.type === 'select'){
      return `<div class="${cls}"><label for="dlg_${f.k}">${f.label}</label>
        <select id="dlg_${f.k}" data-k="${f.k}">${f.options.map(o =>
          `<option value="${esc(o.value)}" ${o.value===f.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;
    }
    const t = f.type === 'number' ? 'number' : 'text';
    return `<div class="${cls}"><label for="dlg_${f.k}">${f.label}</label>
      <input id="dlg_${f.k}" data-k="${f.k}" type="${t}" ${f.type==='number'?'step="any" inputmode="decimal"':''}
        value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder||'')}"></div>`;
  }).join('')
    + (cfg.extra ? `<div class="dlg-extra">${cfg.extra}</div>` : '')
    + (cfg.live ? `<div class="dlg-live" id="dlgLive"></div>` : '')
    + `<div class="dlg-err" id="dlgErr"></div>`;

  plainButtons();
  if(cfg.live) dlg.addEventListener('input', dlgLive);
  dlgLive();
  if(!dlg.open) showSheet();
  const first = dlg.querySelector('[data-k]');
  if(first) setTimeout(() => first.focus(), 60);
}

function dlgValues(){
  const v = {};
  dlg.querySelectorAll('[data-k]').forEach(el => {
    const f = dlgCfg.fields.find(x => x.k === el.dataset.k);
    v[el.dataset.k] = f && f.type === 'number' ? n(el.value) : el.value;
  });
  return v;
}
function dlgLive(){
  const box = document.getElementById('dlgLive');
  if(!box || !dlgCfg || !dlgCfg.live) return;
  box.innerHTML = dlgCfg.live(dlgValues());
}
function dlgSubmit(e){
  e.preventDefault();
  if(typeof dlgCfg.save !== 'function') return false;   // กล่องอ่านอย่างเดียว ไม่มีอะไรให้บันทึก
  const v = dlgValues();
  const err = dlgCfg.check ? dlgCfg.check(v) : null;
  if(err){ document.getElementById('dlgErr').textContent = err; return false; }
  dlg.removeEventListener('input', dlgLive);
  dlg.close();
  dlgCfg.save(v);
  return false;
}
// กดกากบาท = ทำแบบเดียวกับปิดกล่อง (บางกล่องต้องย้อนกลับไปหน้าต่างสั่งสินค้า ไม่ใช่ทิ้งบิล)
/* เปิดกล่องโดยรอให้จัดหน้าเสร็จก่อนค่อยเริ่มเลื่อน จะได้ไม่สะดุดเฟรมแรก */
function showSheet(){
  if(reduceMotion()){ dlg.showModal(); return; }
  dlg.classList.add('preopen');
  dlg.showModal();
  let started = false;
  const start = () => { if(started) return; started = true; dlg.classList.remove('preopen'); };
  // พอเลื่อนจบค่อยใส่เบลอ ตอนนั้นไม่มีอะไรขยับแล้ว เบลอทีเดียวจบ ไม่กินทุกเฟรม
  const settle = e => {
    if(e && e.animationName !== 'sheet') return;
    if(dlg.open && !dlg.classList.contains('closing')) dlg.classList.add('settled');
  };
  dlg.addEventListener('animationend', settle, { once:true });
  setTimeout(settle, 820);
  // รอสองเฟรม: เฟรมแรกเบราว์เซอร์จัดหน้า เฟรมที่สองค่อยเริ่มขยับ
  // รอสองเฟรม: เฟรมแรกเบราว์เซอร์จัดหน้า เฟรมที่สองค่อยเริ่มขยับ
  // (ชุดตรวจรันนอกเบราว์เซอร์ ไม่มี rAF จึงต้องเช็กก่อน)
  if(typeof requestAnimationFrame === 'function')
    requestAnimationFrame(() => requestAnimationFrame(start));
  setTimeout(start, 120);        // เผื่อแท็บถูกพักไว้ rAF ไม่ยิง กล่องจะได้ไม่ค้างนอกจอ
}

/* ===================== ปิดกล่องให้มีภาพเคลื่อนไหว =====================
   ตอนเปิดกล่องเลื่อนเข้ามาจากขวา แต่ตอนปิดของเดิมหายวับทันที เป็นคนละจังหวะกัน
   dialog.close() ของเบราว์เซอร์ปิดทันทีเสมอ จึงต้องครอบไว้:
   เล่นภาพเลื่อนออกก่อน จบแล้วค่อยปิดจริง

   ครอบที่ตัว dlg.close เลย จุดที่เรียกปิดทั้ง 36 แห่งในไฟล์นี้จึงได้ไปด้วยโดยไม่ต้องแก้ทีละจุด */
// เก็บตัวปิดของจริงไว้ก่อนจะทับ dlg.close ด้านล่าง
// (ใช้ dlg.close ตรง ๆ ไม่อ้าง HTMLDialogElement เพราะชุดตรวจรันนอกเบราว์เซอร์ ไม่มีคลาสนั้น)
const dlgCloseNow = dlg.close.bind(dlg);
let dlgClosing = false, dlgCloseTimer = null;

const reduceMotion = () => {
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
};

// ยกเลิกการปิดที่ค้างอยู่ ใช้ตอนมีกล่องใหม่มาเปิดแทนระหว่างที่กล่องเก่ากำลังเลื่อนออก
function abortDlgClose(){
  dlgClosing = false;
  dlg.classList.remove('settled');   // กล่องใหม่กำลังจะเปิด เดี๋ยวไปใส่เบลอตอนมันจอดเอง
  clearTimeout(dlgCloseTimer); dlgCloseTimer = null;
  dlg.classList.remove('closing');
}

function closeDialogAnimated(){
  if(!dlg.open || dlgClosing) return;
  if(reduceMotion()) return dlgCloseNow();   // เครื่องตั้งให้ลดการเคลื่อนไหว ปิดเลยไม่ต้องหน่วง

  dlgClosing = true;
  dlg.classList.remove('settled');   // เอาเบลอออกก่อน ขาออกจะได้เบาเหมือนขาเข้า
  dlg.classList.add('closing');
  const finish = () => {
    if(!dlgClosing) return;        // ถูกยกเลิกไปแล้ว เพราะมีกล่องใหม่มาเปิดแทน
    abortDlgClose();
    dlgCloseNow();
  };
  // เผื่อ animationend ไม่ยิง (เบราว์เซอร์แปลก ๆ หรือแท็บถูกพักไว้) ต้องมีตัวสำรองเสมอ
  dlgCloseTimer = setTimeout(finish, 820);
  dlg.addEventListener('animationend', finish, { once:true });
}
dlg.close = closeDialogAnimated;

// กด Esc เบราว์เซอร์จะปิดเองทันที กันไว้แล้วปิดเองให้มีภาพเคลื่อนไหวเหมือนกดปุ่ม
dlg.addEventListener('cancel', e => {
  if(dlgClosing) return;
  e.preventDefault();
  closeDialogAnimated();
});

function dlgDismiss(){ dlg.close(); }   // ที่เหลือให้ตัวดักเหตุการณ์ close จัดการ จะได้ไม่ทำซ้ำ
dlg.addEventListener('close', () => {
  dlg.removeEventListener('input', dlgLive);
  // มีหน้าต่างใหม่เปิดแทนไปแล้ว = ไม่ใช่การปิดจริง อย่าไปยุ่งกับค่าของหน้าต่างใหม่
  if(dlg.open) return;
  const back = dlgCfg && dlgCfg.onDismiss;
  dlgCfg = {};                       // กัน onDismiss ทำงานซ้ำตอนกล่องถัดไปเปิด
  if(typeof back === 'function') back();
});

/* --------- แท็บ 1: วัตถุดิบ --------- */
function viewIng(){
  // แถวสรุปไม่ต้องมีปุ่มเพิ่ม หัวการ์ดข้างล่างมีอยู่แล้ว (ปุ่มซ้ำแบบเดียวกับหน้ารายจ่าย)
  const back = subHead('ing','ของที่ซื้อมา', db.ingredients.length ? db.ingredients.length + ' อย่าง · ใช้คิดต้นทุนต่อจาน' : 'ยังไม่ได้ใส่ของที่ซื้อมา');
  const rows = db.ingredients.map(i => `
    <div class="li" role="button" tabindex="0" onclick="editIng('${i.id}')"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();editIng('${i.id}')}">
      <span class="av">${esc(initial(i.name))}</span>
      <div class="li-main">
        <div class="li-title">${esc(i.name || '(ยังไม่มีชื่อ)')}</div>
        <div class="li-subrow">
          <span class="li-sub">${n(i.packQty).toLocaleString('th-TH')} ${esc(i.unit)} · ${baht(i.packPrice)} บาท</span>
          <span class="chip">${perUnit(i)}</span>
        </div>
      </div>
      <div class="li-end">
        <span class="li-del" role="button" tabindex="0" title="ลบ"
              onclick="event.stopPropagation(); delIng('${i.id}')"
              onkeydown="if(event.key==='Enter'){event.stopPropagation();delIng('${i.id}')}">${icon('trash',15)}</span>
        <span class="li-chev">${icon('chev',16)}</span>
      </div>
    </div>`).join('');

  return back + `
  <div class="card">
    <div class="head-row">
      <h2>วัตถุดิบที่ซื้อมา</h2>
      <button class="btn sm primary" onclick="addIng()">${icon('plus',14)} เพิ่ม</button>
    </div>
    <p class="sub">${db.ingredients.length ? 'แตะที่รายการเพื่อแก้ไข' : 'กรอกตามบิลที่ซื้อจริง เดี๋ยวแอปคิดให้เองว่าตกหน่วยละเท่าไหร่'}</p>
    <div class="list">
      ${rows || `<div class="empty">
        <div class="empty-ic">${icon('box',34)}</div>
        <h3>เริ่มจากของที่ซื้อมา</h3>
        <p>กรอกตามบิล เช่น แป้งเครป 1,000 กรัม 45 บาท แล้วแอปจะคิดให้เองว่าตกกรัมละเท่าไหร่</p>
        <button class="btn primary" onclick="addIng()">${icon('plus',16)} เพิ่มของชิ้นแรก</button>
      </div>`}
    </div>
  </div>`;
}
// หน้าต่างเดียวใช้ได้ทั้งเพิ่มและแก้ไข (ส่ง null = เพิ่มใหม่)
function ingDialog(ing){
  openDialog({ icon:'ing',
    title: ing ? 'แก้ไขวัตถุดิบ' : 'เพิ่มวัตถุดิบ',
    sub:'กรอกตามบิลที่ซื้อจริง ระบบคิดราคาต่อหน่วยให้เอง',
    fields:[
      {k:'name', label:'ชื่อวัตถุดิบ', type:'text', value:ing?.name ?? '', placeholder:'เช่น แป้งเครป', wide:true},
      {k:'packQty', label:'ปริมาณที่ได้', type:'number', value:ing?.packQty ?? 1000},
      {k:'unit', label:'หน่วย', type:'select', value:ing?.unit ?? 'กรัม', options:UNITS.map(u=>({value:u,label:u}))},
      {k:'packPrice', label:'ราคาที่จ่าย (บาท)', type:'number', value:ing?.packPrice ?? '', wide:true}
    ],
    live: v => v.packQty > 0 && v.packPrice > 0
      ? `คิดเป็น ${perUnit({unit:v.unit, packQty:v.packQty, packPrice:v.packPrice})}`
      : 'กรอกปริมาณกับราคาแล้วจะคำนวณให้ทันที',
    check: v => !v.name.trim() ? 'ยังไม่ได้ใส่ชื่อวัตถุดิบ'
              : v.packQty <= 0 ? 'ปริมาณที่ได้ต้องมากกว่า 0'
              : v.packPrice < 0 ? 'ราคาติดลบไม่ได้' : null,
    save: v => {
      const data = {name:v.name.trim(), packQty:v.packQty, unit:v.unit, packPrice:v.packPrice};
      if(ing) Object.assign(ing, data);
      else db.ingredients.push(Object.assign({id:uid()}, data));
      save(); render();
      toast(savedMsg('ของที่ซื้อมา', data.name, !ing));
    }
  });
}
function addIng(){ ingDialog(null); }
function editIng(id){ const i = findIng(id); if(i) ingDialog(i); }
function delIng(id){
  if(!adminOk(() => delIng(id))) return;
  const i = findIng(id);
  const used = db.menus.filter(m => (m.items||[]).some(it => it.ingId===id)).map(m=>m.name||'(ไม่มีชื่อ)');
  const go = () => {
    const nm = i ? i.name : '';
    db.ingredients = db.ingredients.filter(x => x.id!==id);
    db.menus.forEach(m => m.items = (m.items||[]).filter(it => it.ingId!==id));
    save(); render();
    toast(delMsg('ของที่ซื้อมา', nm));
  };
  if(used.length) askConfirm(`ลบ "${esc(i?.name||'')}" ?`,
    `ของชิ้นนี้ถูกใช้ในสูตรของ ${esc(used.join(', '))} — ลบแล้วสูตรเหล่านั้นจะหายไปด้วย`, 'ลบเลย', go);
  else go();
}

/* --------- แท็บ 2: เมนู --------- */
function costSplit(m){
  const cost = menuCost(m), price = n(m.price), pf = price - cost;
  if(price <= 0 || cost <= 0) return '';
  if(pf < 0){
    return `<div class="split"><i class="seg-loss only" style="width:100%"></i></div>
      <div class="legend"><span><i style="background:var(--bad)"></i>ขาดทุนจานละ <b>${baht(-pf)}</b> บาท</span></div>`;
  }
  const cw = clamp(cost / price * 100, 0, 100);
  return `
    <div class="split">
      <i class="seg-cost" style="width:${cw}%"></i>
      <i class="seg-profit" style="width:${100-cw}%"></i>
    </div>
    <div class="legend">
      <span><i style="background:var(--brand)"></i>ต้นทุน <b>${baht(cost)}</b></span>
      <span><i style="background:var(--brand-l)"></i>กำไร <b>${baht(pf)}</b></span>
    </div>`;
}

/* ===================== หน้าเลือกของที่ใช้ในสูตร =====================
   เดิมต้องเปิดหน้าต่างทีละชิ้น เมนูหนึ่งใช้ของ 7 อย่างก็ 7 รอบ
   เปลี่ยนเป็นเห็นของทั้งหมดในหน้าเดียว ติ๊กอันที่ใช้แล้วใส่จำนวน จบในครั้งเดียว */
let recipeDraft = null;   // {menuId, map:{ingId: qty}}

function openRecipe(menuId){
  const m = findMenu(menuId); if(!m) return;
  recipeDraft = { menuId, map: Object.fromEntries((m.items||[]).map(it => [it.ingId, n(it.qty)])) };
  render(); window.scrollTo({top:0});
}
function closeRecipe(){ recipeDraft = null; render(); window.scrollTo({top:0}); }

function toggleIng(id){
  if(!recipeDraft) return;
  if(id in recipeDraft.map) delete recipeDraft.map[id];
  else recipeDraft.map[id] = '';            // ติ๊กแล้วค่อยพิมพ์จำนวน
  render();
  const el = document.getElementById('q_' + id);
  if(el) el.focus();
}
function setDraftQty(id, v){
  if(!recipeDraft) return;
  recipeDraft.map[id] = v === '' ? '' : n(v);
  refreshRecipeSum();                        // อัปเดตแค่แถบสรุป ช่องที่พิมพ์อยู่จะได้ไม่หลุด
  const c = document.getElementById('c_' + id);
  const ing = findIng(id);
  if(c && ing) c.textContent = n(v) > 0 ? baht(unitCost(ing) * n(v)) : '';
}
function draftCost(){
  if(!recipeDraft) return 0;
  return Object.entries(recipeDraft.map).reduce((s,[id,q]) => {
    const ing = findIng(id);
    return s + (ing ? unitCost(ing) * n(q) : 0);
  }, 0);
}
function refreshRecipeSum(){
  const box = document.getElementById('recipeSum');
  if(box) box.innerHTML = recipeSumHTML();
}
function recipeSumHTML(){
  const m = findMenu(recipeDraft.menuId);
  const cost = draftCost(), price = n(m.price), pf = price - cost;
  const picked = Object.keys(recipeDraft.map).length;
  if(!picked) return `<b>ยังไม่ได้เลือกของ</b><span>ติ๊กของที่ใช้ทำจานนี้</span>`;
  if(price <= 0) return `<b>ค่าของจานละ ${baht(cost)} บาท</b><span>เลือกไว้ ${picked} อย่าง · ยังไม่ได้ใส่ราคาขาย</span>`;
  return `<b>ค่าของ ${baht(cost)} · ขาย ${baht(price)} → เหลือ ${baht(pf)} บาท</b>
          <span>เลือกไว้ ${picked} อย่าง · กำไร ${price > 0 ? (pf/price*100).toFixed(0) : 0}%</span>`;
}
function saveRecipe(){
  const m = findMenu(recipeDraft.menuId);
  if(m){
    m.items = Object.entries(recipeDraft.map)
      .filter(([,q]) => n(q) > 0)
      .map(([ingId,q]) => ({ingId, qty:n(q)}));
    save();
  }
  recipeDraft = null; render(); window.scrollTo({top:0});
  toast('บันทึกของที่ใช้ในเมนูนี้แล้ว');
}

function viewRecipe(){
  const m = findMenu(recipeDraft.menuId);
  if(!m){ recipeDraft = null; return viewMenu(); }

  const rows = db.ingredients.map(i => {
    const on = i.id in recipeDraft.map;
    const q = on ? recipeDraft.map[i.id] : '';
    const c = n(q) > 0 ? baht(unitCost(i) * n(q)) : '';
    return `<div class="pick${on ? ' on' : ''}">
      <button class="pick-box" onclick="toggleIng('${i.id}')" aria-pressed="${on}"
              aria-label="${on ? 'เอาออก' : 'เลือก'} ${esc(i.name)}">${icon('check',15)}</button>
      <div class="pick-main" onclick="toggleIng('${i.id}')">

        <input id="q_${i.id}" type="number" step="any" inputmode="decimal" class="pick-qty"
               value="${q}" placeholder="0" oninput="setDraftQty('${i.id}', this.value)">

  }).join('');

  return `<button class="btn back" onclick="closeRecipe()">${icon('back',16)} กลับไปหน้าเมนู</button>
  <div class="card">
    <h2>${esc(m.name || '(ยังไม่มีชื่อ)')} ใช้ของอะไรบ้าง</h2>
    <p class="sub">ติ๊กของที่ใช้ แล้วใส่ว่าใช้เท่าไหร่ต่อ 1 จาน — ติ๊กได้หลายอย่างในครั้งเดียว</p>
    ${db.ingredients.length
      ? `<div class="picks">${rows}</div>`
      : `<div class="empty">${icon('box',34)}ยังไม่มีของให้เลือก<br>ไปใส่ของที่ซื้อมาก่อน</div>
         <button class="btn primary block" onclick="go('ing')">ไปใส่ของที่ซื้อมา</button>`}
  </div>
  <div class="savebar">
    <div class="recipe-sum" id="recipeSum">${recipeSumHTML()}</div>
    <div class="btnrow">
      <button class="btn ghost" onclick="closeRecipe()">ยกเลิก</button>
      <button class="btn primary" onclick="saveRecipe()">บันทึกสูตร</button>
    </div>
  </div>`;
}

let openMenuId = null;
function openMenu(id){ openMenuId = id; render(); window.scrollTo({top:0}); }
function backToMenus(){ openMenuId = null; render(); window.scrollTo({top:0}); }

function viewMenu(){

  if(!db.ingredients.length){
    openMenuId = null;
    return `<div class="card">
      <div class="empty">
        <div class="empty-ic">${icon('box',34)}</div>
        <h3>ต้องใส่ของที่ซื้อมาก่อน</h3>
        <p>พอมีรายการของแล้ว ค่อยมาบอกว่าแต่ละเมนูใช้อะไรบ้าง</p>
        <button class="btn primary" onclick="go('ing')">ไปใส่ของที่ซื้อมา</button>
      </div>

  // --- หน้ารายการเมนู: เห็นทีเดียวว่าเมนูไหนกำไรดี ---

    if(!db.menus.length){

          <button class="btn primary" onclick="addMenu()">${icon('plus',16)} เพิ่มเมนูแรก</button>

           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openMenu('${m.id}')}">
        <span class="av ${noRecipe ? 'w' : st.lv === 'good' ? 'g' : st.lv === 'bad' ? 'b' : 'w'}">${esc(initial(m.name))}</span>
        <div class="li-main">

          <div class="li-sub">${noRecipe ? 'ยังไม่ได้ใส่ว่าใช้อะไรบ้าง'
            : `ขาย ${baht(m.price)} บาท · ได้กำไรจานละ ${baht(profit(m))} บาท`}</div>
          ${isSetMenu(m) ? `<div class="li-sub">จัดชุดให้แล้ว: ${esc(fixText(setAddons(m)))}</div>`
            : n(m.incl) > 0 ? `<div class="li-sub">รวมไส้ ${n(m.incl)} อย่าง · เกินคิดเพิ่มอันละ ${baht(m.extraTop)} บาท</div>` : ''}
        </div>
        <div class="li-end">
          <span class="status is-${noRecipe ? 'warn' : st.lv}">${noRecipe ? 'ยังไม่ครบ' : st.word}</span>
          <span class="li-chev">${icon('chev',16)}</span>
        </div>
      </div>`;
    }).join('');

    return `<div class="card">
      <div class="head-row">
        <h2>เมนูที่ขาย</h2>
        <button class="btn sm primary" onclick="addMenu()">${icon('plus',14)} เพิ่ม</button>
      </div>
      <p class="sub">แตะที่เมนูเพื่อดูรายละเอียดและใส่ว่าใช้ของอะไรบ้าง</p>
      <div class="list">${rows}</div>

    const items = (m.items||[]).map(it => {

      return `<div class="li-read">
        <div class="li-main">
          <div class="li-title">${esc(ing?.name || '(ของชิ้นนี้ถูกลบไปแล้ว)')}</div>
          <div class="li-sub">ใช้ ${n(it.qty).toLocaleString('th-TH')} ${esc(ing?.unit||'')}</div>
        </div>
        <span class="chip">${ing ? baht(unitCost(ing)*n(it.qty)) : '–'}</span>

    return `<button class="btn back" onclick="backToMenus()">${icon('back',16)} เมนูทั้งหมด</button>
    <div class="card">
      <div class="row-head" style="margin-bottom:2px">
        <div class="li-main">
          <h2 style="margin:0">${esc(m.name || '(ยังไม่มีชื่อ)')}</h2>
          <div class="li-sub">ขาย ${baht(m.price)} บาท · วันละ ${n(m.qtyPerDay)} จาน</div>
        </div>
        <button class="btn sm" onclick="editMenu('${m.id}')">${icon('edit',14)} แก้ไข</button>
        <button class="li-del" title="ลบเมนูนี้" onclick="delMenu('${m.id}')">${icon('trash',15)}</button>
      </div>

      <div class="verdict is-${st.lv}">
        <b>${st.word}</b>
        ${n(m.price) > 0 && (m.items||[]).length
          ? `ขายจานละ ${baht(m.price)} บาท ค่าของ ${baht(cost)} บาท <b>เหลือกำไร ${baht(profit(m))} บาท</b>`
          : 'ใส่ราคาขายและของที่ใช้ให้ครบก่อน แล้วจะคำนวณให้'}
      </div>

      ${costSplit(m)}

      ${menuGroupList(m)}

      <div class="sec">จานนี้ใช้ของอะไรบ้าง</div>
      <div class="list">${items || `<div class="empty" style="padding:16px">ยังไม่ได้ใส่ว่าใช้ของอะไร</div>`}</div>
      <div style="margin-top:10px">
        <button class="btn primary block" onclick="openRecipe('${m.id}')">${icon('edit',15)} ${items ? 'แก้ว่าใช้ของอะไรบ้าง' : 'เลือกของที่ใช้'}</button>
      </div>

      <div class="sec">ผลลัพธ์</div>
      <div class="tiles">
        <div class="tile"><div class="lbl">ต้นทุน / จาน</div><div class="val tnum">${baht(cost)}</div></div>
        <div class="tile"><div class="lbl">กำไร / จาน</div>
          <div class="val tnum ${profit(m)>=0?'good':'bad'}">${baht(profit(m))}</div></div>
        <div class="tile"><div class="lbl">กำไร %</div>
          <div class="val tnum ${lv}">${mg.toFixed(1)}%</div>
          <div class="meter is-${lv}" style="margin-top:7px"><i style="width:${clamp(mg,0,100)}%"></i></div></div>
        <div class="tile"><div class="lbl">ราคาที่แนะนำ</div>
          <div class="val tnum">${baht(suggestPrice(m))}</div></div>
      </div>
    </div>`;
  }).join('');

  return cards || `<div class="card">
    <h2>เมนู</h2>
    <div class="empty">${icon('menu',34)}ยังไม่มีเมนู<br>กดปุ่ม <b>เพิ่ม</b> ด้านบน</div>
  </div>`;
}
const findMenu = id => db.menus.find(m => m.id===id);
// หน้าต่างเดียวใช้ได้ทั้งเพิ่มและแก้ไข (ส่ง null = เพิ่มใหม่)
// ชุดไส้ที่ติ๊กไว้ในหน้าต่างเพิ่ม/แก้เมนู (ยังไม่บันทึกจนกว่าจะกดบันทึก)
let menuDraftGroups = new Set();
// ติ๊กในที่เลย ไม่วาดหน้าต่างใหม่ ข้อความที่พิมพ์ค้างไว้จะได้ไม่หาย
function toggleDraftGroup(gid, el){
  if(menuDraftGroups.has(gid)) menuDraftGroups.delete(gid); else menuDraftGroups.add(gid);
  const on = menuDraftGroups.has(gid);
  if(el){ el.classList.toggle('on', on); el.setAttribute('aria-pressed', on); }
  const sum = document.getElementById('gpickSum');
  if(sum) sum.textContent = draftGroupSum();
}
function draftGroupSum(){
  const gs = [...menuDraftGroups].map(id => findGroup(id)).filter(Boolean);
  if(!gs.length) return 'ยังไม่ได้เลือก — เมนูนี้จะไม่มีไส้ให้ติ๊กตอนขาย';
  const items = gs.reduce((a,g) => a + g.items.length, 0);
  return `เลือก ${gs.length} ชุด · ติ๊กได้ ${items} อย่างตอนขาย`;
}
/* ===================== ไส้ที่ร้านจัดให้ (เมนูจัดชุด) =====================
   ใช้ชิปแบบเดียวกับชุดไส้ (.gpick/.gchip) ไม่ต้องมี CSS ใหม่
   แม่ค้าแตะเลือกจากไส้ที่มีอยู่แล้ว **ไม่ต้องพิมพ์ชื่อไส้เอง** พิมพ์แล้วสะกดไม่ตรงกัน
   ลูกค้าจะเห็นชื่อไส้คนละแบบกับที่ร้านรู้จัก */
let menuDraftFix = new Set();

/* ไส้ทุกอย่างในร้าน แยกตามชุด (ไส้คาว / ไส้หวาน / ราดซอส)
   ชื่อซ้ำข้ามชุดเอาอันเดียว · ร้านจัดชุดข้ามชุดได้ จะเอาทั้งคาวทั้งหวานทั้งซอสก็ได้
   เจ้าของถามเอง: "ถ้าใส่คาวกับหวานหมดด้วยล่ะทำไง ไหนจะซอสด้วยนะ" */
function fixGroups(){
  const seen = new Set(), out = [];
  (db.groups || []).forEach(g => {
    const items = (g.items || []).filter(it => it.name && !seen.has(it.name));
    items.forEach(it => seen.add(it.name));
    if(items.length) out.push({ id:g.id, name:g.name, items });
  });
  return out;
}
// ไส้ทุกอย่างในร้านเรียงตามลำดับชุด ใช้จัดลำดับตอนบันทึกด้วย
function allAddonNames(){
  const out = [];
  fixGroups().forEach(g => g.items.forEach(it => out.push({ name:it.name, group:g.name })));
  return out;
}
/* ไส้ที่เคยจัดไว้แต่ถูกลบออกจากชุดไปแล้ว — **ต้องโชว์ไว้ให้เอาออกได้**
   ไม่งั้นมันค้างอยู่บนเมนูตลอดไปโดยที่แม่ค้าไม่มีทางแตะถึง */
function strayFix(){
  const known = allAddonNames().map(a => a.name);
  return [...menuDraftFix].filter(nm => !known.includes(nm));
}

function toggleDraftFix(name, el){
  if(menuDraftFix.has(name)) menuDraftFix.delete(name); else menuDraftFix.add(name);
  paintFixPicker();
}
// เลือกทั้งชุดทีเดียว — "ใส่คาวหมด" ไม่ต้องไล่แตะทีละอัน
function toggleDraftFixGroup(gid){
  const g = gid === '*' ? { items: strayFix().map(nm => ({ name:nm })) }
                        : fixGroups().find(x => x.id === gid);
  if(!g) return;
  const all = g.items.every(it => menuDraftFix.has(it.name));
  g.items.forEach(it => all ? menuDraftFix.delete(it.name) : menuDraftFix.add(it.name));
  paintFixPicker();
}
/* วาดใหม่เฉพาะก้อนตัวเลือก ไม่เปิดกล่องใหม่
   (เปิดใหม่ = ชื่อกับราคาที่พิมพ์ค้างไว้หายหมด) */
function paintFixPicker(){
  const box = document.getElementById('fpickBox');
  if(box) box.innerHTML = fixPickerInner();
}

function draftFixSum(){
  const total = menuDraftFix.size;
  if(!total) return 'ไม่เลือก = ลูกค้าเลือกไส้เองได้ตามปกติ';
  // บอกเป็นชุด ไม่ใช่ไล่ชื่อยาวเป็นพรืด (เลือกทั้งคาวทั้งหวานแล้วอ่านไม่ไหว)
  const per = fixGroups().map(g => {
    const k = g.items.filter(it => menuDraftFix.has(it.name)).length;
    return k ? `${g.name} ${k}` : '';
  }).filter(Boolean).join(' · ');
  return `จัดให้ ${total} อย่าง${per ? ' · ' + per : ''} · ลูกค้าเปลี่ยนเองไม่ได้`;
}

function fixChipsHTML(items){
  return `<div class="gpick">${items.map(it => {
    const on = menuDraftFix.has(it.name);
    return `<button type="button" class="gchip${on ? ' on' : ''}" aria-pressed="${on}"
      onclick="toggleDraftFix('${jsq(it.name)}', this)">
      <span class="gchip-n">${esc(it.name)}</span>
    </button>`;
  }).join('')}</div>`;
}

function fixPickerInner(){
  const gs = fixGroups();
  const stray = strayFix();
  const groupBlock = (key, name, items) => {
    const picked = items.filter(it => menuDraftFix.has(it.name)).length;
    const all = picked === items.length;
    return `
      <div class="gpick-head" style="margin-top:12px">
        <span>${esc(name)}</span>
        <small>เลือกแล้ว ${picked} จาก ${items.length}</small>
        <button type="button" class="btn sm" style="margin-left:auto"
                onclick="toggleDraftFixGroup('${jsq(key)}')">${all ? 'เอาออกทั้งชุด' : 'เลือกทั้งชุด'}</button>
      </div>
      ${fixChipsHTML(items)}`;
  };
  return `
    <div class="gpick-head" style="margin-top:16px">
      <span>เมนูจัดชุด — ร้านใส่ไส้ให้เลย</span>
      <small id="fpickSum">${esc(draftFixSum())}</small>
    </div>
    ${gs.map(g => groupBlock(g.id, g.name, g.items)).join('')}
    ${stray.length ? groupBlock('*', 'ไส้ที่ไม่อยู่ในชุดไหนแล้ว', stray.map(nm => ({ name:nm }))) : ''}
    <p class="hint">เลือกไว้แล้ว = ขายราคาเดียว ไส้ตามที่ร้านจัด · ลูกค้าเลือกเองไม่ได้ · ไม่คิดค่าไส้เพิ่ม<br>
      จะเอาทั้งคาว ทั้งหวาน ทั้งซอส พร้อมกันก็ได้ กด "เลือกทั้งชุด" ทีเดียวจบ</p>`;
}
function fixPickerHTML(){
  if(!allAddonNames().length && !menuDraftFix.size) return '';
  return `<div id="fpickBox">${fixPickerInner()}</div>`;
}

function groupPickerHTML(){
  if(!(db.groups||[]).length){
    return `<div class="gpick-empty">
      <b>ยังไม่มีชุดไส้ในร้านนี้</b>
      <p>บันทึกเมนูนี้ก่อนได้เลย แล้วค่อยไปสร้างชุดไส้ที่การ์ด "ชุดไส้ที่ใส่ได้" ในหน้าตั้งค่า</p>
    </div>`;
  }
  return `
    <div class="gpick-head">
      <span>ไส้ที่เมนูนี้ใส่ได้</span>
      <small id="gpickSum">${esc(draftGroupSum())}</small>
    </div>
    <div class="gpick">${db.groups.map(g => {
      const on = menuDraftGroups.has(g.id);
      return `<button type="button" class="gchip${on ? ' on' : ''}" aria-pressed="${on}"
        onclick="toggleDraftGroup('${g.id}', this)">
        <span class="gchip-n">${esc(g.name)}</span>
        <small>${g.items.length} อย่าง</small>
      </button>`;
    }).join('')}</div>`;
}

/* เรียงไส้ที่ร้านจัดให้ตามลำดับชุด (คาว → หวาน → ซอส) ไม่ใช่ตามลำดับที่แม่ค้าแตะ
   อ่านบนบิลแล้วเป็นระเบียบ และลูกค้าเห็นเรียงเหมือนกันทุกจาน
   ของที่ถูกลบออกจากชุดไปแล้วต่อท้ายไว้ **ห้ามทิ้ง** ไม่งั้นกดบันทึกเฉย ๆ ไส้หายเงียบ */
function sortedDraftFix(){
  const order = allAddonNames().map(a => a.name);
  return [...order.filter(nm => menuDraftFix.has(nm)), ...strayFix()];
}

function menuDialog(m){
  if(!adminOk(() => menuDialog(m))) return;
  menuDraftGroups = new Set(m ? (m.groupIds || []) : []);
  menuDraftFix    = new Set(m ? (m.fix || []) : []);
  openDialog({ icon:'menu',
    title: m ? 'แก้ไขเมนู' : 'เพิ่มเมนูใหม่',
    sub: m ? 'แก้ชื่อ ราคา และเลือกไส้ที่ใส่ได้' : 'ใส่ชื่อ ราคา แล้วติ๊กไส้ที่ใส่ได้ ในหน้าต่างเดียวจบ',
    fields:[
      {k:'name', label:'ชื่อเมนู', type:'text', value:m?.name ?? '', placeholder:'เช่น เครปกรอบ นูเทลล่า', wide:true},
      {k:'cat', label:'หมวด (เช่น เครป โตเกียว)', type:'text', value: m ? menuCat(m) : '', wide:true},
      {k:'price', label:'ราคาขาย (บาท)', type:'number', value:m?.price ?? ''},
      {k:'qtyPerDay', label:'ขายได้วันละ (จาน)', type:'number', value:m?.qtyPerDay ?? ''},
      // สองช่องนี้สำหรับเมนูแบบ "โตเกียว 2 ไส้" ที่จำนวนไส้คือตัวกำหนดราคา
      // เครปที่คิดราคาต่อไส้อยู่แล้ว เว้นว่างไว้ ไม่ต้องกรอก
      {k:'incl', label:'ราคานี้รวมไส้กี่อย่าง (เว้นว่าง = ไม่จำกัด)', type:'number', value:m?.incl ?? ''},
      {k:'extraTop', label:'ไส้ที่เกินคิดเพิ่มอันละ (บาท)', type:'number', value:m?.extraTop ?? ''}
    ],
    extra: groupPickerHTML() + fixPickerHTML(),
    live: m ? (v => {
      const c = menuCost(m), pf = v.price - c;
      if(!(v.price > 0)) return `ต้นทุนวัตถุดิบจานละ ${baht(c)} บาท`;
      return `กำไรจานละ ${baht(pf)} บาท (${(pf/v.price*100).toFixed(1)}%) · วันละ ${baht(pf * v.qtyPerDay)} บาท`;
    }) : null,
    check: v => !v.name.trim() ? 'ยังไม่ได้ใส่ชื่อเมนู'
              : v.price < 0 ? 'ราคาติดลบไม่ได้'
              : v.qtyPerDay < 0 ? 'จำนวนจานติดลบไม่ได้'
              : v.incl < 0 ? 'จำนวนไส้ติดลบไม่ได้'
              : v.extraTop < 0 ? 'ค่าไส้เพิ่มติดลบไม่ได้' : null,
    save: v => {
      const data = {name:v.name.trim(), cat:(v.cat||'').trim(), price:v.price,
                    qtyPerDay:v.qtyPerDay, incl:v.incl, extraTop:v.extraTop,
                    groupIds:[...menuDraftGroups], fix:sortedDraftFix()};
      if(m) Object.assign(m, data);
      else db.menus.push(Object.assign({id:uid(), items:[]}, data));
      const gs = menuDraftGroups.size, fx = menuDraftFix.size;
      menuDraftGroups = new Set();
      menuDraftFix = new Set();
      save(); render();
      toast(savedMsg('เมนู', data.name, !m)
            + (fx ? ` · จัดชุดไส้ให้ ${fx} อย่าง` : gs ? ` · ใส่ไส้ ${gs} ชุด` : ''));
    }
  });
}
function addMenu(){

function editMenu(id){ const m = findMenu(id); if(m) menuDialog(m); }
function delMenu(id){
  const m = findMenu(id);
  askConfirm(`ลบเมนู "${esc(m?.name||'(ไม่มีชื่อ)')}" ?`,
    'ยอดขายที่บันทึกไปแล้วยังอยู่ ไม่หายไปด้วย', 'ลบเลย', () => {
      db.menus = db.menus.filter(x => x.id!==id);

function refreshFixed(){
  const cur = document.getElementById('fixedKpi');
  if(!cur) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = viewFixed();
  const next = tmp.querySelector('#fixedKpi');
  if(next) cur.replaceWith(next);
}

/* เปิดทัวร์ไหนอยู่ · รายการขั้นที่ใช้ได้จริงในรอบนี้ */
let tourAt = 0, tourList = [], tourWhich = 'intro';

// เห็นอยู่จริงไหม — ของที่ซ่อนอยู่หรือกว้างศูนย์ ชี้ไปก็ไม่มีใครเห็นว่าชี้อะไร
function tourVisible(sel){
  /* ต้องเอา "ตัวแรกที่มองเห็น" ไม่ใช่ตัวแรกใน DOM
     แท็บย่อยที่ซ่อนอยู่ก็มี element หน้าตาเดียวกันแต่ขนาดเป็นศูนย์
     ถ้าใช้ querySelector เฉย ๆ แล้วตัวแรกบังเอิญอยู่ในแท็บที่ซ่อน
     ขั้นนั้นจะถูกข้ามทั้งที่ของจริงโผล่อยู่ตรงหน้า (หน้ารายจ่ายมีปุ่มเพิ่มอยู่ทั้งสองแท็บย่อย) */
  for(const el of document.querySelectorAll(sel)){
    if(!el || el.hidden) continue;
    const r = el.getBoundingClientRect();
    if(r.width > 0 && r.height > 0) return el;
  }
  return null;
}

function startTour(key){
  const t = TOURS.find(x => x[0] === (key || 'intro')) || TOURS[0];
  tourWhich = t[0];
  endTour();                         // เผื่อกดข้ามมาจากการ์ดจบของทัวร์ก่อนหน้า
  dlg.close();
  go(t[2]);                          // พาไปหน้าที่ทัวร์ชุดนี้พูดถึงก่อน
  tourList = t[3];
  setTimeout(() => {
    if(!tourNow().length){ toast('ยังไม่มีอะไรให้พาดูตอนนี้'); return; }
    tourAt = 0;
    document.getElementById('tour').hidden = false;
    document.addEventListener('keydown', tourKey);
    paintTour();
  }, 420);
}

// ขั้นที่ "ตอนนี้" ชี้ได้จริง — คิดใหม่ทุกครั้ง ไม่จำค่าเก่าไว้
const tourNow = () => tourList.filter(([sel]) => tourVisible(sel));

/* ดูจบแล้วต้องมีอะไรมารับ ไม่ใช่จอหรี่หายไปเฉย ๆ แล้วงงว่าจบหรือแอปค้าง
   เจ้าของขอมาเอง: "หลังจากที่ดูจบ หรือครบแล้ว ก็ให้มีปุ่มด้วย"
   และต้องมีทางไปต่อ — ชวนดูทัวร์หน้าที่ยังไม่เคยดู */
function tourFinish(){
  const t = TOURS.find(x => x[0] === tourWhich) || TOURS[0];
  markTourSeen(tourWhich);
  const hole = document.getElementById('tourHole');
  // หุบรูให้หายไป จะได้ไม่มีกรอบค้างชี้ปุ่มสุดท้ายอยู่ตอนอ่านการ์ดจบ
  hole.style.width = hole.style.height = '0px';
  hole.style.top = hole.style.left = '50%';

  tourConfetti();
  const tip = document.getElementById('tourTip');
  tip.classList.add('tour-end');
  tip.innerHTML = `<div class="tour-ic">🎉</div>
    <h3>ดูจบแล้ว</h3>
    <p>ทัวร์<b>${esc(t[1])}</b> · กดปุ่ม ? มุมขวาบนเพื่อดูซ้ำหรือดูหน้าอื่น</p>
    <div class="tour-foot">
      <button type="button" class="tour-b go" onclick="endTour()">เริ่มใช้งานเลย</button>
    </div>`;
  // การ์ดจบลอยกลางจอ ไม่ได้เกาะปุ่มไหนแล้ว
  tip.style.top = '50%';
  tip.style.left = '50%';
  tip.style.transform = 'translate(-50%, -50%)';
}

/* โปรยกระดาษฉลองหนึ่งรอบ
   สร้างเป็น element จริงแล้วลบทิ้งเมื่อเล่นจบ ไม่ปล่อยค้างไว้กินแรงเครื่อง
   เครื่องที่ตั้งว่าลดการเคลื่อนไหวไม่ต้องสร้างเลย */
function tourConfetti(){
  const host = document.getElementById('tour');
  const old = host.querySelector('.tour-conf');
  if(old) old.remove();
  if(reduceMotion()) return;
  const sky = document.createElement('div');
  sky.className = 'tour-conf';
  const colors = ['var(--brand)', 'var(--good)', 'var(--warn)', '#e8b4b4', '#7aa7e8'];
  let html = '';
  for(let i = 0; i < 18; i++){
    const left  = Math.round(Math.random() * 96) + '%';
    const delay = (Math.random() * .7).toFixed(2) + 's';
    const dur   = (1.9 + Math.random() * 1.1).toFixed(2) + 's';
    const c     = colors[i % colors.length];
    const w     = 6 + Math.round(Math.random() * 5);
    html += `<i style="left:${left}; width:${w}px; background:${c};
      animation-delay:${delay}; animation-duration:${dur}"></i>`;
  }
  sky.innerHTML = html;
  host.appendChild(sky);
  setTimeout(() => sky.remove(), 3600);
}

const tourSeen = k => ((store && store.tourSeen) || []).includes(k);
function markTourSeen(k){
  if(!store || tourSeen(k)) return;
  store.tourSeen = [...((store.tourSeen) || []), k];
  save();
}

function endTour(){
  const host = document.getElementById('tour');
  host.hidden = true;
  document.removeEventListener('keydown', tourKey);
  const conf = host.querySelector('.tour-conf');
  if(conf) conf.remove();
  const tip = document.getElementById('tourTip');
  tip.classList.remove('tour-end');
  tip.style.transform = '';
}
function tourKey(e){ if(e.key === 'Escape') endTour(); }
function tourGo(d){
  const next = tourAt + d;
  if(next < 0) return;
  if(next >= tourNow().length) return tourFinish();
  tourAt = next;
  paintTour();
}

function paintTour(){
  const vis = tourNow();
  if(!vis.length) return endTour();
  if(tourAt >= vis.length) tourAt = vis.length - 1;
  const [sel, title, text] = vis[tourAt];
  const el = tourVisible(sel);
  if(!el) return tourGo(1);          // หายไประหว่างทาง ข้ามไปขั้นถัดไป
  el.scrollIntoView({ block:'center', behavior:'smooth' });

  tourSettled(el, () => {
    const r = el.getBoundingClientRect();
    const pad = 6;
    const hole = document.getElementById('tourHole');
    hole.style.top    = (r.top - pad) + 'px';
    hole.style.left   = (r.left - pad) + 'px';
    hole.style.width  = (r.width + pad * 2) + 'px';
    hole.style.height = (r.height + pad * 2) + 'px';

    const nTotal = tourNow().length;
    const last = tourAt === nTotal - 1;
    const tip = document.getElementById('tourTip');
    tip.innerHTML = `<h3>${esc(title)}</h3><p>${esc(text)}</p>
      <div class="tour-foot">
        <span class="tour-no">${tourAt + 1} / ${nTotal}</span>
        ${tourAt > 0 ? '<button type="button" class="tour-b" onclick="tourGo(-1)">ก่อนหน้า</button>' : ''}
        <button type="button" class="tour-b" onclick="endTour()">ปิด</button>
        <button type="button" class="tour-b go" onclick="tourGo(1)">${last ? 'จบแล้ว' : 'ถัดไป'}</button>
      </div>`;

    /* วางกล่องใต้ของที่ชี้ ถ้าข้างล่างไม่พอก็ขึ้นไปอยู่ข้างบน
       ต้องวัดความสูงจริงหลังใส่ข้อความแล้ว เดาเอาไม่ได้ ข้อความยาวไม่เท่ากัน */
    const th = tip.offsetHeight, tw = tip.offsetWidth, gap = 12, edge = 16;
    const below = r.bottom + gap + th + edge <= innerHeight;
    tip.style.top = (below ? r.bottom + gap : r.top - gap - th) + 'px';
    let left = r.left + r.width / 2 - tw / 2;
    left = Math.max(edge, Math.min(left, innerWidth - tw - edge));
    tip.style.left = left + 'px';
  });
}

/* เรียก cb เมื่อ element หยุดขยับแล้ว (หรือครบเวลารอ)
   วัดตำแหน่งซ้ำทุก 60ms ได้ค่าเดิมสองรอบติด = จอดนิ่งแล้ว */
function tourSettled(el, cb){
  let last = null, left = 12;
  const tick = () => {
    const r = el.getBoundingClientRect();
    const now = Math.round(r.top) + ':' + Math.round(r.left);
    if(now === last || left <= 0) return cb();
    last = now; left--;
    setTimeout(tick, 60);
  };
  tick();
}

}



/* ===================== หน้าขายแบบ POS =====================
   เปิดบิล → กดเมนูที่ลูกค้าสั่ง (กดซ้ำ = เพิ่มจำนวน) → ใส่ท็อปปิ้ง → รับเงิน
   บันทึกเป็นรายการแยกตามเมนู แต่ผูก bill เดียวกัน จะได้ดูย้อนหลังได้เหมือนเดิม */
/* ===================== เมนูจริงจากใบเมนูของร้าน =====================
   เครป: แป้ง 15 บาท แล้วบวกไส้ที่เลือก (ไส้ละ 5–10 บาท) ซอสราดฟรี
   โตเกียว: ไส้คาวคิดตามจำนวนไส้ (2 ไส้ 10 / 3 ไส้ 15) จึงแยกเป็น 2 เมนู */
function shopMenu(){
  const A = (name, price, group) => ({ id: uid(), name, price, group });

let order = null;   // {lines:[{menuId,name,price,qty,addons:[{name,price}]}]}

/* ===================== หมวดหมู่เมนู (ใช้ในหน้าขาย) ===================== */
// ร้านยังไม่เคยตั้งหมวด ให้เดาจากชื่อเมนูไปก่อน แก้เองได้ในหน้าตั้งค่า
const CAT_GUESS = ['เครป','โตเกียว','ไข่ป๋วง','แพนเค้ก','วาฟเฟิล','ขนมปัง','น้ำ'];
function menuCat(m){
  if(m.cat) return m.cat;
  const name = String(m.name || '');
  const hit = CAT_GUESS.find(c => name.includes(c));
  return hit || 'อื่น ๆ';
}
function allCats(){
  const out = [];
  db.menus.forEach(m => { const c = menuCat(m); if(!out.includes(c)) out.push(c); });
  return out;
}
let posCat = null;              // null = ดูทุกหมวด
let posQ = '';                  // คำที่พิมพ์ค้นหา
let quickPick = false;          // โหมดเลือกด่วน = โชว์แต่เมนูที่ขายดี
function pickCat(c){ posCat = (c === '*' ? null : c); quickPick = false; repaintPosList(); }

// เมนูที่ขายดีใน 7 วันล่าสุด ไว้ใช้ตอนเลือกด่วน
function hotMenuIds(){
  const days = new Set(lastNDays(dayKey(), 7).map(w => w.key));
  const cnt = new Map();
  (db.sales||[]).forEach(x => { if(days.has(x.d)) cnt.set(x.menuId, (cnt.get(x.menuId)||0) + n(x.qty)); });
  return [...cnt.entries()].sort((a,b) => b[1] - a[1]).slice(0,6).map(e => e[0]);
}
/* ===================== เมนูขายดีที่ลูกค้าจะเห็น =====================
   เจ้าของขอมาเอง: "เมนูที่ลูกค้าสั่งบ่อย ๆ ไปแสดงที่ลูกค้าได้มั้ย"

   **คิดที่เครื่องแม่ค้า แล้วส่งขึ้นคลาวด์แค่อันดับ (1-3)**
   ห้ามส่งจำนวนจานหรือยอดเงินขึ้นไปเด็ดขาด — ยอดขายย้อนหลังเป็นเรื่องในร้าน
   ลูกค้าเห็นแค่ป้าย "ขายดี" ก็พอ ไม่ต้องรู้ว่าขายได้กี่จาน
   ขายได้น้อยกว่า HOT_MIN ไม่ติดป้าย ไม่งั้นร้านที่เพิ่งเปิดขายได้จานเดียว
   ก็กลายเป็น "ขายดี" ซึ่งเป็นคำโกหก */
const HOT_SHOW = 3;             // ติดป้ายให้ลูกค้าเห็นมากสุดกี่อย่าง
const HOT_MIN  = 3;             // ขายได้ใน 7 วันน้อยกว่านี้ ไม่นับว่าขายดี
function hotForCustomers(){
  const days = new Set(lastNDays(dayKey(), 7).map(w => w.key));
  const cnt = new Map();
  (db.sales || []).forEach(x => {
    if(!x.menuId || !days.has(x.d)) return;
    cnt.set(x.menuId, (cnt.get(x.menuId) || 0) + n(x.qty));
  });
  return [...cnt.entries()].filter(e => e[1] >= HOT_MIN)
    .sort((a,b) => b[1] - a[1]).slice(0, HOT_SHOW).map(e => e[0]);
}

function toggleQuick(){ quickPick = !quickPick; if(quickPick) posCat = null; repaintPosList(); }

// เมนูที่ต้องโชว์ หลังกรองหมวด/คำค้น/เลือกด่วน
function posMenus(){
  let list = db.menus;
  if(quickPick){
    // เมนูขายดีที่ยังมีอยู่จริง — ถ้าเมนูถูกแทนที่ไปแล้ว (id เปลี่ยน) ต้องไม่โชว์รายการว่าง
    const hot = hotMenuIds().map(id => list.find(m => m.id === id)).filter(Boolean);
    if(hot.length) list = hot;
  }
  if(posCat) list = list.filter(m => menuCat(m) === posCat);
  const q = posQ.trim().toLowerCase();
  if(q) list = list.filter(m => String(m.name||'').toLowerCase().includes(q));
  return list;
}

/* ===================== ค่าไส้ของจานหนึ่ง =====================
   มีสองแบบ แล้วแต่ว่าเมนูนั้นตั้ง "รวมไส้กี่อย่าง" ไว้หรือเปล่า

   A) ตั้งไว้ (เช่น โตเกียว 2 ไส้ ฿10) = คิดแบบโควตา
      ไส้ในโควตาฟรีเพราะรวมอยู่ในราคาแล้ว เกินมาคิดอันละ m.extraTop บาท
      **ไม่ใช้ราคาต่อไส้ของเมนูนี้** ไม่งั้นจะเก็บซ้ำสองเด้ง

   B) ไม่ได้ตั้ง (เช่น เครป ไส้กรอก +5 ไข่ +10) = คิดราคาต่อไส้เหมือนเดิม

   ทุกจุดที่คิดเงิน (บิลหน้าร้าน · แก้ยอดขายย้อนหลัง · หน้าลูกค้า) ต้องใช้สูตรนี้
   ถ้าแยกกันคิด เดี๋ยวได้ราคาคนละอย่างระหว่างที่ลูกค้าเห็นกับที่ร้านเก็บ */
/* ===================== เมนูจัดชุด — ร้านตั้งไส้ไว้ให้เลย =====================
   เจ้าของขอมาเอง: "ร้านตั้งให้เลยว่ามีใส่อะไรบ้าง"
   `m.fix` = ชื่อไส้ที่ร้านใส่ให้ตายตัว · ลูกค้าเปลี่ยนไม่ได้ · ราคาเดียวจบ

   ไส้พวกนี้ **ไม่คิดเงินเพิ่ม** และต้องตัดที่สูตรกลางที่เดียว ห้ามไปบวกลบเอาเองตามจุด
   ถ้าปล่อยให้ไหลเข้าสูตรโควตา เมนูจัดชุด 3 ไส้ที่ตั้ง incl 2 ไว้
   จะถูกเก็บเงินเพิ่มทันทีทั้งที่ลูกค้าไม่ได้เลือกอะไรเลย */
const setAddons = m => ((m && m.fix) || []).filter(Boolean).map(nm => ({ name:String(nm), price:0 }));
const isSetMenu = m => setAddons(m).length > 0;
/* ร้านจัดชุดใส่ทั้งคาวทั้งหวานทั้งซอสได้ ซึ่งยาวเกินกว่าจะโชว์ครบในรายการที่ไว้กวาดตา
   **ตัดเฉพาะที่เป็นรายการให้เลือก** (แถวเมนู) · บิลกับการ์ดออเดอร์ต้องโชว์ครบเสมอ
   เพราะนั่นคือสิ่งที่แม่ค้าอ่านตอนยืนทอด */
function fixText(names, max){
  const list = (names || []).map(x => (x && x.name) ? x.name : String(x));
  const m = max || 3;
  if(list.length <= m) return list.join(' · ');
  return list.slice(0, m).join(' · ') + ` และอีก ${list.length - m} อย่าง`;
}

function addonCost(m, addons){
  if(isSetMenu(m)) return 0;            // ร้านจัดไส้ให้แล้ว ไม่เก็บค่าไส้
  const list = addons || [];
  const incl = n(m && m.incl);
  if(incl > 0) return Math.max(0, list.length - incl) * n(m && m.extraTop);
  return list.reduce((s, a) => s + n(a.price), 0);
}

// ไส้ที่เกินโควตา — ใช้บอกแม่ค้ากับลูกค้าว่าเกินมากี่อย่าง
function addonOver(m, addons){
  if(isSetMenu(m)) return 0;           // เลือกเองไม่ได้ จึงไม่มีคำว่า "เกิน"
  const incl = n(m && m.incl);
  return incl > 0 ? Math.max(0, (addons || []).length - incl) : 0;
}

const lineTotal = l => (n(l.price) + addonCost(findMenu(l.menuId), l.addons)) * n(l.qty);
const orderTotal = () => (order ? order.lines : []).reduce((s,l) => s + lineTotal(l), 0);
const orderCount = () => (order ? order.lines : []).reduce((s,l) => s + n(l.qty), 0);

// กดเมนู: ถ้าบรรทัดล่าสุดเป็นเมนูเดียวกันและยังไม่ใส่ท็อปปิ้ง ให้บวกจำนวนแทนการเพิ่มบรรทัดใหม่
function tapMenu(id, backTo){
  const m = findMenu(id); if(!m || !order) return;
  const tops = menuAddons(m);
  const set  = isSetMenu(m);     // ร้านจัดไส้ไว้แล้ว ไม่ต้องเปิดกล่องให้ติ๊ก

  /* เมนูที่ไม่มีไส้ให้เลือก (หรือร้านจัดไส้ไว้แล้ว) กดซ้ำ = เพิ่มจำนวนในบรรทัดเดิม
     เมนูจัดชุดทุกจานไส้เหมือนกันอยู่แล้ว แตกบรรทัดไปก็ได้บรรทัดซ้ำเปล่า ๆ */
  if(!tops.length || set){
    const same = order.lines.find(l => l.menuId === id);
    if(same){ same.qty = n(same.qty) + 1; repaintOrder(); return; }
  }

  // เมนูที่มีไส้ กดแต่ละครั้ง = จานใหม่ที่เลือกไส้ของตัวเองได้
  // (เดิมไปบวกจำนวนให้บรรทัดเดิมที่ยังไม่มีไส้ ทำให้สั่งจานเดิมแต่คนละไส้ไม่ได้เลย)
  // อยากได้จานเหมือนเดิมเพิ่ม ให้กด + ที่บรรทัดในบิลแทน
  // ไส้ของเมนูจัดชุดต้องติดไปกับบรรทัดด้วย ไม่งั้นแม่ค้าอ่านบิลแล้วไม่รู้ว่าจานนี้ใส่อะไร
  const line = { lid: uid(), menuId:id, name:m.name, price:n(m.price), qty:1,
                 addons: set ? setAddons(m) : [] };
  order.lines.push(line);
  repaintOrder();
  if(tops.length && !set) lineAddons(line.lid, backTo);
}

// ไส้ของจานนี้ตรงกับอีกบรรทัดเป๊ะไหม — ใช้ชื่อไส้ที่เรียงแล้วเทียบ
const lineKey = l => l.menuId + '|' + (l.addons||[]).map(a => a.name).sort().join(',');

/* เลือกไส้เสร็จแล้ว ถ้าได้จานที่เหมือนบรรทัดอื่นเป๊ะ ให้ยุบรวมกัน
   ไม่งั้นกดเมนูเดิมแล้วเลือกไส้ชุดเดิม จะได้บรรทัดซ้ำสองอันในบิล */
function mergeSameLine(lid){
  if(!order) return;
  const l = order.lines.find(x => x.lid === lid); if(!l) return;
  const twin = order.lines.find(x => x.lid !== lid && lineKey(x) === lineKey(l));
  if(!twin) return;
  twin.qty = n(twin.qty) + n(l.qty);
  order.lines = order.lines.filter(x => x.lid !== lid);
}
function doneAddons(lid){ mergeSameLine(lid); repaintOrder(); }
function lineQty(lid, v){
  const l = order.lines.find(x => x.lid === lid); if(!l) return;
  l.qty = n(l.qty) + v;
  if(l.qty <= 0) order.lines = order.lines.filter(x => x.lid !== lid);
  repaintOrder();
}
function delLine(lid){ order.lines = order.lines.filter(x => x.lid !== lid); repaintOrder(); }

// ใส่ท็อปปิ้งให้บรรทัดนั้น
function lineAddons(lid, backTo){
  const l = order.lines.find(x => x.lid === lid); if(!l) return;
  const m = findMenu(l.menuId);
  const tops = menuAddons(m);
  /* เมนูจัดชุด: ไส้ถูกตั้งไว้แล้ว เปิดให้ติ๊กไม่ได้
     ไม่งั้นแม่ค้าแก้ไส้จานนี้ได้ แต่ลูกค้าที่สั่งผ่าน QR แก้ไม่ได้ ของกับราคาจะไม่ตรงกัน */
  if(isSetMenu(m)){
    openDialog({ icon:'ing', title:'เมนูนี้ร้านจัดไส้ไว้แล้ว', sub: m ? m.name : '',
      html:`<p style="margin:0;color:var(--ink-2)">จานนี้ใส่ <b>${esc(setAddons(m).map(a => a.name).join(' · '))}</b> ให้ทุกจาน ราคาเดียวจบ<br>
        อยากให้เลือกไส้เองได้ ไปที่ <b>ตั้งค่า</b> → แตะเมนูนี้ → <b>แก้ไข</b> แล้วเอาไส้ที่ร้านจัดให้ออกครับ</p>` });
    return;
  }
  if(!tops.length){
    openDialog({ icon:'ing', title:'เมนูนี้ยังไม่ได้ตั้งไส้', sub: m ? m.name : '',
      html:'<p style="margin:0;color:var(--ink-2)">ไปที่แท็บ <b>ตั้งค่า</b> → แตะเมนูนี้ → <b>ชุดไส้ที่ใส่ได้</b> แล้วติ๊กชุดไส้ที่ใช้ครับ</p>' });
    return;
  }
  // อ่านของที่เลือกใหม่ทุกครั้งที่วาด ไม่งั้นติ๊กแล้วปุ่มไม่เปลี่ยนสี
  const draw = () => openDialog({ icon:'ing',
    title:'เลือกไส้ / ท็อปปิ้ง',
    sub: topSumText(l),
    html: topsHTML(tops, new Set((l.addons||[]).map(a => a.name)), lid,
                   n((findMenu(l.menuId)||{}).incl) > 0),
    /* กากบาท / Esc = ยกเลิก
       มาจากทางลัด: ต้องกลับไปหน้าขายเลย และของที่เพิ่งกดต้องไม่ค้างอยู่ในบิล
       เดิมโผล่หน้าต่าง "สั่งสินค้า" ที่แม่ค้าไม่ได้สั่งให้เปิด ต้องกดปิดอีกรอบ
       แถมเมนูที่เพิ่งยกเลิกไปก็ยังนอนอยู่ในบิล (เจ้าของเจอเองกับตา)
       มาจากในหน้าต่างสั่งสินค้าอยู่แล้ว: กลับไปที่นั่นเหมือนเดิม ถูกแล้ว */
    onDismiss: () => {
      if(backTo){
        order = null; orderOpen = false;
        // พากลับหน้าที่กดมา เจ้าของเจอว่ากดจากแดชบอร์ดแล้วยกเลิก
        // มันทิ้งไว้ที่หน้าขายเฉย ๆ ทั้งที่ไม่ได้ตั้งใจจะมา
        if(backTo !== tab) go(backTo); else render();
        return;
      }
      mergeSameLine(lid);
      if(orderOpen) drawOrderDialog();
    },
    foot:[{label:'เสร็จแล้ว', cls:'primary wide', fn:`doneAddons('${lid}')`}]
  });
  l._draw = () => { draw(); paintOverWarn(l); };
  draw();
  paintOverWarn(l);      // กลับมาแก้ไส้ทีหลังแล้วยังเกินอยู่ ต้องเห็นเตือนทันที
}

// บรรทัดสรุปใต้หัวกล่อง บอกว่าตอนนี้เลือกอะไรไปแล้วบ้าง บวกเงินเท่าไร
function topSumText(l){
  const m = findMenu(l.menuId);
  const picked = l.addons || [];
  const incl = n(m && m.incl);

  // เมนูแบบโควตา (โตเกียว 2 ไส้) ต้องบอกตั้งแต่ยังไม่เลือกว่ารวมกี่อย่าง เกินแล้วคิดเท่าไหร่
  if(!picked.length)
    return incl > 0
      ? `${l.name} — ราคานี้รวมไส้ ${incl} อย่าง · เกินคิดเพิ่มอันละ ${baht(m.extraTop)} บาท`
      : `${l.name} — แตะของที่ลูกค้าเลือก เลือกได้หลายอย่าง`;

  const extra = addonCost(m, picked);
  const over  = addonOver(m, picked);
  const tail  = incl > 0
    ? ` · เลือก ${picked.length} จาก ${incl}` +
      (over ? ` · เกิน ${over} อย่าง +${baht(extra)} บาท` : ' · ยังไม่เกิน')
    : (extra ? ` · +${baht(extra)} บาท` : '');
  return picked.map(a => a.name).join(' · ') + tail;
}
/* แถบเตือน "เลือกเกินแล้วนะ" — ตัวหนังสือสีเทาใต้หัวกล่องมันจางเกินไป
   เจ้าของขอให้เตือนชัด ๆ ว่าต้องเก็บเงินเพิ่มเท่าไหร่
   คืนค่าว่างถ้าไม่ใช่เมนูโควตาหรือยังไม่เกิน จะได้ไม่รกตอนปกติ */
function overWarnHTML(m, addons, price, qty){
  const over = addonOver(m, addons);
  if(!over) return '';
  const add  = addonCost(m, addons);
  const each = n(price) + add;
  return `<div class="note warn">${icon('alert',17)}<span>
    <b>เลือกเกินมา ${over} อย่าง</b> — ต้องเก็บเงินเพิ่ม <b>${baht(add)} บาท</b><br>
    จานนี้เป็น <b>${baht(each)} บาท</b>${n(qty) > 1 ? ` × ${n(qty)} จาน = ${baht(each * n(qty))} บาท` : ''}
  </span></div>`;
}

// วาดแถบเตือนใหม่โดยไม่แตะส่วนอื่นของกล่อง จะได้ไม่เด้งกลับขึ้นบนตอนเลื่อนหาไส้
function paintOverWarn(l){
  const box = document.getElementById('topWarn');
  if(box) box.innerHTML = overWarnHTML(findMenu(l.menuId), l.addons, l.price, l.qty);
}

function pickLineTop(lid, name, btn){
  const l = order.lines.find(x => x.lid === lid); if(!l) return;
  const m = findMenu(l.menuId);
  const a = menuAddons(m).find(x => x.name === name);
  if(!a) return;
  const has = (l.addons||[]).some(x => x.name === name);
  l.addons = has ? l.addons.filter(x => x.name !== name)
                 : [...(l.addons||[]), {name:a.name, price:n(a.price)}];
  // เปลี่ยนสีตรงปุ่มที่กดเลย ไม่วาดกล่องใหม่ จะได้ไม่เด้งกลับไปบนสุดตอนเลื่อนหาไส้หวาน
  if(btn && btn.classList) btn.classList.toggle('on', !has);
  else if(l._draw) l._draw();
  const sub = document.getElementById('dlgSub');
  if(sub) sub.textContent = topSumText(l);
  paintOverWarn(l);
}

function payBill(){
  if(!order || !order.lines.length) return;
  const d = dayKey(), t = nowTime(), bill = uid();
  order.lines.forEach(l => {
    (db.sales = db.sales || []).push({
      id: uid(), bill, d, t,
      menuId: l.menuId, name: l.name, qty: n(l.qty),
      addons: (l.addons||[]).map(a => ({name:a.name, price:n(a.price)})),
      total: lineTotal(l)
    });
  });
  const paid = orderTotal();
  order = null; orderOpen = false; save();
  dlg.close(); render();
  toast(`รับเงินแล้ว ${baht(paid)} บาท`);

/* จำตำแหน่งเลื่อนของกล่องที่ส่งชื่อมา แล้วคืนให้หลังวาดใหม่
   ใช้ตอนที่ต้องสร้าง DOM ใหม่ทั้งก้อนแต่ไม่อยากให้ผู้ใช้เสียที่ที่เลื่อนไว้ */
function scrollOf(...sels){
  const saved = sels.map(s => {
    const el = document.querySelector(s);
    return [s, el ? el.scrollTop : 0];
  });
  return {
    restore(){
      saved.forEach(([s, top]) => {
        if(!top) return;
        const el = document.querySelector(s);
        if(el) el.scrollTop = top;
      });
    }
  };
}

/* ===================== หน้าขาย = รายการที่ขายไปแล้ววันนี้ ===================== */
// รวมรายการขายของวันนั้นเป็น "บิล"
function billsToday(key){
  const map = new Map();
  (db.sales||[]).filter(x => x.d === key).forEach(x => {
    const k = x.bill || x.id;
    const b = map.get(k) || {bill:k, t:x.t || '', lines:[], total:0, qty:0};
    b.lines.push(x); b.total += n(x.total); b.qty += n(x.qty);
    if((x.t||'') > b.t) b.t = x.t || b.t;
    map.set(k, b);
  });
  const mins = t => { const [h,m] = String(t||'').split(':').map(Number);
    return (isFinite(h) ? h : 0) * 60 + (isFinite(m) ? m : 0); };
  return [...map.values()].sort((a,b) => mins(b.t) - mins(a.t));
}

/* quota = เมนูนี้คิดแบบโควตาไหม (เช่น โตเกียว 2 ไส้)
   ถ้าใช่ **ห้ามโชว์ราคาต่อไส้บนชิป** เพราะ 2 อันแรกฟรี ไม่ได้คิดอันละ 5 ทุกอัน

function topsHTML(tops, picked, lid, quota){

/* ===================== ข้อความแจ้งหลังบันทึก / แก้ไข / ลบ =====================
   ทุกครั้งที่ข้อมูลถูกเปลี่ยนจริง ต้องมีข้อความบอก จะได้รู้ว่ากดติดแล้ว */
function cut(name, max){                 // ชื่อยาว ๆ ตัดให้พอดีข้อความแจ้ง
  const t = String(name || '').trim();
  if(!t) return '';
  return t.length > (max || 18) ? t.slice(0, max || 18) + '…' : t;
}
const savedMsg = (what, name, isNew) =>
  (isNew ? 'เพิ่ม' : 'แก้') + what + (name ? ' "' + cut(name) + '" ' : '') + 'แล้ว';
const delMsg = (what, name) => 'ลบ' + what + (name ? ' "' + cut(name) + '" ' : '') + 'แล้ว';

/* ข้อความแจ้งสั้น ๆ มุมล่าง */
let toastTimer = null;
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast'; el.className = 'toast';
    try{ el.setAttribute('popover', 'manual'); }catch(e){}
    document.body.appendChild(el);
  }
  el.textContent = msg;
  // ถ้ามีหน้าต่างเปิดอยู่ ต้องยกข้อความขึ้นชั้นบนสุดด้วย ไม่งั้นโดนบัง
  try{ if(el.showPopover && !el.matches(':popover-open')) el.showPopover(); }catch(e){}
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('on');
    setTimeout(() => { try{ if(el.hidePopover) el.hidePopover(); }catch(e){} }, 220);
  }, 2400);
}

/* ===================== หน้า "วันนี้" — หัวใจของแอป ===================== */
/* ===================== กราฟยอดขาย 7 วันล่าสุด =====================
   แท่งเดียวชุดเดียว (ยอดขายรายวัน) จึงไม่ต้องมีคำอธิบายสี
   วันนี้เน้นสีเข้ม วันอื่นสีอ่อน · ป้ายตัวเลขใส่เฉพาะวันนี้กับวันที่ขายดีสุด */
function lastNDays(key, count){
  const out = [];
  const [y,m,d] = key.split('-').map(Number);
  for(let i = count - 1; i >= 0; i--){
    const dt = new Date(y, m-1, d - i);
    const k = dayKey(dt);
    out.push(Object.assign({key:k, dow:dt.getDay()}, sumDay(k)));
  }
  return out;
}

// ปัดขึ้นเป็นเลขกลม ๆ สำหรับเส้นบนสุดของกราฟ
function niceTop(v){
  if(v <= 0) return 100;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v / (mag/2)) * (mag/2);
}

function chartBody(key, days){
  const maxSale = Math.max(...days.map(d => d.sale));
  if(maxSale <= 0) return '<div class="empty" style="padding:24px"><p style="margin:0">ยังไม่มียอดขายใน 7 วันนี้</p></div>';

  const top = niceTop(maxSale);
  const W = 340, H = 158;
  const padL = 10, padR = 10, padT = 30, base = 120, labelY = 139;
  const slot = (W - padL - padR) / days.length;
  const barW = Math.min(24, slot * 0.52);
  const best = days.reduce((a,b) => b.sale > a.sale ? b : a, days[0]);
  const DOW = ['อา','จ','อ','พ','พฤ','ศ','ส'];

  const bars = days.map((d,i) => {
    const x = padL + slot*i + (slot - barW)/2;
    const h = d.sale > 0 ? Math.max(3, (d.sale / top) * (base - padT)) : 0;
    const isToday = d.key === key;
    const fill = isToday ? 'var(--brand)' : 'var(--brand-l)';
    const showLabel = isToday || (d.key === best.key && best.sale > 0);
    const hitX = padL + slot*i;
    const open = `dayMoneyDialog('${d.key}')`;
    const say = `${thaiDate(d.key)} ขายได้ ${baht(d.sale)} บาท${d.exp ? ' ซื้อของ ' + baht(d.exp) + ' บาท' : ''} แตะเพื่อดูรายละเอียด`;
    return `<g class="cday" role="button" tabindex="0" aria-label="${esc(say)}"
         onclick="${open}"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${open}}">
      <title>${thaiDate(d.key)} — ขายได้ ${baht(d.sale)} บาท${d.exp ? ' · ซื้อของ ' + baht(d.exp) : ''} · แตะเพื่อดู</title>
      <rect class="cday-bg" x="${hitX.toFixed(1)}" y="${padT-16}" width="${slot.toFixed(1)}"
            height="${(labelY - padT + 22).toFixed(1)}" rx="8" fill="var(--soft)" opacity="0"/>
      ${h > 0 ? `<rect x="${x.toFixed(1)}" y="${(base-h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}"
            rx="4" ry="4" fill="${fill}"/>
        <rect x="${x.toFixed(1)}" y="${(base-4).toFixed(1)}" width="${barW.toFixed(1)}" height="4" fill="${fill}"/>`
        : `<rect x="${x.toFixed(1)}" y="${base-2}" width="${barW.toFixed(1)}" height="2" rx="1" fill="var(--line)"/>`}
      ${showLabel && h > 0 ? `<text x="${(x+barW/2).toFixed(1)}" y="${(base-h-9).toFixed(1)}"
            text-anchor="middle" font-size="11.5" font-weight="700"
            fill="var(--ink)">${baht(d.sale)}</text>` : ''}
      <text x="${(x+barW/2).toFixed(1)}" y="${labelY}" text-anchor="middle" font-size="10.5"
            font-weight="${d.key===key ? '800' : '600'}"
            fill="${d.key===key ? 'var(--ink)' : 'var(--muted)'}">${DOW[d.dow]}</text>
      <rect class="cday-hit" x="${hitX.toFixed(1)}" y="${padT-16}" width="${slot.toFixed(1)}"
            height="${(labelY - padT + 22).toFixed(1)}" fill="transparent" pointer-events="all"/>
    </g>`;
  }).join('');

  const avg = days.filter(d => d.sale > 0);
  const avgVal = avg.length ? avg.reduce((s,d) => s + d.sale, 0) / avg.length : 0;
  const avgY = base - (avgVal / top) * (base - padT);

  return `
    <div class="chart">
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img"

// เมนูขายดีของวันนั้น เรียงจากยอดเงินมากไปน้อย
function topMenus(key){
  const map = new Map();
  (db.sales||[]).filter(x => x.d === key).forEach(x => {
    const k = x.name || '(ไม่มีชื่อ)';
    const r = map.get(k) || {name:k, qty:0, baht:0};
    r.qty += n(x.qty); r.baht += n(x.total);
    map.set(k, r);
  });
  return [...map.values()].sort((a,b) => b.baht - a.baht);
}

// ไส้/ท็อปปิ้งที่ลูกค้าเพิ่มบ่อยที่สุดของวันนั้น
function topAddons(key){
  const map = new Map();
  (db.sales||[]).filter(x => x.d === key).forEach(x => {
    (x.addons||[]).forEach(a => {
      const r = map.get(a.name) || {name:a.name, qty:0};
      r.qty += n(x.qty);
      map.set(a.name, r);
    });
  });
  return [...map.values()].sort((a,b) => b.qty - a.qty);
}

// จำนวนบิลของวันนั้น (บิลเดียวอาจมีหลายรายการ)
function billsOf(key){
  const set = new Set();
  (db.sales||[]).filter(x => x.d === key).forEach(x => set.add(x.bill || x.id));
  return set.size;
}

// ช่วงเวลาที่ขายดี
const SLOTS = [['เช้า','ก่อน 11 โมง',0,11], ['กลางวัน','11 โมง–บ่าย 3',11,15],
               ['เย็น','บ่าย 3 เป็นต้นไป',15,24]];
function byTimeSlot(key){
  const out = SLOTS.map(([name,when]) => ({name, when, baht:0, qty:0}));
  (db.sales||[]).filter(x => x.d === key).forEach(x => {
    const h = parseInt(String(x.t||'0').slice(0,2), 10) || 0;
    const i = SLOTS.findIndex(([,,a,b]) => h >= a && h < b);
    if(i >= 0){ out[i].baht += n(x.total); out[i].qty += n(x.qty); }
  });
  return out;
}

// ค่าเฉลี่ยยอดขายของ N วันก่อนหน้า (ไม่นับวันนี้ และไม่นับวันที่ไม่ได้ขาย)
function avgSaleBefore(key, days){
  const list = allDays().filter(k => k < key).slice(0, days).map(k => sumDay(k).sale).filter(v => v > 0);
  if(!list.length) return 0;
  return list.reduce((a,b) => a + b, 0) / list.length;
}

// เส้นบาง ๆ พร้อมพื้นจาง ๆ จุดท้ายเน้นค่าปัจจุบัน
function sparkLine(vals, color, W, H){
  if(!vals.length) return '';
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const span = (max - min) || 1;
  const pad = 4;
  const x = i => pad + (W - pad*2) * (vals.length === 1 ? 0.5 : i / (vals.length - 1));
  const y = v => H - pad - ((v - min) / span) * (H - pad*2);
  const pts = vals.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area = `${pad},${H-pad} ${pts} ${(W-pad).toFixed(1)},${H-pad}`;
  const lx = x(vals.length-1), ly = y(vals[vals.length-1]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" aria-hidden="true">
    <polygon points="${area}" fill="${color}" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3.5" fill="${color}"
            stroke="var(--bg)" stroke-width="2"/>
  </svg>`;
}
// แท่งเล็ก ๆ แท่งสุดท้าย (วันนี้) เข้มกว่าเพื่อน
function miniBars(vals, color, W, H){
  if(!vals.length) return '';
  const max = Math.max(...vals, 1);
  const slot = W / vals.length, bw = Math.min(8, slot * 0.5);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" aria-hidden="true">
    ${vals.map((v,i) => {
      const h = Math.max(2, (v / max) * (H - 6));
      const bx = slot*i + (slot - bw)/2;
      return `<rect x="${bx.toFixed(1)}" y="${(H-h).toFixed(1)}" width="${bw.toFixed(1)}"
                height="${h.toFixed(1)}" rx="2" fill="${color}"
                opacity="${i === vals.length-1 ? 1 : .35}"/>`;
    }).join('')}
  </svg>`;
}

/* ===================== ส่วนบนของหน้าแรก =====================
   ค้นหา / ทางลัด / แถบวันในสัปดาห์ / การ์ดสถานะ / แถวเมนูขายดี
   ทั้งหมดวาดลงในเปลือกหน้าเว็บ (#homeTop) ไม่ได้อยู่ใน #view
   เพราะช่องค้นหาต้องไม่ถูกสร้างใหม่ทุกครั้งที่พิมพ์ ไม่งั้นคีย์บอร์ดเด้งปิด */

let dashDay = dayKey();        // วันที่แดชบอร์ดกำลังดูอยู่ แตะแถบวันเพื่อย้อนหลัง
/* ถาดวันเก็บวันไว้เป็นช่วงยาว ๆ ให้ลากย้อนได้เรื่อย ๆ ไม่ใช่ 7 ช่องตายตัว
   **ช่วงนี้เปลี่ยนให้น้อยที่สุด** ตราบใดที่วันที่เลือกยังอยู่ในช่วงเดิมก็ไม่ต้องวาดใหม่
   ไม่งั้นแตะวันทีหนึ่งถาดถูกสร้างใหม่ทั้งแถว วงแดงจะกระโดดแทนที่จะไหล
   และตำแหน่งที่แม่ค้าเลื่อนค้างไว้ก็หายทุกครั้ง */
const WK_SPAN = 90;            // ลากย้อนได้ราว 3 เดือน ไกลกว่านี้กดชื่อเดือนเปิดปฏิทินเร็วกว่า
let wkFrom = '', wkTo = '';
function wkSpan(){
  const today = dayKey();
  /* เปิดแอปค้างข้ามเที่ยงคืน (กันจอดับตอนรับออเดอร์) dashDay ยังเป็นเมื่อวาน
     แต่ "วันนี้" ขยับไปแล้ว ถ้าคืนช่วงเดิม ถาดจะไม่มีช่องของวันนี้ให้กด
     จึงต้องคิดใหม่เมื่อปลายช่วงตามไม่ทันวันนี้ (เว้นแต่ปลายช่วงยังไม่ถูกตัดที่วันนี้) */
  if(wkFrom && dashDay >= addDays(wkFrom, 7) && dashDay <= wkTo
     && (wkTo >= today || wkTo >= addDays(dashDay, WK_SPAN))) return [wkFrom, wkTo];
  wkFrom = addDays(dashDay, -WK_SPAN);
  wkTo   = addDays(dashDay, WK_SPAN);
  if(wkTo > today) wkTo = today;
  return [wkFrom, wkTo];
}
let homeQ   = '';              // คำค้นบนหน้าแรก

const DOW_TH = ['จ','อ','พ','พฤ','ศ','ส','อา'];

function addDays(key, step){
  const [y,m,d] = key.split('-').map(Number);
  return dayKey(new Date(y, m-1, d + step));
}
// จันทร์ = 0 ให้ตรงกับลำดับใน DOW_TH (ของเบราว์เซอร์เริ่มที่อาทิตย์)
function dowIdx(key){
  const [y,m,d] = key.split('-').map(Number);
  return (new Date(y, m-1, d).getDay() + 6) % 7;
}
// จันทร์–อาทิตย์ ของสัปดาห์ที่วันนั้นอยู่
function weekOf(key){
  const [y,m,d] = key.split('-').map(Number);
  const shift = (new Date(y, m-1, d).getDay() + 6) % 7;   // 0 = จันทร์
  return Array.from({length:7}, (_,i) => dayKey(new Date(y, m-1, d - shift + i)));
}
// ชื่อวันที่อ่านง่าย ใช้ในหัวการ์ดที่เปลี่ยนตามวันที่เลือก
function dayLabel(key){
  if(key === dayKey()) return 'วันนี้';
  if(key === addDays(dayKey(), -1)) return 'เมื่อวาน';
  return thaiDate(key);
}
// รูปที่เอาไปต่อท้ายคำได้เลย เช่น "บิล" + ofDay → "บิลวันนี้" / "บิลวันที่ 28 ต.ค."
function ofDay(key){
  const l = dayLabel(key);
  return (l === 'วันนี้' || l === 'เมื่อวาน') ? l : 'วันที่ ' + l;
}

function wkHTML(){

/* วาดแถบวันใหม่เฉพาะตอนเปลี่ยนสัปดาห์ อยู่สัปดาห์เดิมก็แค่สลับคลาส
   เหตุผลเดียวกับแถบเมนูล่าง — ถ้าสร้าง element ใหม่ วงแดงจะกระโดดทันที
   ไม่มีสถานะเดิมให้ CSS ไหลออกมา และ :active ก็ไม่มีโอกาสแสดง */
/* เลื่อนถาดให้วันที่เลือกมาอยู่กลาง — ไม่งั้นกระโดดไปวันไกล ๆ แล้วมองไม่เห็นว่าอยู่ตรงไหน */
function centerWkRow(row, smooth){
  if(!row) return;
  const on = row.querySelector('.wk-d.on');
  if(!on) return;
  const left = on.offsetLeft - row.clientWidth / 2 + on.offsetWidth / 2;
  try{ row.scrollTo({ left, behavior: (smooth && !reduceMotion()) ? 'smooth' : 'auto' }); }
  catch(e){ row.scrollLeft = left; }
}

let wkPainted = '';    // วันที่วงแดงอยู่ตอนวาดรอบก่อน ใช้ดูว่าต้องเลื่อนถาดตามไหม
function paintWeek(){
  const box = document.getElementById('wkStrip');
  if(!box) return;
  const week = wkSpan().join();          // คีย์คือ "ช่วงวันในถาด" ไม่ใช่สัปดาห์แล้ว
  if(box.dataset.week !== week){
    box.innerHTML = wkHTML();
    box.dataset.week = week;
    wkPainted = dashDay;
    centerWkRow(box.querySelector('.wk-row'), false);   // เพิ่งสร้าง ยังไม่มีอะไรให้ค่อย ๆ เลื่อน
    return;
  }
  // ช่วงเดิม: ย้ายวงแดงกับจุดบอกว่ามีบันทึก โดยไม่แตะโครง
  box.querySelectorAll('.wk-d').forEach(el => {
    const k = el.dataset.day;
    el.classList.toggle('on', k === dashDay);
    const dot = el.querySelector('.dot');
    if(dot) dot.classList.toggle('off', !hasRecord(k));
  });
  // เปลี่ยนวันเอง (กดลูกศร / เลือกจากปฏิทิน) ให้ถาดไหลตามไปหา
  if(wkPainted !== dashDay){
    wkPainted = dashDay;
    centerWkRow(box.querySelector('.wk-row'), true);
  }
}

/* ชื่อเดือนบนหัวต้องวิ่งตามวันที่เลื่อนไปเห็น
   ไม่งั้นลากย้อนไปถึง ก.ย. แล้วหัวยังเขียน พ.ย. ค้างอยู่ อ่านแล้วงง
   ดักที่ชั้นนอกสุดเพราะ scroll ไม่ลอยขึ้นมาเอง · หน่วงด้วยเฟรมภาพ ไม่งั้นคิดทุกพิกเซลที่เลื่อน */
let wkTick = 0;
document.addEventListener('scroll', e => {
  const row = e.target;
  if(!row || !row.classList || !row.classList.contains('wk-row')) return;
  if(wkTick) return;
  wkTick = requestAnimationFrame(() => {
    wkTick = 0;
    const head = row.parentElement && row.parentElement.querySelector('.wk-mt');
    if(!head) return;
    const mid = row.scrollLeft + row.clientWidth / 2;
    let best = null, gap = Infinity;
    row.querySelectorAll('.wk-d').forEach(el => {
      const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
      if(d < gap){ gap = d; best = el; }
    });
    /* **วันที่เลือกอยู่ ถ้ายังเห็นอยู่ในถาด ให้ยึดเดือนของมันก่อน**
       บนจอคอมถาดกว้างมาก เห็นทีละ 20 วัน จุดกึ่งกลางเลยไปตกเดือนก่อน
       แล้วหัวเขียน "ต.ค." ทั้งที่วงแดงอยู่ที่ 6 พ.ย. — อ่านแล้วขัดกันเอง */
    const on = row.querySelector('.wk-d.on');
    if(on){
      const x = on.offsetLeft + on.offsetWidth / 2;
      if(x > row.scrollLeft && x < row.scrollLeft + row.clientWidth) best = on;
    }
    if(best) head.textContent = thaiMonth(monthKey(best.dataset.day));
  });
}, true);

function pickDay(k){
  if(k > dayKey()) return;
  dashDay = k;
  histMonth = monthKey(k);    // การ์ดสรุปเดือนบนหน้าย้อนหลังเดินตามวันที่เลือกด้วย
  render();
}
function shiftWeek(step){
  // ไปข้างหน้าได้ไม่เกินสัปดาห์ที่มีวันนี้อยู่ — เงื่อนไขเดียวกับที่ปิดปุ่มลูกศร
  if(step > 0 && addDays(weekOf(dashDay)[0], 7) > dayKey()) return;
  const next = addDays(dashDay, step * 7);
  pickDay(next > dayKey() ? dayKey() : next);
}

/* ---------- ปัดนิ้วซ้าย-ขวาในปฏิทินเพื่อเปลี่ยนเดือน ----------
   **ถาดวันไม่ใช้ตัวนี้แล้ว** มันเลื่อนเองด้วยการเลื่อนของเบราว์เซอร์ ซึ่งลื่นกว่ามาก
   ถ้ายังดักปัดทับไว้ด้วย พอสะบัดถาดแล้วปล่อย มันจะกระโดดสัปดาห์ให้อีกต่อหนึ่ง
   เหลือไว้เฉพาะปฏิทิน เพราะตารางเดือนเลื่อนเองไม่ได้ */
const SWIPE_MIN = 40;          // ต้องลากไกลกว่านี้ถึงนับว่าปัด ไม่งั้นแค่แตะก็เปลี่ยนเดือน
const SWIPE_DO = { cal: step => calShift(step) };
let swFrom = null, swAte = false;

document.addEventListener('pointerdown', e => {
  swAte = false;               // เริ่มนิ้วใหม่ = ล้างธงเก่าทิ้งเสมอ ไม่งั้นค้างไปกินคลิกถัดไป
  const box = e.target.closest && e.target.closest('[data-swipe]');
  swFrom = box ? { box, x:e.clientX, y:e.clientY } : null;
}, { passive:true });

document.addEventListener('pointerup', e => {
  const from = swFrom; swFrom = null;
  if(!from) return;
  const dx = e.clientX - from.x, dy = e.clientY - from.y;
  // แนวตั้งมากกว่า = เขากำลังเลื่อนหน้าจอ ไม่ใช่ปัดเปลี่ยนวัน ต้องปล่อยผ่าน
  if(Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy) * 1.4) return;
  swAte = true;                // ปัดจบตรงปุ่มวันพอดี เบราว์เซอร์จะยิง click ตามมา ต้องกินทิ้ง
  const go = SWIPE_DO[from.box.dataset.swipe];
  if(go) go(dx < 0 ? 1 : -1);  // ลากไปทางซ้าย = ดูของถัดไป
}, { passive:true });

document.addEventListener('pointercancel', () => { swFrom = null; }, { passive:true });
// ดักตั้งแต่ชั้นนอกสุด ไม่งั้นปัดทีหนึ่งได้ทั้งเปลี่ยนสัปดาห์และเลือกวันที่นิ้วไปหยุดทับ
document.addEventListener('click', e => {
  if(!swAte) return;
  swAte = false;
  e.stopPropagation(); e.preventDefault();
}, true);
/* ---------- ปฏิทินเต็มเดือน ----------
   เจ้าของขอมาเอง: "ตรงเดือนให้สามารถเป็นแบบปฏิทินได้"
   ของเดิมเป็นรายชื่อเดือนให้กด ซึ่งไปได้แค่เดือนที่เคยมีบันทึก
   และยังต้องมาไล่หาวันในแถบ 7 ช่องอีกที ตอนนี้เห็นทั้งเดือนแล้วแตะวันได้เลย */
let calMon = '';       // เดือนที่ปฏิทินกำลังเปิดดูอยู่ (คนละตัวกับวันที่เลือกไว้)

function monthPick(){
  calMon = monthKey(dashDay);
  openDialog({ icon:'today',
    title:'เลือกวัน',
    sub:'แตะวันไหนก็ได้ · ปัดซ้าย-ขวาเพื่อเปลี่ยนเดือน',
    html:`<div id="calBox" data-swipe="cal">${calHTML()}</div>`,
    foot:[{label:'ปิด', cls:'ghost', fn:'dlg.close()'},
          {label:'วันนี้', cls:'primary', fn:`jumpDay('${dayKey()}')`}]
  });
}

function calHTML(){
  const today = dayKey();
  const [y, m] = calMon.split('-').map(Number);
  const lead = (new Date(y, m-1, 1).getDay() + 6) % 7;   // 0 = จันทร์ ให้ตรงกับแถบวันบนหน้าแรก
  const len  = new Date(y, m, 0).getDate();              // วันที่ 0 ของเดือนถัดไป = วันสุดท้ายของเดือนนี้
  const sum  = sumMonth(calMon);
  const cells = [];
  for(let i = 0; i < lead; i++) cells.push('<span class="cal-x"></span>');
  for(let d = 1; d <= len; d++){
    const k = `${calMon}-${pad2(d)}`;
    cells.push(`<button type="button" class="cal-d${k === dashDay ? ' on' : ''}${
      k === today ? ' today' : ''}" ${k > today ? 'disabled' : ''}
      data-day="${k}" onclick="jumpDay('${k}')" aria-label="${thaiDate(k, true)}">
      <span class="cal-n">${d}</span>
      <span class="dot${hasRecord(k) ? '' : ' off'}"></span>
    </button>`);
  }
  return `
    <div class="cal-head">
      <button type="button" class="cal-nav" onclick="calShift(-1)" aria-label="เดือนก่อนหน้า">${icon('back',16)}</button>
      <b>${thaiMonth(calMon)}</b>
      <button type="button" class="cal-nav" onclick="calShift(1)"
              ${calMon < monthKey(today) ? '' : 'disabled'} aria-label="เดือนถัดไป">${icon('chev',16)}</button>
    </div>
    <div class="cal-dow">${DOW_TH.map((d,i) => `<span${i === 6 ? ' class="sun"' : ''}>${d}</span>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    <p class="cal-sum">${sum.days
      ? `เดือนนี้ขายได้ <b>${baht(sum.sale)}</b> บาท · มีบันทึก ${sum.days} วัน`
      : 'เดือนนี้ยังไม่มีบันทึกสักวัน'}</p>`;
}

/* เปลี่ยนเดือนแล้ววาดเฉพาะในกล่อง ไม่เปิดกล่องใหม่
   ไม่งั้นกล่องจะเล่นภาพเปิด-ปิดใหม่ทุกครั้งที่กดลูกศร ตาลาย */
function calShift(step){
  const [y, m] = calMon.split('-').map(Number);
  const d = new Date(y, m-1+step, 1);
  const mk = `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  if(mk > monthKey(dayKey())) return;        // ยังไม่ถึงเดือนนั้น ไม่ต้องให้ไปดู
  calMon = mk;
  const box = document.getElementById('calBox');
  if(box) box.innerHTML = calHTML();
}

function jumpDay(k){
  if(k > dayKey()) return;
  dlg.close(); pickDay(k);
}
/* ตารางของที่ซื้อมา — **โชว์เฉพาะที่แอปรู้จริง** (เจ้าของเลือกเอง)
   ในภาพตัวอย่างมีคอลัมน์ "คงเหลือ 12.5 กก." กับป้าย "ใกล้หมด"
   **แอปไม่ได้นับสต็อกเลย** ของที่ซื้อมาเก็บแค่ซื้อมาเท่าไหร่/จ่ายเท่าไหร่ ไว้คิดต้นทุนต่อหน่วย
   ใส่ไปก็เป็นเลขมั่ว แล้วแม่ค้าจะวางแผนซื้อของผิด
   **ต้นทุนเป็นข้อมูลของคนดูแล** หน้าของที่ซื้อมาถูกล็อกด้วยรหัสอยู่แล้ว
   เอามาโชว์บนหน้าแรกแบบไม่ล็อก = คนที่ยืนอยู่หน้าร้านเห็นต้นทุนหมด */
function ingTableHTML(){
  if(hasPin() && !isAdmin()) return '';
  const list = (db.ingredients || []).slice(0, 8);
  if(!list.length) return '';
  const usedIn = id => (db.menus || []).filter(m => (m.items || []).some(it => it.ingId === id)).length;
  return `<div class="card hd-t">
    ${cardHead('ing', 'ของที่ซื้อมา', `ต้นทุนต่อหน่วยที่แอปคิดให้จากบิลที่กรอกไว้`)}
    <div class="hd-tb">
      <div class="hd-th"><span>รายการ</span><span>ซื้อมา</span><span>ต้นทุนต่อหน่วย</span><span>ใช้ในเมนู</span></div>
      ${list.map(ing => `<div class="hd-tr">

/* ---------- การ์ดสถานะของวันที่เลือก ---------- */
function srow(cls, ic, title, sub, act, fn){
  return `<div class="srow ${cls}">
    <span class="srow-ic">${icon(ic,22)}</span>
    <div class="srow-t"><b>${title}</b><span>${sub}</span></div>
    ${act ? `<button type="button" class="srow-a" onclick="${fn}">${act}</button>` : ''}
  </div>`;
}
function statusHTML(){
  const key = dashDay, today = dayKey();
  const d = sumDay(key), bills = billsOf(key);
  if(key !== today){
    return srow('flat','hist', thaiDate(key, true),
      bills ? `${bills} บิล · ขายได้ ${baht(d.sale)} บาท` : 'วันนั้นไม่มีบันทึกการขาย',
      'กลับมาวันนี้', `pickDay('${today}')`);
  }
  if(!db.shopOpen)
    return srow('warn','store','ตอนนี้ร้านปิดอยู่','เปิดร้านก่อนแล้วค่อยเริ่มเปิดบิล','เปิดร้าน','toggleShopOpen()');
  if(!bills)
    return srow('flat','cart','ยังไม่ได้ขายอะไรวันนี้','ร้านเปิดอยู่ · กดเปิดบิลได้เลย','เปิดบิล',"go('sale')");
  return srow('','check', `วันนี้ขายแล้ว ${bills} บิล`,
    `ขายได้ ${baht(d.sale)} · ${d.net >= 0 ? 'เหลือ' : 'ขาดทุน'} ${baht(Math.abs(d.net))} บาท`,
    'ดู', `dayMoneyDialog('${key}')`);
}

/* สะกิดเรื่องสำรองข้อมูล — ว่างเปล่าเมื่อเพิ่งสำรองไป หรือยังไม่มีอะไรจะเสีย */
/* ปิดเมนูไว้แล้วต้องเห็นบนหน้าแรกตลอด **ไม่งั้นลืมว่าปิดค้างไว้**
   ของมาเพิ่มกลางวันแล้วอยากเปิดคืน จะได้กดได้เลยไม่ต้องไปหาในตั้งค่า
   หายเองเมื่อไม่มีอะไรปิดอยู่ (และพรุ่งนี้หายเองอยู่แล้วเพราะธงเป็นวันที่) */
function soldOutWarnHTML(){
  const off  = soldOutList().map(m => m.name);
  const tops = topOutNames();          // ไส้ที่ปิดไว้ก็ต้องสะกิด ไม่งั้นลืมว่าปิดค้าง
  const all  = [...off, ...tops];
  if(!all.length) return '';
  const what = off.length && tops.length ? `${off.length} เมนู · ${tops.length} ไส้`
             : off.length ? `${off.length} อย่าง` : `${tops.length} ไส้`;
  return srow('warn', 'alert', `ปิดขายอยู่ ${what}`, all.join(' · '), 'แก้', 'soldOutDialog()');
}

function backupWarnHTML(){
  if(!hasWorthKeeping()) return '';
  const d = daysSinceBackup();
  if(d !== null && d < BK_NAG_DAYS) return '';
  return srow('warn', 'box',
    d === null ? 'ยังไม่เคยสำรองข้อมูล' : `ไม่ได้สำรองข้อมูล ${d} วัน`,
    'มือถือหาย = ข้อมูลหายหมด',
    'สำรองเลย', 'openBackup()');
}

  // เอา 6 อันดับพอ ตาราง 8 แถวยาวเกินกว่าจะกวาดตาทีเดียว
  const top = topMenus(dashDay).slice(0,6);

    ? top.map(m => ({ name:m.name, qty:m.qty, baht:m.baht,
                      id:(db.menus.find(x => x.name === m.name) || {}).id }))

  const topBaht = Math.max(...list.map(m => n(m.baht)), 1);

    <div class="home-sec">

      <button type="button" onclick="go('sale')">เปิดบิล</button>

    <div class="hil">${plates ? `<div class="hil-cap">${plates} จาน · แตะเมนูเพื่อเปิดบิลเลย</div>` : ''}
      ${list.map((m,i) => `
      <button type="button" class="hil-b" ${m.id ? `onclick="hilTap('${jsq(m.id)}')"` : 'disabled'}>
        <span class="hil-no${i === 0 && top.length ? ' top' : ''}">${i+1}</span>
        <span class="hil-n">${esc(m.name || '(ไม่มีชื่อ)')}</span>
        <span class="hil-v">${m.baht ? baht(m.baht) : '—'}<span>${m.qty ? m.qty + ' จาน' : 'ยังไม่ขาย'}</span></span>
        <span class="hil-m"><i style="width:${clamp(n(m.baht) / topBaht * 100, m.baht ? 4 : 0, 100)}%"></i></span>
      </button>`).join('')}</div>`;
}

    ${grp(`ของที่ซื้อมา · ${ings.length}`, ings.map(x => `
      <div class="li" role="button" tabindex="0" onclick="clearSearch(); go('ing')"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();clearSearch();go('ing')}">
        <span class="av">${esc(initial(x.name))}</span>

/* ---------- แท็บย่อยในหน้า ใช้ซ้ำได้ทุกหน้า =====================
   วาดทุกแผงไว้ตั้งแต่แรกแล้วสลับด้วย CSS ไม่ได้วาดใหม่ตอนกด
   เลยไม่เสียตำแหน่งสกรอลล์และไม่ต้องคิดเลขซ้ำ */
const segs = { dash:'sale', setup:'shop', exp:'day' };     // แต่ละหน้าจำแท็บย่อยที่เปิดค้างไว้
const segOn = (bar, key) => segs[bar] === key;

// แถบแท็บย่อย — items เป็น [คีย์, ชื่อ, ไอคอน]
function segBar(bar, items){
  return `<div class="dseg">${items.map(([k,label,ic]) => `
    <button type="button" class="dseg-b${segOn(bar,k) ? ' on' : ''}" data-sb="${bar}" data-seg="${k}"
            onclick="setSeg('${bar}','${k}')">${ic ? icon(ic,15) : ''}${label}</button>`).join('')}</div>`;
}
// แผงเนื้อหาของแท็บย่อยหนึ่งอัน (cls = 'dash' ถ้าอยากให้การ์ดเรียงเป็นกริด)
function segPane(bar, key, inner, cls){
  // เรียงคลาสให้เหมือนกับที่แดชบอร์ดเขียนไว้: [กริด] dpane [on]
  const c = [cls === undefined ? 'dash' : cls, 'dpane', segOn(bar,key) ? 'on' : ''].filter(Boolean).join(' ');
  return `<div class="${c}" data-sb="${bar}" data-seg="${key}">${inner}</div>`;
}
function setSeg(bar, key){
  const prev = segs[bar];
  segs[bar] = key;

  // แผงทุกใบวาดไว้อยู่แล้ว ลำดับใน DOM คือลำดับบนแถบชิป ใช้ดูทิศได้เลย
  const panes = [...document.querySelectorAll('.dpane[data-sb="' + bar + '"]')];
  const order = panes.map(p => p.dataset.seg);
  const dir = order.indexOf(key) > order.indexOf(prev) ? 'swap-r' : 'swap-l';

  document.querySelectorAll('[data-sb="' + bar + '"][data-seg]')
    .forEach(el => el.classList.toggle('on', el.dataset.seg === key));

  // ให้แผงที่เพิ่งโผล่เลื่อนเข้ามาทางเดียวกับที่นิ้วกด เหมือนตอนเปลี่ยนแท็บล่าง
  const now = panes.find(p => p.dataset.seg === key);
  if(now && prev !== key) playSwap(now, dir);
}

/* เล่นแอนิเมชันเลื่อนเข้าให้ element หนึ่งตัว
   ต้องล้างคลาสเก่าแล้วบังคับ reflow ก่อน ไม่งั้นเบราว์เซอร์มองว่าเป็นอนิเมชันเดิมและไม่เล่นซ้ำ */
function playSwap(el, cls){
  if(!el || !el.classList) return;
  el.classList.remove('swap','swap-r','swap-l');
  void el.offsetWidth;
  el.classList.add(cls);
}

/* ---------- บันทึกการขาย (เลือกเมนู + ท็อปปิ้ง) ---------- */
let saleDraft = null;

function saleDialog(existing){
  if(!db.menus.length){
    openDialog({ icon:'menu', title:'ยังไม่มีเมนู', sub:'ใส่เมนูที่ขายก่อน แล้วค่อยมาบันทึกการขาย',
      html:'<p style="margin:0;color:var(--ink-2)">ไปที่แท็บ <b>ตั้งค่า</b> แล้วกดปุ่ม <b>เพิ่ม</b> ในการ์ดเมนู เพื่อใส่ชื่อกับราคาขายก่อนครับ</p>' });
    return;
  }
  const first = db.menus[0];
  // รายการเก่าอาจชี้ไปเมนูที่ถูกลบหรือถูกแทนที่ไปแล้ว ต้องหาเมนูที่ใกล้เคียงให้ ไม่งั้นกดบันทึกแล้วเงียบ
  let mid = existing ? existing.menuId : first.id;
  let gone = false;
  if(!findMenu(mid)){
    const byName = db.menus.find(x => existing && x.name === existing.name);
    mid = byName ? byName.id : first.id;
    gone = true;
  }
  saleDraft = existing
    ? { menuId: mid, qty: n(existing.qty) || 1,
        picked: new Set((existing.addons||[]).map(a => a.name)),
        id: existing.id, t: existing.t, d: existing.d,
        oldName: gone ? (existing.name || '') : '' }
    : { menuId: mid, qty: 1, picked: new Set() };
  renderSaleDialog();
}

function saleTotal(){
  const m = findMenu(saleDraft.menuId);
  if(!m) return 0;
  // ใช้สูตรกลางตัวเดียวกับบิลหน้าร้าน ไม่งั้นแก้ย้อนหลังแล้วได้ราคาคนละอย่าง
  const picked = menuAddons(m).filter(a => saleDraft.picked.has(a.name));
  return (n(m.price) + addonCost(m, picked)) * n(saleDraft.qty);
}

function renderSaleDialog(){
  const m = findMenu(saleDraft.menuId) || db.menus[0];
  const tops = menuAddons(m);
  openDialog({ icon:'cart',
    title: saleDraft.id ? 'แก้รายการขาย' : 'บันทึกการขาย',
    sub: saleDraft.oldName
      ? `เมนูเดิม "${saleDraft.oldName}" ไม่มีในร้านแล้ว — เลือกเมนูที่ใช้แทนด้านล่าง`
      : 'เลือกเมนู ใส่จำนวน แล้วติ๊กไส้ที่ลูกค้าเพิ่ม',
    html: `
      <div class="sec" style="margin-top:0">ขายอะไร</div>
      <div class="pills">${db.menus.map(x => `
        <button type="button" class="pill${x.id === saleDraft.menuId ? ' on' : ''}" onclick="pickMenu('${x.id}')">
          ${esc(x.name || '(ไม่มีชื่อ)')}<b>${baht(x.price)}</b>
        </button>`).join('')}</div>

      <div class="sec">กี่จาน</div>
      <div class="stepper">
        <button type="button" onclick="bumpQty(-1)" aria-label="ลด">−</button>
        <span id="saleQty">${n(saleDraft.qty)}</span>
        <button type="button" onclick="bumpQty(1)" aria-label="เพิ่ม">+</button>
      </div>

      ${isSetMenu(m) ? `<p class="hint">เมนูนี้ร้านจัดไส้ไว้แล้ว: <b>${esc(setAddons(m).map(a => a.name).join(' · '))}</b> — ราคาเดียว เลือกไส้เองไม่ได้</p>`
      : tops.length ? `<div class="sec">ท็อปปิ้งที่เพิ่ม</div>
      <div class="tops">${tops.map(a => `
        <button type="button" class="top${saleDraft.picked.has(a.name) ? ' on' : ''}" onclick="toggleTop('${jsq(a.name)}')">
          ${esc(a.name)}${n((findMenu(saleDraft.menuId)||{}).incl) > 0 ? ''
            : ` <b>${n(a.price) > 0 ? '+' + baht(a.price) : 'ฟรี'}</b>`}
        </button>`).join('')}</div>`
      : `<p class="hint">เมนูนี้ยังไม่ได้ตั้งไส้ — ตั้งได้ที่แท็บ <b>ตั้งค่า</b></p>`}

      <div class="dlg-live" style="margin-top:18px" id="saleSum">รวม ${baht(saleTotal())} บาท</div>`,
    foot: [
      {label:'ยกเลิก', cls:'ghost', fn:'dlg.close()'},
      {label: saleDraft.id ? 'บันทึกการแก้ไข' : 'บันทึก', cls:'primary', fn:'commitSale()'},
      ...(saleDraft.id ? [{label:'ลบ', cls:'danger', fn:`dlg.close(); delEntry('sale','${saleDraft.id}')`}] : [])
    ]
  });
}
function pickMenu(id){ saleDraft.menuId = id; saleDraft.picked = new Set(); renderSaleDialog(); }
function bumpQty(v){
  saleDraft.qty = Math.max(1, n(saleDraft.qty) + v);
  const q = document.getElementById('saleQty'); if(q) q.textContent = saleDraft.qty;
  const t = document.getElementById('saleSum'); if(t) t.textContent = 'รวม ' + baht(saleTotal()) + ' บาท';
}
function toggleTop(name){
  if(saleDraft.picked.has(name)) saleDraft.picked.delete(name); else saleDraft.picked.add(name);
  renderSaleDialog();
}
function commitSale(){
  const m = findMenu(saleDraft.menuId);
  if(!m) return toast('เลือกเมนูก่อนนะครับ');
  // เมนูจัดชุด: ไส้ที่ร้านตั้งไว้ต้องถูกบันทึกลงยอดขายด้วย ไม่งั้นย้อนดูแล้วไม่รู้ว่าขายอะไรไป
  const addons = isSetMenu(m)
    ? setAddons(m)
    : menuAddons(m).filter(a => saleDraft.picked.has(a.name))
                   .map(a => ({name:a.name, price:n(a.price)}));
  const rec = {
    id: saleDraft.id || uid(),
    d: saleDraft.d || dayKey(),
    t: saleDraft.t || nowTime(),
    menuId: m.id, name: m.name, qty: n(saleDraft.qty),
    addons, total: saleTotal()
  };
  const i = (db.sales||[]).findIndex(x => x.id === rec.id);
  const iBefore = (db.sales||[]).length;
  if(i >= 0) db.sales[i] = rec; else (db.sales = db.sales||[]).push(rec);
  const wasEdit = !!saleDraft.id && (db.sales||[]).length === iBefore;
  saleDraft = null; save(); dlg.close(); render();
  toast((wasEdit ? 'แก้รายการขาย' : 'บันทึกการขาย') + ' "' + cut(rec.name) + '" แล้ว ฿' + baht(rec.total));
}

function expenseDialog(existing){

    sub: 'ซื้อของเข้าร้าน ค่าแก๊ส ค่าเดินทาง ฯลฯ',

      {k:'note', label:'ซื้ออะไร', type:'text', value: existing ? existing.note : '',
       placeholder:'เช่น แป้ง 2 ถุง + ไข่ 1 แผง', wide:true},
      {k:'amount', label:'กี่บาท', type:'number', value: existing ? existing.amount : '', wide:true}
    ],
    check: v => !v.note.trim() ? 'ใส่ด้วยว่าซื้ออะไร'
              : !(v.amount > 0) ? 'จำนวนเงินต้องมากกว่า 0' : null,

/* ---------- แตะรายการเพื่อแก้ / ลบ ---------- */
function editEntry(kind, id){
  if(kind === 'sale'){
    const e = (db.sales||[]).find(x => x.id === id);
    if(e) saleDialog(e);
  }else{
    const e = (db.expenses||[]).find(x => x.id === id);
    if(e) expenseDialog(e);
  }
}
function delEntry(kind, id){
  if(!adminOk(() => delEntry(kind, id))) return;
  const isSale = kind === 'sale';
  const gone = (isSale ? (db.sales||[]) : (db.expenses||[])).find(x => x.id === id);
  if(isSale) db.sales = (db.sales||[]).filter(x => x.id !== id);
  else db.expenses = (db.expenses||[]).filter(x => x.id !== id);
  save(); render();
  toast(delMsg(isSale ? 'รายการขาย' : 'รายจ่าย', gone ? (isSale ? gone.name : gone.note) : ''));
}

let histMonth = null;              // เดือนที่กำลังดู null = เดือนล่าสุดที่มีข้อมูล
let histSort = 'date';             // 'date' = วันใหม่ก่อน, 'net' = กำไรเยอะก่อน
let histOnlyBig = false;           // ดูเฉพาะวันที่ขายเกินเกณฑ์

function allMonths(){
  return [...new Set(allDays().map(monthKey))].sort().reverse();
}
function curMonth(){
  // เลือกเดือนเองแล้วให้ยึดอันนั้น แม้เดือนนั้นยังไม่มีบันทึก จะได้ตรงกับแถบวันด้านบน
  if(histMonth) return histMonth;
  return allMonths()[0] || monthKey(dayKey());
}
function setHistSort(v){ histSort = v; render(); }
function toggleHistBig(){ histOnlyBig = !histOnlyBig; render(); }

// เกณฑ์ "ขายดี" = ยอดเฉลี่ยต่อวันปัดขึ้นหลักร้อย
function bigDayCut(keys){
  if(!keys.length) return 0;
  const avg = keys.reduce((a,k) => a + sumDay(k).sale, 0) / keys.length;
  return Math.max(100, Math.round(avg / 100) * 100);
}

  </div>

  <div class="card">
    ${cardHead('hist','แต่ละวันขายได้เท่าไหร่','แท่งยาว = วันนั้นขายดี · แตะเพื่อดูรายการของวันนั้น')}

        <span class="dayx-top">

// สรุปสามบรรทัด: เข้า / ออก / เหลือ
function moneyBox(sale, exp){
  const net = sale - exp;
  return `<div class="mbox">
    <div class="mbox-row in">
      <span class="mbox-ic">${icon('up',15)}</span>
      <span class="mbox-k">เงินเข้า (ขายได้)</span>

    </div>
    <div class="mbox-row out">

      <span class="mbox-ic">${icon('sum',15)}</span>

// รายการรายจ่าย เรียงใหม่ก่อน พร้อมวันที่ถ้าดูหลายวัน
function expRows(list, showDay){

  return `<div class="list">${list.map(e => `

        <div class="li-sub">${showDay ? thaiDate(e.d) + ' · ' : ''}${esc(e.t || '')}</div>

// รายจ่ายของทั้งเดือน จัดกลุ่มตามหัวข้อที่ซื้อซ้ำ ๆ
function expByNote(mk){
  const list = (db.expenses||[]).filter(x => monthKey(x.d) === mk);
  const map = new Map();
  list.forEach(x => {
    const k = String(x.note || 'ซื้อของ').trim();
    const row = map.get(k) || {note:k, total:0, times:0};
    row.total += n(x.amount); row.times++;
    map.set(k, row);
  });
  return [...map.values()].sort((a,b) => b.total - a.total);
}

      <button class="btn primary block" onclick="editSales()">ใส่ยอดขายต่อวัน</button>

    </div>`);

    /* --- เมนูไหนทำเงินให้ร้านมากสุด --- */
    const earners = db.menus
      .map(m => ({m, total: profit(m) * n(m.qtyPerDay)}))
      .filter(x => n(x.m.qtyPerDay) > 0)
      .sort((a,b) => b.total - a.total);
    if(earners.length){
      const top = Math.max(...earners.map(x => Math.abs(x.total))) || 1;
      blocks.push(`<div class="card">
        <h2>เมนูไหนทำเงินให้ร้านมากสุด</h2>

          </div>`).join('')}</div>
      </div>`);
    }
  }

  return back + blocks.join('') + viewSum();
}

/* หน้าต่างกรอกยอดขายของทุกเมนูในทีเดียว */
function editSales(){
  openDialog({ icon:'hist',
    title:'ยอดขายต่อวัน',
    sub:'กะคร่าว ๆ ว่าแต่ละเมนูขายได้วันละกี่จาน',
    fields: db.menus.map(m => ({
      k:'q_'+m.id, label:(m.name || '(ไม่มีชื่อ)') + ' — จาน/วัน',
      type:'number', value:n(m.qtyPerDay) || '', wide:true
    })),
    live: v => {
      let rev=0, food=0, plates=0;
      db.menus.forEach(m => {
        const q = n(v['q_'+m.id]);
        plates += q; rev += n(m.price)*q; food += menuCost(m)*q;
      });
      if(!plates) return 'ใส่ตัวเลขแล้วจะคำนวณให้ทันที';
      const net = rev - food - fixedPerDay();
      return `ขายวันละ ${plates} จาน → กำไรสุทธิ ${baht(net)} บาท/วัน`;
    },
    check: v => Object.values(v).some(x => n(x) < 0) ? 'จำนวนจานติดลบไม่ได้' : null,
    save: v => {
      db.menus.forEach(m => m.qtyPerDay = n(v['q_'+m.id]));
      save(); render();
      toast('บันทึกจำนวนจานต่อวันแล้ว');
    }
  });
}

/* --------- ส่วนเปรียบเทียบเมนู (อยู่ท้ายหน้าภาพรวม) --------- */
function viewSum(){
  if(!db.menus.length) return '';
  const sorted = [...db.menus].sort((a,b) => marginPct(b) - marginPct(a));
  const worst = sorted[sorted.length-1];

  const bars = sorted.map(m => {
    const mg = marginPct(m), lv = level(mg);
    return `<div class="rank-row">
      <div class="rank-name">${esc(m.name||'(ไม่มีชื่อ)')}</div>
      <div class="rank-val ${lv}">${mg.toFixed(1)}%</div>
      <div class="meter is-${lv}"><i style="width:${clamp(mg,0,100)}%"></i></div>
      <div class="rank-sub">ขาย ${baht(m.price)} · ต้นทุน ${baht(menuCost(m))} · กำไร ${baht(profit(m))} บาท</div>
    </div>`;
  }).join('');

  const rows = sorted.map(m => {
    const mg = marginPct(m);
    return `<tr>
      <td>${esc(m.name||'(ไม่มีชื่อ)')}</td>
      <td class="n">${baht(menuCost(m))}</td>
      <td class="n">${baht(m.price)}</td>
      <td class="n ${profit(m)>=0?'good':'bad'}">${baht(profit(m))}</td>
      <td class="n ${level(mg)}">${mg.toFixed(1)}%</td>
      <td class="n">${baht(suggestPrice(m))}</td>
    </tr>`;
  }).join('');

  const tips = [];
  if(worst && marginPct(worst) < n(db.targetMargin))
    tips.push(`<b>${esc(worst.name||'(ไม่มีชื่อ)')}</b> กำไรบางสุดที่ ${marginPct(worst).toFixed(1)}% — ลองขึ้นราคาเป็น ${baht(suggestPrice(worst))} บาท หรือลดปริมาณไส้ลง`);
  if(breakEven())
    tips.push(`ต้องขายให้ได้วันละ <b>${Math.ceil(breakEven())} จาน</b> ถึงจะคุ้มค่าเช่าและค่าไฟ`);
  if(!fixedPerMonth())
    tips.push(`ยังไม่ได้ใส่ต้นทุนคงที่ — ตัวเลขกำไรที่เห็นยังไม่ได้หักค่าเช่ากับค่าไฟ`);

  return `
  <div class="card">
    <h2>เมนูไหนกำไรดี</h2>
    <p class="sub">ยิ่งแท่งยาวยิ่งดี · ร้านอาหารทั่วไปควรได้ 60% ขึ้นไป</p>
    <div class="rank">${bars}</div>
  </div>

  <div class="card">
    <details>
      <summary>ดูตารางสรุปแบบเต็ม</summary>
    <div class="scroll">
      <table>
        <thead><tr><th>เมนู</th><th>ต้นทุน</th><th>ขาย</th><th>กำไร</th><th>กำไร %</th><th>แนะนำ</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="hint">เลื่อนตารางไปทางซ้ายเพื่อดูคอลัมน์ที่เหลือ</p>
    </details>
  </div>

  ${tips.length ? `<div class="card"><h2>ข้อสังเกต</h2>
    ${tips.map(t=>`<div class="note">${t}</div>`).join('')}</div>` : ''}`;
}

/* ท็อปปิ้งแบบผูกกับเมนูทีละอัน ถูกแทนด้วย "ชุดไส้" ที่ใช้ร่วมกันแล้ว

/* ===================== หน้าตั้งค่าเมนู =====================
   ที่เดียวจบ: มีแป้ง/เมนูอะไรบ้าง · ใส่ไส้อะไรได้บ้าง · เมนูไหนใช้ชุดไส้ไหน */
function viewSetup(){
  const menuRows = db.menus.map(m => {

    </div>
    <button type="button" class="btn sm" onclick="shopDialog()">${icon('edit',14)} แก้ไข</button>
  </div>

  <div class="card lockcard">
    <span class="ic-tile tone-o">${icon('lock',17)}</span>
    <div class="shopcard-m">
      <div class="shopcard-n" style="font-size:14.5px">เครื่องนี้ใช้ร้านนี้ร้านเดียว</div>
      <div class="shopcard-s">เปิดมาเจอร้านนี้เลย ไม่มีร้านอื่นให้สับสน</div>

  </div>` : `<div class="card">
    ${cardHead('store','ร้านของฉัน','แต่ละร้านแยกเมนู ไส้ ยอดขาย และรายจ่ายของตัวเอง',
      `<span class="head-tag">${store.shops.length} ร้าน</span>
       <button type="button" class="btn sm primary" onclick="addShop()">${icon('plus',14)} เพิ่มร้าน</button>`)}
    <div class="shoplist">${shopListHTML(true)}</div>
    <p class="hint" style="margin:12px 0 0">แตะชื่อร้านเพื่อสลับไปใช้ร้านนั้น · กดรูปลิงก์เพื่อส่งให้คนดูแลร้านนั้นเปิดในมือถือตัวเอง · ดินสอคือแก้ชื่อหรือลบ</p>
  </div>`) + `

    <p class="hint" style="margin:0 0 12px">ล็อกเฉพาะ <b>แก้เมนู/ราคา · ชุดไส้ · ลบบิล · ลบรายจ่าย · จัดการร้าน · สำรองข้อมูล · ล้างข้อมูล</b>
      ส่วนหน้าขายกับ Dashboard ใช้ได้เลยไม่ต้องใส่รหัส</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap">

    ${cardHead('menu','แป้ง / เมนูที่ขาย','แตะชื่อเพื่อแก้ราคา · ปุ่ม "ชุดไส้" คือเลือกว่าเมนูนี้ใส่อะไรได้',
      `<span class="head-tag">${db.menus.length} เมนู</span>

    <div class="list">${menuRows || `<div class="empty" style="padding:22px 10px">

      ${navRow('sum','g','ดูว่าเมนูไหนกำไรดี', db.menus.length ? `เทียบ ${db.menus.length} เมนู` : 'ยังไม่มีเมนู', "go('dash')")}
    </div>
  </div>`;

  /* ---- แท็บ "ข้อมูล" ---- */
  const paneData = `
  <div class="card">
    ${cardHead('box','ข้อมูลของฉัน','เก็บอยู่ในเครื่องนี้เครื่องเดียว ควรคัดลอกเก็บไว้เป็นระยะ')}
    <div class="navlist">
      ${navRow('cart','g','ให้ลูกค้าสั่งเองผ่าน QR',
        db.orderOn ? 'เปิดอยู่ · ออเดอร์เด้งมาที่เครื่องนี้' : 'ยังไม่ได้เปิด', 'orderSetupDialog()')}
      ${navRow('box','o','สำรอง / กู้คืนข้อมูล','คัดลอกเก็บไว้ กันข้อมูลหาย','openBackup()')}
      ${navRow('menu','w','คู่มือการใช้งาน','ทำอะไรยังไง · คำในแอปแปลว่าอะไร','openHelp()')}
      ${navRow('today','g','ใส่ข้อมูลตัวอย่าง','ลองเล่นด้วยข้อมูลร้านสมมติ','loadDemo()')}
      ${navRow('trash','r','ล้างข้อมูลทั้งหมด','ลบทุกอย่างในเครื่องนี้ กู้คืนไม่ได้','resetAll()')}
    </div>
  </div>`;

  return shopStatusRow()
    + segBar('setup', [['shop','ร้าน','store'], ['menu','เมนู','menu'],
                       ['cost','ต้นทุน','sum'],  ['data','ข้อมูล','box']])
    + segPane('setup','shop', paneShop, '')
    + segPane('setup','menu', paneMenu, '')
    + segPane('setup','cost', paneCost, '')
    + segPane('setup','data', paneData, '');
}

// การ์ดสถานะร้าน ใช้ซ้ำบนหัวหน้าอื่น ๆ ให้ไปทางเดียวกับการ์ดสถานะบนหน้าแรก
function shopStatusRow(){
  const key = dayKey();
  const bills = billsOf(key);
  return srow(db.shopOpen ? '' : 'warn', 'store',
    esc(db.shopName || 'ร้านของฉัน'),
    (db.shopOpen ? 'เปิดอยู่' : 'ปิดอยู่')
      + (bills ? ` · วันนี้ ${bills} บิล ฿${baht(sumDay(key).sale)}` : ' · วันนี้ยังไม่ได้ขาย'),
    db.shopOpen ? 'ปิดร้าน' : 'เปิดร้าน', 'toggleShopOpen()');
}

/* หัวของหน้าย่อยที่เข้ามาจากหน้าตั้งค่า — ปุ่มย้อนกลับ + การ์ดสรุป
   ใช้ .srow ตัวเดียวกับการ์ดสถานะบนหน้าแรก ทุกหน้าจะได้หน้าตาไปทางเดียวกัน */

    <span class="ic-tile tone-${tone}">${icon(ic,17)}</span>
    <span class="navrow-m">
      <span class="navrow-t">${title}</span>
      <span class="navrow-s">${sub}</span>

    <span class="li-chev">${icon('chev',16)}</span>

/* ---------- เลือกว่าเมนูนี้ใช้ชุดไส้ไหนบ้าง ---------- */
function pickGroups(menuId){
  if(!adminOk(() => pickGroups(menuId))) return;
  const m = findMenu(menuId); if(!m) return;
  const picked = new Set(m.groupIds || []);
  openDialog({ icon:'ing',
    title: 'เมนูนี้ใส่อะไรได้บ้าง',
    sub: esc(m.name || '(ไม่มีชื่อ)'),
    html: (db.groups||[]).length
      ? `<div class="picks">${db.groups.map(g => `
          <div class="pick${picked.has(g.id) ? ' on' : ''}">
            <button class="pick-box" onclick="toggleMenuGroup('${menuId}','${g.id}')"
                    aria-pressed="${picked.has(g.id)}">${icon('check',15)}</button>
            <div class="pick-main" onclick="toggleMenuGroup('${menuId}','${g.id}')">
              <div class="li-title">${esc(g.name)}</div>
              <div class="li-sub">${g.items.length} อย่าง · ${g.items.slice(0,4).map(i => esc(i.name)).join(' ')}${g.items.length > 4 ? ' …' : ''}</div>
            </div>
          </div>`).join('')}</div>`
      : `<p style="margin:0;color:var(--ink-2)">ยังไม่มีชุดไส้ — กด <b>เพิ่มชุด</b> ในหน้าตั้งค่าก่อนครับ</p>`,
    foot: [{label:'เสร็จแล้ว', cls:'primary', fn:'dlg.close(); render()'}]
  });
}
function toggleMenuGroup(menuId, gid){
  const m = findMenu(menuId); if(!m) return;
  const ids = new Set(m.groupIds || []);
  if(ids.has(gid)) ids.delete(gid); else ids.add(gid);
  m.groupIds = [...ids];
  save(); pickGroups(menuId);          // เปิดหน้าต่างเดิมซ้ำเพื่อให้เห็นติ๊กเปลี่ยน
  const g = findGroup(gid);
  toast((ids.has(gid) ? 'ใส่ชุด' : 'เอาชุด') + ' "' + cut(g ? g.name : '') + '" ' + (ids.has(gid) ? 'ให้' : 'ออกจาก') + 'เมนูนี้แล้ว');
}

/* ---------- ชุดไส้: สร้าง / เปลี่ยนชื่อ / ลบ ---------- */
function groupDialog(g){
  if(!adminOk(() => groupDialog(g))) return;
  openDialog({ icon:'ing',
    title: g ? 'เปลี่ยนชื่อชุด' : 'เพิ่มชุดไส้',
    sub: g ? '' : 'เช่น ไส้คาว · ไส้หวาน · ราดซอส (ฟรี)',
    fields: [{k:'name', label:'ชื่อชุด', type:'text', value: g ? g.name : '',
              placeholder:'เช่น ไส้คาว', wide:true}],
    check: v => !v.name.trim() ? 'ใส่ชื่อชุดด้วย' : null,
    extraFoot: g ? {label:'ลบชุด', cls:'danger', fn:`dlg.close(); delGroup('${g.id}')`} : null,
    save: v => {
      if(g) g.name = v.name.trim();
      else (db.groups = db.groups||[]).push({id:uid(), name:v.name.trim(), items:[]});
      save(); render();
      toast(savedMsg('ชุดไส้', v.name.trim(), !g));
    }
  });
}
function delGroup(gid){
  if(!adminOk(() => delGroup(gid))) return;
  const g = findGroup(gid); if(!g) return;
  const used = db.menus.filter(m => (m.groupIds||[]).includes(gid)).length;
  askConfirm(`ลบชุด "${g.name}" ?`,
    used ? `ชุดนี้ถูกใช้อยู่ใน ${used} เมนู ลบแล้วเมนูเหล่านั้นจะเลือกไส้ชุดนี้ไม่ได้อีก`
         : 'ยังไม่มีเมนูไหนใช้ชุดนี้',
    'ลบ', () => {
      const nm = g.name;
      db.groups = (db.groups||[]).filter(x => x.id !== gid);
      db.menus.forEach(m => m.groupIds = (m.groupIds||[]).filter(x => x !== gid));
      save(); go('setup');
      toast(delMsg('ชุดไส้', nm));
    });
}

/* ---------- แก้ไส้ในชุด ---------- */
function groupEditor(gid){
  if(!adminOk(() => groupEditor(gid))) return;
  const g = findGroup(gid); if(!g) return;
  const rows = g.items.map((it,i) => `
    <div class="li" role="button" tabindex="0" onclick="groupItemDialog('${gid}',${i})"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();groupItemDialog('${gid}',${i})}">
      <div class="li-main"><div class="li-title">${esc(it.name)}</div></div>
      <div class="li-end">
        <span class="chip">${n(it.price) > 0 ? '+' + baht(it.price) : 'ฟรี'}</span>
        <span class="li-chev">${icon('chev',16)}</span>
      </div>
    </div>`).join('');
  openDialog({ icon:'ing',
    title: esc(g.name),
    sub: `${g.items.length} อย่าง · แตะเพื่อแก้ชื่อหรือราคา`,
    html: `<div class="list">${rows || '<div class="empty" style="padding:18px">ยังไม่มีไส้ในชุดนี้</div>'}</div>`,
    foot: [
      {label:'เปลี่ยนชื่อชุด', cls:'ghost', fn:`dlg.close(); groupDialog(findGroup('${gid}'))`},
      {label:'เพิ่มไส้', cls:'primary', fn:`groupItemDialog('${gid}',-1)`}
    ]
  });
}
function groupItemDialog(gid, idx){
  if(!adminOk(() => groupItemDialog(gid, idx))) return;
  const g = findGroup(gid); if(!g) return;
  const cur = idx >= 0 ? g.items[idx] : null;
  openDialog({ icon:'ing',
    title: cur ? 'แก้ไส้' : 'เพิ่มไส้',
    sub: `ในชุด ${g.name}`,
    fields: [
      {k:'name', label:'ชื่อไส้', type:'text', value: cur ? cur.name : '', placeholder:'เช่น ไก่หยอง', wide:true},
      {k:'price', label:'คิดเพิ่มกี่บาท (ฟรีใส่ 0)', type:'number', value: cur ? cur.price : '', wide:true}
    ],
    check: v => !v.name.trim() ? 'ใส่ชื่อไส้ด้วย' : v.price < 0 ? 'ราคาติดลบไม่ได้' : null,
    extraFoot: cur ? {label:'ลบ', cls:'danger', fn:`dlg.close(); delGroupItem('${gid}',${idx})`} : null,
    save: v => {
      const data = {name:v.name.trim(), price:n(v.price)};
      if(cur) Object.assign(cur, data);
      else g.items.push(Object.assign({id:uid()}, data));
      save(); render(); groupEditor(gid);
      toast(savedMsg('ไส้', data.name, !cur));
    }
  });
}
function delGroupItem(gid, idx){
  if(!adminOk(() => delGroupItem(gid, idx))) return;
  const g = findGroup(gid); if(!g) return;
  const gone = g.items[idx];
  g.items.splice(idx,1); save(); render(); groupEditor(gid);
  toast(delMsg('ไส้', gone ? gone.name : ''));
}

/* ===================== สำรอง / กู้คืน ===================== */
function openBackup(){
  if(!adminOk(() => openBackup())) return;
  const box = document.getElementById('backup');
  document.getElementById('dump').value = JSON.stringify(store);
  document.getElementById('bkMsg').textContent = '';
  box.hidden = false;
  box.scrollIntoView({behavior:'smooth', block:'start'});
}
function closeBackup(){ document.getElementById('backup').hidden = true; }
function bkMsg(t){ document.getElementById('bkMsg').textContent = t; }

async function copyDump(){
  const ta = document.getElementById('dump');
  try{
    await navigator.clipboard.writeText(ta.value);
    markBackedUp();
    bkMsg('คัดลอกแล้ว — เอาไปวางเก็บไว้ที่ไหนก็ได้');
  }catch(e){
    ta.select(); bkMsg('กดค้างที่ข้อความแล้วเลือก "คัดลอก" เองนะครับ');
  }
}
function restoreText(){
  const txt = document.getElementById('paste').value.trim();
  if(!txt) return bkMsg('ยังไม่ได้วางข้อความ');
  if(!applyData(txt)) return bkMsg('ข้อความไม่ถูกต้อง ลองคัดลอกมาใหม่ทั้งก้อน');
  bkMsg('กู้คืนเรียบร้อย');
}
function applyData(raw){
  try{
    const data = JSON.parse(raw);
    // ก้อนใหม่ = มีหลายร้าน / ก้อนเก่า = ร้านเดียว ใส่ทับร้านที่กำลังใช้อยู่
    if(data && Array.isArray(data.shops) && data.shops.length){
      const wasLocked = store && store.locked;
      const keepPin = store && store.pin;
      store = { shops: data.shops.map((x,i) => fixShop(x, 'ร้านที่ ' + (i+1))), active: data.active };
      if(data.pin && data.pin.h) store.pin = data.pin; else if(keepPin) store.pin = keepPin;
      if(wasLocked && store.shops.some(x => x.id === wasLocked)){ store.locked = wasLocked; store.active = wasLocked; }
      if(!store.shops.some(x => x.id === store.active)) store.active = store.shops[0].id;
      db = curShop(); markBackedUp(); render();
      toast('กู้คืนข้อมูลแล้ว ' + store.shops.length + ' ร้าน');
      return true;
    }
    if(!data || !Array.isArray(data.ingredients)) return false;
    setShopData(data); markBackedUp(); render();
    toast('กู้คืนข้อมูลลงร้าน "' + cut(db.shopName) + '" แล้ว');
    return true;
  }catch(e){ return false; }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(store,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `สมุดร้าน-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  markBackedUp();
}
function importJSON(input){
  const file = input.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    bkMsg(applyData(r.result) ? 'กู้คืนจากไฟล์เรียบร้อย' : 'ไฟล์ไม่ถูกต้อง');
    input.value = '';
  };
  r.readAsText(file);
}

// ใส่ท็อปปิ้ง + สร้างประวัติย้อนหลังให้ข้อมูลตัวอย่าง จะได้เห็นว่าหน้าย้อนหลังหน้าตาเป็นยังไง
function seedHistory(d){
  const tops = [
    {id:uid(), name:'เพิ่มไข่', price:10},
    {id:uid(), name:'เพิ่มชีส', price:15},
    {id:uid(), name:'เพิ่มนูเทลล่า', price:20}
  ];
  d.menus.forEach(m => m.addons = tops.map(t => ({...t, id:uid()})));

  const today = new Date();
  for(let back = 13; back >= 0; back--){
    const dt = new Date(today); dt.setDate(today.getDate() - back);
    if(dt.getDay() === 1) continue;                       // สมมติปิดวันจันทร์
    const key = dayKey(dt);
    const busy = 0.75 + ((back * 37) % 55) / 100;          // ให้แต่ละวันไม่เท่ากัน
    d.menus.forEach((m, mi) => {
      const q = Math.max(1, Math.round(n(m.qtyPerDay) * busy));
      const add = (mi + back) % 3 === 0 ? [m.addons[(back + mi) % m.addons.length]] : [];
      const extra = add.reduce((a,x) => a + x.price, 0);
      d.sales.push({
        id: uid(), d: key, t: pad2(10 + mi*3) + ':' + pad2((back*7) % 60),
        menuId: m.id, name: m.name, qty: q,
        addons: add.map(x => ({name:x.name, price:x.price})),
        total: (n(m.price) + extra) * q
      });
    });
    if(back % 3 === 0){
      d.expenses.push({ id:uid(), d:key, t:'08:20', note:'ซื้อของเข้าร้าน',
                        amount: 380 + ((back*53) % 240) });
    }
  }
  d.expenses.push({ id:uid(), d: dayKey(), t:'08:10', note:'ค่าแก๊ส', amount:400 });
  return d;
}

/* ===================== เริ่มทำงาน ===================== */
// เปิดผ่านลิงก์จะดาวน์โหลดไฟล์ไม่ได้ — ซ่อนปุ่มนั้น ใช้ปุ่มคัดลอกแทน
if(window.claude){
  const b = document.getElementById('dlBtn');
  if(b) b.hidden = true;
}
// ติดตั้งเป็นแอป + ใช้งานตอนไม่มีเน็ต (ต้องเป็น https หรือ localhost)
if('serviceWorker' in navigator && !window.claude
   && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.update();                              // เช็กของใหม่ทุกครั้งที่เปิดแอป
      // ได้ของใหม่มาแล้วและมีตัวเก่าคุมอยู่ → โหลดหน้าใหม่ให้เลย จะได้ไม่ต้องกด refresh เอง
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', () => {
          if(sw.state === 'installed' && navigator.serviceWorker.controller) location.reload();
        });
      });
    }).catch(()=>{});
  });
}

// เปิดด้วยลิงก์เฉพาะร้านไหม — ต้องทำที่นี่ หลังทุกอย่างถูกประกาศครบแล้ว

startOrderWatch();

// หน้าต่างเดียวใช้ได้ทั้งเพิ่มและแก้ไข (ส่ง null = เพิ่มใหม่)
function ingDialog(ing){
  openDialog({
    title: ing ? 'แก้ไขวัตถุดิบ' : 'เพิ่มวัตถุดิบ',
    sub:'กรอกตามบิลที่ซื้อจริง ระบบคิดราคาต่อหน่วยให้เอง',
    fields:[
      {k:'name', label:'ชื่อวัตถุดิบ', type:'text', value:ing?.name ?? '', placeholder:'เช่น แป้งเครป', wide:true},
      {k:'packQty', label:'ปริมาณที่ได้', type:'number', value:ing?.packQty ?? 1000},
      {k:'unit', label:'หน่วย', type:'select', value:ing?.unit ?? 'กรัม', options:UNITS.map(u=>({value:u,label:u}))},
      {k:'packPrice', label:'ราคาที่จ่าย (บาท)', type:'number', value:ing?.packPrice ?? '', wide:true}
    ],
    live: v => v.packQty > 0 && v.packPrice > 0
      ? `คิดเป็น ${perUnit({unit:v.unit, packQty:v.packQty, packPrice:v.packPrice})}`
      : 'กรอกปริมาณกับราคาแล้วจะคำนวณให้ทันที',
    check: v => !v.name.trim() ? 'ยังไม่ได้ใส่ชื่อวัตถุดิบ'
              : v.packQty <= 0 ? 'ปริมาณที่ได้ต้องมากกว่า 0'
              : v.packPrice < 0 ? 'ราคาติดลบไม่ได้' : null,
    save: v => {
      const data = {name:v.name.trim(), packQty:v.packQty, unit:v.unit, packPrice:v.packPrice};
      if(ing) Object.assign(ing, data);
      else db.ingredients.push(Object.assign({id:uid()}, data));
      save(); render();
      toast(savedMsg('ของที่ซื้อมา', data.name, !ing));
    }
  });
}
function addIng(){ ingDialog(null); }
function editIng(id){ const i = findIng(id); if(i) ingDialog(i); }
function delIng(id){
  if(!adminOk(() => delIng(id))) return;
  const i = findIng(id);
  const used = db.menus.filter(m => (m.items||[]).some(it => it.ingId===id)).map(m=>m.name||'(ไม่มีชื่อ)');
  const go = () => {
    const nm = i ? i.name : '';
    db.ingredients = db.ingredients.filter(x => x.id!==id);
    db.menus.forEach(m => m.items = (m.items||[]).filter(it => it.ingId!==id));
    save(); render();
    toast(delMsg('ของที่ซื้อมา', nm));
  };
  if(used.length) askConfirm(`ลบ "${esc(i?.name||'')}" ?`,
    `ของชิ้นนี้ถูกใช้ในสูตรของ ${esc(used.join(', '))} — ลบแล้วสูตรเหล่านั้นจะหายไปด้วย`, 'ลบเลย', go);
  else go();
}

/* --------- แท็บ 2: เมนู --------- */
function costSplit(m){
  const cost = menuCost(m), price = n(m.price), pf = price - cost;
  if(price <= 0 || cost <= 0) return '';
  if(pf < 0){
    return `<div class="split"><i class="seg-loss only" style="width:100%"></i></div>
      <div class="legend"><span><i style="background:var(--bad)"></i>ขาดทุนจานละ <b>${baht(-pf)}</b> บาท</span></div>`;
  }
  const cw = clamp(cost / price * 100, 0, 100);
  return `
    <div class="split">
      <i class="seg-cost" style="width:${cw}%"></i>
      <i class="seg-profit" style="width:${100-cw}%"></i>
    </div>
    <div class="legend">
      <span><i style="background:var(--brand)"></i>ต้นทุน <b>${baht(cost)}</b></span>
      <span><i style="background:var(--brand-l)"></i>กำไร <b>${baht(pf)}</b></span>
    </div>`;
}

/* ===================== หน้าเลือกของที่ใช้ในสูตร =====================
   เดิมต้องเปิดหน้าต่างทีละชิ้น เมนูหนึ่งใช้ของ 7 อย่างก็ 7 รอบ
   เปลี่ยนเป็นเห็นของทั้งหมดในหน้าเดียว ติ๊กอันที่ใช้แล้วใส่จำนวน จบในครั้งเดียว */
let recipeDraft = null;   // {menuId, map:{ingId: qty}}

function openRecipe(menuId){
  const m = findMenu(menuId); if(!m) return;
  recipeDraft = { menuId, map: Object.fromEntries((m.items||[]).map(it => [it.ingId, n(it.qty)])) };
  render(); window.scrollTo({top:0});
}
function closeRecipe(){ recipeDraft = null; render(); window.scrollTo({top:0}); }

function toggleIng(id){
  if(!recipeDraft) return;
  if(id in recipeDraft.map) delete recipeDraft.map[id];
  else recipeDraft.map[id] = '';            // ติ๊กแล้วค่อยพิมพ์จำนวน
  render();
  const el = document.getElementById('q_' + id);
  if(el) el.focus();
}
function setDraftQty(id, v){
  if(!recipeDraft) return;
  recipeDraft.map[id] = v === '' ? '' : n(v);
  refreshRecipeSum();                        // อัปเดตแค่แถบสรุป ช่องที่พิมพ์อยู่จะได้ไม่หลุด
  const c = document.getElementById('c_' + id);
  const ing = findIng(id);
  if(c && ing) c.textContent = n(v) > 0 ? baht(unitCost(ing) * n(v)) : '';
}
function draftCost(){
  if(!recipeDraft) return 0;
  return Object.entries(recipeDraft.map).reduce((s,[id,q]) => {
    const ing = findIng(id);
    return s + (ing ? unitCost(ing) * n(q) : 0);
  }, 0);
}
function refreshRecipeSum(){
  const box = document.getElementById('recipeSum');
  if(box) box.innerHTML = recipeSumHTML();
}
function recipeSumHTML(){
  const m = findMenu(recipeDraft.menuId);
  const cost = draftCost(), price = n(m.price), pf = price - cost;
  const picked = Object.keys(recipeDraft.map).length;
  if(!picked) return `<b>ยังไม่ได้เลือกของ</b><span>ติ๊กของที่ใช้ทำจานนี้</span>`;
  if(price <= 0) return `<b>ค่าของจานละ ${baht(cost)} บาท</b><span>เลือกไว้ ${picked} อย่าง · ยังไม่ได้ใส่ราคาขาย</span>`;
  return `<b>ค่าของ ${baht(cost)} · ขาย ${baht(price)} → เหลือ ${baht(pf)} บาท</b>
          <span>เลือกไว้ ${picked} อย่าง · กำไร ${price > 0 ? (pf/price*100).toFixed(0) : 0}%</span>`;
}
function saveRecipe(){
  const m = findMenu(recipeDraft.menuId);
  if(m){
    m.items = Object.entries(recipeDraft.map)
      .filter(([,q]) => n(q) > 0)
      .map(([ingId,q]) => ({ingId, qty:n(q)}));
    save();
  }
  recipeDraft = null; render(); window.scrollTo({top:0});
  toast('บันทึกของที่ใช้ในเมนูนี้แล้ว');
}

function viewRecipe(){
  const m = findMenu(recipeDraft.menuId);
  if(!m){ recipeDraft = null; return viewMenu(); }

  const rows = db.ingredients.map(i => {
    const on = i.id in recipeDraft.map;
    const q = on ? recipeDraft.map[i.id] : '';
    const c = n(q) > 0 ? baht(unitCost(i) * n(q)) : '';
    return `<div class="pick${on ? ' on' : ''}">
      <button class="pick-box" onclick="toggleIng('${i.id}')" aria-pressed="${on}"
              aria-label="${on ? 'เอาออก' : 'เลือก'} ${esc(i.name)}">${icon('check',15)}</button>
      <div class="pick-main" onclick="toggleIng('${i.id}')">
        <div class="li-title">${esc(i.name || '(ไม่มีชื่อ)')}</div>
        <div class="li-sub">${perUnit(i)}</div>
      </div>
      ${on ? `<div class="pick-qtyrow">
        <input id="q_${i.id}" type="number" step="any" inputmode="decimal" class="pick-qty"
               value="${q}" placeholder="0" oninput="setDraftQty('${i.id}', this.value)">
        <span class="pick-unit">${esc(i.unit)}</span>
        <span class="pick-cost" id="c_${i.id}">${c}</span>
      </div>` : ''}
    </div>`;
  }).join('');

  return `<button class="btn back" onclick="closeRecipe()">${icon('back',16)} กลับไปหน้าเมนู</button>
  <div class="card">
    <h2>${esc(m.name || '(ยังไม่มีชื่อ)')} ใช้ของอะไรบ้าง</h2>
    <p class="sub">ติ๊กของที่ใช้ แล้วใส่ว่าใช้เท่าไหร่ต่อ 1 จาน — ติ๊กได้หลายอย่างในครั้งเดียว</p>
    ${db.ingredients.length
      ? `<div class="picks">${rows}</div>`
      : `<div class="empty">${icon('box',34)}ยังไม่มีของให้เลือก<br>ไปใส่ของที่ซื้อมาก่อน</div>
         <button class="btn primary block" onclick="go('ing')">ไปใส่ของที่ซื้อมา</button>`}
  </div>
  <div class="savebar">
    <div class="recipe-sum" id="recipeSum">${recipeSumHTML()}</div>
    <div class="btnrow">
      <button class="btn ghost" onclick="closeRecipe()">ยกเลิก</button>
      <button class="btn primary" onclick="saveRecipe()">บันทึกสูตร</button>
    </div>
  </div>`;
}

// เปิดเมนูไหนอยู่ (null = แสดงเป็นรายการรวม)
let openMenuId = null;
function openMenu(id){ openMenuId = id; render(); window.scrollTo({top:0}); }
function backToMenus(){ openMenuId = null; render(); window.scrollTo({top:0}); }

function viewMenu(){
  if(recipeDraft) return viewRecipe();
  if(!db.ingredients.length){
    openMenuId = null;
    return `<div class="card">
      <div class="empty">
        <div class="empty-ic">${icon('box',34)}</div>
        <h3>ต้องใส่ของที่ซื้อมาก่อน</h3>
        <p>พอมีรายการของแล้ว ค่อยมาบอกว่าแต่ละเมนูใช้อะไรบ้าง</p>
        <button class="btn primary" onclick="go('ing')">ไปใส่ของที่ซื้อมา</button>
      </div>
    </div>`;
  }

  // --- หน้ารายการเมนู: เห็นทีเดียวว่าเมนูไหนกำไรดี ---
  if(!openMenuId || !findMenu(openMenuId)){
    openMenuId = null;
    if(!db.menus.length){
      return `<div class="card">
        <div class="empty">
          <div class="empty-ic">${icon('menu',34)}</div>
          <h3>ใส่เมนูที่ขาย</h3>
          <p>ใส่ชื่อกับราคาขาย แล้วเลือกว่าจานนั้นใช้ของอะไรบ้าง จะรู้ทันทีว่ากำไรเท่าไหร่</p>
          <button class="btn primary" onclick="addMenu()">${icon('plus',16)} เพิ่มเมนูแรก</button>
        </div></div>`;
    }
    const rows = db.menus.map(m => {
      const st = statusWord(m);
      const noRecipe = !(m.items||[]).length;
      return `<div class="li" role="button" tabindex="0" onclick="openMenu('${m.id}')"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openMenu('${m.id}')}">
        <span class="av ${noRecipe ? 'w' : st.lv === 'good' ? 'g' : st.lv === 'bad' ? 'b' : 'w'}">${esc(initial(m.name))}</span>
        <div class="li-main">
          <div class="li-title">${esc(m.name || '(ยังไม่มีชื่อ)')}</div>
          <div class="li-sub">${noRecipe ? 'ยังไม่ได้ใส่ว่าใช้อะไรบ้าง'
            : `ขาย ${baht(m.price)} บาท · ได้กำไรจานละ ${baht(profit(m))} บาท`}</div>
        </div>
        <div class="li-end">
          <span class="status is-${noRecipe ? 'warn' : st.lv}">${noRecipe ? 'ยังไม่ครบ' : st.word}</span>
          <span class="li-chev">${icon('chev',16)}</span>
        </div>
      </div>`;
    }).join('');

    return `<div class="card">
      <div class="head-row">
        <h2>เมนูที่ขาย</h2>
        <button class="btn sm primary" onclick="addMenu()">${icon('plus',14)} เพิ่ม</button>
      </div>
      <p class="sub">แตะที่เมนูเพื่อดูรายละเอียดและใส่ว่าใช้ของอะไรบ้าง</p>
      <div class="list">${rows}</div>
    </div>`;
  }

  // --- หน้ารายละเอียดของเมนูเดียว ---
  const cards = [findMenu(openMenuId)].map(m => {
    const cost = menuCost(m), mg = marginPct(m), lv = level(mg);
    const items = (m.items||[]).map(it => {
      const ing = findIng(it.ingId);
      return `<div class="li-read">
        <div class="li-main">
          <div class="li-title">${esc(ing?.name || '(ของชิ้นนี้ถูกลบไปแล้ว)')}</div>

        </div>
        <span class="chip">${ing ? baht(unitCost(ing)*n(it.qty)) : '–'}</span>
      </div>`;

    const st = statusWord(m);
    return `<button class="btn back" onclick="backToMenus()">${icon('back',16)} เมนูทั้งหมด</button>
    <div class="card">
      <div class="row-head" style="margin-bottom:2px">

          <h2 style="margin:0">${esc(m.name || '(ยังไม่มีชื่อ)')}</h2>

      <div class="verdict is-${st.lv}">

        ${n(m.price) > 0 && (m.items||[]).length

          : 'ใส่ราคาขายและของที่ใช้ให้ครบก่อน แล้วจะคำนวณให้'}

      <div class="sec">จานนี้ใช้ของอะไรบ้าง</div>
      <div class="list">${items || `<div class="empty" style="padding:16px">ยังไม่ได้ใส่ว่าใช้ของอะไร</div>`}</div>
      <div style="margin-top:10px">
        <button class="btn primary block" onclick="openRecipe('${m.id}')">${icon('edit',15)} ${items ? 'แก้ว่าใช้ของอะไรบ้าง' : 'เลือกของที่ใช้'}</button>

        <div class="tile"><div class="lbl">ต้นทุน / จาน</div><div class="val tnum">${baht(cost)}</div></div>
        <div class="tile"><div class="lbl">กำไร / จาน</div>

        <div class="tile"><div class="lbl">กำไร %</div>
          <div class="val tnum ${lv}">${mg.toFixed(1)}%</div>
          <div class="meter is-${lv}" style="margin-top:7px"><i style="width:${clamp(mg,0,100)}%"></i></div></div>
        <div class="tile"><div class="lbl">ราคาที่แนะนำ</div>
          <div class="val tnum">${baht(suggestPrice(m))}</div></div>

  return cards || `<div class="card">
    <h2>เมนู</h2>

const findMenu = id => db.menus.find(m => m.id===id);
// หน้าต่างเดียวใช้ได้ทั้งเพิ่มและแก้ไข (ส่ง null = เพิ่มใหม่)
function menuDialog(m){
  if(!adminOk(() => menuDialog(m))) return;
  openDialog({
    title: m ? 'แก้ไขเมนู' : 'เพิ่มเมนูใหม่',
    sub: m ? 'แก้ชื่อ ราคาขาย หรือยอดขายต่อวัน' : 'ใส่ชื่อกับราคาขายก่อน แล้วค่อยไปใส่สูตรทีหลัง',
    fields:[
      {k:'name', label:'ชื่อเมนู', type:'text', value:m?.name ?? '', placeholder:'เช่น เครปกรอบ นูเทลล่า', wide:true},
      {k:'cat', label:'หมวด (เช่น เครป โตเกียว)', type:'text', value: m ? menuCat(m) : '', wide:true},
      {k:'price', label:'ราคาขาย (บาท)', type:'number', value:m?.price ?? ''},
      {k:'qtyPerDay', label:'ขายได้วันละ (จาน)', type:'number', value:m?.qtyPerDay ?? ''}
    ],
    live: m ? (v => {
      const c = menuCost(m), pf = v.price - c;
      if(!(v.price > 0)) return `ต้นทุนวัตถุดิบจานละ ${baht(c)} บาท`;
      return `กำไรจานละ ${baht(pf)} บาท (${(pf/v.price*100).toFixed(1)}%) · วันละ ${baht(pf * v.qtyPerDay)} บาท`;
    }) : null,
    check: v => !v.name.trim() ? 'ยังไม่ได้ใส่ชื่อเมนู'
              : v.price < 0 ? 'ราคาติดลบไม่ได้'
              : v.qtyPerDay < 0 ? 'จำนวนจานติดลบไม่ได้' : null,
    save: v => {
      const data = {name:v.name.trim(), cat:(v.cat||'').trim(), price:v.price, qtyPerDay:v.qtyPerDay};
      if(m) Object.assign(m, data);
      else db.menus.push(Object.assign({id:uid(), items:[]}, data));
      save(); render();
      toast(savedMsg('เมนู', data.name, !m));
    }
  });
}
function addMenu(){
  if(!adminOk(() => addMenu())) return; menuDialog(null); }
function editMenu(id){ const m = findMenu(id); if(m) menuDialog(m); }
function delMenu(id){
  const m = findMenu(id);
  askConfirm(`ลบเมนู "${esc(m?.name||'(ไม่มีชื่อ)')}" ?`,
    'ยอดขายที่บันทึกไปแล้วยังอยู่ ไม่หายไปด้วย', 'ลบเลย', () => {
      db.menus = db.menus.filter(x => x.id!==id);
      if(openMenuId === id) openMenuId = null;
      save(); render();
      toast(delMsg('เมนู', m ? m.name : ''));
    });
}
// หน้าต่างเดียวใช้ได้ทั้งเพิ่มและแก้ไขรายการในสูตร (idx = -1 คือเพิ่มใหม่)
function itemDialog(mid, idx){
  const m = findMenu(mid); if(!m) return;
  const cur = idx >= 0 ? m.items[idx] : null;
  openDialog({
    title: cur ? 'แก้ไขวัตถุดิบในสูตร' : 'เพิ่มวัตถุดิบในสูตร',
    sub:`เมนู: ${m.name || '(ยังไม่มีชื่อ)'}`,
    fields:[
      {k:'ingId', label:'วัตถุดิบ', type:'select', value: cur ? cur.ingId : db.ingredients[0].id, wide:true,
       options: db.ingredients.map(i => ({value:i.id, label:i.name || '(ไม่มีชื่อ)'}))},
      {k:'qty', label:'ใช้เท่าไหร่ต่อ 1 จาน', type:'number', value: cur ? cur.qty : '', wide:true}
    ],
    live: v => {
      const ing = findIng(v.ingId);
      if(!ing) return 'เลือกวัตถุดิบก่อน';
      if(!(v.qty > 0)) return `ใส่จำนวนเป็น "${esc(ing.unit)}" — ของนี้${perUnit(ing)}`;
      return `${v.qty} ${esc(ing.unit)} = ${baht(unitCost(ing) * v.qty)} บาท ต่อจาน`;
    },
    check: v => !findIng(v.ingId) ? 'ยังไม่ได้เลือกวัตถุดิบ'
              : !(v.qty > 0) ? 'ปริมาณที่ใช้ต้องมากกว่า 0' : null,
    save: v => {
      if(cur) Object.assign(cur, {ingId:v.ingId, qty:v.qty});
      else (m.items = m.items||[]).push({ingId:v.ingId, qty:v.qty});
      save(); render();
      const ingName = (findIng(v.ingId)||{}).name;
      toast(savedMsg('ของที่ใช้', ingName, !cur));
    }
  });
}
function addItem(mid){ itemDialog(mid, -1); }
function editItem(mid, idx){ itemDialog(mid, idx); }
function delItem(mid,idx){
  const m = findMenu(mid); if(!m) return;
  const gone = m.items[idx];
  m.items.splice(idx,1); save(); render();
  toast(delMsg('ของที่ใช้', gone ? (findIng(gone.ingId)||{}).name : ''));
}

/* --------- แท็บ 3: ต้นทุนคงที่ --------- */
function viewFixed(){

  const f = db.fixed;
  const fld = (k,l,ph='') => `<div class="f"><label>${l}</label>
    <input type="number" step="any" inputmode="decimal" value="${f[k]}" placeholder="${ph}" oninput="setFixed('${k}',this.value)"></div>`;
  const be = breakEven();

  return back + `
  <div class="card" id="fixedKpi">
    <h2>ต้องขายกี่จานถึงไม่ขาดทุน</h2>
    <p class="sub">ขายให้ได้เท่านี้ก่อน ถึงจะพอจ่ายค่าเช่ากับค่าไฟ</p>
    <div class="hero tnum">${be ? Math.ceil(be) : '–'}<small>${be ? 'จาน / วัน' : 'ยังคำนวณไม่ได้'}</small></div>
    ${be ? `<p class="hint">คิดจากกำไรเฉลี่ย ${baht(avgProfit())} บาท/จาน — ขายได้เกินนี้เมื่อไหร่คือเริ่มมีกำไรจริง</p>`
         : `<p class="hint">ต้องมีเมนูที่ตั้งราคาขายแล้ว และกำไรเฉลี่ยมากกว่า 0 ก่อน</p>`}
    <div class="tiles" style="margin-top:14px">
      <div class="tile"><div class="lbl">รายจ่ายประจำ / เดือน</div><div class="val tnum">${baht(fixedPerMonth())}</div></div>
      <div class="tile"><div class="lbl">เฉลี่ยวันละ</div><div class="val tnum">${baht(fixedPerDay())}</div></div>
      <div class="tile"><div class="lbl">กำไรเฉลี่ย / จาน</div><div class="val tnum">${baht(avgProfit())}</div></div>
    </div>
  </div>

  <div class="card">
    <h2>รายจ่ายประจำเดือน</h2>
    <p class="sub">ค่าที่ต้องจ่ายแม้วันนั้นขายไม่ได้เลย</p>
    <div class="grid g-auto">
      ${fld('rent','ค่าเช่าที่ / เดือน')}
      ${fld('electric','ค่าไฟ / เดือน')}
      ${fld('water','ค่าน้ำ / เดือน')}
      ${fld('gas','ค่าแก๊ส / เดือน')}
      ${fld('other','อื่น ๆ / เดือน','ค่าขนส่ง ค่าเน็ต')}
      ${fld('labor','ค่าแรงลูกจ้าง / วัน')}
      ${fld('days','เปิดขายกี่วัน / เดือน')}
      <div class="f"><label>อยากได้กำไรกี่ %</label>
        <input type="number" step="any" inputmode="decimal" value="${db.targetMargin}" oninput="setTarget(this.value)"></div>
    </div>
  </div>`;
}
let typedTimer = null;
function savedSoon(msg){                 // รอให้หยุดพิมพ์ก่อน แล้วค่อยบอกครั้งเดียว
  clearTimeout(typedTimer);
  typedTimer = setTimeout(() => toast(msg), 900);
}
function setFixed(k,v){ db.fixed[k]=n(v); save(); refreshFixed(); savedSoon('บันทึกค่าใช้จ่ายประจำแล้ว'); }
function setTarget(v){ db.targetMargin=n(v); save(); refreshFixed(); savedSoon('บันทึกกำไรที่อยากได้แล้ว'); }

// อัปเดตเฉพาะการ์ดสรุปด้านบน ไม่แตะการ์ดที่มีช่องกรอก
// (ถ้าวาดทั้งหน้าใหม่ ช่องที่กำลังพิมพ์อยู่จะหลุดโฟกัสทุกตัวอักษร)
function refreshFixed(){
  const cur = document.getElementById('fixedKpi');
  if(!cur) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = viewFixed();
  const next = tmp.querySelector('#fixedKpi');
  if(next) cur.replaceWith(next);
}

/* --------- ขั้นตอนเริ่มใช้งาน สำหรับคนที่เพิ่งเปิดครั้งแรก --------- */
function setupSteps(){
  return [
    {ok: db.ingredients.length > 0, tab:'ing',
     label:'ใส่ของที่ซื้อมา', sub:'แป้ง ไข่ นม เนย ไส้ — ซื้อมาเท่าไหร่ ราคาเท่าไหร่'},
    {ok: db.menus.some(m => (m.items||[]).length > 0), tab:'menu',
     label:'ใส่เมนูที่ขาย', sub:'ชื่อเมนู ราคาขาย แล้วเลือกว่าใช้ของอะไรบ้าง'},
    {ok: fixedPerMonth() > 0, tab:'fixed',
     label:'ใส่ค่าเช่า ค่าไฟ', sub:'ค่าที่ต้องจ่ายทุกเดือนแม้ขายไม่ได้'}
  ];
}
function stepsCard(){
  const steps = setupSteps();
  const done = steps.filter(s => s.ok).length;
  if(done === steps.length) return '';
  const next = steps.find(s => !s.ok);
  return `<div class="card">
    <h2>เริ่มใช้งาน — ทำไปแล้ว ${done} จาก ${steps.length} ขั้น</h2>
    <p class="sub">ทำครบแล้วแอปจะบอกได้ว่าเดือนนี้เหลือกำไรเท่าไหร่</p>
    <div class="steps">
      ${steps.map((s,i) => `
        <button class="step${s.ok?' done':''}" onclick="go('${s.tab}')">
          <span class="step-no">${s.ok ? icon('check',15) : (i+1)}</span>
          <span class="step-main">
            <span class="step-label">${s.label}</span>
            <span class="step-sub">${s.sub}</span>
          </span>
          ${s.ok ? '' : `<span class="li-chev">${icon('chev',16)}</span>`}
        </button>`).join('')}
    </div>
    <button class="btn primary block" style="margin-top:14px" onclick="go('${next.tab}')">
      ทำขั้นต่อไป: ${next.label}
    </button>
  </div>`;
}



/* ===================== หน้าขายแบบ POS =====================
   เปิดบิล → กดเมนูที่ลูกค้าสั่ง (กดซ้ำ = เพิ่มจำนวน) → ใส่ท็อปปิ้ง → รับเงิน
   บันทึกเป็นรายการแยกตามเมนู แต่ผูก bill เดียวกัน จะได้ดูย้อนหลังได้เหมือนเดิม */
/* ===================== เมนูจริงจากใบเมนูของร้าน =====================
   เครป: แป้ง 15 บาท แล้วบวกไส้ที่เลือก (ไส้ละ 5–10 บาท) ซอสราดฟรี
   โตเกียว: ไส้คาวคิดตามจำนวนไส้ (2 ไส้ 10 / 3 ไส้ 15) จึงแยกเป็น 2 เมนู */
function shopMenu(){
  const A = (name, price, group) => ({ id: uid(), name, price, group });

  const ไส้คาวเครป = [
    ['พิซซ่า',5], ['พริกเผา',5], ['ไก่หยอง',5],
    ['โบโลน่า',5], ['ไก่สับ',5], ['ไส้กรอก',5],
    ['ปูอัด',5], ['ไข่นก',5], ['ไข่ไก่',10], ['ยำสาหร่าย',10]
  ].map(([n,p]) => A(n, p, 'ไส้คาว'));

  const ไส้หวานเครป = [
    ['แยมสตรอเบอร์รี่',5], ['แยมบลูเบอร์รี่',5], ['ช็อกโกแลต',5],
    ['เยลลี่',5], ['โอริโอ้',5], ['ลูกเกด',5],
    ['มาร์ชเมลโลว์',5], ['ฝอยทอง',10]
  ].map(([n,p]) => A(n, p, 'ไส้หวาน'));

  const ซอสฟรี = ['ซอสพริก','ซอสมะเขือเทศ','มายองเนส','นมข้น','ช็อกโกแลต']
    .map(n => A(n, 0, 'ราดซอส (ฟรี)'));

  const ไส้โตเกียว = ['พริกเผา','พิซซ่า','ไข่นก','ปูอัด','ไส้กรอก','ไก่สับ','โบโลน่า','ไก่หยอง','สาหร่าย']
    .map(n => A(n, 0, 'ไส้โตเกียว (คาว)'));

  const ไส้หวานโตเกียว = ['ครีม','ครีมข้าวโพด','เผือกกวน'].map(n => A(n, 0, 'ไส้โตเกียว (หวาน)'));

  const M = (name, price, addons) => ({ id: uid(), name, price, qtyPerDay: 0, items: [], addons });

  return [
    M('เครป แป้งวานิลา', 15, [...ไส้คาวเครป, ...ไส้หวานเครป, ...ซอสฟรี]),
    M('เครป แป้งชาร์โคล', 15, [...ไส้คาวเครป.map(a=>({...a,id:uid()})),
                               ...ไส้หวานเครป.map(a=>({...a,id:uid()})),
                               ...ซอสฟรี.map(a=>({...a,id:uid()}))]),
    M('โตเกียวไส้คาว 2 ไส้', 10, [...ไส้โตเกียว, ...ซอสฟรี.map(a=>({...a,id:uid()}))]),
    M('โตเกียวไส้คาว 3 ไส้', 15, [...ไส้โตเกียว.map(a=>({...a,id:uid()})),
                                  ...ซอสฟรี.map(a=>({...a,id:uid()}))]),
    M('โตเกียวไส้หวาน 6 ชิ้น', 25, [...ไส้หวานโตเกียว,
                                     ...ซอสฟรี.map(a=>({...a,id:uid()}))]),

// ใส่เมนูจริงลงแอป โดยไม่แตะยอดขาย/รายจ่ายที่บันทึกไว้แล้ว
function loadShopMenu(){

  const go = () => {
    db.menus = shopMenu();

    migrateGroups(db);            // แตกไส้ในใบเมนูออกเป็นชุดไส้ที่ใช้ร่วมกัน

let order = null;   // {lines:[{menuId,name,price,qty,addons:[{name,price}]}]}

/* ===================== หมวดหมู่เมนู (ใช้ในหน้าขาย) ===================== */
// ร้านยังไม่เคยตั้งหมวด ให้เดาจากชื่อเมนูไปก่อน แก้เองได้ในหน้าตั้งค่า
const CAT_GUESS = ['เครป','โตเกียว','ไข่ป๋วง','แพนเค้ก','วาฟเฟิล','ขนมปัง','น้ำ'];
function menuCat(m){
  if(m.cat) return m.cat;
  const name = String(m.name || '');
  const hit = CAT_GUESS.find(c => name.includes(c));
  return hit || 'อื่น ๆ';
}
function allCats(){
  const out = [];
  db.menus.forEach(m => { const c = menuCat(m); if(!out.includes(c)) out.push(c); });
  return out;
}
let posCat = null;              // null = ดูทุกหมวด
let posQ = '';                  // คำที่พิมพ์ค้นหา
let quickPick = false;          // โหมดเลือกด่วน = โชว์แต่เมนูที่ขายดี
function pickCat(c){ posCat = (c === '*' ? null : c); quickPick = false; repaintPosList(); }

// เมนูที่ขายดีใน 7 วันล่าสุด ไว้ใช้ตอนเลือกด่วน
function hotMenuIds(){
  const days = new Set(lastNDays(dayKey(), 7).map(w => w.key));
  const cnt = new Map();
  (db.sales||[]).forEach(x => { if(days.has(x.d)) cnt.set(x.menuId, (cnt.get(x.menuId)||0) + n(x.qty)); });
  return [...cnt.entries()].sort((a,b) => b[1] - a[1]).slice(0,6).map(e => e[0]);
}
function toggleQuick(){ quickPick = !quickPick; if(quickPick) posCat = null; repaintPosList(); }

// เมนูที่ต้องโชว์ หลังกรองหมวด/คำค้น/เลือกด่วน
function posMenus(){
  let list = db.menus;
  if(quickPick){
    // เมนูขายดีที่ยังมีอยู่จริง — ถ้าเมนูถูกแทนที่ไปแล้ว (id เปลี่ยน) ต้องไม่โชว์รายการว่าง
    const hot = hotMenuIds().map(id => list.find(m => m.id === id)).filter(Boolean);
    if(hot.length) list = hot;
  }
  if(posCat) list = list.filter(m => menuCat(m) === posCat);
  const q = posQ.trim().toLowerCase();
  if(q) list = list.filter(m => String(m.name||'').toLowerCase().includes(q));
  return list;
}

// พิมพ์ค้นหาแล้ววาดแค่รายการเมนู ไม่วาดทั้งกล่อง ช่องพิมพ์จะได้ไม่หลุดโฟกัส
function posSearch(v){
  posQ = v;
  repaintPosList();
}
function repaintPosList(){
  const list = document.querySelector('.poslist');
  if(!list) return repaintOrder();
  list.innerHTML = posRowsHTML();
  plainButtons();
  const cats = document.querySelector('.dlg-body .cats');

  plainButtons();
}

function openPOS(){

    openDialog({ title:'ยังไม่มีเมนู', sub:'ตั้งเมนูกับราคาไว้ก่อน แล้วค่อยมาเปิดบิล',
      html:'<p style="margin:0;color:var(--ink-2)">ไปที่แท็บ <b>เมนู</b> กดปุ่ม <b>เพิ่ม</b> ใส่ชื่อกับราคาขาย แล้วกลับมาที่นี่ครับ</p>' });

function clearBill(){

}

const lineTotal = l => (n(l.price) + (l.addons||[]).reduce((s,a) => s + n(a.price), 0)) * n(l.qty);
const orderTotal = () => (order ? order.lines : []).reduce((s,l) => s + lineTotal(l), 0);
const orderCount = () => (order ? order.lines : []).reduce((s,l) => s + n(l.qty), 0);

// กดเมนู: ถ้าบรรทัดล่าสุดเป็นเมนูเดียวกันและยังไม่ใส่ท็อปปิ้ง ให้บวกจำนวนแทนการเพิ่มบรรทัดใหม่
function tapMenu(id){
  const m = findMenu(id); if(!m || !order) return;
  const last = order.lines.find(l => l.menuId === id && !(l.addons||[]).length);
  if(last){ last.qty = n(last.qty) + 1; repaintOrder(); return; }
  const line = { lid: uid(), menuId:id, name:m.name, price:n(m.price), qty:1, addons:[] };
  order.lines.push(line);
  repaintOrder();
  // เมนูที่มีไส้ ให้เลือกไส้ต่อเลย ไม่ต้องไปหาปุ่มเอง
  if(menuAddons(m).length) lineAddons(line.lid);
}
function lineQty(lid, v){
  const l = order.lines.find(x => x.lid === lid); if(!l) return;
  l.qty = n(l.qty) + v;
  if(l.qty <= 0) order.lines = order.lines.filter(x => x.lid !== lid);
  repaintOrder();
}
function delLine(lid){ order.lines = order.lines.filter(x => x.lid !== lid); repaintOrder(); }

// ใส่ท็อปปิ้งให้บรรทัดนั้น
function lineAddons(lid){
  const l = order.lines.find(x => x.lid === lid); if(!l) return;
  const m = findMenu(l.menuId);
  const tops = menuAddons(m);
  if(!tops.length){
    openDialog({ title:'เมนูนี้ยังไม่ได้ตั้งไส้', sub: m ? m.name : '',
      html:'<p style="margin:0;color:var(--ink-2)">ไปที่แท็บ <b>ตั้งค่า</b> → แตะเมนูนี้ → <b>ชุดไส้ที่ใส่ได้</b> แล้วติ๊กชุดไส้ที่ใช้ครับ</p>' });
    return;
  }
  // อ่านของที่เลือกใหม่ทุกครั้งที่วาด ไม่งั้นติ๊กแล้วปุ่มไม่เปลี่ยนสี
  const draw = () => openDialog({
    title:'เลือกไส้ / ท็อปปิ้ง',
    sub: topSumText(l),
    html: topsHTML(tops, new Set((l.addons||[]).map(a => a.name)), lid),
    onDismiss: () => { if(orderOpen) drawOrderDialog(); },
    foot:[{label:'เสร็จแล้ว', cls:'primary wide', fn:'repaintOrder()'}]
  });
  l._draw = draw;
  draw();
}

// บรรทัดสรุปใต้หัวกล่อง บอกว่าตอนนี้เลือกอะไรไปแล้วบ้าง บวกเงินเท่าไร
function topSumText(l){
  const picked = l.addons || [];
  if(!picked.length) return `${l.name} — แตะของที่ลูกค้าเลือก เลือกได้หลายอย่าง`;
  const extra = picked.reduce((s,a) => s + n(a.price), 0);
  return picked.map(a => a.name).join(' · ') + (extra ? ` · +${baht(extra)} บาท` : '');
}
function pickLineTop(lid, name, btn){
  const l = order.lines.find(x => x.lid === lid); if(!l) return;
  const m = findMenu(l.menuId);
  const a = menuAddons(m).find(x => x.name === name);
  if(!a) return;
  const has = (l.addons||[]).some(x => x.name === name);
  l.addons = has ? l.addons.filter(x => x.name !== name)
                 : [...(l.addons||[]), {name:a.name, price:n(a.price)}];
  // เปลี่ยนสีตรงปุ่มที่กดเลย ไม่วาดกล่องใหม่ จะได้ไม่เด้งกลับไปบนสุดตอนเลื่อนหาไส้หวาน
  if(btn && btn.classList) btn.classList.toggle('on', !has);
  else if(l._draw) l._draw();
  const sub = document.getElementById('dlgSub');
  if(sub) sub.textContent = topSumText(l);
}

function payBill(){
  if(!order || !order.lines.length) return;
  const d = dayKey(), t = nowTime(), bill = uid();
  order.lines.forEach(l => {
    (db.sales = db.sales || []).push({
      id: uid(), bill, d, t,
      menuId: l.menuId, name: l.name, qty: n(l.qty),
      addons: (l.addons||[]).map(a => ({name:a.name, price:n(a.price)})),
      total: lineTotal(l)
    });
  });
  const paid = orderTotal();
  order = null; orderOpen = false; save();
  dlg.close(); render();
  toast(`รับเงินแล้ว ${baht(paid)} บาท`);
}

/* ===================== หน้าขาย = รายการที่ขายไปแล้ววันนี้ ===================== */
// รวมรายการขายของวันนั้นเป็น "บิล"
function billsToday(key){
  const map = new Map();
  (db.sales||[]).filter(x => x.d === key).forEach(x => {
    const k = x.bill || x.id;
    const b = map.get(k) || {bill:k, t:x.t || '', lines:[], total:0, qty:0};
    b.lines.push(x); b.total += n(x.total); b.qty += n(x.qty);
    if((x.t||'') > b.t) b.t = x.t || b.t;
    map.set(k, b);
  });
  const mins = t => { const [h,m] = String(t||'').split(':').map(Number);
    return (isFinite(h) ? h : 0) * 60 + (isFinite(m) ? m : 0); };
  return [...map.values()].sort((a,b) => mins(b.t) - mins(a.t));
}

// เครื่องนี้ยังเป็นเมนูตัวอย่างอยู่ไหม (ดูจากว่ามีโตเกียวหรือยัง)

/* ===================== หลายร้านในแอปเดียว =====================
   แต่ละร้านมีเมนู ไส้ ยอดขาย รายจ่าย ของตัวเองแยกขาดจากกัน

function switchShop(id){

  histMonth = null; posCat = null; posQ = ''; quickPick = false;

// รายการร้านทั้งหมด ใช้ได้ทั้งในหน้าต่างสลับร้านและในหน้าตั้งค่า

/* ===================== ข้อความแจ้งหลังบันทึก / แก้ไข / ลบ =====================
   ทุกครั้งที่ข้อมูลถูกเปลี่ยนจริง ต้องมีข้อความบอก จะได้รู้ว่ากดติดแล้ว */
function cut(name, max){                 // ชื่อยาว ๆ ตัดให้พอดีข้อความแจ้ง
  const t = String(name || '').trim();
  if(!t) return '';
  return t.length > (max || 18) ? t.slice(0, max || 18) + '…' : t;
}
const savedMsg = (what, name, isNew) =>
  (isNew ? 'เพิ่ม' : 'แก้') + what + (name ? ' "' + cut(name) + '" ' : '') + 'แล้ว';
const delMsg = (what, name) => 'ลบ' + what + (name ? ' "' + cut(name) + '" ' : '') + 'แล้ว';

/* ข้อความแจ้งสั้น ๆ มุมล่าง */
let toastTimer = null;
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast'; el.className = 'toast';
    try{ el.setAttribute('popover', 'manual'); }catch(e){}
    document.body.appendChild(el);
  }
  el.textContent = msg;
  // ถ้ามีหน้าต่างเปิดอยู่ ต้องยกข้อความขึ้นชั้นบนสุดด้วย ไม่งั้นโดนบัง
  try{ if(el.showPopover && !el.matches(':popover-open')) el.showPopover(); }catch(e){}
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('on');
    setTimeout(() => { try{ if(el.hidePopover) el.hidePopover(); }catch(e){} }, 220);
  }, 2400);
}

/* ===================== กราฟยอดขาย 7 วันล่าสุด =====================
   แท่งเดียวชุดเดียว (ยอดขายรายวัน) จึงไม่ต้องมีคำอธิบายสี
   วันนี้เน้นสีเข้ม วันอื่นสีอ่อน · ป้ายตัวเลขใส่เฉพาะวันนี้กับวันที่ขายดีสุด */
function lastNDays(key, count){
  const out = [];
  const [y,m,d] = key.split('-').map(Number);
  for(let i = count - 1; i >= 0; i--){
    const dt = new Date(y, m-1, d - i);
    const k = dayKey(dt);
    out.push(Object.assign({key:k, dow:dt.getDay()}, sumDay(k)));
  }
  return out;
}

// ปัดขึ้นเป็นเลขกลม ๆ สำหรับเส้นบนสุดของกราฟ
function niceTop(v){
  if(v <= 0) return 100;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v / (mag/2)) * (mag/2);
}

function salesChart(key){ return ''; }   // ย้ายไปอยู่ในการ์ดของ Dashboard แล้ว

function chartBody(key, days){
  const maxSale = Math.max(...days.map(d => d.sale));
  if(maxSale <= 0) return '<div class="empty" style="padding:24px"><p style="margin:0">ยังไม่มียอดขายใน 7 วันนี้</p></div>';

  const top = niceTop(maxSale);
  const W = 340, H = 158;
  const padL = 10, padR = 10, padT = 30, base = 120, labelY = 139;
  const slot = (W - padL - padR) / days.length;
  const barW = Math.min(24, slot * 0.52);
  const best = days.reduce((a,b) => b.sale > a.sale ? b : a, days[0]);
  const DOW = ['อา','จ','อ','พ','พฤ','ศ','ส'];

  const bars = days.map((d,i) => {
    const x = padL + slot*i + (slot - barW)/2;
    const h = d.sale > 0 ? Math.max(3, (d.sale / top) * (base - padT)) : 0;
    const isToday = d.key === key;
    const fill = isToday ? 'var(--brand)' : 'var(--brand-l)';
    const showLabel = isToday || (d.key === best.key && best.sale > 0);
    const hitX = padL + slot*i;
    const open = `dayMoneyDialog('${d.key}')`;
    const say = `${thaiDate(d.key)} ขายได้ ${baht(d.sale)} บาท${d.exp ? ' ซื้อของ ' + baht(d.exp) + ' บาท' : ''} แตะเพื่อดูรายละเอียด`;
    return `<g class="cday" role="button" tabindex="0" aria-label="${esc(say)}"
         onclick="${open}"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${open}}">
      <title>${thaiDate(d.key)} — ขายได้ ${baht(d.sale)} บาท${d.exp ? ' · ซื้อของ ' + baht(d.exp) : ''} · แตะเพื่อดู</title>
      <rect class="cday-bg" x="${hitX.toFixed(1)}" y="${padT-16}" width="${slot.toFixed(1)}"
            height="${(labelY - padT + 22).toFixed(1)}" rx="8" fill="var(--soft)" opacity="0"/>
      ${h > 0 ? `<rect x="${x.toFixed(1)}" y="${(base-h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}"
            rx="4" ry="4" fill="${fill}"/>
        <rect x="${x.toFixed(1)}" y="${(base-4).toFixed(1)}" width="${barW.toFixed(1)}" height="4" fill="${fill}"/>`
        : `<rect x="${x.toFixed(1)}" y="${base-2}" width="${barW.toFixed(1)}" height="2" rx="1" fill="var(--line)"/>`}
      ${showLabel && h > 0 ? `<text x="${(x+barW/2).toFixed(1)}" y="${(base-h-9).toFixed(1)}"
            text-anchor="middle" font-size="11.5" font-weight="700"
            fill="var(--ink)">${baht(d.sale)}</text>` : ''}
      <text x="${(x+barW/2).toFixed(1)}" y="${labelY}" text-anchor="middle" font-size="10.5"
            font-weight="${d.key===key ? '800' : '600'}"
            fill="${d.key===key ? 'var(--ink)' : 'var(--muted)'}">${DOW[d.dow]}</text>
      <rect class="cday-hit" x="${hitX.toFixed(1)}" y="${padT-16}" width="${slot.toFixed(1)}"
            height="${(labelY - padT + 22).toFixed(1)}" fill="transparent" pointer-events="all"/>
    </g>`;
  }).join('');

  const avg = days.filter(d => d.sale > 0);
  const avgVal = avg.length ? avg.reduce((s,d) => s + d.sale, 0) / avg.length : 0;
  const avgY = base - (avgVal / top) * (base - padT);

  return `
    <div class="chart">
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
           aria-label="กราฟแท่งยอดขาย 7 วันล่าสุด สูงสุด ${baht(best.sale)} บาท">
        <line x1="${padL}" y1="${padT}" x2="${W-padR}" y2="${padT}" stroke="var(--line-2)" stroke-width="1"/>
        <text x="${padL}" y="${padT-7}" font-size="10" fill="var(--muted)" font-weight="600">${baht(top)}</text>
        ${avgVal > 0 ? `<line x1="${padL}" y1="${avgY.toFixed(1)}" x2="${W-padR}" y2="${avgY.toFixed(1)}"
              stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" opacity=".55"/>` : ''}
        <line x1="${padL}" y1="${base}" x2="${W-padR}" y2="${base}" stroke="var(--line)" stroke-width="1"/>
        ${bars}
      </svg>
    </div>
    <p class="hint" style="margin:8px 0 0">แตะแท่งไหนก็ได้ เพื่อดูว่าวันนั้นขายอะไรไปบ้าง</p>
    <details>
      <summary>ดูเป็นตัวเลข</summary>
      <table>
        <thead><tr><th>วัน</th><th>ขายได้</th><th>ซื้อของ</th><th>เหลือ</th></tr></thead>
        <tbody>${days.map(d => `<tr>
          <td>${thaiDate(d.key)}${d.key===key ? ' (วันนี้)' : ''}</td>
          <td class="n">${baht(d.sale)}</td>
          <td class="n">${baht(d.exp)}</td>
          <td class="n ${d.net>=0?'good':'bad'}">${baht(d.net)}</td>
        </tr>`).join('')}</tbody>
      </table>
    </details>`;
}

/* ===================== สถิติสำหรับหน้า Dashboard ===================== */

// เมนูขายดีของวันนั้น เรียงจากยอดเงินมากไปน้อย
function topMenus(key){
  const map = new Map();
  (db.sales||[]).filter(x => x.d === key).forEach(x => {
    const k = x.name || '(ไม่มีชื่อ)';
    const r = map.get(k) || {name:k, qty:0, baht:0};
    r.qty += n(x.qty); r.baht += n(x.total);
    map.set(k, r);
  });
  return [...map.values()].sort((a,b) => b.baht - a.baht);
}

// ไส้/ท็อปปิ้งที่ลูกค้าเพิ่มบ่อยที่สุดของวันนั้น
function topAddons(key){
  const map = new Map();
  (db.sales||[]).filter(x => x.d === key).forEach(x => {
    (x.addons||[]).forEach(a => {
      const r = map.get(a.name) || {name:a.name, qty:0};
      r.qty += n(x.qty);
      map.set(a.name, r);
    });
  });
  return [...map.values()].sort((a,b) => b.qty - a.qty);
}

// จำนวนบิลของวันนั้น (บิลเดียวอาจมีหลายรายการ)
function billsOf(key){
  const set = new Set();
  (db.sales||[]).filter(x => x.d === key).forEach(x => set.add(x.bill || x.id));
  return set.size;
}

// ช่วงเวลาที่ขายดี
const SLOTS = [['เช้า','ก่อน 11 โมง',0,11], ['กลางวัน','11 โมง–บ่าย 3',11,15],
               ['เย็น','บ่าย 3 เป็นต้นไป',15,24]];
function byTimeSlot(key){
  const out = SLOTS.map(([name,when]) => ({name, when, baht:0, qty:0}));
  (db.sales||[]).filter(x => x.d === key).forEach(x => {
    const h = parseInt(String(x.t||'0').slice(0,2), 10) || 0;
    const i = SLOTS.findIndex(([,,a,b]) => h >= a && h < b);
    if(i >= 0){ out[i].baht += n(x.total); out[i].qty += n(x.qty); }
  });
  return out;
}

// ค่าเฉลี่ยยอดขายของ N วันก่อนหน้า (ไม่นับวันนี้ และไม่นับวันที่ไม่ได้ขาย)
function avgSaleBefore(key, days){
  const list = allDays().filter(k => k < key).slice(0, days).map(k => sumDay(k).sale).filter(v => v > 0);
  if(!list.length) return 0;
  return list.reduce((a,b) => a + b, 0) / list.length;
}

// บรรทัดเทียบกับค่าเฉลี่ย ใช้วางใต้ตัวเลขวันนี้
function compareLine(key){
  const d = sumDay(key);
  const avg7 = avgSaleBefore(key, 7);
  const bills = billsOf(key);
  if(!d.sale) return '';
  const parts = [];
  if(bills) parts.push(`${bills} บิล · เฉลี่ยบิลละ ${baht(d.sale / bills)} บาท`);
  if(avg7 > 0){
    const diff = (d.sale - avg7) / avg7 * 100;
    const word = diff >= 5 ? `ดีกว่าปกติ ${Math.round(diff)}%`
               : diff <= -5 ? `น้อยกว่าปกติ ${Math.round(-diff)}%`
               : 'พอ ๆ กับปกติ';
    parts.push(`${word} (ปกติวันละ ${baht(avg7)})`);
  }
  return parts.length ? `<p class="hint" style="margin-top:14px">${parts.join(' · ')}</p>` : '';
}

// เส้นบาง ๆ พร้อมพื้นจาง ๆ จุดท้ายเน้นค่าปัจจุบัน
function sparkLine(vals, color, W, H){
  if(!vals.length) return '';
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const span = (max - min) || 1;
  const pad = 4;
  const x = i => pad + (W - pad*2) * (vals.length === 1 ? 0.5 : i / (vals.length - 1));
  const y = v => H - pad - ((v - min) / span) * (H - pad*2);
  const pts = vals.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area = `${pad},${H-pad} ${pts} ${(W-pad).toFixed(1)},${H-pad}`;
  const lx = x(vals.length-1), ly = y(vals[vals.length-1]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" aria-hidden="true">
    <polygon points="${area}" fill="${color}" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3.5" fill="${color}"
            stroke="var(--bg)" stroke-width="2"/>
  </svg>`;
}
// แท่งเล็ก ๆ แท่งสุดท้าย (วันนี้) เข้มกว่าเพื่อน
function miniBars(vals, color, W, H){
  if(!vals.length) return '';
  const max = Math.max(...vals, 1);
  const slot = W / vals.length, bw = Math.min(8, slot * 0.5);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" aria-hidden="true">
    ${vals.map((v,i) => {
      const h = Math.max(2, (v / max) * (H - 6));
      const bx = slot*i + (slot - bw)/2;
      return `<rect x="${bx.toFixed(1)}" y="${(H-h).toFixed(1)}" width="${bw.toFixed(1)}"
                height="${h.toFixed(1)}" rx="2" fill="${color}"
                opacity="${i === vals.length-1 ? 1 : .35}"/>`;
    }).join('')}
  </svg>`;
}

/* ---------- บันทึกการขาย (เลือกเมนู + ท็อปปิ้ง) ---------- */
let saleDraft = null;

function saleDialog(existing){
  if(!db.menus.length){
    openDialog({ title:'ยังไม่มีเมนู', sub:'ใส่เมนูที่ขายก่อน แล้วค่อยมาบันทึกการขาย',
      html:'<p style="margin:0;color:var(--ink-2)">ไปที่แท็บ <b>ตั้งค่า</b> แล้วกดปุ่ม <b>เพิ่ม</b> ในการ์ดเมนู เพื่อใส่ชื่อกับราคาขายก่อนครับ</p>' });
    return;
  }
  const first = db.menus[0];
  // รายการเก่าอาจชี้ไปเมนูที่ถูกลบหรือถูกแทนที่ไปแล้ว ต้องหาเมนูที่ใกล้เคียงให้ ไม่งั้นกดบันทึกแล้วเงียบ
  let mid = existing ? existing.menuId : first.id;
  let gone = false;
  if(!findMenu(mid)){
    const byName = db.menus.find(x => existing && x.name === existing.name);
    mid = byName ? byName.id : first.id;
    gone = true;
  }
  saleDraft = existing
    ? { menuId: mid, qty: n(existing.qty) || 1,
        picked: new Set((existing.addons||[]).map(a => a.name)),
        id: existing.id, t: existing.t, d: existing.d,
        oldName: gone ? (existing.name || '') : '' }
    : { menuId: mid, qty: 1, picked: new Set() };
  renderSaleDialog();
}

function saleTotal(){
  const m = findMenu(saleDraft.menuId);
  if(!m) return 0;
  const extra = menuAddons(m).filter(a => saleDraft.picked.has(a.name))
                             .reduce((s,a) => s + n(a.price), 0);
  return (n(m.price) + extra) * n(saleDraft.qty);
}

function renderSaleDialog(){
  const m = findMenu(saleDraft.menuId) || db.menus[0];
  const tops = menuAddons(m);
  openDialog({
    title: saleDraft.id ? 'แก้รายการขาย' : 'บันทึกการขาย',
    sub: saleDraft.oldName
      ? `เมนูเดิม "${saleDraft.oldName}" ไม่มีในร้านแล้ว — เลือกเมนูที่ใช้แทนด้านล่าง`
      : 'เลือกเมนู ใส่จำนวน แล้วติ๊กไส้ที่ลูกค้าเพิ่ม',
    html: `
      <div class="sec" style="margin-top:0">ขายอะไร</div>
      <div class="pills">${db.menus.map(x => `
        <button type="button" class="pill${x.id === saleDraft.menuId ? ' on' : ''}" onclick="pickMenu('${x.id}')">
          ${esc(x.name || '(ไม่มีชื่อ)')}<b>${baht(x.price)}</b>
        </button>`).join('')}</div>

      <div class="sec">กี่จาน</div>
      <div class="stepper">
        <button type="button" onclick="bumpQty(-1)" aria-label="ลด">−</button>
        <span id="saleQty">${n(saleDraft.qty)}</span>
        <button type="button" onclick="bumpQty(1)" aria-label="เพิ่ม">+</button>
      </div>

      ${tops.length ? `<div class="sec">ท็อปปิ้งที่เพิ่ม</div>
      <div class="tops">${tops.map(a => `
        <button type="button" class="top${saleDraft.picked.has(a.name) ? ' on' : ''}" onclick="toggleTop('${jsq(a.name)}')">
          ${esc(a.name)} <b>${n(a.price) > 0 ? '+' + baht(a.price) : 'ฟรี'}</b>
        </button>`).join('')}</div>`
      : `<p class="hint">เมนูนี้ยังไม่ได้ตั้งไส้ — ตั้งได้ที่แท็บ <b>ตั้งค่า</b></p>`}

      <div class="dlg-live" style="margin-top:18px" id="saleSum">รวม ${baht(saleTotal())} บาท</div>`,
    foot: [
      {label:'ยกเลิก', cls:'ghost', fn:'dlg.close()'},
      {label: saleDraft.id ? 'บันทึกการแก้ไข' : 'บันทึก', cls:'primary', fn:'commitSale()'},
      ...(saleDraft.id ? [{label:'ลบ', cls:'danger', fn:`dlg.close(); delEntry('sale','${saleDraft.id}')`}] : [])
    ]
  });
}
function pickMenu(id){ saleDraft.menuId = id; saleDraft.picked = new Set(); renderSaleDialog(); }
function bumpQty(v){
  saleDraft.qty = Math.max(1, n(saleDraft.qty) + v);
  const q = document.getElementById('saleQty'); if(q) q.textContent = saleDraft.qty;
  const t = document.getElementById('saleSum'); if(t) t.textContent = 'รวม ' + baht(saleTotal()) + ' บาท';
}
function toggleTop(name){
  if(saleDraft.picked.has(name)) saleDraft.picked.delete(name); else saleDraft.picked.add(name);
  renderSaleDialog();
}
function commitSale(){
  const m = findMenu(saleDraft.menuId);
  if(!m) return toast('เลือกเมนูก่อนนะครับ');
  const addons = menuAddons(m).filter(a => saleDraft.picked.has(a.name))
                              .map(a => ({name:a.name, price:n(a.price)}));
  const rec = {
    id: saleDraft.id || uid(),
    d: saleDraft.d || dayKey(),
    t: saleDraft.t || nowTime(),
    menuId: m.id, name: m.name, qty: n(saleDraft.qty),
    addons, total: saleTotal()
  };
  const i = (db.sales||[]).findIndex(x => x.id === rec.id);
  const iBefore = (db.sales||[]).length;
  if(i >= 0) db.sales[i] = rec; else (db.sales = db.sales||[]).push(rec);
  const wasEdit = !!saleDraft.id && (db.sales||[]).length === iBefore;
  saleDraft = null; save(); dlg.close(); render();
  toast((wasEdit ? 'แก้รายการขาย' : 'บันทึกการขาย') + ' "' + cut(rec.name) + '" แล้ว ฿' + baht(rec.total));
}

    extraFoot: existing ? {label:'ลบ', cls:'danger', fn:`dlg.close(); delEntry('exp','${existing ? existing.id : ''}')`} : null,
    save: v => {
      const rec = { id: existing ? existing.id : uid(),
                    d: existing ? existing.d : dayKey(),
                    t: existing ? existing.t : nowTime(),
                    note: v.note.trim(), amount: v.amount };
      const i = (db.expenses||[]).findIndex(x => x.id === rec.id);
      if(i >= 0) db.expenses[i] = rec; else (db.expenses = db.expenses||[]).push(rec);
      save(); render();
      toast(savedMsg('รายจ่าย', rec.note, !existing) + ' ฿' + baht(rec.amount));
    }
  });
}

/* ---------- แตะรายการเพื่อแก้ / ลบ ---------- */
function editEntry(kind, id){
  if(kind === 'sale'){
    const e = (db.sales||[]).find(x => x.id === id);
    if(e) saleDialog(e);
  }else{
    const e = (db.expenses||[]).find(x => x.id === id);
    if(e) expenseDialog(e);
  }
}
function delEntry(kind, id){
  if(!adminOk(() => delEntry(kind, id))) return;
  const isSale = kind === 'sale';
  const gone = (isSale ? (db.sales||[]) : (db.expenses||[])).find(x => x.id === id);
  if(isSale) db.sales = (db.sales||[]).filter(x => x.id !== id);
  else db.expenses = (db.expenses||[]).filter(x => x.id !== id);
  save(); render();
  toast(delMsg(isSale ? 'รายการขาย' : 'รายจ่าย', gone ? (isSale ? gone.name : gone.note) : ''));
}

/* ===================== หน้า "ย้อนหลัง" ===================== */
/* ===================== ย้อนหลัง ===================== */
let histMonth = null;              // เดือนที่กำลังดู null = เดือนล่าสุดที่มีข้อมูล
let histSort = 'date';             // 'date' = วันใหม่ก่อน, 'net' = กำไรเยอะก่อน
let histOnlyBig = false;           // ดูเฉพาะวันที่ขายเกินเกณฑ์

function allMonths(){
  return [...new Set(allDays().map(monthKey))].sort().reverse();
}
function curMonth(){
  const all = allMonths();
  if(histMonth && all.includes(histMonth)) return histMonth;
  return all[0] || monthKey(dayKey());
}
// เลื่อนไปเดือนที่มีข้อมูลถัดไป (รายการเรียงใหม่→เก่า)
function shiftMonth(step){
  const all = allMonths();
  const i = all.indexOf(curMonth());
  const next = all[i + step];
  if(!next) return;
  histMonth = next; render(); window.scrollTo({top:0});
}
function setHistSort(v){ histSort = v; render(); }
function toggleHistBig(){ histOnlyBig = !histOnlyBig; render(); }

// เกณฑ์ "ขายดี" = ยอดเฉลี่ยต่อวันปัดขึ้นหลักร้อย
function bigDayCut(keys){
  if(!keys.length) return 0;
  const avg = keys.reduce((a,k) => a + sumDay(k).sale, 0) / keys.length;
  return Math.max(100, Math.round(avg / 100) * 100);
}

    </div></div>`;

    </div>
    <p class="hint" style="margin:14px 0 0">เฉลี่ยขายวันละ ฿${baht(avgSale)}</p>
    <div class="mon3">
      <div><span>เงินเข้า</span><b>${money(m.sale)}</b></div>
      <div><span>เงินออก</span><b>${money(m.exp)}</b></div>
      <div><span>${m.net>=0?'เหลือ':'ขาดทุน'}</span><b class="${m.net>=0?'good':'bad'}">${money(Math.abs(m.net))}</b></div>
    </div>
    <button type="button" class="seeall" onclick="monthMoneyDialog('${mk}')">
      ${icon('sum',14)} ดูรายรับ-รายจ่ายของเดือนนี้ทั้งหมด</button>
  </div>

  <div class="card">
    ${cardHead('hist','แต่ละวันขายได้เท่าไหร่','แท่งยาว = วันนั้นขายดี · แตะเพื่อดูรายการของวันนั้น')}
    <div class="cats">
      <button type="button" class="cat${!histOnlyBig && histSort==='date' ? ' on' : ''}"
              onclick="histOnlyBig=false; setHistSort('date')">ทั้งหมด <b>${inMonth.length}</b></button>
      <button type="button" class="cat${histOnlyBig ? ' on' : ''}" onclick="toggleHistBig()">ขายเกิน ฿${baht(cut)}</button>
      <button type="button" class="cat${histSort==='net' ? ' on' : ''}" onclick="setHistSort('net')">เรียงตามกำไร</button>
    </div>
    ${shown.length ? `<div class="dayx">${shown.map(k => {
      const s = sumDay(k);
      return `<button type="button" class="dayx-row" onclick="dayMoneyDialog('${k}')">
        <span class="dayx-top">
          <span class="dayx-d">${thaiDate(k)}</span>

/* ===================== รายรับ-รายจ่าย =====================
   รายจ่ายไม่ได้เก็บไว้เฉย ๆ — มันถูกหักออกจากยอดขายเป็น "เหลือ" ทั้งในวันและในเดือน
   ส่วนนี้ทำให้ดูได้ว่าเงินเข้าเท่าไร ออกเท่าไร และออกไปกับอะไรบ้าง */

// สรุปสามบรรทัด: เข้า / ออก / เหลือ
function moneyBox(sale, exp){
  const net = sale - exp;
  return `<div class="mbox">
    <div class="mbox-row in">
      <span class="mbox-ic">${icon('up',15)}</span>
      <span class="mbox-k">เงินเข้า (ขายได้)</span>

    <div class="mbox-row net">
      <span class="mbox-ic">${icon('sum',15)}</span>
      <span class="mbox-k">${net >= 0 ? 'เหลือ' : 'ขาดทุน'}</span>

// รายการรายจ่าย เรียงใหม่ก่อน พร้อมวันที่ถ้าดูหลายวัน

// รายจ่ายของทั้งเดือน จัดกลุ่มตามหัวข้อที่ซื้อซ้ำ ๆ
function expByNote(mk){
  const list = (db.expenses||[]).filter(x => monthKey(x.d) === mk);
  const map = new Map();
  list.forEach(x => {
    const k = String(x.note || 'ซื้อของ').trim();
    const row = map.get(k) || {note:k, total:0, times:0};
    row.total += n(x.amount); row.times++;
    map.set(k, row);
  });
  return [...map.values()].sort((a,b) => b.total - a.total);
}

      <h2>ภาพรวมร้าน</h2>

      <button class="btn primary block" onclick="editSales()">ใส่ยอดขายต่อวัน</button>

    </div>`);
  }else{
    /* --- ตัวเลขหลัก --- */

    blocks.push(`<div class="card">
      <h2>ยอดขายที่ใช้คำนวณ</h2>
      <p class="sub">ขายวันละ ${d.plates} จาน · เดือนละ ${n(db.fixed.days)} วัน · ค่าเช่า+ค่าไฟวันละ ${baht(d.fixed)} บาท</p>
      <button class="btn block" onclick="editSales()">แก้ยอดขายต่อวัน</button>

        <h2>เงินที่ขายได้ไปไหนบ้าง</h2>
        <p class="sub">จากรายได้ ${baht(d.revenue)} บาทต่อวัน</p>

          <i style="width:${pw}%; background:${d.net>=0?'var(--brand-d)':'var(--bad)'}"></i>
        </div>

          <span><i style="background:var(--brand-mid)"></i>ค่าเช่า/ค่าไฟ <b>${xw.toFixed(0)}%</b> · ${baht(d.fixed)}</span>
          <span><i style="background:${d.net>=0?'var(--brand-d)':'var(--bad)'}"></i>${d.net>=0?'เหลือเป็นกำไร':'ขาดทุน'} <b>${pw.toFixed(0)}%</b> · ${baht(d.net)}</span>
        </div>
      </div>`);
    }

    /* --- จุดคุ้มทุน --- */
    if(d.need > 0){
      const pct = clamp(d.plates / d.need * 100, 0, 100);
      const ok = d.plates >= d.need;
      blocks.push(`<div class="card">
        <h2>ขายพอคุ้มแล้วหรือยัง</h2>
        <p class="sub">ต้องขายให้ได้ ${Math.ceil(d.need)} จาน ถึงจะพอจ่ายค่าเช่าและค่าไฟ</p>

      </div>`);
    }

    /* --- เมนูไหนทำเงินให้ร้านมากสุด --- */
    const earners = db.menus
      .map(m => ({m, total: profit(m) * n(m.qtyPerDay)}))
      .filter(x => n(x.m.qtyPerDay) > 0)
      .sort((a,b) => b.total - a.total);
    if(earners.length){
      const top = Math.max(...earners.map(x => Math.abs(x.total))) || 1;
      blocks.push(`<div class="card">
        <h2>เมนูไหนทำเงินให้ร้านมากสุด</h2>
        <p class="sub">กำไรต่อจาน × จำนวนที่ขายได้ — ไม่ใช่เมนูที่ %กำไรสูงสุดเสมอไป</p>

            <div class="meter ${x.total>=0?'':'is-bad'}"><i style="width:${clamp(Math.abs(x.total)/top*100,2,100)}%"></i></div>

          </div>`).join('')}</div>
      </div>`);
    }
  }

  return back + blocks.join('') + viewSum();
}

/* หน้าต่างกรอกยอดขายของทุกเมนูในทีเดียว */
function editSales(){
  openDialog({
    title:'ยอดขายต่อวัน',
    sub:'กะคร่าว ๆ ว่าแต่ละเมนูขายได้วันละกี่จาน',
    fields: db.menus.map(m => ({
      k:'q_'+m.id, label:(m.name || '(ไม่มีชื่อ)') + ' — จาน/วัน',
      type:'number', value:n(m.qtyPerDay) || '', wide:true
    })),
    live: v => {
      let rev=0, food=0, plates=0;
      db.menus.forEach(m => {
        const q = n(v['q_'+m.id]);
        plates += q; rev += n(m.price)*q; food += menuCost(m)*q;
      });
      if(!plates) return 'ใส่ตัวเลขแล้วจะคำนวณให้ทันที';
      const net = rev - food - fixedPerDay();
      return `ขายวันละ ${plates} จาน → กำไรสุทธิ ${baht(net)} บาท/วัน`;
    },
    check: v => Object.values(v).some(x => n(x) < 0) ? 'จำนวนจานติดลบไม่ได้' : null,
    save: v => {
      db.menus.forEach(m => m.qtyPerDay = n(v['q_'+m.id]));
      save(); render();
      toast('บันทึกจำนวนจานต่อวันแล้ว');
    }
  });
}

/* --------- ส่วนเปรียบเทียบเมนู (อยู่ท้ายหน้าภาพรวม) --------- */
function viewSum(){
  if(!db.menus.length) return '';
  const sorted = [...db.menus].sort((a,b) => marginPct(b) - marginPct(a));
  const worst = sorted[sorted.length-1];

  const bars = sorted.map(m => {
    const mg = marginPct(m), lv = level(mg);
    return `<div class="rank-row">
      <div class="rank-name">${esc(m.name||'(ไม่มีชื่อ)')}</div>
      <div class="rank-val ${lv}">${mg.toFixed(1)}%</div>
      <div class="meter is-${lv}"><i style="width:${clamp(mg,0,100)}%"></i></div>
      <div class="rank-sub">ขาย ${baht(m.price)} · ต้นทุน ${baht(menuCost(m))} · กำไร ${baht(profit(m))} บาท</div>
    </div>`;
  }).join('');

  const rows = sorted.map(m => {
    const mg = marginPct(m);
    return `<tr>
      <td>${esc(m.name||'(ไม่มีชื่อ)')}</td>
      <td class="n">${baht(menuCost(m))}</td>
      <td class="n">${baht(m.price)}</td>
      <td class="n ${profit(m)>=0?'good':'bad'}">${baht(profit(m))}</td>
      <td class="n ${level(mg)}">${mg.toFixed(1)}%</td>
      <td class="n">${baht(suggestPrice(m))}</td>
    </tr>`;
  }).join('');

  const tips = [];
  if(worst && marginPct(worst) < n(db.targetMargin))
    tips.push(`<b>${esc(worst.name||'(ไม่มีชื่อ)')}</b> กำไรบางสุดที่ ${marginPct(worst).toFixed(1)}% — ลองขึ้นราคาเป็น ${baht(suggestPrice(worst))} บาท หรือลดปริมาณไส้ลง`);
  if(breakEven())
    tips.push(`ต้องขายให้ได้วันละ <b>${Math.ceil(breakEven())} จาน</b> ถึงจะคุ้มค่าเช่าและค่าไฟ`);
  if(!fixedPerMonth())
    tips.push(`ยังไม่ได้ใส่ต้นทุนคงที่ — ตัวเลขกำไรที่เห็นยังไม่ได้หักค่าเช่ากับค่าไฟ`);

  return `
  <div class="card">
    <h2>เมนูไหนกำไรดี</h2>
    <p class="sub">ยิ่งแท่งยาวยิ่งดี · ร้านอาหารทั่วไปควรได้ 60% ขึ้นไป</p>
    <div class="rank">${bars}</div>
  </div>

  <div class="card">
    <details>
      <summary>ดูตารางสรุปแบบเต็ม</summary>
    <div class="scroll">
      <table>
        <thead><tr><th>เมนู</th><th>ต้นทุน</th><th>ขาย</th><th>กำไร</th><th>กำไร %</th><th>แนะนำ</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="hint">เลื่อนตารางไปทางซ้ายเพื่อดูคอลัมน์ที่เหลือ</p>
    </details>
  </div>

  ${tips.length ? `<div class="card"><h2>ข้อสังเกต</h2>
    ${tips.map(t=>`<div class="note">${t}</div>`).join('')}</div>` : ''}`;
}

/* ---------- เลือกว่าเมนูนี้ใช้ชุดไส้ไหนบ้าง ---------- */
function pickGroups(menuId){
  if(!adminOk(() => pickGroups(menuId))) return;
  const m = findMenu(menuId); if(!m) return;
  const picked = new Set(m.groupIds || []);
  openDialog({
    title: 'เมนูนี้ใส่อะไรได้บ้าง',
    sub: esc(m.name || '(ไม่มีชื่อ)'),
    html: (db.groups||[]).length
      ? `<div class="picks">${db.groups.map(g => `
          <div class="pick${picked.has(g.id) ? ' on' : ''}">
            <button class="pick-box" onclick="toggleMenuGroup('${menuId}','${g.id}')"
                    aria-pressed="${picked.has(g.id)}">${icon('check',15)}</button>
            <div class="pick-main" onclick="toggleMenuGroup('${menuId}','${g.id}')">
              <div class="li-title">${esc(g.name)}</div>
              <div class="li-sub">${g.items.length} อย่าง · ${g.items.slice(0,4).map(i => esc(i.name)).join(' ')}${g.items.length > 4 ? ' …' : ''}</div>
            </div>
          </div>`).join('')}</div>`
      : `<p style="margin:0;color:var(--ink-2)">ยังไม่มีชุดไส้ — กด <b>เพิ่มชุด</b> ในหน้าตั้งค่าก่อนครับ</p>`,
    foot: [{label:'เสร็จแล้ว', cls:'primary', fn:'dlg.close(); render()'}]
  });
}
function toggleMenuGroup(menuId, gid){
  const m = findMenu(menuId); if(!m) return;
  const ids = new Set(m.groupIds || []);
  if(ids.has(gid)) ids.delete(gid); else ids.add(gid);
  m.groupIds = [...ids];
  save(); pickGroups(menuId);          // เปิดหน้าต่างเดิมซ้ำเพื่อให้เห็นติ๊กเปลี่ยน
  const g = findGroup(gid);
  toast((ids.has(gid) ? 'ใส่ชุด' : 'เอาชุด') + ' "' + cut(g ? g.name : '') + '" ' + (ids.has(gid) ? 'ให้' : 'ออกจาก') + 'เมนูนี้แล้ว');
}

/* ---------- ชุดไส้: สร้าง / เปลี่ยนชื่อ / ลบ ---------- */
function groupDialog(g){
  if(!adminOk(() => groupDialog(g))) return;
  openDialog({
    title: g ? 'เปลี่ยนชื่อชุด' : 'เพิ่มชุดไส้',
    sub: g ? '' : 'เช่น ไส้คาว · ไส้หวาน · ราดซอส (ฟรี)',
    fields: [{k:'name', label:'ชื่อชุด', type:'text', value: g ? g.name : '',
              placeholder:'เช่น ไส้คาว', wide:true}],
    check: v => !v.name.trim() ? 'ใส่ชื่อชุดด้วย' : null,
    extraFoot: g ? {label:'ลบชุด', cls:'danger', fn:`dlg.close(); delGroup('${g.id}')`} : null,
    save: v => {
      if(g) g.name = v.name.trim();
      else (db.groups = db.groups||[]).push({id:uid(), name:v.name.trim(), items:[]});
      save(); render();
      toast(savedMsg('ชุดไส้', v.name.trim(), !g));
    }
  });
}
function delGroup(gid){
  if(!adminOk(() => delGroup(gid))) return;
  const g = findGroup(gid); if(!g) return;
  const used = db.menus.filter(m => (m.groupIds||[]).includes(gid)).length;
  askConfirm(`ลบชุด "${g.name}" ?`,
    used ? `ชุดนี้ถูกใช้อยู่ใน ${used} เมนู ลบแล้วเมนูเหล่านั้นจะเลือกไส้ชุดนี้ไม่ได้อีก`
         : 'ยังไม่มีเมนูไหนใช้ชุดนี้',
    'ลบ', () => {
      const nm = g.name;
      db.groups = (db.groups||[]).filter(x => x.id !== gid);
      db.menus.forEach(m => m.groupIds = (m.groupIds||[]).filter(x => x !== gid));
      save(); tab = 'setup'; render();
      toast(delMsg('ชุดไส้', nm));
    });
}

/* ---------- แก้ไส้ในชุด ---------- */
function groupEditor(gid){
  if(!adminOk(() => groupEditor(gid))) return;
  const g = findGroup(gid); if(!g) return;
  const rows = g.items.map((it,i) => `
    <div class="li" role="button" tabindex="0" onclick="groupItemDialog('${gid}',${i})"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();groupItemDialog('${gid}',${i})}">
      <div class="li-main"><div class="li-title">${esc(it.name)}</div></div>
      <div class="li-end">
        <span class="chip">${n(it.price) > 0 ? '+' + baht(it.price) : 'ฟรี'}</span>
        <span class="li-chev">${icon('chev',16)}</span>
      </div>
    </div>`).join('');
  openDialog({
    title: esc(g.name),
    sub: `${g.items.length} อย่าง · แตะเพื่อแก้ชื่อหรือราคา`,
    html: `<div class="list">${rows || '<div class="empty" style="padding:18px">ยังไม่มีไส้ในชุดนี้</div>'}</div>`,
    foot: [
      {label:'เปลี่ยนชื่อชุด', cls:'ghost', fn:`dlg.close(); groupDialog(findGroup('${gid}'))`},
      {label:'เพิ่มไส้', cls:'primary', fn:`groupItemDialog('${gid}',-1)`}
    ]
  });
}
function groupItemDialog(gid, idx){
  if(!adminOk(() => groupItemDialog(gid, idx))) return;
  const g = findGroup(gid); if(!g) return;
  const cur = idx >= 0 ? g.items[idx] : null;
  openDialog({
    title: cur ? 'แก้ไส้' : 'เพิ่มไส้',
    sub: `ในชุด ${g.name}`,
    fields: [
      {k:'name', label:'ชื่อไส้', type:'text', value: cur ? cur.name : '', placeholder:'เช่น ไก่หยอง', wide:true},
      {k:'price', label:'คิดเพิ่มกี่บาท (ฟรีใส่ 0)', type:'number', value: cur ? cur.price : '', wide:true}
    ],
    check: v => !v.name.trim() ? 'ใส่ชื่อไส้ด้วย' : v.price < 0 ? 'ราคาติดลบไม่ได้' : null,
    extraFoot: cur ? {label:'ลบ', cls:'danger', fn:`dlg.close(); delGroupItem('${gid}',${idx})`} : null,
    save: v => {
      const data = {name:v.name.trim(), price:n(v.price)};
      if(cur) Object.assign(cur, data);
      else g.items.push(Object.assign({id:uid()}, data));
      save(); render(); groupEditor(gid);
      toast(savedMsg('ไส้', data.name, !cur));
    }
  });
}
function delGroupItem(gid, idx){
  if(!adminOk(() => delGroupItem(gid, idx))) return;
  const g = findGroup(gid); if(!g) return;
  const gone = g.items[idx];
  g.items.splice(idx,1); save(); render(); groupEditor(gid);
  toast(delMsg('ไส้', gone ? gone.name : ''));
}

/* ===================== สำรอง / กู้คืน ===================== */
function openBackup(){
  if(!adminOk(() => openBackup())) return;
  const box = document.getElementById('backup');
  document.getElementById('dump').value = JSON.stringify(store);
  document.getElementById('bkMsg').textContent = '';
  box.hidden = false;
  box.scrollIntoView({behavior:'smooth', block:'start'});
}
function closeBackup(){ document.getElementById('backup').hidden = true; }
function bkMsg(t){ document.getElementById('bkMsg').textContent = t; }

async function copyDump(){
  const ta = document.getElementById('dump');
  try{
    await navigator.clipboard.writeText(ta.value);
    bkMsg('คัดลอกแล้ว — เอาไปวางเก็บไว้ที่ไหนก็ได้');
  }catch(e){
    ta.select(); bkMsg('กดค้างที่ข้อความแล้วเลือก "คัดลอก" เองนะครับ');
  }
}
function restoreText(){
  const txt = document.getElementById('paste').value.trim();
  if(!txt) return bkMsg('ยังไม่ได้วางข้อความ');
  if(!applyData(txt)) return bkMsg('ข้อความไม่ถูกต้อง ลองคัดลอกมาใหม่ทั้งก้อน');
  bkMsg('กู้คืนเรียบร้อย');
}
function applyData(raw){
  try{
    const data = JSON.parse(raw);
    // ก้อนใหม่ = มีหลายร้าน / ก้อนเก่า = ร้านเดียว ใส่ทับร้านที่กำลังใช้อยู่
    if(data && Array.isArray(data.shops) && data.shops.length){
      const wasLocked = store && store.locked;
      const keepPin = store && store.pin;
      store = { shops: data.shops.map((x,i) => fixShop(x, 'ร้านที่ ' + (i+1))), active: data.active };
      if(data.pin && data.pin.h) store.pin = data.pin; else if(keepPin) store.pin = keepPin;
      if(wasLocked && store.shops.some(x => x.id === wasLocked)){ store.locked = wasLocked; store.active = wasLocked; }
      if(!store.shops.some(x => x.id === store.active)) store.active = store.shops[0].id;
      db = curShop(); save(); render();
      toast('กู้คืนข้อมูลแล้ว ' + store.shops.length + ' ร้าน');
      return true;
    }
    if(!data || !Array.isArray(data.ingredients)) return false;
    setShopData(data); render();
    toast('กู้คืนข้อมูลลงร้าน "' + cut(db.shopName) + '" แล้ว');
    return true;
  }catch(e){ return false; }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(store,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `สมุดร้าน-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(input){
  const file = input.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    bkMsg(applyData(r.result) ? 'กู้คืนจากไฟล์เรียบร้อย' : 'ไฟล์ไม่ถูกต้อง');
    input.value = '';
  };
  r.readAsText(file);
}

// ใส่ท็อปปิ้ง + สร้างประวัติย้อนหลังให้ข้อมูลตัวอย่าง จะได้เห็นว่าหน้าย้อนหลังหน้าตาเป็นยังไง
function seedHistory(d){
  const tops = [
    {id:uid(), name:'เพิ่มไข่', price:10},
    {id:uid(), name:'เพิ่มชีส', price:15},
    {id:uid(), name:'เพิ่มนูเทลล่า', price:20}
  ];
  d.menus.forEach(m => m.addons = tops.map(t => ({...t, id:uid()})));

  const today = new Date();
  for(let back = 13; back >= 0; back--){
    const dt = new Date(today); dt.setDate(today.getDate() - back);
    if(dt.getDay() === 1) continue;                       // สมมติปิดวันจันทร์
    const key = dayKey(dt);
    const busy = 0.75 + ((back * 37) % 55) / 100;          // ให้แต่ละวันไม่เท่ากัน
    d.menus.forEach((m, mi) => {
      const q = Math.max(1, Math.round(n(m.qtyPerDay) * busy));
      const add = (mi + back) % 3 === 0 ? [m.addons[(back + mi) % m.addons.length]] : [];
      const extra = add.reduce((a,x) => a + x.price, 0);
      d.sales.push({
        id: uid(), d: key, t: pad2(10 + mi*3) + ':' + pad2((back*7) % 60),
        menuId: m.id, name: m.name, qty: q,
        addons: add.map(x => ({name:x.name, price:x.price})),
        total: (n(m.price) + extra) * q
      });
    });
    if(back % 3 === 0){
      d.expenses.push({ id:uid(), d:key, t:'08:20', note:'ซื้อของเข้าร้าน',
                        amount: 380 + ((back*53) % 240) });
    }
  }
  d.expenses.push({ id:uid(), d: dayKey(), t:'08:10', note:'ค่าแก๊ส', amount:400 });
  return d;
}

/* ===================== เริ่มทำงาน ===================== */
// เปิดผ่านลิงก์จะดาวน์โหลดไฟล์ไม่ได้ — ซ่อนปุ่มนั้น ใช้ปุ่มคัดลอกแทน
if(window.claude){
  const b = document.getElementById('dlBtn');
  if(b) b.hidden = true;
}
// ติดตั้งเป็นแอป + ใช้งานตอนไม่มีเน็ต (ต้องเป็น https หรือ localhost)
if('serviceWorker' in navigator && !window.claude
   && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.update();                              // เช็กของใหม่ทุกครั้งที่เปิดแอป
      // ได้ของใหม่มาแล้วและมีตัวเก่าคุมอยู่ → โหลดหน้าใหม่ให้เลย จะได้ไม่ต้องกด refresh เอง
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', () => {
          if(sw.state === 'installed' && navigator.serviceWorker.controller) location.reload();
        });
      });
    }).catch(()=>{});
  });
}

render();

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e2600a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ต้นทุนเครป">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<title>คำนวณต้นทุนร้านเครป</title>
<style>
  /* ===================== ธีมขาว–ส้ม (เรียบ) ===================== */
  :root{
    --bg:#ffffff;
    --soft:#faf8f6;          /* พื้นช่องกรอก / แถบอ่อน */
    --tint:#fff2e8;          /* ส้มอ่อนมาก */
    --line:#ece7e2;
    --line-2:#f4f0ec;

    --ink:#1b1715;           /* ดำอมน้ำตาล อ่านสบายกว่าดำล้วน */
    --ink-2:#57504a;
    --muted:#9a918a;

    --orange:#e2600a;        /* สีหลัก ใช้กับตัวเลขใหญ่และปุ่มหลัก */
    --orange-d:#a8450a;      /* ส้มเข้ม สำหรับตัวหนังสือเล็ก */
    --orange-l:#f8cfa6;      /* ส้มอ่อน */
    --orange-mid:#f0a055;    /* ส้มกลาง */

    --good:#15803d;  --good-ink:#15803d;  --good-bg:#edf7f0;
    --warn:#a16207;  --warn-ink:#8a5a06;  --warn-bg:#fdf6e3;
    --bad:#b91c1c;   --bad-ink:#b91c1c;   --bad-bg:#fdeeee;

    --nav-h:62px;
    color-scheme: light;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font-family:"Sarabun","Leelawadee UI","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.65; -webkit-text-size-adjust:100%;
  }

  /* ===================== โครง: ขาวล้วน คอลัมน์เดียว ===================== */
  .shell{
    width:100%; max-width:640px; margin:0 auto; min-height:100dvh;
    padding-top:env(safe-area-inset-top, 0px);
  }

  .appbar{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
    background:var(--bg); padding:20px 20px 12px;
    display:flex; align-items:center; gap:12px;
  }
  .appbar::after{
    content:''; position:absolute; left:20px; right:20px; bottom:0; height:1px;
    background:var(--line); opacity:0; transition:opacity .2s;
  }
  .appbar.stuck::after{opacity:1}
  .titles{flex:1; min-width:0}
  .titles h1{font-size:25px; margin:0; font-weight:800; letter-spacing:-.035em; line-height:1.2}
  .titles p{display:none}
  .icon-btn{
    width:38px; height:38px; flex:0 0 auto; border-radius:11px; cursor:pointer;
    border:1px solid var(--line); background:var(--bg); color:var(--ink-2);
    display:grid; place-items:center; transition:.16s;
  }
  .icon-btn:hover{border-color:var(--orange); color:var(--orange)}
  .icon-btn:active{transform:scale(.93)}
  .icon-btn svg{width:18px; height:18px}

  main{padding:4px 20px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px))}

  /* ===================== ตัวเลขสำคัญของแต่ละหน้า ===================== */
  .headline{padding:4px 0 22px; border-bottom:1px solid var(--line)}
  .headline .k{font-size:13px; color:var(--muted); font-weight:600}
  .headline .v{
    font-size:40px; font-weight:800; letter-spacing:-.04em; line-height:1.15;
    color:var(--orange); margin:2px 0 4px; font-variant-numeric:tabular-nums;
  }
  .headline .v small{font-size:16px; font-weight:700; color:var(--ink-2); margin-left:8px; letter-spacing:0}
  .headline .s{font-size:13px; color:var(--ink-2); line-height:1.55}
  .headline.is-bad .v{color:var(--bad)}
  .headline:empty{display:none}

  /* ===================== ส่วนเนื้อหา: หัวข้อ + เส้นคั่น ===================== */
  .card, .block{padding:22px 0; border-bottom:1px solid var(--line)}
  .card:last-child, .block:last-child{border-bottom:none}
  .card > h2, .block > h2{font-size:16px; font-weight:800; margin:0 0 3px; letter-spacing:-.02em}
  .card > h2 + .sub, .block > h2 + .sub{margin:0 0 14px; font-size:13px; color:var(--muted); line-height:1.5}
  .sec{
    font-size:11px; color:var(--muted); font-weight:800; letter-spacing:.09em;
    text-transform:uppercase; margin:24px 0 10px;
  }
  .sec:first-child{margin-top:0}

  /* หัวข้อที่มีปุ่มเพิ่มอยู่ขวา */
  .head-row{display:flex; align-items:flex-start; gap:12px; margin-bottom:3px}
  .head-row h2{flex:1; margin:0!important}

  /* ===================== แถบเมนู ===================== */
  .bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:640px; z-index:25; display:flex;
    background:var(--bg); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .bottomnav button{
    flex:1; border:none; background:none; cursor:pointer; font:inherit;
    height:var(--nav-h); color:var(--muted); font-size:11px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    transition:color .16s;
  }
  .bottomnav button svg{width:21px; height:21px}
  .bottomnav button.on{color:var(--orange)}

  /* ===================== ปุ่ม ===================== */
  button{font:inherit}
  .btn{
    cursor:pointer; border:1px solid var(--line); background:var(--bg);
    color:var(--ink); padding:11px 16px; border-radius:11px;
    font-weight:700; font-size:14.5px; transition:.16s; display:inline-flex;
    align-items:center; gap:7px; justify-content:center;
  }
  .btn:active{transform:scale(.975)}
  .btn:hover{border-color:var(--orange); color:var(--orange)}
  .btn.primary{background:var(--orange); border-color:var(--orange); color:#fff}
  .btn.primary:hover{background:var(--orange-d); border-color:var(--orange-d); color:#fff}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--ink-2)}
  .btn.danger{color:var(--bad-ink)}
  .btn.danger:hover{border-color:var(--bad); color:var(--bad)}
  .btn.sm{padding:7px 12px; font-size:13px; border-radius:9px}
  .btn.block{width:100%}
  .btn svg{width:16px; height:16px}
  .btnrow{display:flex; flex-wrap:wrap; gap:9px}
  .btn.back{border:none; background:none; color:var(--orange); padding:0 0 14px; font-weight:700}

  /* ===================== ฟอร์ม ===================== */
  .f{display:flex; flex-direction:column; gap:6px; min-width:0}
  .f label{font-size:12px; color:var(--ink-2); font-weight:700}
  input,select,textarea{
    font:inherit; width:100%; color:var(--ink); background:var(--soft);
    border:1px solid var(--line); border-radius:11px; padding:12px 13px; transition:.16s;
  }
  input:focus,select:focus,textarea:focus{
    outline:none; border-color:var(--orange); background:var(--bg);
    box-shadow:0 0 0 3px var(--tint);
  }
  input[type=number]{text-align:right; font-variant-numeric:tabular-nums; font-weight:700}
  textarea{font-family:ui-monospace,Consolas,monospace; font-size:12px; resize:vertical}
  .grid{display:grid; gap:13px}
  .g2{grid-template-columns:1fr 1fr}
  .g-auto{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
  .f.wide{grid-column:1/-1}

  /* ===================== ตัวเลขย่อย (ไม่มีกล่อง) ===================== */
  .quick{display:flex; gap:0; margin:0}
  .quick .q{flex:1; padding:0 14px; border-left:1px solid var(--line)}
  .quick .q:first-child{padding-left:0; border-left:none}
  .quick .q .k{font-size:11.5px; color:var(--muted); font-weight:600}
  .quick .q .v{font-size:18px; font-weight:800; margin-top:1px; letter-spacing:-.03em;
               font-variant-numeric:tabular-nums}

  .tiles{display:grid; gap:0 14px; grid-template-columns:1fr 1fr}
  .tile{padding:12px 0; border-bottom:1px solid var(--line-2)}
  .tile .lbl{font-size:11.5px; color:var(--muted); font-weight:600}
  .tile .val{font-size:19px; font-weight:800; margin-top:1px; letter-spacing:-.03em}
  .tnum{font-variant-numeric:tabular-nums}
  .good{color:var(--good-ink)} .warn{color:var(--warn-ink)} .bad{color:var(--bad-ink)}

  /* ===================== รายการ ===================== */
  .list{display:flex; flex-direction:column}
  .li, .li-read{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:14px 0; border:none; background:none; border-bottom:1px solid var(--line-2);
    font:inherit; color:inherit;
  }
  .li{cursor:pointer; transition:background .14s; padding-left:10px; padding-right:10px;
      margin:0 -10px; border-radius:10px}
  .li:hover{background:var(--soft)}
  .li:focus-visible{outline:2px solid var(--orange); outline-offset:-2px}
  .li:last-of-type, .li-read:last-of-type{border-bottom:none}
  .li-main{flex:1; min-width:0}
  .li-title{font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .li-sub{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  .li-end{display:flex; align-items:center; gap:9px; flex:0 0 auto}
  .li-del{
    width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg); color:var(--muted); cursor:pointer; display:grid; place-items:center;
  }
  .li-del:hover{color:var(--bad); border-color:var(--bad)}
  .li-chev{color:var(--muted); opacity:.4; flex:0 0 auto}
  .av{display:none}                      /* ดีไซน์เรียบ ไม่ใช้วงกลมไอคอนแล้ว */

  .row-head{display:flex; align-items:center; gap:10px}
  .chip{
    display:inline-flex; align-items:center; padding:4px 10px; border-radius:8px;
    background:var(--soft); color:var(--ink-2); font-size:12px; font-weight:700;
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .status{padding:4px 11px; border-radius:8px; font-size:12.5px; font-weight:700; white-space:nowrap}
  .status.is-good{background:var(--good-bg); color:var(--good-ink)}
  .status.is-warn{background:var(--warn-bg); color:var(--warn-ink)}
  .status.is-bad{background:var(--bad-bg); color:var(--bad-ink)}

  /* ===================== หน้าว่าง ===================== */
  .empty{text-align:center; padding:40px 10px; color:var(--muted); font-size:13.5px}
  .empty-ic{width:62px; height:62px; margin:0 auto 16px; border-radius:20px;
            background:var(--tint); color:var(--orange); display:grid; place-items:center}
  .empty-ic svg{width:30px; height:30px}
  .empty h3{margin:0 0 7px; font-size:18px; font-weight:800; color:var(--ink); letter-spacing:-.03em}
  .empty p{margin:0 auto 18px; max-width:300px; line-height:1.65}

  /* ===================== ขั้นตอนเริ่มใช้ ===================== */
  .steps{display:flex; flex-direction:column}
  .step{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:15px 0; border:none; border-bottom:1px solid var(--line-2);
    background:none; cursor:pointer; font:inherit; color:inherit;
  }
  .step:last-child{border-bottom:none}
  .step:hover .step-label{color:var(--orange)}
  .step.done{cursor:default}
  .step-no{width:30px; height:30px; flex:0 0 auto; border-radius:10px; background:var(--tint);
           color:var(--orange-d); display:grid; place-items:center; font-weight:800; font-size:14px}
  .step.done .step-no{background:var(--good); color:#fff}
  .step-main{flex:1; min-width:0; display:block}
  .step-label{display:block; font-weight:700; font-size:15px}
  .step.done .step-label{color:var(--muted); text-decoration:line-through}
  .step-sub{display:block; font-size:12.5px; color:var(--muted); line-height:1.45}

  /* ===================== กราฟ (บาง เรียบ) ===================== */
  .split{display:flex; gap:2px; height:10px; margin:14px 0 11px}
  .split i{display:block; height:100%; background:var(--line)}
  .split i:first-child{border-radius:5px 0 0 5px}
  .split i:last-child{border-radius:0 5px 5px 0}
  .split i.only{border-radius:5px}
  .seg-cost{background:var(--orange)!important}
  .seg-profit{background:var(--orange-l)!important}
  .seg-loss{background:var(--bad)!important}
  .legend{display:flex; flex-wrap:wrap; gap:7px 18px; font-size:12.5px; color:var(--ink-2)}
  .legend span{display:inline-flex; align-items:center; gap:7px}
  .legend i{width:9px; height:9px; border-radius:3px; flex:0 0 auto}
  .legend b{color:var(--ink); font-variant-numeric:tabular-nums}

  .meter{height:7px; border-radius:99px; overflow:hidden; background:var(--line-2)}
  .meter>i{display:block; height:100%; border-radius:99px; background:var(--orange); transition:width .4s ease}
  .meter.is-good>i{background:var(--good)}
  .meter.is-warn>i{background:var(--warn)}
  .meter.is-bad>i{background:var(--bad)}

  .rank{display:flex; flex-direction:column; gap:18px}
  .rank-row{display:grid; grid-template-columns:1fr auto; gap:6px 10px; align-items:center}
  .rank-name{font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rank-val{text-align:right; font-weight:800; font-variant-numeric:tabular-nums; font-size:15px}
  .rank-row .meter{grid-column:1/-1}
  .rank-sub{grid-column:1/-1; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}

  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th,td{text-align:right; padding:11px 8px; border-bottom:1px solid var(--line-2)}
  th:first-child,td:first-child{text-align:left; padding-left:0}
  th:last-child,td:last-child{padding-right:0}
  th{color:var(--muted); font-size:11px; font-weight:800; white-space:nowrap;
     text-transform:uppercase; letter-spacing:.06em}
  tbody tr:last-child td{border-bottom:none}
  td.n{font-variant-numeric:tabular-nums}
  .scroll{overflow-x:auto}
  .scroll table{min-width:430px}

  /* ===================== กล่องข้อความ ===================== */
  .verdict{border-radius:12px; padding:14px 16px; font-size:13.5px; line-height:1.6; margin:0 0 16px}
  .verdict b:first-child{display:block; font-size:16px; margin-bottom:3px; letter-spacing:-.02em}
  .verdict.is-good{background:var(--good-bg); color:var(--good-ink)}
  .verdict.is-warn{background:var(--warn-bg); color:var(--warn-ink)}
  .verdict.is-bad{background:var(--bad-bg); color:var(--bad-ink)}
  .note{background:var(--soft); border-left:3px solid var(--orange); border-radius:0 10px 10px 0;
        padding:13px 15px; font-size:13px; color:var(--ink-2); margin-top:12px; line-height:1.6}
  .hint{color:var(--muted); font-size:12.5px; margin:12px 0 0; line-height:1.55}
  .panel{background:var(--soft); border-radius:12px; padding:15px}

  details{margin-top:14px}
  details>summary{cursor:pointer; list-style:none; color:var(--orange); font-weight:700;
                  font-size:13.5px; padding:9px 0; display:flex; align-items:center; gap:8px}
  details>summary::-webkit-details-marker{display:none}
  details>summary::after{content:'▾'; font-size:11px; transition:transform .2s}
  details[open]>summary::after{transform:rotate(180deg)}

  /* ===================== หน้าเลือกของ ===================== */
  .picks{display:flex; flex-direction:column}
  .pick{display:grid; grid-template-columns:26px 1fr; gap:8px 13px; align-items:center;
        padding:14px 10px; margin:0 -10px; border-bottom:1px solid var(--line-2); border-radius:10px}
  .pick:last-child{border-bottom:none}
  .pick.on{background:var(--tint)}
  .pick-box{width:26px; height:26px; border-radius:8px; border:2px solid var(--line);
            background:var(--bg); color:transparent; cursor:pointer; padding:0;
            display:grid; place-items:center; transition:.15s}
  .pick.on .pick-box{background:var(--orange); border-color:var(--orange); color:#fff}
  .pick-main{cursor:pointer; min-width:0}
  .pick-qtyrow{grid-column:2/-1; display:flex; align-items:center; gap:10px}
  .pick-qty{width:100px; flex:0 0 auto; padding:9px 11px}
  .pick-unit{font-size:12.5px; color:var(--muted); font-weight:600; flex:0 0 auto}
  .pick-cost{margin-left:auto; font-size:13.5px; font-weight:800; color:var(--orange-d);
             font-variant-numeric:tabular-nums}

  .savebar{
    position:sticky; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px);
    background:var(--bg); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; box-shadow:0 6px 24px rgba(27,23,21,.1); margin-top:18px;
  }
  .savebar .btnrow .btn{flex:1}
  .recipe-sum{margin-bottom:12px; line-height:1.5}
  .recipe-sum b{display:block; font-size:15px; letter-spacing:-.02em}
  .recipe-sum span{font-size:12.5px; color:var(--muted)}

  /* ===================== หน้าต่างกรอก ===================== */
  dialog{
    border:none; padding:0; color:var(--ink); background:var(--bg);
    width:100%; max-width:640px; max-height:92dvh; overflow:auto;
    margin:auto auto 0; border-radius:22px 22px 0 0;
    padding-bottom:env(safe-area-inset-bottom, 0px);
    box-shadow:0 -10px 50px rgba(27,23,21,.25);
  }
  dialog::backdrop{background:rgba(27,23,21,.4)}
  dialog[open]{animation:sheet .24s cubic-bezier(.2,.9,.3,1)}
  @keyframes sheet{from{transform:translateY(100%)} to{transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){ dialog[open]{animation:none} }
  .dlg-grip{width:38px; height:4px; border-radius:99px; background:var(--line); margin:12px auto 0}
  .dlg-head{padding:14px 20px 0}
  .dlg-head h3{margin:0; font-size:19px; font-weight:800; letter-spacing:-.03em}
  .dlg-head p{margin:4px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5}
  .dlg-body{padding:17px 20px 0; display:grid; gap:13px; grid-template-columns:1fr 1fr}
  .dlg-live{grid-column:1/-1; background:var(--tint); color:var(--orange-d); border-radius:11px;
            padding:12px 14px; font-size:13.5px; font-weight:700; line-height:1.5;
            font-variant-numeric:tabular-nums}
  .dlg-err{grid-column:1/-1; color:var(--bad-ink); font-size:12.5px; font-weight:700}
  .dlg-err:empty{display:none}
  .dlg-foot{padding:18px 20px 22px; display:flex; gap:10px}
  .dlg-foot .btn{flex:1; padding:13px 18px}

  .gloss{display:flex; flex-direction:column; gap:16px}
  .gloss-row{display:flex; flex-direction:column; gap:4px}
  .gloss-k{font-weight:800; font-size:15px; color:var(--orange-d); letter-spacing:-.02em}
  .gloss-v{font-size:13.5px; color:var(--ink-2); line-height:1.6}

  /* ===================== จอใหญ่: แท็บข้อความใต้หัวข้อ ===================== */
  @media(min-width:760px){
    .shell{max-width:780px; min-height:100dvh}
    .appbar{padding:34px 36px 0}
    .appbar::after{display:none}
    .titles h1{font-size:30px}
    main{padding:0 36px 80px}
    .headline{padding-top:18px}

    .bottomnav{
      position:static; transform:none; width:auto; max-width:none;
      background:transparent; border-top:none; border-bottom:1px solid var(--line);
      margin:14px 36px 0; padding:0; gap:4px;
    }
    .bottomnav button{
      flex:0 0 auto; height:auto; padding:10px 14px 12px; flex-direction:row; gap:8px;
      font-size:14.5px; color:var(--muted); border-bottom:2px solid transparent;
      margin-bottom:-1px; transition:.16s;
    }
    .bottomnav button svg{width:17px; height:17px}
    .bottomnav button:hover{color:var(--ink-2)}
    .bottomnav button.on{color:var(--orange); border-bottom-color:var(--orange)}

    .tiles{grid-template-columns:repeat(4,1fr)}
    .pick{grid-template-columns:26px 1fr auto}
    .pick-qtyrow{grid-column:3}
    .savebar{bottom:20px}
    .scroll table{min-width:0}
    dialog{max-width:540px; margin:auto; border-radius:20px; animation:none; padding-bottom:0}
    .dlg-grip{display:none}
  }

  /* ===================== สมุดรายวัน ===================== */
  .daybtns{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .daybtn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
    padding:22px 12px; border-radius:16px; border:1.5px solid var(--line);
    background:var(--bg); cursor:pointer; font:inherit; font-weight:800; font-size:16px;
    color:var(--ink); transition:.16s;
  }
  .daybtn svg{width:22px; height:22px}

<script>
/* ===================== ข้อมูล ===================== */
const KEY = 'crepe-cost-v1';
const UNITS = ['กรัม','มิลลิลิตร','ชิ้น','แผ่น','ใบ','ช้อนโต๊ะ'];

const blank = () => ({
  ingredients: [],
  menus: [],
  groups: [],              // ชุดไส้/ท็อปปิ้งที่ใช้ร่วมกัน                 // {id,name,price,addons:[{id,name,price}],items:[]}
  sales: [],                 // {id, d:'YYYY-MM-DD', t:'HH:MM', menuId, name, qty, addons:[{name,price}], total}
  expenses: [],              // {id, d:'YYYY-MM-DD', t:'HH:MM', note, amount}
  fixed: { rent:0, electric:0, gas:0, water:0, other:0, days:26, labor:0 },
  targetMargin: 65
});

/* ---------- วันที่ ---------- */
const pad2 = v => String(v).padStart(2,'0');
const dayKey = (dt = new Date()) => `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
const nowTime = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thaiDate(key, withYear){
  const [y,m,d] = key.split('-').map(Number);
  return `${d} ${TH_MON[m-1]}${withYear ? ' ' + (y+543).toString().slice(-2) : ''}`;
}
const monthKey = key => key.slice(0,7);
function thaiMonth(mk){
  const [y,m] = mk.split('-').map(Number);
  return `${TH_MON[m-1]} ${y+543}`;
}

/* ---------- สรุปของวัน / เดือน ---------- */
function sumDay(key){
  const sale = (db.sales||[]).filter(x => x.d === key).reduce((a,x) => a + n(x.total), 0);
  const exp  = (db.expenses||[]).filter(x => x.d === key).reduce((a,x) => a + n(x.amount), 0);
  return { sale, exp, net: sale - exp };
}
function sumMonth(mk){
  const sale = (db.sales||[]).filter(x => monthKey(x.d) === mk).reduce((a,x) => a + n(x.total), 0);
  const exp  = (db.expenses||[]).filter(x => monthKey(x.d) === mk).reduce((a,x) => a + n(x.amount), 0);
  const days = new Set([...(db.sales||[]), ...(db.expenses||[])].filter(x => monthKey(x.d) === mk).map(x => x.d));
  return { sale, exp, net: sale - exp, days: days.size };
}
// รายการทั้งหมดของวันนั้น เรียงเวลาใหม่สุดขึ้นก่อน
function entriesOf(key){
  const a = (db.sales||[]).filter(x => x.d === key).map(x => ({...x, kind:'sale'}));
  const b = (db.expenses||[]).filter(x => x.d === key).map(x => ({...x, kind:'exp'}));
  return [...a,...b].sort((x,y) => String(y.t||'').localeCompare(String(x.t||'')));
}
function allDays(){
  const set = new Set([...(db.sales||[]), ...(db.expenses||[])].map(x => x.d));
  return [...set].sort().reverse();
}

let db = load();
let tab = 'today';

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return migrateGroups(seedHistory(buildDemo()));   // เปิดครั้งแรก มีข้อมูลตัวอย่างให้เห็นภาพก่อน
    return migrateGroups(Object.assign(blank(), JSON.parse(raw)));
  }catch(e){ return migrateGroups(seedHistory(buildDemo())); }
}
/* ===================== ชุดไส้ที่ใช้ร่วมกันหลายเมนู =====================
   เดิมไส้ถูกก๊อปเก็บไว้ในแต่ละเมนู แก้ทีต้องไล่แก้ทุกเมนู
   เปลี่ยนเป็นเก็บเป็น "ชุด" ไว้ที่เดียว แล้วเมนูแค่บอกว่าใช้ชุดไหนบ้าง */
function migrateGroups(d){
  const hasLegacy = (d.menus||[]).some(m => (m.addons||[]).length);
  if(Array.isArray(d.groups) && d.groups.length && !hasLegacy) return d;
  if(!hasLegacy){ d.groups = d.groups || []; return d; }
  if(!Array.isArray(d.groups)) d.groups = [];
  const groups = d.groups;
  (d.menus||[]).forEach(m => {
    const ids = Array.isArray(m.groupIds) ? [...m.groupIds] : [];
    (m.addons||[]).forEach(a => {
      const gname = a.group || 'ท็อปปิ้ง';
      let g = groups.find(x => x.name === gname);
      if(!g) groups.push(g = {id:uid(), name:gname, items:[]});
      if(!g.items.some(x => x.name === a.name && n(x.price) === n(a.price)))
        g.items.push({id:uid(), name:a.name, price:n(a.price)});
      if(!ids.includes(g.id)) ids.push(g.id);
    });
    m.groupIds = ids;
    delete m.addons;                 // ย้ายเข้าในชุดแล้ว
  });
  d.groups = groups;
  return d;
}

// ไส้ทั้งหมดที่เมนูนี้เลือกได้ (รวมของเก่าที่ยังไม่ได้ย้าย)
function menuAddons(m){
  if(!m) return [];
  const out = [];
  (m.groupIds||[]).forEach(gid => {
    const g = (db.groups||[]).find(x => x.id === gid);
    if(g) g.items.forEach(it => out.push({id:it.id, name:it.name, price:n(it.price), group:g.name}));
  });
  (m.addons||[]).forEach(a => { if(!out.some(x => x.name === a.name)) out.push(a); });
  return out;
}
const findGroup = id => (db.groups||[]).find(g => g.id === id);

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ /* เบราว์เซอร์ปิดการเก็บข้อมูล — ใช้ต่อได้แต่ไม่บันทึก */ }
}
// ตัวอักษรแทนรายการในวงกลม — ข้ามสระหน้าของไทยเพื่อให้แต่ละรายการต่างกันจริง
function initial(name){
  const t = String(name || '').trim();
  if(!t) return '?';
  const m = t.match(/[^sเ-ไ]/);   // ตัวแรกที่ไม่ใช่ เ แ โ ใ ไ
  return (m ? m[0] : t[0]);
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function n(v){ const x = parseFloat(v); return isFinite(x) ? x : 0; }
// เจ้าของร้านคิดเป็นบาทเต็ม ไม่ได้คิดเป็นสตางค์ — แสดงทศนิยมเฉพาะตอนเงินน้อยกว่า 10 บาท
function baht(v){
  const x = n(v);
  // เลขกลม ๆ ไม่ต้องมีจุดทศนิยม (5 ไม่ใช่ 5.00) · เลขน้อยกว่า 10 ที่มีเศษค่อยโชว์สตางค์
  if(Number.isInteger(x)) return x.toLocaleString('th-TH');
  return Math.abs(x) < 10
    ? x.toLocaleString('th-TH',{minimumFractionDigits:2, maximumFractionDigits:2})
    : Math.round(x).toLocaleString('th-TH');
}
function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

// ราคาต่อหน่วยมักเป็นเลขจุดทศนิยมยาว ๆ (0.0450) คนทั่วไปอ่านยาก
// ถ้าต่ำกว่า 1 บาทให้บอกเป็นสตางค์แทน
function perUnit(ing){
  const c = unitCost(ing), u = esc(ing.unit);
  if(c === 0) return 'ยังไม่ได้ใส่ราคา';
  if(c < 1) return `${u}ละ ${(c*100).toFixed(c < 0.1 ? 1 : 0)} สตางค์`;
  return `${u}ละ ${baht(c)} บาท`;
}

/* ===================== การคำนวณ ===================== */
const unitCost = ing => n(ing.packQty) > 0 ? n(ing.packPrice) / n(ing.packQty) : 0;
const findIng = id => db.ingredients.find(i => i.id === id);

function menuCost(m){
  return (m.items||[]).reduce((s,it) => {
    const ing = findIng(it.ingId);
    return s + (ing ? unitCost(ing) * n(it.qty) : 0);
  }, 0);
}
const profit = m => n(m.price) - menuCost(m);
const marginPct = m => n(m.price) > 0 ? profit(m) / n(m.price) * 100 : 0;
const suggestPrice = m => {
  const mg = n(db.targetMargin);
  return mg < 100 ? menuCost(m) / (1 - mg/100) : 0;
};

function fixedPerMonth(){
  const f = db.fixed;
  return n(f.rent)+n(f.electric)+n(f.gas)+n(f.water)+n(f.other) + n(f.labor)*n(f.days);
}
const fixedPerDay = () => n(db.fixed.days) > 0 ? fixedPerMonth() / n(db.fixed.days) : 0;

function avgProfit(){
  const list = db.menus.filter(m => n(m.price) > 0);
  if(!list.length) return 0;
  return list.reduce((s,m) => s + profit(m), 0) / list.length;
}
const breakEven = () => avgProfit() > 0 ? fixedPerDay() / avgProfit() : 0;

/* ภาพรวมทั้งร้านต่อวัน — คิดจากยอดขายโดยประมาณของแต่ละเมนู */
function daily(){
  let revenue = 0, food = 0, plates = 0;
  db.menus.forEach(m => {
    const q = n(m.qtyPerDay);
    if(q <= 0) return;
    plates  += q;
    revenue += n(m.price) * q;
    food    += menuCost(m) * q;
  });
  const fixed = fixedPerDay();
  const gross = revenue - food;          // กำไรก่อนหักค่าเช่า/ค่าไฟ
  const net   = gross - fixed;           // กำไรสุทธิจริง ๆ
  const perPlate = plates > 0 ? gross / plates : avgProfit();
  return {
    revenue, food, fixed, gross, net, plates, perPlate,
    need: perPlate > 0 ? fixed / perPlate : 0,   // ต้องขายกี่จานถึงคุ้ม
    month: net * n(db.fixed.days)
  };
}
const hasSales = () => db.menus.some(m => n(m.qtyPerDay) > 0);

// บอกสถานะเป็นคำ คนอ่านไม่ต้องตีความสีเอง
function statusWord(m){
  if(n(m.price) <= 0) return {word:'ยังไม่ได้ใส่ราคา', lv:'warn'};
  if(profit(m) < 0)   return {word:'ขาดทุน', lv:'bad'};
  const lv = level(marginPct(m));
  return {word: lv==='good' ? 'กำไรดี' : lv==='warn' ? 'กำไรพอใช้' : 'กำไรน้อย', lv};
}

// ระดับของกำไร: ถึงเป้า / ใกล้เป้า / ต่ำไป  — ใช้คู่กับตัวเลขเสมอ ไม่ให้สีสื่อความหมายลำพัง
// เกณฑ์ตามมาตรฐานร้านอาหารทั่วไป ไม่ผูกกับเป้าที่ผู้ใช้ตั้ง
// (เป้าที่ตั้งเอาไว้ใช้คำนวณ "ราคาที่แนะนำ" อย่างเดียว)
function level(mg){
  if(mg >= 60) return 'good';   // กำไรดี
  if(mg >= 45) return 'warn';   // พอใช้
  return 'bad';                 // น้อยไป
}

const TABS = [

// ตัวเลขสำคัญของแต่ละแท็บ แสดงไว้บนสุดของหน้า
function headStat(){
  if(tab === 'sale'){
    const c = order ? orderCount() : 0;
    return {k:'บิลนี้', v: baht(order ? orderTotal() : 0), u:'บาท',
            s: c ? `${c} จาน · กดรับเงินเมื่อลูกค้าจ่าย` : 'กดเมนูที่ลูกค้าสั่ง'};
  }
  if(recipeDraft) return {k:'กำลังเลือกของที่ใช้', v:'', s:'ติ๊กของที่ใช้ แล้วใส่จำนวนต่อ 1 จาน'};

  if(order) return {k:'กำลังเปิดบิล', v: baht(orderTotal()), u:'บาท',
                    s: orderCount() ? `${orderCount()} จานในบิลนี้` : 'กดเมนูที่ลูกค้าสั่ง'};
  if(tab === 'today'){
    const key = dayKey(), d = sumDay(key);
    const has = (db.sales||[]).some(x=>x.d===key) || (db.expenses||[]).some(x=>x.d===key);
    return {k: thaiDate(key, true) + ' · ' + (d.net>=0 ? 'วันนี้เหลือ' : 'วันนี้ขาดทุน'),
            v: baht(Math.abs(d.net)), u:'บาท',
            s: has ? `ขายได้ ${baht(d.sale)} · ซื้อของ ${baht(d.exp)} บาท`
                   : 'ยังไม่ได้บันทึกอะไรวันนี้ — กดปุ่มด้านล่างได้เลย'};
  }
  if(tab === 'hist'){
    const days = allDays();
    if(!days.length) return {k:'ย้อนหลัง', v:'', s:'ยังไม่มีประวัติ'};
    const m = sumMonth(monthKey(days[0]));
    return {k: thaiMonth(monthKey(days[0])) + ' · ' + (m.net>=0 ? 'เหลือ' : 'ขาดทุน'),
            v: baht(Math.abs(m.net)), u:'บาท',
            s: `ขายได้ ${baht(m.sale)} · ซื้อของ ${baht(m.exp)} บาท · ${m.days} วัน`};
  }
  if(tab === 'setup'){
    const items = (db.groups||[]).reduce((a,g) => a + g.items.length, 0);
    return {k:'ตั้งค่า', v:String(db.menus.length), u:'เมนู',
            s: `ไส้ที่ใส่ได้ ${items} อย่าง ใน ${(db.groups||[]).length} ชุด`};
  }
  if(tab === 'more'){
    return {k:'อื่น ๆ', v:'', s:'ของที่นาน ๆ ใช้ที'};
  }
  if(tab === 'ing'){
    const c = db.ingredients.length;
    return {k:'ของที่ซื้อมา', v:String(c), u:'อย่าง',
            s: c ? 'แตะที่รายการเพื่อแก้ราคาหรือปริมาณ' : 'ยังไม่ได้ใส่ของที่ซื้อมา'};
  }
  if(tab === 'menu'){
    const ms = db.menus.filter(m => (m.items||[]).length);
    const avg = ms.length ? ms.reduce((a,m)=>a+marginPct(m),0)/ms.length : 0;
    if(openMenuId){
      const m = findMenu(openMenuId);
      if(m) return {k:'กำไรของเมนูนี้', v: n(m.price)>0 ? marginPct(m).toFixed(0) : '–', u:'%',
                    s: n(m.price)>0 ? `ขาย ${baht(m.price)} · ค่าของ ${baht(menuCost(m))} · เหลือ ${baht(profit(m))} บาท` : 'ยังไม่ได้ใส่ราคาขาย'};
    }
    return {k:'เมนูที่ขาย', v:String(db.menus.length), u:'เมนู',
            s: ms.length ? `กำไรเฉลี่ย ${avg.toFixed(0)}% ต่อจาน` : 'ยังไม่ได้ใส่ว่าแต่ละเมนูใช้ของอะไร'};
  }
  if(tab === 'fixed'){
    const be = breakEven();
    return {k:'รายจ่ายประจำเดือน', v: baht(fixedPerMonth()), u:'บาท',
            s: be ? `ต้องขายวันละ ${Math.ceil(be)} จาน ถึงจะไม่ขาดทุน` : 'ใส่ค่าเช่า ค่าไฟ ค่าแก๊ส ให้ครบ'};
  }
  if(!db.menus.length) return {k:'ยินดีต้อนรับ', v:'', s:'เริ่มจากใส่ของที่ซื้อมา แล้วแอปจะคิดกำไรให้เอง'};
  if(!hasSales()) return {k:'ภาพรวมร้าน', v:'', s:'ใส่ยอดขายต่อวัน แล้วจะรู้ว่าเดือนนี้เหลือเท่าไหร่'};
  const d = daily();
  return {k: d.net>=0 ? 'กำไรสุทธิเดือนนี้' : 'ขาดทุนเดือนนี้',
          v: baht(Math.abs(d.month)), u:'บาท',
          s: d.net>=0 ? `วันละ ${baht(d.net)} บาท จากการขาย ${d.plates} จาน`
                      : `ขาดทุนวันละ ${baht(-d.net)} บาท — ต้องขายเพิ่ม`};
}

function render(){
  document.getElementById('pageTitle').textContent =
    (TABS.find(t => t[0] === tab) || ['','ภาพรวม'])[1];

  const hs = headStat();
  document.getElementById('headStat').innerHTML =
    `<div class="k">${hs.k}</div>` +
    (hs.v ? `<div class="v">${hs.v}${hs.u ? `<small>${hs.u}</small>` : ''}</div>` : '') +
    `<div class="s">${hs.s}</div>`;

  const neg = tab === 'dash' && db.menus.length && hasSales() && daily().net < 0;
  document.getElementById('headStat').classList.toggle('is-bad', !!neg);

  document.getElementById('tabsBottom').innerHTML = TABS.map(([k,l,ic]) =>
    `<button class="${tab===k?'on':''}" onclick="go('${k}')" aria-label="${l}">
       ${icon(ic,22)}<span>${l}</span></button>`).join('');

  renderBanner();
  document.getElementById('view').innerHTML =
    tab==='sale'  ? viewPOS()   :
    tab==='today' ? viewToday() :
    tab==='setup' ? viewSetup() :
    tab==='hist'  ? viewHist()  :
    tab==='menu'  ? viewMenu()  :
    tab==='ing'   ? viewIng()   :
    tab==='fixed' ? viewFixed() :
    tab==='dash'  ? viewDash()  : viewMore();
}

const dlg = document.getElementById('dlg');
let dlgCfg = null;

// fields: [{k, label, type:'text'|'number'|'select', value, options, placeholder, wide, step}]
function openDialog(cfg){
  dlgCfg = cfg;
  document.getElementById('dlgTitle').textContent = cfg.title;
  document.getElementById('dlgSub').textContent = cfg.sub || '';

  const foot = document.getElementById('dlgFoot');
  const defFoot = '<button type="button" class="btn ghost" id="dlgCancel" onclick="dlg.close()">ยกเลิก</button>'
                + '<button type="submit" class="btn primary" id="dlgSave">บันทึก</button>';

  // ปุ่มท้ายกล่องแบบกำหนดเอง
  if(cfg.foot){
    foot.innerHTML = cfg.foot.map(b =>
      '<button type="button" class="btn ' + (b.cls||'') + '" onclick="' + b.fn + '">' + b.label + '</button>').join('');
  }else{
    foot.innerHTML = defFoot;
    if(cfg.extraFoot){
      foot.insertAdjacentHTML('beforeend',
        '<button type="button" class="btn ' + (cfg.extraFoot.cls||'') + '" onclick="' + cfg.extraFoot.fn + '">'
        + cfg.extraFoot.label + '</button>');
    }
  }

  const saveBtn = document.getElementById('dlgSave');
  if(saveBtn && cfg.saveLabel) saveBtn.textContent = cfg.saveLabel;

  // โหมดอ่านอย่างเดียว เช่น หน้าอธิบายคำศัพท์ หรือหน้าถามยืนยัน
  // (เช็กว่าส่ง html มาหรือเปล่า ไม่ใช่เช็กว่ามีเนื้อหา — ข้อความว่างก็ยังถือว่าโหมดนี้)
  if(cfg.html !== undefined){
    document.getElementById('dlgBody').innerHTML = `<div style="grid-column:1/-1">${cfg.html}</div>`;
    if(!cfg.foot) foot.innerHTML = '<button type="button" class="btn primary" onclick="dlg.close()">เข้าใจแล้ว</button>';
    dlg.showModal();
    return;
  }

  document.getElementById('dlgBody').innerHTML = cfg.fields.map(f => {
    const cls = `f${f.wide ? ' wide' : ''}`;
    if(f.type === 'select'){
      return `<div class="${cls}"><label for="dlg_${f.k}">${f.label}</label>
        <select id="dlg_${f.k}" data-k="${f.k}">${f.options.map(o =>
          `<option value="${esc(o.value)}" ${o.value===f.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;
    }
    const t = f.type === 'number' ? 'number' : 'text';
    return `<div class="${cls}"><label for="dlg_${f.k}">${f.label}</label>
      <input id="dlg_${f.k}" data-k="${f.k}" type="${t}" ${f.type==='number'?'step="any" inputmode="decimal"':''}
        value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder||'')}"></div>`;
  }).join('')
    + (cfg.live ? `<div class="dlg-live" id="dlgLive"></div>` : '')
    + `<div class="dlg-err" id="dlgErr"></div>`;

  if(cfg.live) dlg.addEventListener('input', dlgLive);
  dlgLive();
  dlg.showModal();
  const first = dlg.querySelector('[data-k]');
  if(first) setTimeout(() => first.focus(), 60);
}

function dlgValues(){
  const v = {};
  dlg.querySelectorAll('[data-k]').forEach(el => {
    const f = dlgCfg.fields.find(x => x.k === el.dataset.k);
    v[el.dataset.k] = f && f.type === 'number' ? n(el.value) : el.value;
  });
  return v;
}
function dlgLive(){
  const box = document.getElementById('dlgLive');
  if(!box || !dlgCfg || !dlgCfg.live) return;
  box.innerHTML = dlgCfg.live(dlgValues());
}
function dlgSubmit(e){
  e.preventDefault();
  const v = dlgValues();
  const err = dlgCfg.check ? dlgCfg.check(v) : null;
  if(err){ document.getElementById('dlgErr').textContent = err; return false; }
  dlg.removeEventListener('input', dlgLive);
  dlg.close();
  dlgCfg.save(v);
  return false;
}
dlg.addEventListener('close', () => dlg.removeEventListener('input', dlgLive));

    check: v => !v.name.trim() ? 'ยังไม่ได้ใส่ชื่อวัตถุดิบ'
              : v.packQty <= 0 ? 'ปริมาณที่ได้ต้องมากกว่า 0'
              : v.packPrice < 0 ? 'ราคาติดลบไม่ได้' : null,
    save: v => {
      const data = {name:v.name.trim(), packQty:v.packQty, unit:v.unit, packPrice:v.packPrice};
      if(ing) Object.assign(ing, data);
      else db.ingredients.push(Object.assign({id:uid()}, data));
      save(); render();
    }
  });
}
function addIng(){ ingDialog(null); }
function editIng(id){ const i = findIng(id); if(i) ingDialog(i); }
function delIng(id){
  const i = findIng(id);
  const used = db.menus.filter(m => (m.items||[]).some(it => it.ingId===id)).map(m=>m.name||'(ไม่มีชื่อ)');
  const go = () => {
    db.ingredients = db.ingredients.filter(x => x.id!==id);
    db.menus.forEach(m => m.items = (m.items||[]).filter(it => it.ingId!==id));
    save(); render();
  };
  if(used.length) askConfirm(`ลบ "${esc(i?.name||'')}" ?`,
    `ของชิ้นนี้ถูกใช้ในสูตรของ ${esc(used.join(', '))} — ลบแล้วสูตรเหล่านั้นจะหายไปด้วย`, 'ลบเลย', go);
  else go();
}

/* --------- แท็บ 2: เมนู --------- */
function costSplit(m){
  const cost = menuCost(m), price = n(m.price), pf = price - cost;
  if(price <= 0 || cost <= 0) return '';
  if(pf < 0){
    return `<div class="split"><i class="seg-loss only" style="width:100%"></i></div>
      <div class="legend"><span><i style="background:var(--bad)"></i>ขาดทุนจานละ <b>${baht(-pf)}</b> บาท</span></div>`;
  }
  const cw = clamp(cost / price * 100, 0, 100);
  return `
    <div class="split">
      <i class="seg-cost" style="width:${cw}%"></i>
      <i class="seg-profit" style="width:${100-cw}%"></i>
    </div>
    <div class="legend">
      <span><i style="background:var(--orange)"></i>ต้นทุน <b>${baht(cost)}</b></span>
      <span><i style="background:var(--orange-l)"></i>กำไร <b>${baht(pf)}</b></span>
    </div>`;
}

/* ===================== หน้าเลือกของที่ใช้ในสูตร =====================
   เดิมต้องเปิดหน้าต่างทีละชิ้น เมนูหนึ่งใช้ของ 7 อย่างก็ 7 รอบ
   เปลี่ยนเป็นเห็นของทั้งหมดในหน้าเดียว ติ๊กอันที่ใช้แล้วใส่จำนวน จบในครั้งเดียว */
let recipeDraft = null;   // {menuId, map:{ingId: qty}}

function openRecipe(menuId){
  const m = findMenu(menuId); if(!m) return;
  recipeDraft = { menuId, map: Object.fromEntries((m.items||[]).map(it => [it.ingId, n(it.qty)])) };
  render(); window.scrollTo({top:0});
}
function closeRecipe(){ recipeDraft = null; render(); window.scrollTo({top:0}); }

function toggleIng(id){
  if(!recipeDraft) return;
  if(id in recipeDraft.map) delete recipeDraft.map[id];
  else recipeDraft.map[id] = '';            // ติ๊กแล้วค่อยพิมพ์จำนวน
  render();
  const el = document.getElementById('q_' + id);
  if(el) el.focus();
}
function setDraftQty(id, v){
  if(!recipeDraft) return;
  recipeDraft.map[id] = v === '' ? '' : n(v);
  refreshRecipeSum();                        // อัปเดตแค่แถบสรุป ช่องที่พิมพ์อยู่จะได้ไม่หลุด
  const c = document.getElementById('c_' + id);
  const ing = findIng(id);
  if(c && ing) c.textContent = n(v) > 0 ? baht(unitCost(ing) * n(v)) : '';
}
function draftCost(){
  if(!recipeDraft) return 0;
  return Object.entries(recipeDraft.map).reduce((s,[id,q]) => {
    const ing = findIng(id);
    return s + (ing ? unitCost(ing) * n(q) : 0);
  }, 0);
}
function refreshRecipeSum(){
  const box = document.getElementById('recipeSum');
  if(box) box.innerHTML = recipeSumHTML();
}
function recipeSumHTML(){
  const m = findMenu(recipeDraft.menuId);
  const cost = draftCost(), price = n(m.price), pf = price - cost;
  const picked = Object.keys(recipeDraft.map).length;
  if(!picked) return `<b>ยังไม่ได้เลือกของ</b><span>ติ๊กของที่ใช้ทำจานนี้</span>`;
  if(price <= 0) return `<b>ค่าของจานละ ${baht(cost)} บาท</b><span>เลือกไว้ ${picked} อย่าง · ยังไม่ได้ใส่ราคาขาย</span>`;
  return `<b>ค่าของ ${baht(cost)} · ขาย ${baht(price)} → เหลือ ${baht(pf)} บาท</b>
          <span>เลือกไว้ ${picked} อย่าง · กำไร ${price > 0 ? (pf/price*100).toFixed(0) : 0}%</span>`;
}
function saveRecipe(){
  const m = findMenu(recipeDraft.menuId);
  if(m){
    m.items = Object.entries(recipeDraft.map)
      .filter(([,q]) => n(q) > 0)
      .map(([ingId,q]) => ({ingId, qty:n(q)}));
    save();
  }
  recipeDraft = null; render(); window.scrollTo({top:0});
}

function viewRecipe(){
  const m = findMenu(recipeDraft.menuId);
  if(!m){ recipeDraft = null; return viewMenu(); }

  const rows = db.ingredients.map(i => {
    const on = i.id in recipeDraft.map;
    const q = on ? recipeDraft.map[i.id] : '';
    const c = n(q) > 0 ? baht(unitCost(i) * n(q)) : '';
    return `<div class="pick${on ? ' on' : ''}">
      <button class="pick-box" onclick="toggleIng('${i.id}')" aria-pressed="${on}"
              aria-label="${on ? 'เอาออก' : 'เลือก'} ${esc(i.name)}">${icon('check',15)}</button>
      <div class="pick-main" onclick="toggleIng('${i.id}')">
        <div class="li-title">${esc(i.name || '(ไม่มีชื่อ)')}</div>
        <div class="li-sub">${perUnit(i)}</div>
      </div>
      ${on ? `<div class="pick-qtyrow">
        <input id="q_${i.id}" type="number" step="any" inputmode="decimal" class="pick-qty"
               value="${q}" placeholder="0" oninput="setDraftQty('${i.id}', this.value)">
        <span class="pick-unit">${esc(i.unit)}</span>
        <span class="pick-cost" id="c_${i.id}">${c}</span>
      </div>` : ''}
    </div>`;
  }).join('');

  return `<button class="btn back" onclick="closeRecipe()">${icon('back',16)} กลับไปหน้าเมนู</button>
  <div class="card">
    <h2>${esc(m.name || '(ยังไม่มีชื่อ)')} ใช้ของอะไรบ้าง</h2>
    <p class="sub">ติ๊กของที่ใช้ แล้วใส่ว่าใช้เท่าไหร่ต่อ 1 จาน — ติ๊กได้หลายอย่างในครั้งเดียว</p>
    ${db.ingredients.length
      ? `<div class="picks">${rows}</div>`
      : `<div class="empty">${icon('box',34)}ยังไม่มีของให้เลือก<br>ไปใส่ของที่ซื้อมาก่อน</div>
         <button class="btn primary block" onclick="go('ing')">ไปใส่ของที่ซื้อมา</button>`}
  </div>
  <div class="savebar">
    <div class="recipe-sum" id="recipeSum">${recipeSumHTML()}</div>
    <div class="btnrow">
      <button class="btn ghost" onclick="closeRecipe()">ยกเลิก</button>
      <button class="btn primary" onclick="saveRecipe()">บันทึกสูตร</button>
    </div>
  </div>`;
}

// เปิดเมนูไหนอยู่ (null = แสดงเป็นรายการรวม)
let openMenuId = null;
function openMenu(id){ openMenuId = id; render(); window.scrollTo({top:0}); }
function backToMenus(){ openMenuId = null; render(); window.scrollTo({top:0}); }

function viewMenu(){
  if(recipeDraft) return viewRecipe();
  if(!db.ingredients.length){
    openMenuId = null;
    return `<div class="card">
      <div class="empty">
        <div class="empty-ic">${icon('box',34)}</div>
        <h3>ต้องใส่ของที่ซื้อมาก่อน</h3>
        <p>พอมีรายการของแล้ว ค่อยมาบอกว่าแต่ละเมนูใช้อะไรบ้าง</p>
        <button class="btn primary" onclick="go('ing')">ไปใส่ของที่ซื้อมา</button>
      </div>
    </div>`;
  }

  // --- หน้ารายการเมนู: เห็นทีเดียวว่าเมนูไหนกำไรดี ---
  if(!openMenuId || !findMenu(openMenuId)){
    openMenuId = null;
    if(!db.menus.length){
      return `<div class="card">
        <div class="empty">
          <div class="empty-ic">${icon('menu',34)}</div>
          <h3>ใส่เมนูที่ขาย</h3>
          <p>ใส่ชื่อกับราคาขาย แล้วเลือกว่าจานนั้นใช้ของอะไรบ้าง จะรู้ทันทีว่ากำไรเท่าไหร่</p>
          <button class="btn primary" onclick="addMenu()">${icon('plus',16)} เพิ่มเมนูแรก</button>
        </div></div>`;
    }
    const rows = db.menus.map(m => {
      const st = statusWord(m);
      const noRecipe = !(m.items||[]).length;
      return `<div class="li" role="button" tabindex="0" onclick="openMenu('${m.id}')"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openMenu('${m.id}')}">
        <span class="av ${noRecipe ? 'w' : st.lv === 'good' ? 'g' : st.lv === 'bad' ? 'b' : 'w'}">${esc(initial(m.name))}</span>
        <div class="li-main">
          <div class="li-title">${esc(m.name || '(ยังไม่มีชื่อ)')}</div>
          <div class="li-sub">${noRecipe ? 'ยังไม่ได้ใส่ว่าใช้อะไรบ้าง'
            : `ขาย ${baht(m.price)} บาท · ได้กำไรจานละ ${baht(profit(m))} บาท`}</div>
        </div>
        <div class="li-end">
          <span class="status is-${noRecipe ? 'warn' : st.lv}">${noRecipe ? 'ยังไม่ครบ' : st.word}</span>
          <span class="li-chev">${icon('chev',16)}</span>
        </div>
      </div>`;
    }).join('');

    return `<div class="card">
      <div class="head-row">
        <h2>เมนูที่ขาย</h2>
        <button class="btn sm primary" onclick="addMenu()">${icon('plus',14)} เพิ่ม</button>
      </div>
      <p class="sub">แตะที่เมนูเพื่อดูรายละเอียดและใส่ว่าใช้ของอะไรบ้าง</p>
      <div class="list">${rows}</div>
    </div>`;
  }

  // --- หน้ารายละเอียดของเมนูเดียว ---
  const cards = [findMenu(openMenuId)].map(m => {
    const cost = menuCost(m), mg = marginPct(m), lv = level(mg);
    const items = (m.items||[]).map(it => {
      const ing = findIng(it.ingId);
      return `<div class="li-read">
        <div class="li-main">
          <div class="li-title">${esc(ing?.name || '(ของชิ้นนี้ถูกลบไปแล้ว)')}</div>
          <div class="li-sub">ใช้ ${n(it.qty).toLocaleString('th-TH')} ${esc(ing?.unit||'')}</div>
        </div>
        <span class="chip">${ing ? baht(unitCost(ing)*n(it.qty)) : '–'}</span>
      </div>`;
    }).join('');

    const st = statusWord(m);
    return `<button class="btn back" onclick="backToMenus()">${icon('back',16)} เมนูทั้งหมด</button>
    <div class="card">
      <div class="row-head" style="margin-bottom:2px">
        <div class="li-main">
          <h2 style="margin:0">${esc(m.name || '(ยังไม่มีชื่อ)')}</h2>
          <div class="li-sub">ขาย ${baht(m.price)} บาท · วันละ ${n(m.qtyPerDay)} จาน</div>
        </div>
        <button class="btn sm" onclick="editMenu('${m.id}')">${icon('edit',14)} แก้ไข</button>
        <button class="li-del" title="ลบเมนูนี้" onclick="delMenu('${m.id}')">${icon('trash',15)}</button>
      </div>

      <div class="verdict is-${st.lv}">
        <b>${st.word}</b>
        ${n(m.price) > 0 && (m.items||[]).length
          ? `ขายจานละ ${baht(m.price)} บาท ค่าของ ${baht(cost)} บาท <b>เหลือกำไร ${baht(profit(m))} บาท</b>`
          : 'ใส่ราคาขายและของที่ใช้ให้ครบก่อน แล้วจะคำนวณให้'}
      </div>

      ${costSplit(m)}

      ${addonList(m)}

      <div class="sec">จานนี้ใช้ของอะไรบ้าง</div>
      <div class="list">${items || `<div class="empty" style="padding:16px">ยังไม่ได้ใส่ว่าใช้ของอะไร</div>`}</div>
      <div style="margin-top:10px">
        <button class="btn primary block" onclick="openRecipe('${m.id}')">${icon('edit',15)} ${items ? 'แก้ว่าใช้ของอะไรบ้าง' : 'เลือกของที่ใช้'}</button>
      </div>

      <div class="sec">ผลลัพธ์</div>
      <div class="tiles">
        <div class="tile"><div class="lbl">ต้นทุน / จาน</div><div class="val tnum">${baht(cost)}</div></div>
        <div class="tile"><div class="lbl">กำไร / จาน</div>
          <div class="val tnum ${profit(m)>=0?'good':'bad'}">${baht(profit(m))}</div></div>
        <div class="tile"><div class="lbl">กำไร %</div>
          <div class="val tnum ${lv}">${mg.toFixed(1)}%</div>
          <div class="meter is-${lv}" style="margin-top:7px"><i style="width:${clamp(mg,0,100)}%"></i></div></div>
        <div class="tile"><div class="lbl">ราคาที่แนะนำ</div>
          <div class="val tnum">${baht(suggestPrice(m))}</div></div>
      </div>
    </div>`;
  }).join('');

  return cards || `<div class="card">
    <h2>เมนู</h2>
    <div class="empty">${icon('menu',34)}ยังไม่มีเมนู<br>กดปุ่ม <b>เพิ่ม</b> ด้านบน</div>
  </div>`;
}
const findMenu = id => db.menus.find(m => m.id===id);
// หน้าต่างเดียวใช้ได้ทั้งเพิ่มและแก้ไข (ส่ง null = เพิ่มใหม่)
function menuDialog(m){
  openDialog({
    title: m ? 'แก้ไขเมนู' : 'เพิ่มเมนูใหม่',
    sub: m ? 'แก้ชื่อ ราคาขาย หรือยอดขายต่อวัน' : 'ใส่ชื่อกับราคาขายก่อน แล้วค่อยไปใส่สูตรทีหลัง',
    fields:[
      {k:'name', label:'ชื่อเมนู', type:'text', value:m?.name ?? '', placeholder:'เช่น เครปกรอบ นูเทลล่า', wide:true},
      {k:'price', label:'ราคาขาย (บาท)', type:'number', value:m?.price ?? ''},
      {k:'qtyPerDay', label:'ขายได้วันละ (จาน)', type:'number', value:m?.qtyPerDay ?? ''}
    ],
    live: m ? (v => {
      const c = menuCost(m), pf = v.price - c;
      if(!(v.price > 0)) return `ต้นทุนวัตถุดิบจานละ ${baht(c)} บาท`;
      return `กำไรจานละ ${baht(pf)} บาท (${(pf/v.price*100).toFixed(1)}%) · วันละ ${baht(pf * v.qtyPerDay)} บาท`;
    }) : null,
    check: v => !v.name.trim() ? 'ยังไม่ได้ใส่ชื่อเมนู'
              : v.price < 0 ? 'ราคาติดลบไม่ได้'
              : v.qtyPerDay < 0 ? 'จำนวนจานติดลบไม่ได้' : null,
    save: v => {
      const data = {name:v.name.trim(), price:v.price, qtyPerDay:v.qtyPerDay};
      if(m) Object.assign(m, data);
      else db.menus.push(Object.assign({id:uid(), items:[]}, data));
      save(); render();
    }
  });
}
function addMenu(){ menuDialog(null); }
function editMenu(id){ const m = findMenu(id); if(m) menuDialog(m); }
function delMenu(id){
  const m = findMenu(id);
  askConfirm(`ลบเมนู "${esc(m?.name||'(ไม่มีชื่อ)')}" ?`,
    'ยอดขายที่บันทึกไปแล้วยังอยู่ ไม่หายไปด้วย', 'ลบเลย', () => {
      db.menus = db.menus.filter(x => x.id!==id);
      if(openMenuId === id) openMenuId = null;
      save(); render();
    });
}
// หน้าต่างเดียวใช้ได้ทั้งเพิ่มและแก้ไขรายการในสูตร (idx = -1 คือเพิ่มใหม่)
function itemDialog(mid, idx){
  const m = findMenu(mid); if(!m) return;
  const cur = idx >= 0 ? m.items[idx] : null;
  openDialog({
    title: cur ? 'แก้ไขวัตถุดิบในสูตร' : 'เพิ่มวัตถุดิบในสูตร',
    sub:`เมนู: ${m.name || '(ยังไม่มีชื่อ)'}`,
    fields:[
      {k:'ingId', label:'วัตถุดิบ', type:'select', value: cur ? cur.ingId : db.ingredients[0].id, wide:true,
       options: db.ingredients.map(i => ({value:i.id, label:i.name || '(ไม่มีชื่อ)'}))},
      {k:'qty', label:'ใช้เท่าไหร่ต่อ 1 จาน', type:'number', value: cur ? cur.qty : '', wide:true}
    ],
    live: v => {
      const ing = findIng(v.ingId);
      if(!ing) return 'เลือกวัตถุดิบก่อน';
      if(!(v.qty > 0)) return `ใส่จำนวนเป็น "${esc(ing.unit)}" — ของนี้${perUnit(ing)}`;
      return `${v.qty} ${esc(ing.unit)} = ${baht(unitCost(ing) * v.qty)} บาท ต่อจาน`;
    },
    check: v => !findIng(v.ingId) ? 'ยังไม่ได้เลือกวัตถุดิบ'
              : !(v.qty > 0) ? 'ปริมาณที่ใช้ต้องมากกว่า 0' : null,
    save: v => {
      if(cur) Object.assign(cur, {ingId:v.ingId, qty:v.qty});
      else (m.items = m.items||[]).push({ingId:v.ingId, qty:v.qty});
      save(); render();
    }
  });
}
function addItem(mid){ itemDialog(mid, -1); }
function editItem(mid, idx){ itemDialog(mid, idx); }
function delItem(mid,idx){
  const m = findMenu(mid); if(!m) return;
  m.items.splice(idx,1); save(); render();
}

function refreshFixed(){
  const cur = document.getElementById('fixedKpi');
  if(!cur) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = viewFixed();
  const next = tmp.querySelector('#fixedKpi');
  if(next) cur.replaceWith(next);
}

     label:'ใส่ของที่ซื้อมา', sub:'แป้ง ไข่ นม เนย ไส้ — ซื้อมาเท่าไหร่ ราคาเท่าไหร่'},

/* ===================== หน้าขายแบบ POS =====================
   เปิดบิล → กดเมนูที่ลูกค้าสั่ง (กดซ้ำ = เพิ่มจำนวน) → ใส่ท็อปปิ้ง → รับเงิน
   บันทึกเป็นรายการแยกตามเมนู แต่ผูก bill เดียวกัน จะได้ดูย้อนหลังได้เหมือนเดิม */
/* ===================== เมนูจริงจากใบเมนูของร้าน =====================
   เครป: แป้ง 15 บาท แล้วบวกไส้ที่เลือก (ไส้ละ 5–10 บาท) ซอสราดฟรี
   โตเกียว: ไส้คาวคิดตามจำนวนไส้ (2 ไส้ 10 / 3 ไส้ 15) จึงแยกเป็น 2 เมนู */
function shopMenu(){
  const A = (name, price, group) => ({ id: uid(), name, price, group });

  const ไส้คาวเครป = [
    ['พิซซ่า',5], ['พริกเผา',5], ['ไก่หยอง',5],
    ['โบโลน่า',5], ['ไก่สับ',5], ['ไส้กรอก',5],
    ['ปูอัด',5], ['ไข่นก',5], ['ไข่ไก่',10], ['ยำสาหร่าย',10]
  ].map(([n,p]) => A(n, p, 'ไส้คาว'));

  const ไส้หวานเครป = [
    ['แยมสตรอเบอร์รี่',5], ['แยมบลูเบอร์รี่',5], ['ช็อกโกแลต',5],
    ['เยลลี่',5], ['โอริโอ้',5], ['ลูกเกด',5],
    ['มาร์ชเมลโลว์',5], ['ฝอยทอง',10]
  ].map(([n,p]) => A(n, p, 'ไส้หวาน'));

  const ซอสฟรี = ['ซอสพริก','ซอสมะเขือเทศ','มายองเนส','นมข้น','ช็อกโกแลต']
    .map(n => A(n, 0, 'ราดซอส (ฟรี)'));

  const ไส้โตเกียว = ['พริกเผา','พิซซ่า','ไข่นก','ปูอัด','ไส้กรอก','ไก่สับ','โบโลน่า','ไก่หยอง','สาหร่าย']
    .map(n => A(n, 0, 'ไส้โตเกียว (คาว)'));

  const ไส้หวานโตเกียว = ['ครีม','ครีมข้าวโพด','เผือกกวน'].map(n => A(n, 0, 'ไส้โตเกียว (หวาน)'));

  const M = (name, price, addons) => ({ id: uid(), name, price, qtyPerDay: 0, items: [], addons });

  return [
    M('เครป แป้งวานิลา', 15, [...ไส้คาวเครป, ...ไส้หวานเครป, ...ซอสฟรี]),
    M('เครป แป้งชาร์โคล', 15, [...ไส้คาวเครป.map(a=>({...a,id:uid()})),
                               ...ไส้หวานเครป.map(a=>({...a,id:uid()})),
                               ...ซอสฟรี.map(a=>({...a,id:uid()}))]),
    M('โตเกียวไส้คาว 2 ไส้', 10, [...ไส้โตเกียว, ...ซอสฟรี.map(a=>({...a,id:uid()}))]),
    M('โตเกียวไส้คาว 3 ไส้', 15, [...ไส้โตเกียว.map(a=>({...a,id:uid()})),
                                  ...ซอสฟรี.map(a=>({...a,id:uid()}))]),
    M('โตเกียวไส้หวาน 6 ชิ้น', 25, [...ไส้หวานโตเกียว,
                                     ...ซอสฟรี.map(a=>({...a,id:uid()}))]),
    M('ไข่ป๋วง 8 ชิ้น', 25, []),
    M('แพนเค้กมินิ 15 ชิ้น', 25, []),
    M('แพนเค้กไส้กรอก 3 ชิ้น', 20, [])
  ];
}

// ใส่เมนูจริงลงแอป โดยไม่แตะยอดขาย/รายจ่ายที่บันทึกไว้แล้ว
function loadShopMenu(){
  const go = () => {
    db.menus = shopMenu();
    delete db.isDemo;
    save(); tab = 'menu'; openMenuId = null; render();
    toast('ใส่เมนูให้แล้ว ' + db.menus.length + ' เมนู');

    'จะแทนที่เมนูเดิมทั้งหมด — ยอดขายกับรายจ่ายที่บันทึกไว้ไม่หาย', 'ใส่เลย', go);
  else go();
}

let order = null;   // {lines:[{menuId,name,price,qty,addons:[{name,price}]}]}

function openPOS(){
  if(!db.menus.length){
    openDialog({ title:'ยังไม่มีเมนู', sub:'ตั้งเมนูกับราคาไว้ก่อน แล้วค่อยมาเปิดบิล',
      html:'<p style="margin:0;color:var(--ink-2)">ไปที่แท็บ <b>เมนู</b> กดปุ่ม <b>เพิ่ม</b> ใส่ชื่อกับราคาขาย แล้วกลับมาที่นี่ครับ</p>' });
    return;
  }
  order = { lines: [] };
  render(); window.scrollTo({top:0});
}
function clearBill(){ if(order) order.lines = []; render(); }
function closePOS(){ order = null; tab = 'today'; render(); window.scrollTo({top:0}); }

const lineTotal = l => (n(l.price) + (l.addons||[]).reduce((s,a) => s + n(a.price), 0)) * n(l.qty);
const orderTotal = () => (order ? order.lines : []).reduce((s,l) => s + lineTotal(l), 0);
const orderCount = () => (order ? order.lines : []).reduce((s,l) => s + n(l.qty), 0);

// กดเมนู: ถ้าบรรทัดล่าสุดเป็นเมนูเดียวกันและยังไม่ใส่ท็อปปิ้ง ให้บวกจำนวนแทนการเพิ่มบรรทัดใหม่
function tapMenu(id){
  const m = findMenu(id); if(!m || !order) return;
  const last = order.lines.find(l => l.menuId === id && !(l.addons||[]).length);
  if(last) last.qty = n(last.qty) + 1;
  else order.lines.push({ lid: uid(), menuId:id, name:m.name, price:n(m.price), qty:1, addons:[] });
  render();
}
function lineQty(lid, v){
  const l = order.lines.find(x => x.lid === lid); if(!l) return;
  l.qty = n(l.qty) + v;
  if(l.qty <= 0) order.lines = order.lines.filter(x => x.lid !== lid);
  render();
}
function delLine(lid){ order.lines = order.lines.filter(x => x.lid !== lid); render(); }

// ใส่ท็อปปิ้งให้บรรทัดนั้น
function lineAddons(lid){
  const l = order.lines.find(x => x.lid === lid); if(!l) return;
  const m = findMenu(l.menuId);
  const tops = menuAddons(m);
  if(!tops.length){
    openDialog({ title:'ยังไม่มีท็อปปิ้ง', sub: m ? m.name : '',
      html:'<p style="margin:0;color:var(--ink-2)">ตั้งท็อปปิ้งของเมนูนี้ได้ที่แท็บ <b>เมนู</b> → เลือกเมนู → <b>ท็อปปิ้งที่เพิ่มได้</b></p>' });
    return;
  }
  const picked = new Set((l.addons||[]).map(a => a.name));
  window._topPick = picked;
  const draw = () => openDialog({
    title:'เลือกไส้ / ท็อปปิ้ง',
    sub: `${l.name} — ติ๊กของที่ลูกค้าเลือก`,
    html: topsHTML(tops, picked, lid),
    foot:[{label:'เสร็จแล้ว', cls:'primary', fn:'dlg.close(); render()'}]
  });
  l._draw = draw;
  draw();
}
function pickLineTop(lid, name){
  const l = order.lines.find(x => x.lid === lid); if(!l) return;
  const m = findMenu(l.menuId);
  const a = menuAddons(m).find(x => x.name === name);
  if(!a) return;
  const has = (l.addons||[]).some(x => x.name === name);
  l.addons = has ? l.addons.filter(x => x.name !== name)
                 : [...(l.addons||[]), {name:a.name, price:n(a.price)}];
  if(l._draw) l._draw();
}

function payBill(){
  if(!order || !order.lines.length) return;
  const d = dayKey(), t = nowTime(), bill = uid();
  order.lines.forEach(l => {
    (db.sales = db.sales || []).push({
      id: uid(), bill, d, t,
      menuId: l.menuId, name: l.name, qty: n(l.qty),
      addons: (l.addons||[]).map(a => ({name:a.name, price:n(a.price)})),
      total: lineTotal(l)
    });
  });
  const paid = orderTotal();
  order = null; tab = 'today'; save(); render();
  toast(`รับเงินแล้ว ${baht(paid)} บาท`);
}

function viewPOS(){
  if(!order) order = { lines: [] };
  const lines = order.lines;
  const menuBtns = db.menus.map(m => `
    <button class="posbtn" onclick="tapMenu('${m.id}')">
      <span class="posbtn-n">${esc(m.name || '(ไม่มีชื่อ)')}</span>
      <span class="posbtn-p">${baht(m.price)}</span>
    </button>`).join('');

  const billRows = lines.map(l => `
    <div class="bill-line">
      <div class="bl-main">
        <div class="bl-name">${esc(l.name || '(ไม่มีชื่อ)')}</div>
        ${(l.addons||[]).length
          ? `<div class="bl-add">${l.addons.map(a => esc(a.name) + (n(a.price) > 0 ? ' +' + baht(a.price) : '')).join(' · ')}</div>`
          : ''}
        <button class="bl-top" onclick="lineAddons('${l.lid}')">+ ท็อปปิ้ง</button>
      </div>
      <div class="bl-qty">
        <button onclick="lineQty('${l.lid}',-1)" aria-label="ลด">−</button>
        <span>${n(l.qty)}</span>
        <button onclick="lineQty('${l.lid}',1)" aria-label="เพิ่ม">+</button>
      </div>
      <div class="bl-sum">${baht(lineTotal(l))}</div>
      <button class="bl-del" onclick="delLine('${l.lid}')" aria-label="ลบ">${icon('x',14)}</button>
    </div>`).join('');

  return `
  <button class="btn back" onclick="closePOS()">${icon('back',16)} ปิดบิล</button>

  <div class="poswrap">
    <div class="pos-left">
      <div class="card">
        <div class="head-row">
          <h2>ลูกค้าสั่งอะไร</h2>
          <button class="btn sm" onclick="go('menu')">แก้เมนู</button>
        </div>
        <p class="sub">กดที่เมนูเพื่อเพิ่มลงบิล · กดซ้ำ = เพิ่มจำนวน</p>
        <div class="posgrid">${menuBtns}</div>
      </div>
    </div>

    <div class="pos-right">
      <div class="billbox">
        <div class="head-row">
          <h2>บิลนี้</h2>
          ${lines.length ? `<button class="btn sm ghost" onclick="clearBill()">ล้างบิล</button>` : ''}
        </div>
        <p class="sub">${lines.length ? `${orderCount()} จาน` : 'ยังไม่ได้เลือกอะไร'}</p>
        <div class="bill">${billRows || `<div class="empty" style="padding:22px 10px">
          <div class="empty-ic">${icon('today',26)}</div>
          <h3 style="font-size:16px">บิลยังว่าง</h3>
          <p style="margin-bottom:0">กดเมนูทางซ้ายที่ลูกค้าสั่ง</p>
        </div>`}</div>
        <div class="billfoot">
          <div class="recipe-sum">
            <b>รวม ${baht(orderTotal())} บาท</b>
            <span>${orderCount()} จาน${lines.length ? ' · กดรับเงินเพื่อบันทึกลงสมุด' : ''}</span>
          </div>
          <div class="btnrow">
            <button class="btn ghost" onclick="closePOS()">ยกเลิก</button>
            <button class="btn primary" onclick="payBill()" ${lines.length ? '' : 'disabled'}>รับเงิน</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

// จัดกลุ่มท็อปปิ้งตามหัวข้อในใบเมนู (ไส้คาว / ไส้หวาน / ราดซอส) จะได้หาเจอเร็ว
function topsHTML(tops, picked, lid){
  const groups = [];
  tops.forEach(a => {
    const g = a.group || '';
    let row = groups.find(x => x.g === g);
    if(!row) groups.push(row = {g, list:[]});
    row.list.push(a);
  });
  return groups.map(row => `
    ${row.g ? `<div class="sec">${esc(row.g)}</div>` : ''}
    <div class="tops">${row.list.map(a => `
      <button class="top${picked.has(a.name) ? ' on' : ''}" onclick="pickLineTop('${lid}','${esc(a.name)}')">
        ${esc(a.name)} <b>${n(a.price) > 0 ? '+' + baht(a.price) : 'ฟรี'}</b>
      </button>`).join('')}</div>`).join('');
}

/* ข้อความแจ้งสั้น ๆ มุมล่าง */
let toastTimer = null;
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast'; el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

/* ===================== หน้า "วันนี้" — หัวใจของแอป ===================== */
function entryRow(e, showDay){
  const isSale = e.kind === 'sale';
  const sub = isSale
    ? [ n(e.qty) > 1 ? n(e.qty) + ' จาน' : '',
        (e.addons||[]).map(a => a.name).join(' ') ].filter(Boolean).join(' · ')
    : '';
  return `<div class="li" role="button" tabindex="0" onclick="editEntry('${e.kind}','${e.id}')"
       onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();editEntry('${e.kind}','${e.id}')}">
    <div class="li-main">
      <div class="li-title">${esc(isSale ? (e.name || 'ขายได้') : (e.note || 'ซื้อของ'))}</div>
      <div class="li-sub">${showDay ? thaiDate(e.d) + ' · ' : ''}${e.t || ''}${sub ? ' · ' + esc(sub) : ''}</div>

/* ---------- บันทึกการขาย (เลือกเมนู + ท็อปปิ้ง) ---------- */
let saleDraft = null;

function saleDialog(existing){
  if(!db.menus.length){
    openDialog({ title:'ยังไม่มีเมนู', sub:'ใส่เมนูที่ขายก่อน แล้วค่อยมาบันทึกการขาย',
      html:'<p style="margin:0;color:var(--ink-2)">ไปที่แท็บ <b>เมนู</b> แล้วกดปุ่ม <b>เพิ่ม</b> เพื่อใส่ชื่อกับราคาขายก่อนครับ</p>' });
    return;
  }
  const first = db.menus[0];
  saleDraft = existing
    ? { menuId: existing.menuId || first.id, qty: n(existing.qty) || 1,
        picked: new Set((existing.addons||[]).map(a => a.name)),
        id: existing.id, t: existing.t, d: existing.d }
    : { menuId: first.id, qty: 1, picked: new Set() };
  renderSaleDialog();
}

function saleTotal(){
  const m = findMenu(saleDraft.menuId);
  if(!m) return 0;
  const extra = (m.addons||[]).filter(a => saleDraft.picked.has(a.name))
                              .reduce((s,a) => s + n(a.price), 0);
  return (n(m.price) + extra) * n(saleDraft.qty);
}

function renderSaleDialog(){
  const m = findMenu(saleDraft.menuId) || db.menus[0];
  const tops = menuAddons(m);
  openDialog({
    title: saleDraft.id ? 'แก้รายการขาย' : 'บันทึกการขาย',
    sub: 'เลือกเมนู ใส่จำนวน แล้วติ๊กท็อปปิ้งที่ลูกค้าเพิ่ม',
    html: `
      <div class="sec" style="margin-top:0">ขายอะไร</div>
      <div class="pills">${db.menus.map(x => `
        <button class="pill${x.id === saleDraft.menuId ? ' on' : ''}" onclick="pickMenu('${x.id}')">
          ${esc(x.name || '(ไม่มีชื่อ)')}<b>${baht(x.price)}</b>
        </button>`).join('')}</div>

      <div class="sec">กี่จาน</div>
      <div class="stepper">
        <button onclick="bumpQty(-1)" aria-label="ลด">−</button>
        <span id="saleQty">${n(saleDraft.qty)}</span>
        <button onclick="bumpQty(1)" aria-label="เพิ่ม">+</button>
      </div>

      ${tops.length ? `<div class="sec">ท็อปปิ้งที่เพิ่ม</div>
      <div class="tops">${tops.map(a => `
        <button class="top${saleDraft.picked.has(a.name) ? ' on' : ''}" onclick="toggleTop('${esc(a.name)}')">
          ${esc(a.name)} <b>+${baht(a.price)}</b>
        </button>`).join('')}</div>`
      : `<p class="hint">เมนูนี้ยังไม่ได้ตั้งท็อปปิ้ง — เพิ่มได้ที่แท็บเมนู</p>`}

      <div class="dlg-live" style="margin-top:18px" id="saleSum">รวม ${baht(saleTotal())} บาท</div>`,
    foot: [
      {label:'ยกเลิก', cls:'ghost', fn:'dlg.close()'},
      {label: saleDraft.id ? 'บันทึกการแก้ไข' : 'บันทึก', cls:'primary', fn:'commitSale()'},
      ...(saleDraft.id ? [{label:'ลบ', cls:'danger', fn:`dlg.close(); delEntry('sale','${saleDraft.id}')`}] : [])
    ]
  });
}
function pickMenu(id){ saleDraft.menuId = id; saleDraft.picked = new Set(); renderSaleDialog(); }
function bumpQty(v){
  saleDraft.qty = Math.max(1, n(saleDraft.qty) + v);
  const q = document.getElementById('saleQty'); if(q) q.textContent = saleDraft.qty;
  const t = document.getElementById('saleSum'); if(t) t.textContent = 'รวม ' + baht(saleTotal()) + ' บาท';
}
function toggleTop(name){
  if(saleDraft.picked.has(name)) saleDraft.picked.delete(name); else saleDraft.picked.add(name);
  renderSaleDialog();
}
function commitSale(){
  const m = findMenu(saleDraft.menuId);
  if(!m) return;
  const addons = (m.addons||[]).filter(a => saleDraft.picked.has(a.name))
                               .map(a => ({name:a.name, price:n(a.price)}));
  const rec = {
    id: saleDraft.id || uid(),
    d: saleDraft.d || dayKey(),
    t: saleDraft.t || nowTime(),
    menuId: m.id, name: m.name, qty: n(saleDraft.qty),
    addons, total: saleTotal()
  };
  const i = (db.sales||[]).findIndex(x => x.id === rec.id);
  if(i >= 0) db.sales[i] = rec; else (db.sales = db.sales||[]).push(rec);
  saleDraft = null; save(); dlg.close(); render();
}

/* ---------- บันทึกรายจ่าย ---------- */
function expenseDialog(existing){
  openDialog({
    title: existing ? 'แก้รายจ่าย' : 'บันทึกรายจ่าย',
    sub: 'ซื้อของเข้าร้าน ค่าแก๊ส ค่าเดินทาง ฯลฯ',
    fields:[
      {k:'note', label:'ซื้ออะไร', type:'text', value: existing ? existing.note : '',
       placeholder:'เช่น แป้ง 2 ถุง + ไข่ 1 แผง', wide:true},
      {k:'amount', label:'กี่บาท', type:'number', value: existing ? existing.amount : '', wide:true}
    ],
    check: v => !v.note.trim() ? 'ใส่ด้วยว่าซื้ออะไร'
              : !(v.amount > 0) ? 'จำนวนเงินต้องมากกว่า 0' : null,
    extraFoot: existing ? {label:'ลบ', cls:'danger', fn:`dlg.close(); delEntry('exp','${existing ? existing.id : ''}')`} : null,
    save: v => {
      const rec = { id: existing ? existing.id : uid(),
                    d: existing ? existing.d : dayKey(),
                    t: existing ? existing.t : nowTime(),
                    note: v.note.trim(), amount: v.amount };
      const i = (db.expenses||[]).findIndex(x => x.id === rec.id);
      if(i >= 0) db.expenses[i] = rec; else (db.expenses = db.expenses||[]).push(rec);
      save(); render();
    }

/* ---------- แตะรายการเพื่อแก้ / ลบ ---------- */
function editEntry(kind, id){
  if(kind === 'sale'){
    const e = (db.sales||[]).find(x => x.id === id);
    if(e) saleDialog(e);
  }else{
    const e = (db.expenses||[]).find(x => x.id === id);
    if(e) expenseDialog(e);
  }
}
function delEntry(kind, id){
  if(kind === 'sale') db.sales = (db.sales||[]).filter(x => x.id !== id);
  else db.expenses = (db.expenses||[]).filter(x => x.id !== id);
  save(); render();
}

    blocks.push(`<div class="card">
      <h2>ภาพรวมร้าน</h2>
      <p class="sub">อีกนิดเดียว — บอกหน่อยว่าแต่ละเมนูขายได้วันละกี่จาน</p>

      <button class="btn primary block" onclick="editSales()">ใส่ยอดขายต่อวัน</button>
      <p class="hint">กะคร่าว ๆ ได้ ไม่ต้องเป๊ะ แก้ทีหลังเมื่อไหร่ก็ได้</p>
    </div>`);
  }else{
    /* --- ตัวเลขหลัก --- */
    const netCls = d.net >= 0 ? 'good' : 'bad';
    blocks.push(`<div class="card">
      <h2>ยอดขายที่ใช้คำนวณ</h2>
      <p class="sub">ขายวันละ ${d.plates} จาน · เดือนละ ${n(db.fixed.days)} วัน · ค่าเช่า+ค่าไฟวันละ ${baht(d.fixed)} บาท</p>
      <button class="btn block" onclick="editSales()">แก้ยอดขายต่อวัน</button>

        <h2>เงินที่ขายได้ไปไหนบ้าง</h2>
        <p class="sub">จากรายได้ ${baht(d.revenue)} บาทต่อวัน</p>

          <i style="width:${fw}%; background:var(--orange-l)"></i>
          <i style="width:${xw}%; background:var(--orange-mid)"></i>
          <i style="width:${pw}%; background:${d.net>=0?'var(--orange-d)':'var(--bad)'}"></i>
        </div>
        <div class="legend">
          <span><i style="background:var(--orange-l)"></i>วัตถุดิบ <b>${fw.toFixed(0)}%</b> · ${baht(d.food)}</span>
          <span><i style="background:var(--orange-mid)"></i>ค่าเช่า/ค่าไฟ <b>${xw.toFixed(0)}%</b> · ${baht(d.fixed)}</span>
          <span><i style="background:${d.net>=0?'var(--orange-d)':'var(--bad)'}"></i>${d.net>=0?'เหลือเป็นกำไร':'ขาดทุน'} <b>${pw.toFixed(0)}%</b> · ${baht(d.net)}</span>
        </div>
      </div>`);
    }

    /* --- จุดคุ้มทุน --- */
    if(d.need > 0){
      const pct = clamp(d.plates / d.need * 100, 0, 100);
      const ok = d.plates >= d.need;
      blocks.push(`<div class="card">
        <h2>ขายพอคุ้มแล้วหรือยัง</h2>
        <p class="sub">ต้องขายให้ได้ ${Math.ceil(d.need)} จาน ถึงจะพอจ่ายค่าเช่าและค่าไฟ</p>
        <div class="rank-row" style="margin-top:6px">

          <div class="rank-val ${ok?'good':'bad'}">${pct.toFixed(0)}%</div>
          <div class="meter is-${ok?'good':'bad'}"><i style="width:${pct}%"></i></div>

          ? `ผ่านจุดคุ้มทุนแล้ว ขายเกินมา <b>${d.plates - Math.ceil(d.need)} จาน</b> ส่วนนี้คือกำไรล้วน ๆ`

      </div>`);
    }

    /* --- เมนูไหนทำเงินให้ร้านมากสุด --- */
    const earners = db.menus
      .map(m => ({m, total: profit(m) * n(m.qtyPerDay)}))
      .filter(x => n(x.m.qtyPerDay) > 0)
      .sort((a,b) => b.total - a.total);
    if(earners.length){
      const top = Math.max(...earners.map(x => Math.abs(x.total))) || 1;
      blocks.push(`<div class="card">
        <h2>เมนูไหนทำเงินให้ร้านมากสุด</h2>
        <p class="sub">กำไรต่อจาน × จำนวนที่ขายได้ — ไม่ใช่เมนูที่ %กำไรสูงสุดเสมอไป</p>

            <div class="rank-val ${x.total>=0?'good':'bad'}">${baht(x.total)}</div>
            <div class="meter ${x.total>=0?'':'is-bad'}"><i style="width:${clamp(Math.abs(x.total)/top*100,2,100)}%"></i></div>

          </div>`).join('')}</div>
      </div>`);
    }
  }

  return back + blocks.join('') + viewSum();
}

/* หน้าต่างกรอกยอดขายของทุกเมนูในทีเดียว */
function editSales(){
  openDialog({
    title:'ยอดขายต่อวัน',
    sub:'กะคร่าว ๆ ว่าแต่ละเมนูขายได้วันละกี่จาน',
    fields: db.menus.map(m => ({
      k:'q_'+m.id, label:(m.name || '(ไม่มีชื่อ)') + ' — จาน/วัน',
      type:'number', value:n(m.qtyPerDay) || '', wide:true
    })),
    live: v => {
      let rev=0, food=0, plates=0;
      db.menus.forEach(m => {
        const q = n(v['q_'+m.id]);
        plates += q; rev += n(m.price)*q; food += menuCost(m)*q;
      });
      if(!plates) return 'ใส่ตัวเลขแล้วจะคำนวณให้ทันที';
      const net = rev - food - fixedPerDay();
      return `ขายวันละ ${plates} จาน → กำไรสุทธิ ${baht(net)} บาท/วัน`;
    },
    check: v => Object.values(v).some(x => n(x) < 0) ? 'จำนวนจานติดลบไม่ได้' : null,
    save: v => {
      db.menus.forEach(m => m.qtyPerDay = n(v['q_'+m.id]));
      save(); render();
    }
  });
}

/* --------- ส่วนเปรียบเทียบเมนู (อยู่ท้ายหน้าภาพรวม) --------- */
function viewSum(){
  if(!db.menus.length) return '';
  const sorted = [...db.menus].sort((a,b) => marginPct(b) - marginPct(a));
  const worst = sorted[sorted.length-1];

  const bars = sorted.map(m => {
    const mg = marginPct(m), lv = level(mg);
    return `<div class="rank-row">
      <div class="rank-name">${esc(m.name||'(ไม่มีชื่อ)')}</div>
      <div class="rank-val ${lv}">${mg.toFixed(1)}%</div>
      <div class="meter is-${lv}"><i style="width:${clamp(mg,0,100)}%"></i></div>
      <div class="rank-sub">ขาย ${baht(m.price)} · ต้นทุน ${baht(menuCost(m))} · กำไร ${baht(profit(m))} บาท</div>
    </div>`;
  }).join('');

  const rows = sorted.map(m => {
    const mg = marginPct(m);
    return `<tr>
      <td>${esc(m.name||'(ไม่มีชื่อ)')}</td>
      <td class="n">${baht(menuCost(m))}</td>
      <td class="n">${baht(m.price)}</td>
      <td class="n ${profit(m)>=0?'good':'bad'}">${baht(profit(m))}</td>
      <td class="n ${level(mg)}">${mg.toFixed(1)}%</td>
      <td class="n">${baht(suggestPrice(m))}</td>
    </tr>`;
  }).join('');

  const tips = [];
  if(worst && marginPct(worst) < n(db.targetMargin))
    tips.push(`<b>${esc(worst.name||'(ไม่มีชื่อ)')}</b> กำไรบางสุดที่ ${marginPct(worst).toFixed(1)}% — ลองขึ้นราคาเป็น ${baht(suggestPrice(worst))} บาท หรือลดปริมาณไส้ลง`);
  if(breakEven())
    tips.push(`ต้องขายให้ได้วันละ <b>${Math.ceil(breakEven())} จาน</b> ถึงจะคุ้มค่าเช่าและค่าไฟ`);
  if(!fixedPerMonth())
    tips.push(`ยังไม่ได้ใส่ต้นทุนคงที่ — ตัวเลขกำไรที่เห็นยังไม่ได้หักค่าเช่ากับค่าไฟ`);

  return `
  <div class="card">
    <h2>เมนูไหนกำไรดี</h2>
    <p class="sub">ยิ่งแท่งยาวยิ่งดี · ร้านอาหารทั่วไปควรได้ 60% ขึ้นไป</p>
    <div class="rank">${bars}</div>
  </div>

  <div class="card">
    <details>
      <summary>ดูตารางสรุปแบบเต็ม</summary>
    <div class="scroll">
      <table>
        <thead><tr><th>เมนู</th><th>ต้นทุน</th><th>ขาย</th><th>กำไร</th><th>กำไร %</th><th>แนะนำ</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="hint">เลื่อนตารางไปทางซ้ายเพื่อดูคอลัมน์ที่เหลือ</p>
    </details>
  </div>

  ${tips.length ? `<div class="card"><h2>ข้อสังเกต</h2>
    ${tips.map(t=>`<div class="note">${t}</div>`).join('')}</div>` : ''}`;
}

function addonDialog(menuId, idx){
  const m = findMenu(menuId); if(!m) return;
  const cur = idx >= 0 ? (m.addons||[])[idx] : null;
  openDialog({
    title: cur ? 'แก้ท็อปปิ้ง' : 'เพิ่มท็อปปิ้ง',
    sub: `ของที่ลูกค้าเพิ่มได้ในเมนู ${m.name || '(ไม่มีชื่อ)'}`,
    fields:[
      {k:'name', label:'ชื่อท็อปปิ้ง', type:'text', value: cur ? cur.name : '',
       placeholder:'เช่น เพิ่มไข่', wide:true},
      {k:'price', label:'คิดเพิ่มกี่บาท', type:'number', value: cur ? cur.price : '', wide:true}
    ],
    check: v => !v.name.trim() ? 'ใส่ชื่อท็อปปิ้งด้วย'
              : v.price < 0 ? 'ราคาติดลบไม่ได้' : null,
    extraFoot: cur ? {label:'ลบ', cls:'danger', fn:`dlg.close(); delAddon('${menuId}',${idx})`} : null,

function delAddon(menuId, idx){

/* ---------- เลือกว่าเมนูนี้ใช้ชุดไส้ไหนบ้าง ---------- */
function pickGroups(menuId){
  const m = findMenu(menuId); if(!m) return;
  const picked = new Set(m.groupIds || []);
  openDialog({
    title: 'เมนูนี้ใส่อะไรได้บ้าง',
    sub: esc(m.name || '(ไม่มีชื่อ)'),
    html: (db.groups||[]).length
      ? `<div class="picks">${db.groups.map(g => `
          <div class="pick${picked.has(g.id) ? ' on' : ''}">
            <button class="pick-box" onclick="toggleMenuGroup('${menuId}','${g.id}')"
                    aria-pressed="${picked.has(g.id)}">${icon('check',15)}</button>
            <div class="pick-main" onclick="toggleMenuGroup('${menuId}','${g.id}')">
              <div class="li-title">${esc(g.name)}</div>
              <div class="li-sub">${g.items.length} อย่าง · ${g.items.slice(0,4).map(i => esc(i.name)).join(' ')}${g.items.length > 4 ? ' …' : ''}</div>
            </div>
          </div>`).join('')}</div>`
      : `<p style="margin:0;color:var(--ink-2)">ยังไม่มีชุดไส้ — กด <b>เพิ่มชุด</b> ในหน้าตั้งค่าก่อนครับ</p>`,
    foot: [{label:'เสร็จแล้ว', cls:'primary', fn:'dlg.close(); render()'}]
  });
}
function toggleMenuGroup(menuId, gid){
  const m = findMenu(menuId); if(!m) return;
  const ids = new Set(m.groupIds || []);
  if(ids.has(gid)) ids.delete(gid); else ids.add(gid);
  m.groupIds = [...ids];
  save(); pickGroups(menuId);          // เปิดหน้าต่างเดิมซ้ำเพื่อให้เห็นติ๊กเปลี่ยน
}

/* ---------- ชุดไส้: สร้าง / เปลี่ยนชื่อ / ลบ ---------- */
function groupDialog(g){
  openDialog({
    title: g ? 'เปลี่ยนชื่อชุด' : 'เพิ่มชุดไส้',
    sub: g ? '' : 'เช่น ไส้คาว · ไส้หวาน · ราดซอส (ฟรี)',
    fields: [{k:'name', label:'ชื่อชุด', type:'text', value: g ? g.name : '',
              placeholder:'เช่น ไส้คาว', wide:true}],
    check: v => !v.name.trim() ? 'ใส่ชื่อชุดด้วย' : null,
    extraFoot: g ? {label:'ลบชุด', cls:'danger', fn:`dlg.close(); delGroup('${g.id}')`} : null,
    save: v => {
      if(g) g.name = v.name.trim();
      else (db.groups = db.groups||[]).push({id:uid(), name:v.name.trim(), items:[]});
      save(); render();
    }
  });
}
function delGroup(gid){
  const g = findGroup(gid); if(!g) return;
  const used = db.menus.filter(m => (m.groupIds||[]).includes(gid)).length;
  askConfirm(`ลบชุด "${g.name}" ?`,
    used ? `ชุดนี้ถูกใช้อยู่ใน ${used} เมนู ลบแล้วเมนูเหล่านั้นจะเลือกไส้ชุดนี้ไม่ได้อีก`
         : 'ยังไม่มีเมนูไหนใช้ชุดนี้',
    'ลบ', () => {
      db.groups = (db.groups||[]).filter(x => x.id !== gid);
      db.menus.forEach(m => m.groupIds = (m.groupIds||[]).filter(x => x !== gid));
      save(); tab = 'setup'; render();
    });
}

function groupItemDialog(gid, idx){

    title: cur ? 'แก้ไส้' : 'เพิ่มไส้',

      {k:'name', label:'ชื่อไส้', type:'text', value: cur ? cur.name : '', placeholder:'เช่น ไก่หยอง', wide:true},

function delGroupItem(gid, idx){
  const g = findGroup(gid); if(!g) return;
  g.items.splice(idx,1); save(); render(); groupEditor(gid);
}

/* ===================== สำรอง / กู้คืน ===================== */
function openBackup(){
  const box = document.getElementById('backup');
  document.getElementById('dump').value = JSON.stringify(db);
  document.getElementById('bkMsg').textContent = '';
  box.hidden = false;
  box.scrollIntoView({behavior:'smooth', block:'start'});
}
function closeBackup(){ document.getElementById('backup').hidden = true; }
function bkMsg(t){ document.getElementById('bkMsg').textContent = t; }

async function copyDump(){
  const ta = document.getElementById('dump');
  try{
    await navigator.clipboard.writeText(ta.value);
    bkMsg('คัดลอกแล้ว — เอาไปวางเก็บไว้ที่ไหนก็ได้');
  }catch(e){
    ta.select(); bkMsg('กดค้างที่ข้อความแล้วเลือก "คัดลอก" เองนะครับ');
  }
}
function restoreText(){
  const txt = document.getElementById('paste').value.trim();
  if(!txt) return bkMsg('ยังไม่ได้วางข้อความ');
  if(!applyData(txt)) return bkMsg('ข้อความไม่ถูกต้อง ลองคัดลอกมาใหม่ทั้งก้อน');
  bkMsg('กู้คืนเรียบร้อย');
}
function applyData(raw){
  try{
    const data = JSON.parse(raw);
    if(!data || !Array.isArray(data.ingredients)) return false;
    db = Object.assign(blank(), data);
    save(); render();
    return true;
  }catch(e){ return false; }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ต้นทุนร้านเครป-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(input){
  const file = input.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    bkMsg(applyData(r.result) ? 'กู้คืนจากไฟล์เรียบร้อย' : 'ไฟล์ไม่ถูกต้อง');

  };
  r.readAsText(file);
}

// ใส่ท็อปปิ้ง + สร้างประวัติย้อนหลังให้ข้อมูลตัวอย่าง จะได้เห็นว่าหน้าย้อนหลังหน้าตาเป็นยังไง
function seedHistory(d){
  const tops = [
    {id:uid(), name:'เพิ่มไข่', price:10},
    {id:uid(), name:'เพิ่มชีส', price:15},
    {id:uid(), name:'เพิ่มนูเทลล่า', price:20}
  ];
  d.menus.forEach(m => m.addons = tops.map(t => ({...t, id:uid()})));

  const today = new Date();
  for(let back = 13; back >= 0; back--){
    const dt = new Date(today); dt.setDate(today.getDate() - back);
    if(dt.getDay() === 1) continue;                       // สมมติปิดวันจันทร์
    const key = dayKey(dt);
    const busy = 0.75 + ((back * 37) % 55) / 100;          // ให้แต่ละวันไม่เท่ากัน
    d.menus.forEach((m, mi) => {
      const q = Math.max(1, Math.round(n(m.qtyPerDay) * busy));
      const add = (mi + back) % 3 === 0 ? [m.addons[(back + mi) % m.addons.length]] : [];
      const extra = add.reduce((a,x) => a + x.price, 0);
      d.sales.push({
        id: uid(), d: key, t: pad2(10 + mi*3) + ':' + pad2((back*7) % 60),
        menuId: m.id, name: m.name, qty: q,
        addons: add.map(x => ({name:x.name, price:x.price})),
        total: (n(m.price) + extra) * q
      });
    });
    if(back % 3 === 0){
      d.expenses.push({ id:uid(), d:key, t:'08:20', note:'ซื้อของเข้าร้าน',
                        amount: 380 + ((back*53) % 240) });
    }
  }
  d.expenses.push({ id:uid(), d: dayKey(), t:'08:10', note:'ค่าแก๊ส', amount:400 });
  return d;
}

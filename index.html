/* ===================== รับออเดอร์จากลูกค้า =====================
   ลูกค้าสแกน QR ที่หน้าร้าน เปิดหน้า order.html (คนละลิงก์กับแอปนี้) กดสั่งเอง
   แล้วออเดอร์เด้งมาโผล่ที่เครื่องแม่ค้า

   ออเดอร์ต้องเดินทางข้ามเครื่อง จึงต้องมีที่เก็บกลาง ใช้ Firebase Realtime Database
   คุยกันด้วย REST ธรรมดา ไม่ต้องโหลด SDK — แอปนี้ยังไม่มี dependency เหมือนเดิม

   สิ่งที่ขึ้นไปบนนั้นมีแค่: ชื่อร้าน สาขา ร้านเปิดอยู่ไหม เมนู ราคา ไส้ และออเดอร์ที่ลูกค้าสั่ง
   สิ่งที่ไม่ขึ้นเด็ดขาด: ต้นทุน วัตถุดิบ ค่าใช้จ่าย ยอดขายย้อนหลัง กำไร รหัสคนดูแล */

function cloudBase(){
  let own = '';
  try{ own = localStorage.getItem(CLOUD_KEY) || ''; }catch(e){}
  return String(own || CLOUD_BASE || '').trim().replace(/\/+$/, '');
}
const cloudReady = () => !!cloudBase();

/* ---------- หา URL ของที่เก็บจาก "ชื่อโปรเจกต์" ให้เอง ----------
   URL จริงของ Firebase มีชื่อโซนปนอยู่ด้วย เช่น
     https://pramvit-order-default-rtdb.asia-southeast1.firebasedatabase.app
   เจ้าของร้านไม่ควรต้องไปไล่หาเอง พิมพ์แค่ชื่อโปรเจกต์ก็พอ
   แล้วให้แอปลองยิงดูทีละโซนว่าอันไหนมีอยู่จริง

   ตอบ 200 = อ่านได้ · 401 = มีจริงแต่กฎไม่ให้อ่านตรงนั้น (ก็คือมีอยู่)
   404 = ไม่มีที่เก็บตัวนี้ ลองโซนถัดไป */
const RTDB_ZONES = ['asia-southeast1', '', 'us-central1', 'europe-west1'];
const rtdbURL = (id, zone) =>
  zone ? `https://${id}-default-rtdb.${zone}.firebasedatabase.app`
       : `https://${id}-default-rtdb.firebaseio.com`;

async function liveCloud(base){
  try{
    const res = await fetch(`${base}/.json?shallow=true`);
    return res.status === 200 || res.status === 401;
  }catch(e){ return false; }
}

// รับได้ทั้ง URL เต็ม ๆ และชื่อโปรเจกต์เปล่า ๆ — คืน URL ที่ใช้ได้จริง หรือ '' ถ้าหาไม่เจอ
async function resolveCloud(input){
  const raw = String(input || '').trim().replace(/\/+$/, '');
  if(!raw) return '';

  // ใส่ลิงก์หน้า console มา ก็ดึงชื่อโปรเจกต์ออกมาให้
  const fromConsole = raw.match(/console\.firebase\.google\.com\/.*?\/project\/([\w-]+)/);
  const id = fromConsole ? fromConsole[1]
           : (/^https?:\/\//.test(raw) ? '' : raw.replace(/[^\w-]/g, ''));

  if(!id) return (await liveCloud(raw)) ? raw : '';

  for(const z of RTDB_ZONES){
    const u = rtdbURL(id, z);
    if(await liveCloud(u)) return u;
  }
  return '';
}

async function cloudReq(method, path, body){
  const base = cloudBase();
  if(!base) throw new Error('ยังไม่ได้ตั้งที่เก็บออเดอร์');
  const res = await fetch(`${base}/${path}.json`, {
    method,
    headers: body === undefined ? undefined : {'Content-Type':'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if(!res.ok){
    const err = new Error('ต่อไม่ติด (' + res.status + ')');
    /* 401/403 = ที่เก็บปฏิเสธ ไม่ใช่เน็ตหลุด
       เคสจริงที่ต้องกลัว: กฎของ Firebase ที่ตั้งเป็น "โหมดทดสอบ" หมดอายุ 30 วัน
       พอหมดแล้วมันปิดทุกทาง ลูกค้าสั่งไม่ได้และออเดอร์ไม่เข้าเครื่องแม่ค้า
       **โดยไม่มีอะไรเตือนเลย** เพราะโค้ดเดิมกลืน error ทิ้งทั้งหมด
       แม่ค้าจะนึกว่าวันนี้ไม่มีลูกค้าสั่ง ไม่ใช่ว่าระบบตาย */
    err.denied = (res.status === 401 || res.status === 403);
    throw err;
  }
  return res.json();
}

/* จำไว้ว่าที่เก็บกำลังปฏิเสธอยู่ไหม — เอาไปขึ้นแถบเตือนบนสุดของทุกหน้า */
let cloudDenied = false;

function markCloud(err){
  const bad = !!(err && err.denied);
  if(bad === cloudDenied) return false;        // ไม่เปลี่ยน ไม่ต้องวาดใหม่
  cloudDenied = bad;
  if(bad){ beep(); toast('ที่เก็บออเดอร์ไม่ให้เข้าถึง — ลูกค้าสั่งไม่ได้ตอนนี้'); }
  return true;                                  // เปลี่ยนแล้ว ให้คนเรียกไปวาดใหม่
}

// ลิงก์ที่เอาไปทำ QR ติดหน้าร้าน — เดาไม่ได้ เพราะมีรหัสช่องของร้านอยู่ในนั้น
function orderLink(){
  if(!db.orderKey) return '';
  return location.origin + location.pathname.replace(/[^/]*$/, '') + 'order.html?s=' + db.orderKey;
}

// ใบเมนูที่ลูกค้าจะเห็น — หยิบเฉพาะที่ต้องโชว์ ไม่ลากต้นทุนหรือสูตรไปด้วย
function menuForCustomers(){
  const hotIds = hotForCustomers();      // คิดที่นี่ครั้งเดียว ไม่ใช่ไล่คิดทุกเมนู
  const outTops = new Set(topOutNames()); // เหมือนกัน ไม่ไล่กวาดทุกชุดซ้ำทุกชิ้น
  return {
    name:   String(db.shopName || 'ร้านของฉัน'),
    branch: String(db.shopBranch || ''),
    open:   !!db.shopOpen,     // ร้านเปิดขายอยู่ไหม
    taking: !!db.orderOn,      // รับออเดอร์ผ่านหน้าลูกค้าอยู่ไหม (คนละเรื่องกับร้านเปิด)
    at:     Date.now(),
    /* เบอร์พร้อมเพย์ — ต้องขึ้นไปด้วย ไม่งั้นมือถือลูกค้าสร้าง QR ไม่ได้
       นี่คือข้อมูลชิ้นเดียวที่ "เป็นของเจ้าของ" ที่ยอมให้ขึ้นคลาวด์ นอกนั้นยังห้ามเหมือนเดิม */
    payId:  String(db.payId || ''),
    menus:  db.menus.map(m => ({
      id: m.id, name: String(m.name || ''), price: n(m.price),
      incl: n(m.incl), extraTop: n(m.extraTop),   // โควตาไส้ ต้องตรงกับฝั่งร้าน
      /* วันนี้หมดแล้วไหม — ส่งเป็น true/false ไม่ส่งวันที่
         ลูกค้าไม่ต้องรู้ว่าปิดตั้งแต่วันไหน และก้อนจะได้เล็ก */
      /* เมนูจัดชุดที่ไส้ของมันหมด ต้องปิดให้ลูกค้าด้วย เพราะเขาเลือกไส้เองไม่ได้ */
      off: customerOff(m),
      /* อันดับขายดี 1-3 (0 = ไม่ติดป้าย) — **เป็นอันดับเท่านั้น ไม่มีตัวเลขยอดขาย**
         ของที่วันนี้หมดแล้วไม่ต้องติดป้าย อ่านแล้วขัดกันเอง */
      hot: customerOff(m) ? 0 : hotIds.indexOf(m.id) + 1,
      /* ไส้ที่ร้านจัดให้ตายตัว — ลูกค้าต้องเห็นว่าจานนี้มีอะไร ไม่ใช่สั่งแบบไม่รู้ว่าได้อะไร */
      fix: setAddons(m).map(a => a.name),
      groups: (m.groupIds || []).map(id => findGroup(id)).filter(Boolean).map(g => ({
        name: String(g.name || ''),
        /* ไส้ที่วันนี้หมด ส่งเป็น true/false เหมือนเมนู ไม่ส่งวันที่ */
        items: (g.items || []).map(it => ({ name: String(it.name || ''), price: n(it.price),
                                            off: outTops.has(it.name) }))
      })).filter(g => g.items.length)
    })).filter(m => m.name)
  };
}

/* ===================== ของหมดวันนี้ =====================
   เจ้าของเลือกเอง: พอไข่หมดตอนหกโมง ลูกค้าก็ยังสั่งไข่ว่งเข้ามาเรื่อย ๆ
   แล้วต้องมานั่งกด "ไม่รับ" ทีละใบ · ปิดเมนูทีเดียวจบ

   **จดเป็นวันที่ ไม่ใช่ true/false** พรุ่งนี้มันเปิดขายเองโดยไม่ต้องมีอะไร
   มารันตอนเที่ยงคืน และไม่ต้องจำไปล้างทีหลัง
   (ถ้าเก็บเป็น true จะต้องมีคนไปปิดให้ทุกเช้า ซึ่งลืมแน่) */
const isSoldOut = m => !!m && m.soldDay === dayKey();
const soldOutList = () => (db.menus || []).filter(isSoldOut);

/* ===================== ไส้หมดรายอย่าง =====================
   เจ้าของถามเอง: "แล้วตั้งตรงไหน ไส้คาวกับหวาน ตอนที่หมด"
   ของเดิมปิดได้แค่ทั้งเมนู พอไข่หมดแต่ไส้อื่นยังมี ต้องปิดทั้งเมนูทิ้ง = เสียของ

   **ปิดเป็น "ชื่อไส้" ไม่ใช่รายชิ้นในชุด** ไส้ชื่อเดียวกันอยู่ได้หลายชุด
   (ไข่ไก่อยู่ทั้งไส้คาวและไส้โตเกียว) ปิดทีละชุดแล้วลูกค้าจะเห็นอันหนึ่งหมดอีกอันไม่หมด
   **จดเป็นวันที่เหมือนเมนู** พรุ่งนี้กลับมาใส่ได้เองโดยไม่ต้องมีใครมาเปิด */
const isTopOut = it => !!it && it.soldDay === dayKey();
function topsByName(name){
  const out = [];
  (db.groups || []).forEach(g => (g.items || []).forEach(it => { if(it.name === name) out.push(it); }));
  return out;
}
const topOutByName = name => topsByName(name).some(isTopOut);
function topOutNames(){
  const out = [];
  (db.groups || []).forEach(g => (g.items || []).forEach(it => {
    if(isTopOut(it) && !out.includes(it.name)) out.push(it.name);
  }));
  return out;
}
function toggleTopOut(name){
  const list = topsByName(name); if(!list.length) return;
  const was = list.some(isTopOut);
  list.forEach(it => { it.soldDay = was ? '' : dayKey(); });
  save();
  // ส่งขึ้นทันทีเหมือนเมนู ลูกค้าอาจนิ้วจ่ออยู่ที่ชิปไส้นั้นพอดี
  if(db.orderOn && cloudReady()) publishMenu().catch(() => {});
  toast(was ? `${name} — กลับมาใส่ได้แล้ว` : `${name} — ปิดไว้ว่าหมดแล้ว`);
  render();
  const box = document.getElementById('soldBox');
  if(box) box.innerHTML = soldOutHTML();
}
/* เมนูจัดชุดที่ไส้ของมันหมด = ทำให้ลูกค้าไม่ได้จริง ๆ
   ลูกค้าเลือกไส้เองไม่ได้ด้วย จึงต้องปิดเมนูนั้นให้ฝั่งลูกค้าไปเลย
   (เมนูธรรมดาไม่ต้อง เพราะลูกค้าเลี่ยงไปเลือกไส้อื่นได้) */
const setMenuOut = m => isSetMenu(m) && setAddons(m).some(a => topOutByName(a.name));
/* "เมนูนี้ปิดฝั่งลูกค้าอยู่ไหม" ต้องถามตัวนี้ตัวเดียวทุกที่ (ใบเมนู · ป้ายบนหน้าขาย)
   เคยใช้ isSoldOut() เฉย ๆ บนหน้าขาย เมนูจัดชุดที่ปิดเพราะไส้หมดเลยไม่มีป้ายให้แม่ค้าเห็น */
const customerOff = m => isSoldOut(m) || setMenuOut(m);
/* นับไส้ที่ "เลือกได้จริงวันนี้" — ต้องนับแบบเดียวกับหน้าลูกค้าเป๊ะ
   เจ้าของทักเอง: หน้าขายขึ้น "เลือกไส้ได้ 23" ทั้งที่ปิดไว้ว่าหมดไปหลายอย่าง
   ลูกค้าเห็นเลขหนึ่ง หน้าร้านเห็นอีกเลขหนึ่ง อ่านแล้วงง
   ชื่อซ้ำข้ามชุด (ไข่ไก่อยู่ทั้งคาวและโตเกียว) นับครั้งเดียว · ไส้ที่ปิดว่าหมดไม่นับ
   แต่บอกไว้ท้ายว่าหมดกี่อย่าง แม่ค้าจะได้รู้ว่ายังมีของที่ปิดค้างอยู่ */
function topsLeft(m, outSet){
  const out = outSet || new Set(topOutNames());
  const names = [...new Set(menuAddons(m).map(a => a.name))];
  const left = names.filter(nm => !out.has(nm)).length;
  return { left, out: names.length - left };
}
function topsText(t, short){
  if(!t.left && t.out) return 'ไส้หมดทุกอย่างวันนี้';
  return `เลือกไส้ได้ ${t.left}${short ? '' : ' อย่าง'}${t.out ? ` · หมด ${t.out}` : ''}`;
}
function setMenusHitBy(name){
  return (db.menus || []).filter(m => isSetMenu(m) && setAddons(m).some(a => a.name === name));
}

function toggleSoldOut(id){
  const m = (db.menus || []).find(x => x.id === id); if(!m) return;
  const was = isSoldOut(m);
  m.soldDay = was ? '' : dayKey();
  save();
  /* **ต้องส่งขึ้นทันที ห้ามใช้ publishMenuSoon()** ซึ่งหน่วง 1.5 วิ
     ลูกค้าอาจกำลังนิ้วจ่ออยู่ที่ปุ่มสั่งเมนูนั้นพอดี */
  if(db.orderOn && cloudReady()) publishMenu().catch(() => {});
  toast(was ? `${m.name} — กลับมาขายแล้ว` : `${m.name} — ปิดไว้ว่าหมดแล้ว`);
  render();
  const box = document.getElementById('soldBox');     // กล่องเปิดค้างอยู่ก็สลับชิปให้ด้วย
  if(box) box.innerHTML = soldOutHTML();
}

/* ส่วนของไส้ในกล่อง "ของหมดวันนี้" — แยกหัวข้อตามชุดไส้ (คาว / หวาน / ซอส)
   ใช้ `fixGroups()` ตัวเดียวกับตอนตั้งเมนูจัดชุด ชื่อซ้ำข้ามชุดเอาอันเดียว */
function topOutHTML(){
  const gs = fixGroups();
  if(!gs.length) return '<p class="hint" style="margin:0">ยังไม่มีชุดไส้ในร้านนี้</p>';
  const outNames = topOutNames();
  const hitSets = [];
  outNames.forEach(nm => setMenusHitBy(nm).forEach(m => {
    if(!hitSets.includes(m.name)) hitSets.push(m.name);
  }));
  return gs.map(g => `
    <div class="sec">${esc(g.name)}</div>
    <div class="tops">${g.items.map(it => {
      const out = topOutByName(it.name);
      return `<button type="button" class="top${out ? ' on' : ''}" onclick="toggleTopOut('${jsq(it.name)}')">
        ${esc(it.name)}${out ? ' · หมด' : ''}</button>`;
    }).join('')}</div>`).join('')
  + `<p class="hint" style="margin:14px 0 0">${outNames.length
      ? `ปิดไว้ ${outNames.length} ไส้ — ลูกค้าเห็นว่าหมดและติ๊กไม่ได้`
      : 'ยังไม่ได้ปิดไส้อะไรเลย'} · <b>พรุ่งนี้กลับมาใส่ได้เอง</b></p>`
  + (hitSets.length
      ? `<div class="note warn" style="margin-top:10px">${icon('alert',17)}<span>
          <b>เมนูจัดชุดที่ใช้ไส้ที่หมด ถูกปิดให้ด้วย</b> — ${esc(hitSets.join(' · '))}<br>
          เพราะลูกค้าเลือกไส้เองไม่ได้ สั่งมาก็ทำให้ไม่ได้ตามที่บอกไว้
        </span></div>`
      : '');
}

function soldOutHTML(){
  /* ยังไม่มีเมนูก็ยังต้องปิดไส้ได้ (ร้านที่ตั้งชุดไส้ก่อนแล้วค่อยใส่เมนู)
     เดิม return ตั้งแต่ตรงนี้ ส่วนของไส้ข้างล่างเลยไม่เคยโผล่ */
  if(!(db.menus || []).length)
    return `<div class="sec" style="margin-top:0">เมนูที่หมด</div>
    <p class="hint" style="margin:0">ยังไม่มีเมนูสักอย่าง ไปเพิ่มที่หน้าเมนูก่อนนะครับ</p>
    <div class="sec" style="margin-top:18px">ไส้ที่หมด</div>
    ${topOutHTML()}`;
  const off = soldOutList().length;
  return `<div class="sec" style="margin-top:0">เมนูที่หมด</div>
  <div class="tops">${db.menus.map(m => {
    const out = isSoldOut(m);
    return `<button type="button" class="top${out ? ' on' : ''}" onclick="toggleSoldOut('${jsq(m.id)}')">
      ${esc(m.name)}${out ? ' · หมด' : ''}</button>`;
  }).join('')}</div>
  <p class="hint" style="margin:14px 0 0">${off
    ? `ตอนนี้ปิดไว้ ${off} อย่าง — ลูกค้าเห็นว่าหมดแล้วและกดสั่งไม่ได้`
    : 'ยังไม่ได้ปิดอะไรเลย ลูกค้าสั่งได้ทุกอย่าง'} ·
    <b>พรุ่งนี้กลับมาขายเองทุกอย่าง</b> ไม่ต้องมาเปิดเอง</p>
  <p class="hint" style="margin:8px 0 0">ที่ปิดไว้ยังขายหน้าร้านได้ตามปกติ
    อันนี้คุมแค่ฝั่งลูกค้าที่สั่งผ่าน QR</p>
  <div class="sec" style="margin-top:18px">ไส้ที่หมด</div>
  ${topOutHTML()}`;
}

function soldOutDialog(){
  openDialog({ icon:'ing',
    title:'ของหมดวันนี้',
    sub:'แตะเมนูหรือไส้ที่หมดแล้ว · อันที่เป็นสีแดงคือปิดอยู่',
    html:`<div id="soldBox">${soldOutHTML()}</div>`,
    foot:[{label:'เสร็จแล้ว', cls:'primary', fn:'dlg.close()'}]
  });
}

// แก้เมนู แก้ราคา เปิด-ปิดร้าน ต้องสะท้อนไปที่หน้าลูกค้าด้วย
// รวบหลาย ๆ การแก้ที่ติด ๆ กันให้ส่งทีเดียว จะได้ไม่ยิงรัว ๆ ตอนพิมพ์
let pubTimer = null;
function publishMenuSoon(){
  if(typeof db !== 'object' || !db || !db.orderOn || !cloudReady()) return;
  clearTimeout(pubTimer);
  pubTimer = setTimeout(() => { publishMenu().catch(() => {}); }, 1500);
}
async function publishMenu(){
  if(!db.orderKey) return;
  const m = menuForCustomers();
  // เครื่องที่เพิ่งรับลิงก์ร้านมายังไม่มีเมนูของตัวเอง (ข้อมูลอยู่แยกกันคนละเครื่อง)
  // ถ้าปล่อยให้เผยแพร่เมนูเปล่า มันจะไปทับเมนูจริงที่เครื่องหลักเผยแพร่ไว้
  // แล้วลูกค้าจะเห็นว่า "ยังไม่เปิดรับออเดอร์" ทั้งที่ร้านเปิดอยู่
  if(!m.menus.length) return;
  await cloudReq('PUT', `s/${db.orderKey}/menu`, m);
}

/* ---------- คอยดูว่ามีออเดอร์เข้ามาไหม ---------- */
let cloudOrders = [];       // ออเดอร์ที่ยังค้างอยู่ (ยังไม่รับ / กำลังทำ)
let orderTimer  = null;
let seenOrders  = null;     // รหัสออเดอร์ที่เคยเห็นแล้ว ใช้ดูว่ามีอันใหม่เข้ามาไหม

const POLL_ON  = 5000;    // กำลังดูจออยู่ ถามถี่หน่อย จะได้รู้ทันที
const POLL_OFF = 15000;   // สลับไปแอปอื่น ถามห่างลง ประหยัดโควตาฟรีกับแบต

function startOrderWatch(){
  clearInterval(orderTimer);
  if(!db.orderOn || !cloudReady() || !db.orderKey) return;
  pollOrders();
  orderTimer = setInterval(pollOrders, document.hidden ? POLL_OFF : POLL_ON);
  keepScreenOn();
}
function stopOrderWatch(){
  clearInterval(orderTimer); orderTimer = null; cloudOrders = [];
  letScreenSleep();
}

/* สลับไปแอปอื่นแล้วยัง**ถามต่อ** แค่ถามห่างลง
   เดิมหยุดถามเลยตอนจอดับ ซึ่งแปลว่าแม่ค้าเปิด LINE อยู่แล้วลูกค้าสั่งเข้ามา
   จะไม่มีอะไรเตือนเลยจนกว่าจะกลับมาเปิดแอป — เสียออเดอร์ไปดื้อ ๆ
   กลับมาดูจอเมื่อไหร่ ถามทันทีหนึ่งครั้ง แล้วปรับจังหวะกลับเป็นถี่ */
document.addEventListener('visibilitychange', () => { startOrderWatch(); });

/* ---------- กันจอดับระหว่างเปิดรับออเดอร์ ----------
   แม่ค้าวางมือถือไว้บนเคาน์เตอร์ พอจอดับเบราว์เซอร์จะหยุดทุกอย่าง
   เสียงเตือนก็ไม่ดัง เจ้าของยอมแลกกับแบตแล้ว (เสียบพาวเวอร์แบงก์เอา)

   กับดัก: ระบบ**ปล่อยล็อกเอง**ตอนสลับแอปหรือจอดับ ต้องขอใหม่ทุกครั้งที่กลับมา
   ไม่ใช่ขอครั้งเดียวตอนเปิดแอป · เครื่องเก่าที่ไม่รองรับก็ไม่พังอะไร แค่ไม่ได้ผล */
let wakeLock = null;

async function keepScreenOn(){
  if(!('wakeLock' in navigator)) return;
  if(!db.orderOn || document.hidden) return;
  if(wakeLock) return;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  }catch(e){ wakeLock = null; }    // แบตใกล้หมด หรือเครื่องไม่ให้ — ปล่อยไป
}

function letScreenSleep(){
  const w = wakeLock;
  wakeLock = null;
  if(!w) return;
  try{ w.release(); }catch(e){}
}

/* ---------- แถบแจ้งเตือนของเครื่อง ----------
   ของเดิมมีแค่เสียง + ข้อความในแอป ซึ่งเห็นเฉพาะตอนเปิดแอปนี้ค้างอยู่
   อันนี้เด้งทับหน้าจอได้แม้กำลังเล่นแอปอื่น

   ต้องขออนุญาต**ตอนแม่ค้ากดปุ่มเท่านั้น** เบราว์เซอร์ไม่ยอมให้ขอลอย ๆ
   จึงขอตอนกดเปิดรับออเดอร์ */
async function askNotifyOK(){
  if(!('Notification' in window)) return false;
  if(Notification.permission === 'granted') return true;
  if(Notification.permission === 'denied')  return false;
  try{ return (await Notification.requestPermission()) === 'granted'; }
  catch(e){ return false; }
}

/* ===================== แจ้งเตือนเข้า LINE =====================
   **แอปยิงไปหา LINE ตรง ๆ ไม่ได้** เบราว์เซอร์บล็อก (CORS) และถึงยิงได้ก็ไม่ควร
   เพราะต้องเอากุญแจของ OA มาฝังในหน้าเว็บ ใครเปิดดูโค้ดก็ส่งในนามร้านเราได้
   จึงมีตัวกลางเล็ก ๆ บน Google Apps Script ถือกุญแจไว้แทน (ดู line-relay.gs)

   **ลิงก์ตัวกลางเก็บในเครื่องอย่างเดียว ห้ามขึ้นคลาวด์เด็ดขาด**
   ใครได้ลิงก์ไปก็ส่งข้อความเข้าไลน์ร้านได้ · `menuForCustomers()` ต้องไม่มีคำนี้ (มีเทสต์คุม)

   **นี่เป็นของเสริม ไม่ได้มาแทนของเดิม** เสียง · แถบแดง · กันจอดับ · แถบแจ้งเตือนของเครื่อง
   ยังทำงานเหมือนเดิมทุกอย่าง LINE ส่งไม่ได้ก็ไม่พลาดออเดอร์

   **โควตาแพ็กฟรีของ LINE หมดได้** แล้วมันหยุดส่งเงียบ ๆ ไม่ได้คิดเงินเพิ่ม
   จึงต้องนับให้ดูและเตือนล่วงหน้า ไม่งั้นแม่ค้าจะนึกว่าวันนี้ไม่มีลูกค้าสั่ง */
const LINE_MAX  = 300;      // โควตาแพ็กฟรีโดยประมาณ ใช้เตือนล่วงหน้าเท่านั้น
const LINE_NEAR = 50;       // เหลือเท่านี้เริ่มเตือน
let lineErr = '';           // เหตุผลที่ส่งไม่สำเร็จครั้งล่าสุด

const lineMonthKey = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; };

// ขึ้นเดือนใหม่ให้เริ่มนับ 0 ใหม่ เหมือนที่ LINE คืนโควตาให้ทุกเดือน
function lineUsed(){
  if(db.lineMonth !== lineMonthKey()){ db.lineMonth = lineMonthKey(); db.lineNo = 0; save(); }
  return n(db.lineNo);
}

async function sendLine(text){
  const url = String(db.lineUrl || '').trim();
  if(!url) return false;
  lineUsed();                       // ให้รีเซ็ตตัวนับก่อนถ้าขึ้นเดือนใหม่
  let res;
  try{
    res = await fetch(url, {
      method: 'POST',
      /* ต้องเป็น text/plain เท่านั้น ไม่งั้นเบราว์เซอร์ยิง preflight (OPTIONS)
         ซึ่ง Google Apps Script ตอบไม่ได้ แล้วจะส่งไม่ออกทั้งที่ลิงก์ถูก */
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ text: String(text || '').slice(0, 400) })
    });
  }catch(e){
    lineErr = 'ส่งไม่ถึงตัวกลาง — เน็ตหลุด หรือลิงก์ผิด';
    return false;
  }
  let out = null;
  try{ out = await res.json(); }catch(e){}
  if(!out || !out.ok){
    lineErr = (out && out.why) ? String(out.why) : 'ตัวกลางตอบว่าส่งไม่สำเร็จ';
    return false;
  }
  lineErr = '';
  db.lineNo = n(db.lineNo) + 1; save();
  return true;
}

/* ข้อความที่ส่งเข้า LINE — **มีแต่เรื่องออเดอร์**
   ห้ามใส่ต้นทุน กำไร หรือยอดขายรวมของวัน เด็ดขาด */
function lineText(fresh){
  const o = fresh[0] || {};
  const what = (o.items || []).map(it => `${it.name} ×${n(it.qty)}`).join(' · ');
  const head = fresh.length === 1 ? 'มีออเดอร์ใหม่' : `มีออเดอร์ใหม่ ${fresh.length} รายการ`;
  return [
    head,
    o.no ? `คิวที่ ${o.no}` : '',
    what,
    `รวม ${baht(n(o.total))} บาท`,
    o.who ? `ชื่อ ${o.who}` : '',
    o.note ? `หมายเหตุ ${o.note}` : '',
    o.paid ? 'ลูกค้าแจ้งว่าโอนแล้ว — ยังต้องเช็กแอปธนาคารก่อนนะ' : ''
  ].filter(Boolean).join('\n');
}

async function notifyOrder(count, what){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const title = count === 1 ? 'มีออเดอร์ใหม่จากลูกค้า' : `มีออเดอร์ใหม่ ${count} รายการ`;
  const opt = {
    body: what || 'แตะเพื่อเปิดแอปแล้วกดรับ',
    tag: 'crepe-order', renotify: true,
    icon: 'icons/icon-192.png', badge: 'icons/icon-192.png'
  };
  try{
    // ไอโฟนสั่งผ่าน service worker เท่านั้น new Notification() ใช้ไม่ได้
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if(reg && reg.showNotification){ await reg.showNotification(title, opt); return; }
    new Notification(title, opt);
  }catch(e){}
}

/* ย้ำเตือนซ้ำถ้ายังมีออเดอร์ที่ยังไม่ได้กดรับ
   แม่ค้ายืนทอดอยู่ มือเปื้อนแป้ง เสียงครั้งเดียวพลาดได้ง่ายมาก
   หยุดเองทันทีที่กดรับหรือกดไม่รับ ไม่ต้องไปปิดที่ไหน */
const NAG_EVERY = 30000;
let nagAt = 0;

function nagNewOrders(){
  if(!cloudOrders.some(o => o.status === 'new')){ nagAt = 0; return; }
  if(Date.now() - nagAt < NAG_EVERY) return;
  nagAt = Date.now();
  beep(); ringBell();
}

/* กันไม่ให้ถามซ้อนกัน — **เคยทำเลขคิวหายมาแล้ว**
   แอปถามทุก 5 วิ และยังถามเพิ่มตอนกลับมาดูจอ กับตอนล้างออเดอร์
   ถ้าเน็ตช้าจนรอบก่อนยังไม่จบ สองรอบจะเห็นออเดอร์ใบเดียวกันที่ยังไม่มีเลข
   แล้วต่างคนต่างแจกเลขให้ รอบแรกแจก 1 รอบสองแจก 2 ตัวหลังเขียนทับ
   ผลคือลูกค้าคนแรกของวันได้ "คิวที่ 2" แล้วคิวที่ 1 หายไปเฉย ๆ
   (เจ้าของเจอเองหลังกดล้างออเดอร์วันนี้) */
let polling = false;

async function pollOrders(){
  if(!db.orderOn || !cloudReady() || !db.orderKey) return;
  if(polling) return;                 // รอบก่อนยังไม่จบ ข้ามไปก่อน เดี๋ยวรอบหน้าค่อยถาม
  polling = true;
  try{ await pollOnce(); }
  finally{ polling = false; }         // ต้องปลดทุกกรณี ไม่งั้นค้างแล้วเลิกถามถาวร
}

async function pollOnce(){
  let data;
  try{ data = await cloudReq('GET', `s/${db.orderKey}/orders`); }
  catch(e){
    // เน็ตหลุดชั่วคราวก็เงียบไว้ รอบหน้าค่อยลองใหม่
    // แต่ถ้าที่เก็บ "ปฏิเสธ" ต้องบอกแม่ค้า ไม่งั้นนึกว่าวันนี้ไม่มีลูกค้าสั่ง
    if(markCloud(e)) render();
    return;
  }
  if(markCloud(null)) render();            // กลับมาเข้าได้แล้ว เอาแถบเตือนออก

  const list = Object.entries(data || {})
    .map(([id, o]) => Object.assign({ id }, o))
    .filter(o => o && (o.status === 'new' || o.status === 'cook'))
    .sort((a, b) => n(a.at) - n(b.at));

  const ids = new Set(list.map(o => o.id));
  let fresh = [];
  // รอบแรกหลังเปิดแอป ถือว่าทุกอันคือของเก่า ไม่ต้องตีระฆังรัว
  if(seenOrders){
    fresh = list.filter(o => o.status === 'new' && !seenOrders.has(o.id));
    if(fresh.length){
      beep();
      ringBell();
      toast(fresh.length === 1 ? 'มีออเดอร์ใหม่จากลูกค้า' : `มีออเดอร์ใหม่ ${fresh.length} รายการ`);
      // เด้งแถบแจ้งเตือนของเครื่องด้วย จะได้เห็นแม้กำลังเล่นแอปอื่นอยู่
      notifyOrder(fresh.length,
        (fresh[0].items || []).map(it => `${it.name} ×${it.qty}`).join(' · '));
      nagAt = Date.now();        // เพิ่งเตือนไป ยังไม่ต้องย้ำซ้ำทันที
    }
  }
  seenOrders = ids;

  // ให้เลขตั้งแต่ออเดอร์เข้ามา ไม่ต้องรอแม่ค้ากดรับ
  // แม่ค้าจะได้เรียก "คิวที่ 5" ได้ทันที และลูกค้าเห็นเลขของตัวเองเลยไม่ต้องรอลุ้น
  await numberNewOrders(list);

  /* เด้งเข้า LINE ด้วยถ้าแม่ค้าตั้งไว้
     **ต้องอยู่หลัง numberNewOrders()** ไม่งั้นข้อความไม่มีเลขคิว เพราะยังไม่ได้แจก
     (เคยวางไว้ข้างบนคู่กับเสียงเตือน แล้วในไลน์ขึ้นแต่รายการ ไม่บอกว่าคิวที่เท่าไหร่)

     **ส่งเฉพาะตอนไม่ได้มองแอปอยู่** (`document.hidden`) — เจ้าของเลือกเอง
     กำลังเปิดแอปค้างอยู่ก็มีเสียง แถบแดง กระดิ่ง และแถบแจ้งเตือนของเครื่องเตือนให้แล้ว
     ส่ง LINE ซ้ำคือเปลืองโควตาเปล่า ๆ ซึ่งแพ็กฟรีมีแค่ ~300 ข้อความต่อเดือน
     (ปุ่ม "ส่งข้อความทดสอบ" ไม่ติดเงื่อนไขนี้ เพราะเช็กที่จุดเรียก ไม่ได้เช็กใน sendLine())
     ไม่ await เพราะห้ามให้รอบถามออเดอร์ช้าลงเพราะรอ LINE */
  if(fresh.length && document.hidden) sendLine(lineText(fresh));

  const changed = JSON.stringify(list) !== JSON.stringify(cloudOrders);
  cloudOrders = list;
  if(changed) render();

  // จำลายนิ้วมือสลิปของทุกใบที่เห็น เพื่อจับสลิปที่เอากลับมาใช้ซ้ำข้ามวัน
  list.forEach(rememberSlip);

  nagNewOrders();
  keepScreenOn();          // ระบบปล่อยล็อกเองบ่อย ขอคืนทุกรอบที่ถาม
  sweepOldOrders(data);
}

/* ---------- เก็บกวาดออเดอร์เก่าทิ้งเอง ----------
   ถ้าไม่ลบ ออเดอร์จะกองสะสมในที่เก็บไปเรื่อย ๆ ไม่มีวันหมด
   ลบให้เองจะได้ไม่ต้องมานั่งลบมือ และไม่มีวันเต็มโควตาฟรี

   ทิ้งช่วงไว้ก่อนลบ เพราะหน้าลูกค้ายังเปิดค้างดูสถานะของตัวเองอยู่
   (หน้าลูกค้าจำออเดอร์ไว้ 6 ชม. จึงรอให้พ้นช่วงนั้นก่อน) */
const DONE_KEEP = 12 * 3600 * 1000;   // จบแล้ว เก็บไว้ 12 ชม.
const ANY_KEEP  = 24 * 3600 * 1000;   // ค้างไม่จบสักที เกิน 1 วันก็ทิ้ง
let lastSweep = 0;

async function sweepOldOrders(data, force){
  const now = Date.now();
  if(!force && now - lastSweep < 30 * 60 * 1000) return 0;   // กวาดทุกครึ่งชั่วโมงพอ
  lastSweep = now;

  const dead = Object.entries(data || {}).filter(([, o]) => {
    if(!o) return true;
    const age  = now - n(o.at);
    const over = o.status === 'done' || o.status === 'rej';
    return over ? age > DONE_KEEP : age > ANY_KEEP;
  }).map(([id]) => id);

  if(!dead.length) return 0;
  // ส่ง null = สั่งลบ ยิงทีเดียวหมดทุกอันแทนที่จะยิงทีละอัน
  const patch = {};
  dead.forEach(id => { patch[id] = null; });
  try{ await cloudReq('PATCH', `s/${db.orderKey}/orders`, patch); }
  catch(e){ return 0; }
  await dropSlips(dead);
  return dead.length;
}

/* ลบรูปสลิปทิ้งคู่กับออเดอร์เสมอ
   รูปใหญ่กว่าออเดอร์เป็นร้อยเท่า ถ้าลืมลบ ที่เก็บจะเต็มเร็วมาก
   เรียกทุกจุดที่ลบออเดอร์: กวาดอัตโนมัติ · ลบทีละใบ · ล้างทั้งวัน */
async function dropSlips(ids){
  if(!ids || !ids.length || !db.orderKey) return;
  const patch = {};
  ids.forEach(id => { patch[id] = null; });
  try{ await cloudReq('PATCH', `s/${db.orderKey}/slips`, patch); }catch(e){}
}

// ปุ่มล้างเองจากหน้าตั้งค่า เผื่ออยากเคลียร์เดี๋ยวนั้น
async function clearOldOrders(){
  if(!cloudReady() || !db.orderKey) return;
  let data;
  try{ data = await cloudReq('GET', `s/${db.orderKey}/orders`); }
  catch(e){ toast('ต่อที่เก็บออเดอร์ไม่ติด'); return; }
  const gone = await sweepOldOrders(data, true);
  await pollOrders();
  toast(gone ? `ล้างออเดอร์เก่าไป ${gone} รายการ` : 'ไม่มีออเดอร์เก่าให้ล้าง');
}

/* แจกเลขให้ออเดอร์ที่ยังไม่มี เรียงตามเวลาที่เข้ามา
   ถ้าส่งไม่ถึงก็คืนเลขกลับ จะได้ไม่มีเลขหายเป็นช่วง ๆ */
async function numberNewOrders(list){
  /* เครื่องถูกล้างข้อมูล สลับเครื่อง หรือเปิดจากลิงก์ร้านกลางวัน ตัวนับในเครื่องจะ
     ย้อนกลับไปเริ่มที่ 0 แล้วแจกเลขซ้ำกับคิวที่ยังค้างอยู่ ลูกค้าสองคนได้เลขเดียวกัน
     ยึดเลขสูงสุดที่เห็นในที่เก็บเป็นหลักก่อนเสมอ */
  syncQueueDay();
  const high = list.reduce((m, o) => Math.max(m, n(o.no)), 0);
  if(high > n(db.queueNo)){ db.queueNo = high; save(); }

  for(const o of list){
    if(n(o.no)) continue;
    const no = nextQueueNo();
    save();
    try{
      await cloudReq('PATCH', `s/${db.orderKey}/orders/${o.id}`, { no });
      o.no = no;
    }catch(e){
      db.queueNo = n(db.queueNo) - 1; save();
      break;                     // เน็ตมีปัญหา รอบหน้าค่อยลองใหม่
    }
  }
}

// เสียงเตือนสั้น ๆ ไม่ต้องมีไฟล์เสียงให้แอปอ้วนขึ้น
/* เสียงเตือนสองโน้ตไล่ขึ้น ตัดเสียงรถเสียงคนหน้าร้านได้ดีกว่าปี๊บเดียว */
function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ac = new Ctx();
    [[880, 0], [1245, .17]].forEach(([hz, at]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      const t = ac.currentTime + at;
      o.type = 'sine'; o.frequency.value = hz;
      g.gain.setValueAtTime(.001, t);
      g.gain.exponentialRampToValueAtTime(.3, t + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + .35);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + .42);
    });
  }catch(e){}
}

/* ---------- เลขคิว เริ่มนับ 1 ใหม่ทุกวัน ---------- */
// ขึ้นวันใหม่แล้วเริ่มนับ 1 ใหม่
function syncQueueDay(){
  const today = dayKey();
  if(db.queueDay !== today){ db.queueDay = today; db.queueNo = 0; }
}
function nextQueueNo(){
  syncQueueDay();
  db.queueNo = n(db.queueNo) + 1;
  return db.queueNo;
}

/* ---------- ปุ่มที่แม่ค้ากด ---------- */
async function takeOrder(id){
  const o = cloudOrders.find(x => x.id === id); if(!o) return;
  /* ลูกค้าแจ้งว่าโอนมาแล้วและแนบสลิปไว้ **ต้องกดเช็กยอดก่อนถึงจะรับได้** (เจ้าของสั่งเอง)
     แค่เปิดดูรูปไม่พอ — ต้องไปเปิดแอปธนาคารแล้วกดบอกว่ายอดตรงหรือไม่ตรง
     กันเผลอกดรับรวดเดียวแล้วทอดไปโดยที่เงินยังไม่เข้า
     เงินสด / จ่ายตอนมารับของ ไม่เกี่ยว กดรับได้ตามปกติ
     กันไว้ตรงนี้อีกชั้นเผื่อถูกเรียกตรง ๆ เหมือนที่หน้าลูกค้าทำกับปุ่มส่ง */
  if(o.paid && o.slip && !slipChecked(o)){
    toast('เช็กยอดในแอปธนาคารก่อนนะ แล้วกดบอกผลในกล่องสลิป');
    viewSlip(id);
    return;
  }
  const no = n(o.no) || nextQueueNo();   // ปกติมีเลขตั้งแต่ตอนเข้ามาแล้ว
  save();
  try{ await cloudReq('PATCH', `s/${db.orderKey}/orders/${id}`, { status:'cook', no }); }
  catch(e){ toast('ส่งไม่ถึงลูกค้า เน็ตอาจหลุด'); return; }
  o.status = 'cook'; o.no = no;
  render();
  toast(`รับออเดอร์แล้ว คิวที่ ${no}`);
}

function rejectOrder(id){
  const o = cloudOrders.find(x => x.id === id); if(!o) return;
  askConfirm('ปฏิเสธออเดอร์นี้',
    'ลูกค้าจะเห็นว่าร้านรับไม่ไหว ออเดอร์นี้จะไม่ถูกบันทึกเป็นยอดขาย',
    'ปฏิเสธ', async () => {
      try{ await cloudReq('PATCH', `s/${db.orderKey}/orders/${id}`, { status:'rej' }); }
      catch(e){ toast('ส่งไม่ถึงลูกค้า เน็ตอาจหลุด'); return; }
      // จดก่อนเอาออกจากรายการ ไม่งั้นหาของมาจดไม่ได้แล้ว
      addTrouble('rej', o);
      cloudOrders = cloudOrders.filter(x => x.id !== id);
      render();
      toast('ปฏิเสธออเดอร์แล้ว');
    }, true);
}

// ลูกค้ามารับของแล้วจ่ายเงิน — ตรงนี้คือจุดที่ออเดอร์กลายเป็นยอดขายจริง
async function finishOrder(id){
  const o = cloudOrders.find(x => x.id === id); if(!o) return;
  const d = dayKey(), t = nowTime(), bill = uid();
  (Array.isArray(o.items) ? o.items : []).forEach(it => {
    const m = findMenu(it.id);
    (db.sales = db.sales || []).push({
      id: uid(), bill, d, t,
      menuId: m ? m.id : '', name: String(it.name || ''), qty: n(it.qty),
      addons: (it.addons || []).map(a => ({ name:String(a.name||''), price:n(a.price) })),
      total: n(it.total)
    });
  });
  save();
  try{ await cloudReq('PATCH', `s/${db.orderKey}/orders/${id}`, { status:'done' }); }catch(e){}
  cloudOrders = cloudOrders.filter(x => x.id !== id);
  render();
  toast(`รับเงินแล้ว ${baht(n(o.total))} บาท`);
}

/* ลบออเดอร์ทิ้งทั้งใบ — ต่างจาก "ไม่รับ" ตรงที่หายไปเลย ไม่เหลือค้างในที่เก็บ
   ใช้ตอนลูกค้าสั่งแล้วไม่มารับ หรือเป็นออเดอร์ที่ลองกดเล่น
   ถ้าไม่มีปุ่มนี้ ออเดอร์ที่กดรับไปแล้วจะค้างอยู่จนกว่าจะกด "เสร็จแล้ว · รับเงิน"
   ซึ่งจะกลายเป็นยอดขายปลอม เงินในสรุปวันนี้เพี้ยนทันที */
function deleteOrder(id){
  const o = cloudOrders.find(x => x.id === id); if(!o) return;
  askConfirm(o.no ? `ลบออเดอร์ คิวที่ ${esc(String(o.no))} ทิ้ง?` : 'ลบออเดอร์นี้ทิ้ง?',
    'ออเดอร์นี้จะหายไปเลย และไม่ถูกบันทึกเป็นยอดขาย · ลูกค้าจะเห็นว่าออเดอร์ถูกยกเลิก',
    'ลบทิ้ง', async () => {
      // ส่ง null = สั่งลบ (ที่เก็บออเดอร์รับคำสั่งลบแบบนี้)
      try{ await cloudReq('PATCH', `s/${db.orderKey}/orders`, { [id]: null }); }
      catch(e){ toast('ลบไม่สำเร็จ เน็ตอาจหลุด'); return; }
      await dropSlips([id]);
      cloudOrders = cloudOrders.filter(x => x.id !== id);
      render();
      toast('ลบออเดอร์แล้ว');
    });
}

/* ล้างออเดอร์ของวันนี้ทีเดียวทั้งหมด
   ใช้ตอนลองเล่นจนมีออเดอร์ปลอมกองอยู่ แล้วอยากเริ่มวันใหม่ให้สะอาด

   สำคัญ: **ไม่แตะยอดขาย** ที่รับเงินไปแล้ววันนี้ยังอยู่ครบ
   ลบแค่ใบออเดอร์ในที่เก็บ ไม่ใช่เงินที่บันทึกไว้ในเครื่อง
   และคืนเลขคิวให้เริ่มนับ 1 ใหม่ ไม่งั้นลูกค้าคนแรกของวันจะได้คิวที่ 8 */
async function clearTodayOrders(){
  if(!cloudReady() || !db.orderKey){ toast('ยังไม่ได้เปิดรับออเดอร์'); return; }
  let data;
  try{ data = await cloudReq('GET', `s/${db.orderKey}/orders`); }
  catch(e){ toast('ต่อที่เก็บออเดอร์ไม่ติด'); return; }

  const today = dayKey();
  const ids = Object.entries(data || {})
    .filter(([, o]) => o && dayKey(new Date(n(o.at))) === today)
    .map(([id]) => id);

  if(!ids.length){ toast('วันนี้ยังไม่มีออเดอร์ให้ล้าง'); return; }

  askConfirm(`ล้างออเดอร์วันนี้ ${ids.length} ใบ?`,
    'ออเดอร์ของวันนี้จะหายหมด และเลขคิวจะเริ่มนับ 1 ใหม่ · ' +
    'ยอดขายที่รับเงินไปแล้ววันนี้ยังอยู่ครบ ไม่ถูกลบไปด้วย',
    'ล้างเลย', async () => {
      const patch = {};
      ids.forEach(id => { patch[id] = null; });
      try{ await cloudReq('PATCH', `s/${db.orderKey}/orders`, patch); }
      catch(e){ toast('ล้างไม่สำเร็จ เน็ตอาจหลุด'); return; }
      await dropSlips(ids);
      db.queueDay = today; db.queueNo = 0; save();
      cloudOrders = [];
      await pollOrders();
      render();
      toast(`ล้างออเดอร์วันนี้แล้ว ${ids.length} ใบ · เลขคิวเริ่มที่ 1 ใหม่`);
    });
}

/* ===================== สลิปโอนเงิน =====================
   **สลิปไม่ใช่หลักฐานว่าเงินเข้า** แอปทำสลิปปลอมมีเยอะและทำได้เหมือนจริงทุกจุด
   มีไว้ให้แม่ค้าหาเจอง่ายตอนไล่ดูในแอปธนาคาร ไม่ใช่ให้เชื่อแทนแอปธนาคาร

   สิ่งที่กันได้จริงคือ **สลิปซ้ำ** — เอาสลิปใบเดิมมาใช้หลายออเดอร์
   ลูกค้าส่งลายนิ้วมือของรูป (64 บิต) มากับออเดอร์ เราเก็บที่เคยเห็นไว้ในเครื่อง
   แล้วเทียบ ต่างกันไม่เกิน 5 บิต = รูปเดียวกัน (เผื่อโดนบีบอัดซ้ำ)

   ต้องเก็บในเครื่องเอง เพราะออเดอร์เก่าถูกลบจากที่เก็บทุก 12-24 ชม.
   ถ้าดูแค่ออเดอร์ที่ยังค้าง จะจับสลิปที่เอากลับมาใช้ข้ามวันไม่ได้ */
const SLIP_KEEP = 400;      // จำลายนิ้วมือย้อนหลังไว้เท่านี้ใบ
const SLIP_NEAR = 5;        // ต่างกันไม่เกินกี่บิตถึงถือว่ารูปเดียวกัน

function slipBits(h){
  let b = '';
  for(const c of String(h || '')) b += parseInt(c, 16).toString(2).padStart(4, '0');
  return b;
}
function slipSame(a, b){
  if(!a || !b || a.length !== b.length) return false;
  const x = slipBits(a), y = slipBits(b);
  let d = 0;
  for(let i = 0; i < x.length; i++) if(x[i] !== y[i] && ++d > SLIP_NEAR) return false;
  return true;
}

/* QR บนสลิป — หน้าลูกค้าอ่านให้แล้วส่งมากับออเดอร์ (ดู readSlipQR() ใน order.html)
   o.slipRef = "รหัสธนาคาร:เลขอ้างอิง" · o.slipQr = ok / none (ไม่เจอ QR) / bad (QR ผิดแบบ) / '' ไม่ได้อ่าน
   **QR บอกแค่ธนาคารที่โอนกับเลขอ้างอิง ไม่ได้บอกยอด และไม่ได้พิสูจน์ว่าเงินเข้า**
   สลิปปลอมก็ใส่ QR ได้ — ห้ามเขียนให้ดูเหมือนแอปตรวจสลิปให้แล้ว
   ที่ได้จริงคือ **จับสลิปซ้ำแม่นขึ้น**: เลขอ้างอิงไม่ซ้ำกันทั้งประเทศ
   ส่วนการเทียบรูป สลิปธนาคารเดียวกันหน้าตาคล้ายกันมาก อาจเตือนผิดได้ */
const BANKS = {
  '002':'กรุงเทพ', '004':'กสิกรไทย', '006':'กรุงไทย', '011':'ทหารไทยธนชาต (ttb)',
  '014':'ไทยพาณิชย์', '022':'ซีไอเอ็มบี', '024':'ยูโอบี', '025':'กรุงศรี', '030':'ออมสิน',
  '033':'ธอส.', '034':'ธ.ก.ส.', '066':'อิสลาม', '067':'ทิสโก้', '069':'เกียรตินาคินภัทร',
  '071':'ไทยเครดิต', '073':'แลนด์ แอนด์ เฮ้าส์'
};
function slipRefInfo(ref){
  const m = /^(\d{3}):(.+)$/.exec(String(ref || ''));
  if(!m) return null;
  return { bank: BANKS[m[1]] ? 'ธนาคาร' + BANKS[m[1]] : 'รหัสธนาคาร ' + m[1], ref: m[2] };
}

/* เคยเห็นสลิปใบนี้มาก่อนไหม — คืนรายการเดิมถ้าเคย
   1) เลขอ้างอิงตรงกัน = ใบเดิมแน่นอน (ไม่สนว่ารูปถูกตัด/ถ่ายจอมาจนหน้าตาเปลี่ยน)
   2) **มีเลขอ้างอิงทั้งคู่แต่คนละเลข = คนละใบ** ถึงรูปจะคล้ายกันก็ไม่เตือน
      (กันเตือนผิดกับสลิปธนาคารเดียวกันที่หน้าตาแทบเหมือนกัน)
   3) ไม่มีเลขให้เทียบ (ไม่เจอ QR / ออเดอร์รุ่นเก่า) → เทียบรูปเหมือนเดิม */
function slipSeenBefore(o){
  if(!o || (!o.slip && !o.slipRef)) return null;
  const seen = (db.slipSeen || []).filter(x => x.id !== o.id);
  if(o.slipRef){
    const hit = seen.find(x => x.ref === o.slipRef);
    if(hit) return hit;
  }
  return seen.find(x => o.slip && slipSame(x.h, o.slip) && !(o.slipRef && x.ref && x.ref !== o.slipRef)) || null;
}

// จำไว้ว่าเห็นสลิปใบนี้กับออเดอร์ไหนเมื่อไหร่
function rememberSlip(o){
  if(!o.slip && !o.slipRef) return;
  db.slipSeen = db.slipSeen || [];
  if(db.slipSeen.some(x => x.id === o.id)) return;
  /* เจอสลิปที่เคยใช้มาแล้ว → จดลงสมุดปัญหาเดี๋ยวนั้น พร้อมบอกว่าซ้ำกับใบไหน
     **ต้องถามก่อน push** ไม่งั้นมันไปเจอตัวเองที่เพิ่งใส่เข้าไป แล้วทุกใบจะกลายเป็นซ้ำ
     จดเลยไม่ต้องรอแม่ค้ากดดูสลิป เพราะอีก 12-24 ชม. ออเดอร์ถูกลบจากที่เก็บ
     แล้วจะย้อนดูไม่ได้ว่าใบที่ซ้ำเมื่อวานคือใบไหน */
  const was = slipSeenBefore(o);
  if(was) addTrouble('dup', o, {
    ofId: was.id, ofNo: n(was.no), ofWho: String(was.who || ''),
    ofAt: n(was.at), ofTotal: n(was.total)
  });
  /* เก็บเลขคิวกับชื่อไปด้วย ไม่งั้นพอเจอสลิปซ้ำจะบอกได้แค่ "เคยใช้แล้ว"
     แต่บอกไม่ได้ว่าซ้ำกับใบไหน ซึ่งเป็นสิ่งที่แม่ค้าอยากรู้ที่สุด */
  db.slipSeen.push({ id:o.id, h:String(o.slip || ''), ref:String(o.slipRef || '').slice(0, 48),
                     at:n(o.at) || Date.now(), total:n(o.total), no:n(o.no), who:String(o.who || '') });
  if(db.slipSeen.length > SLIP_KEEP) db.slipSeen = db.slipSeen.slice(-SLIP_KEEP);
  save();
}

/* ===================== สมุดบันทึกออเดอร์มีปัญหา =====================
   **ต้องเก็บในเครื่อง ไม่ใช่ดูจากออเดอร์ที่ค้างอยู่**
   เพราะออเดอร์ถูกลบจากที่เก็บทุก 12-24 ชม. พอข้ามวันแล้วจะย้อนดูไม่ได้เลย
   ว่าใบที่โดนปฏิเสธหรือยอดไม่ตรงเมื่อวานคือใบไหน

   เจ้าของขอมาเอง: "บางทีจะได้รู้ว่าซ้ำจากออเดอร์ไหน แล้วถ้าวันถัดไปใช้อันเดิมอีกก็ต้องแจ้ง"
   ของที่จดมี 3 อย่าง: ไม่รับ (`rej`) · ยอดไม่ตรง (`bad`) · สลิปซ้ำ (`dup`)
   **ห้ามขึ้นคลาวด์** เป็นเรื่องภายในร้าน ลูกค้าไม่ต้องเห็น (`menuForCustomers()` ไม่มีช่องนี้) */
const TROUBLE_KEEP = 300;
const TROUBLE_NAME = { rej:'ไม่รับออเดอร์', bad:'ยอดไม่ตรง', dup:'สลิปซ้ำ' };

function addTrouble(kind, o, extra){
  db.troubles = db.troubles || [];
  // กันจดซ้ำใบเดิมเรื่องเดิม (รอบถามออเดอร์วิ่งทุก 5 วินาที)
  if(db.troubles.some(t => t.id === o.id && t.kind === kind)) return;
  db.troubles.push(Object.assign({
    kind, id:o.id, at:Date.now(), orderAt:n(o.at),
    no:n(o.no), who:String(o.who || ''), total:n(o.total),
    what:(o.items || []).map(it => `${it.name} ×${n(it.qty)}`).join(' · ')
  }, extra || {}));
  if(db.troubles.length > TROUBLE_KEEP) db.troubles = db.troubles.slice(-TROUBLE_KEEP);
  save();
}

const troubleList = () => (db.troubles || []).slice().sort((a,b) => n(b.at) - n(a.at));

/* การ์ดท้ายหน้าออเดอร์ โผล่เฉพาะตอนมีของให้ดู ไม่งั้นรกเปล่า ๆ */
function troubleCard(){
  const all = troubleList();
  if(!all.length) return '';
  const today = all.filter(t => dayKey(new Date(n(t.at))) === dayKey()).length;
  return `<div class="card">
    ${cardHead('alert', 'ออเดอร์ที่มีปัญหา',
      today ? `วันนี้ ${today} ราย · ย้อนหลังทั้งหมด ${all.length} ราย`
            : `ย้อนหลังทั้งหมด ${all.length} ราย`,
      `<button type="button" class="btn sm" onclick="troubleDialog()">ดูประวัติ</button>`)}
    <p class="hint" style="margin:0">เก็บไว้ในเครื่องนี้ ไม่หายไปพร้อมออเดอร์ ·
      ใช้ดูว่าสลิปที่ซ้ำนั้นซ้ำกับใบไหน และใครเคยมีปัญหามาก่อน</p>
  </div>`;
}

function troubleDialog(){
  const all = troubleList();
  const row = t => {
    const cls = t.kind === 'dup' ? 'bad' : t.kind === 'bad' ? 'bad' : 'warn';
    const ของ = t.what ? esc(t.what) : '(ไม่มีรายการ)';
    const ซ้ำกับ = t.kind === 'dup' && t.ofAt
      ? `<i class="of">ใช้ซ้ำกับ ${t.ofNo ? 'คิวที่ ' + esc(String(t.ofNo)) : 'ออเดอร์'}${
          t.ofWho ? ' ของ' + esc(t.ofWho) : ''} ${esc(whenText(t.ofAt))} ยอด ${money(n(t.ofTotal))}</i>`
      : '';
    return `<div class="tr-row">
      <span class="tr-tag ${cls}">${esc(TROUBLE_NAME[t.kind] || t.kind)}</span>
      <span class="tr-m">
        <b>${t.no ? 'คิวที่ ' + esc(String(t.no)) + ' · ' : ''}${ของ}</b>
        <i>${esc(whenText(t.at))}${t.who ? ' · ' + esc(t.who) : ''} · ${money(n(t.total))}</i>
        ${ซ้ำกับ}
      </span>
    </div>`;
  };
  openDialog({ icon:'alert', title:'ออเดอร์ที่มีปัญหา',
    sub: `ย้อนหลัง ${all.length} ราย · เก็บในเครื่องนี้เท่านั้น`,
    html: all.length
      ? `<div class="trlist">${all.map(row).join('')}</div>
         <p class="hint" style="margin:12px 0 0">เก็บล่าสุด ${TROUBLE_KEEP} รายการ
           ของเก่ากว่านั้นถูกลบให้เอง · <b>ไม่เกี่ยวกับยอดขาย</b> ลบทิ้งแล้วเงินไม่หาย</p>`
      : `<div class="empty"><p>ยังไม่มีออเดอร์ที่มีปัญหา</p></div>`,
    foot: all.length
      ? [{label:'ล้างประวัติ', cls:'ghost danger', fn:'clearTroubles()'},
         {label:'ปิด', cls:'primary', fn:'dlg.close()'}]
      : [{label:'ปิด', cls:'primary wide', fn:'dlg.close()'}]
  });
}

function clearTroubles(){
  askConfirm('ล้างประวัติออเดอร์มีปัญหา?',
    'ประวัติจะหายหมด · ยอดขายไม่เกี่ยวและไม่หายไปด้วย · การกันสลิปซ้ำยังทำงานเหมือนเดิม',
    'ล้างเลย', () => {
      db.troubles = []; save(); render();
      toast('ล้างประวัติแล้ว');
    });
}

// รูปโหลดเฉพาะตอนกดดู ไม่เอามาปนกับรอบถามออเดอร์ทุก 5 วินาที ไม่งั้นโควตาฟรีหมดเร็ว
/* ---------- เช็กยอดแล้วหรือยัง ----------
   เจ้าของสั่งเอง: **"มันต้องให้แม่ค้ากดตรวจสอบก่อนแล้วถึงจะกดรับได้"**
   ของเดิมแค่ "เปิดดูสลิป" ก็ปลดล็อกแล้ว ซึ่งยังไม่ได้แปลว่าเช็กอะไรเลย
   เปิดดูรูปสลิปไม่ได้บอกว่าเงินเข้าจริงไหม — ต้องไปเปิดแอปธนาคารดู

   ตอนนี้ใช้ `o.chk` ซึ่งคือผลที่แม่ค้ากดเองในกล่องดูสลิป
   (1 = ยอดตรง · -1 = ยอดไม่ตรง · 0 = ยังไม่ได้เช็ก) **กดทางไหนก็ปลดล็อก**
   เพราะกด "ยอดไม่ตรง" ก็คือตรวจแล้วเหมือนกัน แค่ผลออกมาไม่ดี
   แล้วค่อยเลือกเองว่าจะไม่รับ หรือรับทั้งที่รู้ว่าเงินยังไม่เข้า (ป้ายแดงเตือนอยู่แล้ว)

   **`chk` อยู่บนก้อนออเดอร์และถูก PATCH ขึ้นที่เก็บ** จึงรอดจากรอบถามทุก 5 วินาที
   ไม่ต้องมีธงแยกเก็บในเครื่องเหมือนเวอร์ชันก่อน */
const slipChecked = o => !!o && n(o.chk) !== 0;

async function viewSlip(id){
  const o = cloudOrders.find(x => x.id === id);
  const dup = slipSeenBefore(o);
  const byRef = !!(dup && o.slipRef && dup.ref === o.slipRef);
  const done = o ? n(o.chk) : 0;
  openDialog({ icon:'cart', title:'สลิปที่ลูกค้าแนบมา',
    sub: o ? `คิวที่ ${esc(String(o.no || '–'))}${o.who ? ' · ' + esc(o.who) : ''}` : '',
    /* คำเตือนต้องอยู่ **เหนือรูป** รูปสลิปสูงกว่าจอ ถ้าเอาไว้ใต้รูป
       แม่ค้าต้องเลื่อนลงไปหา แล้วจะไม่มีใครเห็น — เท่ากับไม่ได้เตือน */
    html:`${dup ? `<div class="note bad" style="margin-bottom:12px">${icon('alert',17)}<span>
        <b>สลิปใบนี้เคยใช้มาแล้ว</b>${byRef ? ' (เลขอ้างอิงบนสลิปตรงกัน)' : ''} กับ ${n(dup.no) ? 'คิวที่ ' + esc(String(dup.no)) : 'ออเดอร์เก่า'}${
          dup.who ? ' ของ' + esc(dup.who) : ''} ${esc(whenText(dup.at))} ยอด ${money(dup.total)}<br>
        อาจเป็นการเอาสลิปเดิมมาใช้ซ้ำ — เช็กแอปธนาคารให้ดีก่อนนะครับ
      </span></div>` : ''}
      <div class="slipwant"><span>ยอดที่ต้องได้</span><b>${money(n(o && o.total))}</b></div>
      ${slipQrHTML(o)}
      <div id="slipBox" class="slipview"><div class="empty"><p>กำลังโหลดรูป…</p></div></div>
      <p class="hint" style="margin:12px 0 0"><b>สลิปปลอมทำได้เหมือนจริงมาก</b>
        รูปนี้ใช้ดูประกอบเฉย ๆ ยืนยันเงินเข้าได้จากแอปธนาคารอย่างเดียว
        ${done ? '' : '<br>เปิดแอปธนาคารดูว่าเงินเข้าจริงไหม แล้วกดบอกข้างล่างไว้ จะได้ไม่ต้องเช็กซ้ำ'}</p>`,
    /* ปุ่มสองปุ่มนี้ **ไม่ได้ตรวจอะไรให้** แม่ค้าเป็นคนเช็กแอปธนาคารเอง
       แอปแค่จำผลไว้ จะได้ไม่ต้องเช็กซ้ำ และไม่เผลอทอดให้ใบที่เงินยังไม่เข้า */
    foot: done
      ? [{label:'ปิด', cls:'primary wide', fn:'dlg.close()'}]
      : [{label:'ยอดไม่ตรง', cls:'ghost danger', fn:`markPaidChecked('${jsq(id)}', -1)`},
         {label:'ยอดตรง · เช็กแล้ว', cls:'primary', fn:`markPaidChecked('${jsq(id)}', 1)`}]
  });
  let img = null;
  try{ img = await cloudReq('GET', `s/${db.orderKey}/slips/${id}`); }catch(e){}
  const box = document.getElementById('slipBox');
  if(!box) return;
  box.innerHTML = img
    ? `<img src="${esc(img)}" alt="สลิปที่ลูกค้าแนบ" onclick="openSlipFull()">
       <p class="hint" style="margin:8px 0 0">แตะที่รูปเพื่อดูใหญ่เต็มจอ</p>`
    : `<div class="empty"><p>โหลดรูปไม่ขึ้น — อาจส่งไม่ถึงตอนเน็ตหลุด หรือถูกลบไปแล้ว</p></div>`;
}

/* บรรทัดบอกว่า QR บนสลิปอ่านได้อะไร — อยู่เหนือรูปเหมือนคำเตือนสลิปซ้ำ (รูปสูงกว่าจอ)
   อ่านได้ = บรรทัดเทาธรรมดา **ไม่ใช่ป้ายเขียว** เพราะ QR ไม่ได้บอกว่าเงินเข้า
   ไม่เจอ / ผิดแบบ = แถบเหลืองเตือนเบา ๆ **ห้ามพูดว่าปลอม** อาจแค่ตัดขอบรูปหรือโอนจากกระเป๋าเงิน */
function slipQrHTML(o){
  const st = o ? String(o.slipQr || '') : '';
  const info = o ? slipRefInfo(o.slipRef) : null;
  if(st === 'ok' && info) return `<div class="slipqr">
      <span>QR บนสลิป</span><b>${esc(info.bank)}</b><code>เลขอ้างอิง ${esc(info.ref)}</code>
      <i>QR บอกได้แค่ธนาคารที่โอนกับเลขอ้างอิง ไม่ได้บอกยอดหรือว่าเงินเข้าจริง</i>
    </div>`;
  if(st === 'none') return `<div class="note warn slipqr-w">${icon('alert',17)}<span>
      <b>ไม่เจอ QR บนสลิป</b> สลิปจากแอปธนาคารปกติจะมี QR เล็ก ๆ อยู่
      อาจเป็นรูปที่ตัดขอบหรือถ่ายจอมา — เช็กแอปธนาคารให้ดีนะครับ</span></div>`;
  if(st === 'bad') return `<div class="note warn slipqr-w">${icon('alert',17)}<span>
      <b>QR บนรูปนี้ไม่ใช่แบบของสลิปธนาคาร</b> อาจโอนจากแอปกระเป๋าเงิน หรือแนบรูปผิด
      — เช็กแอปธนาคารให้ดีนะครับ</span></div>`;
  return '';
}

/* จำผลที่แม่ค้าเช็กแอปธนาคารมา — **ไม่ใช่แอปตรวจให้** คนเป็นคนตรวจ
   มีไว้เพื่อ 1) ไม่ต้องเช็กซ้ำใบเดิม 2) ใบที่ยอดไม่ตรงจะขึ้นป้ายแดงกันเผลอทอด
   เก็บขึ้นที่เก็บด้วย เครื่องอื่นของร้าน (ถ้ามี) จะได้เห็นตรงกัน */
async function markPaidChecked(id, val){
  const o = cloudOrders.find(x => x.id === id);
  if(!o) return;
  o.chk = val;
  // ยอดไม่ตรงต้องจดไว้ ออเดอร์ใบนี้หายไปใน 12-24 ชม. แต่คนที่ทำต้องยังจำได้
  if(val < 0) addTrouble('bad', o);
  dlg.close();
  render();
  // ยอดไม่ตรง: หน้าลูกค้าขึ้นป้ายบอกให้มาคุยที่ร้านเอง (อ่านช่อง chk) แม่ค้าต้องรู้ว่าลูกค้ารู้แล้ว
  toast(val > 0 ? 'บันทึกแล้ว เงินเข้าจริง' : 'บันทึกแล้ว ยอดไม่ตรง — แจ้งลูกค้าให้แล้ว · อย่าเพิ่งทำ');
  try{ await cloudReq('PATCH', `s/${db.orderKey}/orders/${id}`, { chk: val }); }
  catch(e){ toast('บันทึกขึ้นที่เก็บไม่สำเร็จ เน็ตอาจหลุด'); }
}

/* เปิดรูปเต็มจอในแท็บใหม่ — สลิปตัวหนังสือเล็ก ย่อไว้ครึ่งจอแล้วอ่านเลขอ้างอิงไม่ออก
   ใช้ blob ไม่ใช่ data: เพราะเบราว์เซอร์หลายตัวไม่ยอมเปิดแท็บจาก data: */
function openSlipFull(){
  const im = document.querySelector('.slipview img');
  if(!im) return;
  try{
    const b = atob(String(im.src).split(',')[1] || '');
    const u8 = new Uint8Array(b.length);
    for(let i = 0; i < b.length; i++) u8[i] = b.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], {type:'image/jpeg'}));
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(e){ toast('เปิดรูปใหญ่ไม่ได้'); }
}

/* บอกเวลาแบบคนพูด ไม่ใช่ timestamp
   **ต้องมี "เมื่อวาน"** เพราะเรื่องที่ต้องรู้ให้ไวที่สุดคือสลิปที่ข้ามวันมาใช้ซ้ำ
   เขียนเป็น "3/11 14:20" แม่ค้าต้องนึกเองว่าเมื่อวานวันที่เท่าไหร่ กว่าจะรู้ตัวก็ทอดไปแล้ว */
function whenText(ms){
  const d = new Date(n(ms));
  const hm = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  const k = dayKey(d);
  if(k === dayKey()) return `วันนี้ ${hm}`;
  const y = new Date(); y.setDate(y.getDate() - 1);
  if(k === dayKey(y)) return `เมื่อวาน ${hm}`;
  return `${d.getDate()}/${d.getMonth()+1} ${hm}`;
}

/* ---------- การ์ดออเดอร์บนหน้าแรก ---------- */
/* ---------- กระดิ่งแจ้งออเดอร์ มุมบนขวา ----------
   อยู่คู่กับแถบแดง: แถบบอกรายละเอียด กระดิ่งเป็นทางเข้าที่อยู่ที่เดิมตลอด
   แม้ไม่มีออเดอร์ค้าง ก็ยังกดเข้าไปดูได้ */
function renderBell(){
  const b = document.getElementById('bellBtn');
  if(!b) return;
  const n2 = cloudOrders.length;
  b.hidden = !db.orderOn;
  if(b.hidden) return;
  b.classList.toggle('on', n2 > 0);
  b.innerHTML = icon('bell', 19) + (n2 ? `<span class="bell-n">${n2 > 9 ? '9+' : n2}</span>` : '');
}

// สั่นทีหนึ่งตอนมีออเดอร์ใหม่เข้ามา เรียกคู่กับเสียงเตือน
function ringBell(){
  const b = document.getElementById('bellBtn');
  if(!b || b.hidden) return;
  b.classList.remove('ring');
  void b.offsetWidth;            // บังคับให้เบราว์เซอร์เริ่มนับใหม่ ไม่งั้นสั่งซ้ำแล้วไม่เล่น
  b.classList.add('ring');
}

/* แถบเล็กบนสุดของทุกหน้า — บอกว่ามีออเดอร์กี่ใบและใบถัดไปคืออะไร
   เดิมเอาการ์ดเต็มมาแปะบนสุด พอมี 4 ใบมันกินเต็มจอแรก แดชบอร์ดถูกดันหายหมด
   เลยย่อเหลือแถบเดียว แตะแล้วเข้าหน้าออเดอร์เต็ม ๆ */
function ordersBar(){
  /* ที่เก็บปฏิเสธ = ลูกค้าสั่งไม่ได้และออเดอร์ไม่เข้า เรื่องใหญ่กว่าออเดอร์ค้าง
     ขึ้นก่อนเสมอ และขึ้นทุกหน้า แม้จะอยู่หน้าออเดอร์อยู่แล้วก็ตาม */
  if(db.orderOn && cloudDenied){
    return `<button type="button" class="obar warn" onclick="cloudDeniedHelp()">
      <span class="obar-n">!</span>
      <span class="obar-m">
        <span class="obar-t">ลูกค้าสั่งไม่ได้ตอนนี้</span>
        <span class="obar-s">ที่เก็บออเดอร์ไม่ให้เข้าถึง · แตะดูวิธีแก้</span>
      </span>
      <span class="obar-go">ดู${icon('chev',15)}</span>
    </button>`;
  }
  if(!db.orderOn || !cloudOrders.length || tab === 'orders') return '';
  const fresh = cloudOrders.filter(o => o.status === 'new').length;
  const next  = cloudOrders[0];
  const what  = (next.items || []).map(it => `${it.name} ×${it.qty}`).join(' · ');
  return `<button type="button" class="obar" onclick="go('orders')">
    <span class="obar-n">${cloudOrders.length}</span>
    <span class="obar-m">
      <span class="obar-t">${cloudOrders.length} ออเดอร์${
        fresh ? ` · ใหม่ ${fresh} ใบรอรับ` : ' · กำลังทำอยู่'}</span>
      <span class="obar-s">${next.no ? `คิวที่ ${esc(String(next.no))} · ` : ''}${esc(what || 'ออเดอร์จากลูกค้า')}</span>
    </span>
    <span class="obar-go">ดู${icon('chev',15)}</span>
  </button>`;
}

/* ---------- หน้าออเดอร์เต็ม ๆ (แท็บซ่อน เข้าจากแถบบนสุด) ---------- */
function viewOrders(){
  const back = `<button class="btn back" onclick="go('today')">${icon('back',16)} แดชบอร์ด</button>`;

  if(!db.orderOn){
    return back + `<div class="card">
      ${cardHead('cart','ยังไม่ได้เปิดรับออเดอร์','ลูกค้ายังสั่งผ่าน QR ไม่ได้')}
      <button type="button" class="btn primary block" onclick="orderSetupDialog()">
        ${icon('cart',16)} ไปตั้งค่าการรับออเดอร์</button>
    </div>` + troubleCard();
  }

  if(!cloudOrders.length){
    return back + `<div class="card">
      <div class="empty">
        <div class="empty-ic">${icon('check',34)}</div>
        <h3>ไม่มีออเดอร์ค้าง</h3>
        <p>ทำครบหมดแล้ว · ออเดอร์ใหม่จะเด้งขึ้นมาเองพร้อมเสียงเตือน</p>
      </div>
    </div>` + clearTodayCard() + troubleCard();
  }

  const fresh = cloudOrders.filter(o => o.status === 'new');
  const cook  = cloudOrders.filter(o => o.status === 'cook');
  const sec = (list, ic, title, sub) => list.length ? `<div class="card">
    ${cardHead(ic, title, sub, `<span class="head-tag">${list.length} ใบ</span>`)}
    <div class="ords">${list.map(orderRowHTML).join('')}</div>
  </div>` : '';

  return back
    + sec(fresh, 'cart', 'ออเดอร์ใหม่ รอรับ', 'กดรับแล้วลูกค้าเห็นเลขคิว')
    + sec(cook,  'today', 'กำลังทำอยู่',      'ลูกค้ามารับแล้วกดเสร็จ · รับเงิน')
    + clearTodayCard() + troubleCard();
}

/* กล่องล้างออเดอร์วันนี้ อยู่ท้ายหน้าออเดอร์เสมอ
   วางไว้ล่างสุดตั้งใจ — เป็นของที่นาน ๆ ใช้ที ไม่ควรอยู่ใกล้ปุ่มรับออเดอร์
   ที่แม่ค้ากดรัว ๆ ตอนยืนทอด จะได้ไม่กดโดนตอนมือเปื้อนแป้ง */
function clearTodayCard(){
  return `<div class="card">
    <p class="hint" style="margin:0">ลองกดเล่นจนมีออเดอร์ปลอมกองอยู่?
      ล้างทิ้งทั้งวันได้ <b>ยอดขายที่รับเงินไปแล้วไม่หาย</b> และเลขคิวจะเริ่มนับ 1 ใหม่ ·
      <button type="button" class="seeall" style="margin-top:8px"
              onclick="clearTodayOrders()">ล้างออเดอร์วันนี้</button></p>
  </div>`;
}

/* ปุ่มสองปุ่มกับราคาเบียดกันไม่ลงในแถว .li ปกติ (ราคาถูกบีบจนหาย)
   ออเดอร์เลยใช้ทรงของตัวเอง: บรรทัดบนคือของกับราคา ปุ่มลงไปอยู่บรรทัดล่างเต็มความกว้าง
   แม่ค้ามือเปื้อนแป้งกดตอนยืนทอด ปุ่มใหญ่ไว้ดีกว่า */
function orderRowHTML(o){
  const items = Array.isArray(o.items) ? o.items : [];
  const cook = o.status === 'cook';

  /* แยกของเป็นแถวละจาน พร้อมไส้ของจานนั้นอยู่ใต้ชื่อ
     ของเดิมต่อทุกจานเป็นพรืดเดียวแล้วเอาไส้ทุกจานมากองรวมกัน
     เจ้าของเจอเอง: "มีหลายรายการแล้วดูงง ๆ" — ไม่มีทางรู้ว่าไส้ไหนของจานไหน */
  const itemsHTML = items.length
    ? `<div class="ord-items">${items.map(it => {
        const tops = (it.addons || []).map(a => a && a.name).filter(Boolean);
        return `<div class="ord-it">
          <span class="ord-it-q">${esc(String(n(it.qty) || 1))}</span>
          <div class="ord-it-m">
            <div class="ord-it-n">${esc(it.name || 'ไม่มีชื่อ')}</div>
            ${tops.length ? `<p class="ord-it-a">${esc(tops.join(' · '))}</p>` : ''}
          </div>
          ${n(it.total) ? `<span class="ord-it-p">${money(n(it.total))}</span>` : ''}
        </div>`;
      }).join('')}</div>`
    : '<div class="ord-s">(ไม่มีรายการ)</div>';

  // บรรทัดบนเหลือแค่ว่าใครสั่ง / กี่รายการ ส่วนของอยู่ในรายการข้างล่างแล้ว
  const head = o.who ? esc(o.who)
             : items.length > 1 ? `${items.length} รายการ`
             : 'ลูกค้าไม่ได้ฝากชื่อ';
  const bits = [
    cook ? 'กำลังทำอยู่' : 'ออเดอร์ใหม่ · รอรับ',
    o.note ? esc(o.note) : ''
  ].filter(Boolean);

  /* ลูกค้ากด "จ่ายแล้ว" มาเอง — **แอปเช็กเงินเข้าแทนไม่ได้**
     ป้ายนี้บอกแค่ว่าลูกค้าแจ้งว่าจ่าย แม่ค้าต้องเปิดแอปธนาคารดูเองก่อนลงมือทอด
     เขียนให้ชัดว่า "แจ้งว่า" ไม่ใช่ "จ่ายแล้ว" เฉย ๆ จะได้ไม่เผลอเชื่อ */
  /* n(o.chk): 1 = แม่ค้าเช็กแอปธนาคารแล้วยอดตรง · -1 = เช็กแล้วยอดไม่ตรง · ไม่มี = ยังไม่ได้เช็ก */
  const chk = n(o.chk);
  const paidTag = o.paid
    ? (chk > 0
        ? `<span class="ord-paid ok">${icon('check',13)} เช็กแล้ว เงินเข้าจริง ${money(n(o.total))}</span>`
        : chk < 0
        ? `<span class="ord-paid no">${icon('alert',13)} ยอดไม่ตรง! ยังไม่ได้เงิน · อย่าเพิ่งทำ</span>`
        : `<span class="ord-paid">${icon('check',13)} ลูกค้าแจ้งว่าโอนแล้ว ${money(n(o.total))} · เช็กแอปธนาคารก่อนนะ</span>`)
    : '';

  /* ยังไม่ได้กดบอกว่ายอดตรงไหม = ยังกดรับไม่ได้ (เจ้าของสั่งเอง)
     **แค่เปิดดูสลิปไม่นับ** รูปสลิปไม่ได้บอกว่าเงินเข้าจริง ต้องเปิดแอปธนาคารดูแล้วกดบอกผล
     ทรงเดียวกับฝั่งลูกค้าที่ปิดปุ่มส่งไว้จนกว่าจะแนบสลิป — ปิดปุ่มแล้วบอกว่าต้องทำอะไรก่อน
     **เงินสด / จ่ายตอนมารับของ ไม่เกี่ยว** กดรับได้ตามปกติ */
  const needLook = !cook && o.paid && o.slip && !slipChecked(o);

  // สลิปซ้ำต้องเตือนตั้งแต่บนการ์ด ไม่ต้องรอให้กดเข้าไปดู
  const dup = slipSeenBefore(o);
  const slipTag = o.slip
    ? `<button type="button" class="ord-slip${dup ? ' dup' : needLook ? ' need' : ''}" onclick="viewSlip('${jsq(o.id)}')">
         ${icon(dup ? 'alert' : 'menu', 13)} ${dup
             ? 'สลิปซ้ำ! เคยใช้กับ ' + (n(dup.no) ? 'คิวที่ ' + esc(String(dup.no)) : 'ออเดอร์เก่า')
               + ' ' + esc(whenText(dup.at)) + ' · แตะดู'
             : needLook ? 'ดูสลิปที่แนบมา · กดเช็กยอด' : 'ดูสลิปที่แนบมา'}
       </button>`
    : '';

  return `<div class="ord${cook ? ' cook' : ''}">
    <div class="ord-top">
      <span class="ord-no">${o.no ? esc(String(o.no)) : '–'}</span>
      <div class="ord-m">
        <div class="ord-n">${o.no ? `<span class="ord-q">คิวที่ ${esc(String(o.no))}</span>` : ''}${head}</div>
        <div class="ord-s">${bits.join(' · ')}</div>
      </div>
      <b class="ord-p">${money(n(o.total))}</b>
    </div>
    ${itemsHTML}
    ${paidTag || slipTag ? `<div class="ord-tags">${paidTag}${slipTag}</div>` : ''}
    <div class="ord-act">
      ${cook
        ? `<button type="button" class="btn ghost" onclick="deleteOrder('${jsq(o.id)}')">ลบทิ้ง</button>
           <button type="button" class="btn primary wide" onclick="finishOrder('${jsq(o.id)}')">เสร็จแล้ว · รับเงิน</button>`
        : `<button type="button" class="btn ghost" onclick="rejectOrder('${jsq(o.id)}')">ไม่รับ</button>
           <button type="button" class="btn primary" ${needLook ? 'disabled' : ''}
                   onclick="takeOrder('${jsq(o.id)}')">${
             needLook ? 'เช็กยอดก่อนถึงจะรับได้' : 'รับออเดอร์'}</button>`}
    </div>
  </div>`;
}

/* บอกตรง ๆ ว่าตอนนี้เด้งแจ้งเตือนได้หรือยัง
   ถ้าแม่ค้าเผลอกดไม่อนุญาตไป จะได้รู้ว่าทำไมไม่มีอะไรเด้ง และต้องไปแก้ที่ไหน */
function notifyLine(){
  if(!('Notification' in window))
    return 'เครื่องนี้ไม่รองรับแถบแจ้งเตือน — ยังมีเสียงเตือนกับแถบแดงในแอปเหมือนเดิม';
  if(Notification.permission === 'granted')
    return 'เปิดแถบแจ้งเตือนไว้แล้ว ✓ สลับไปเล่นแอปอื่นก็ยังเห็นออเดอร์ใหม่';
  if(Notification.permission === 'denied')
    return 'เครื่องนี้ <b>ปิดแถบแจ้งเตือน</b>ของแอปนี้ไว้ เปิดคืนได้ที่ ตั้งค่าเครื่อง → การแจ้งเตือน';
  return `ยังไม่ได้เปิดแถบแจ้งเตือน · <button type="button" class="seeall"
          onclick="turnOnNotify()">เปิดแถบแจ้งเตือน</button>`;
}

async function turnOnNotify(){
  const ok = await askNotifyOK();
  toast(ok ? 'เปิดแถบแจ้งเตือนแล้ว' : 'ยังไม่ได้เปิด — ลองอีกทีหรือเปิดที่ตั้งค่าเครื่อง');
  orderSetupDialog();
}

/* เบอร์พร้อมเพย์ที่จะเอาไปทำ QR ให้ลูกค้าสแกนจ่าย
   **เลขนี้ขึ้นคลาวด์ไปกับใบเมนู** เพราะต้องให้มือถือลูกค้าสร้าง QR ได้
   ใครมีลิงก์ร้านก็เห็นเลขนี้ได้ (และเห็นชื่อบัญชีตอนกรอกในแอปธนาคาร)
   เจ้าของรับทราบแล้ว — ถ้าไม่อยากให้ขึ้น เว้นช่องนี้ว่างไว้ ลูกค้าจะจ่ายตอนมารับของอย่างเดียว */
function setPayId(v){
  const d = String(v || '').replace(/\D/g, '');
  db.payId = d; save();
  publishMenuSoon();
  render();
  toast(d ? 'บันทึกเบอร์พร้อมเพย์แล้ว — ลูกค้าสแกนจ่ายก่อนส่งออเดอร์ได้'
          : 'เอาพร้อมเพย์ออกแล้ว — ลูกค้าจะจ่ายตอนมารับของอย่างเดียว');
}

// บอกตรง ๆ ว่าเลขที่กรอกถูกอ่านเป็นอะไร จะได้รู้ทันทีถ้าพิมพ์ผิด
function payIdHint(){
  const d = String(db.payId || '').replace(/\D/g, '');
  if(!d) return 'ยังไม่ได้ใส่ — ลูกค้าจะเห็นแค่ "จ่ายตอนมารับของ" ไม่มี QR ให้สแกน';
  if(d.length === 13) return `อ่านเป็น <b>เลขบัตรประชาชน/ผู้เสียภาษี</b> ${esc(d)} · บัญชีนี้ต้องผูกพร้อมเพย์ไว้แล้ว`;
  if(d.length === 15) return `อ่านเป็น <b>เลขกระเป๋าเงิน</b> ${esc(d)}`;
  if(d.length === 10 || d.length === 11) return `อ่านเป็น <b>เบอร์มือถือ</b> ${esc(d)} · บัญชีนี้ต้องผูกพร้อมเพย์ไว้แล้ว`;
  return `<b>เลขดูแปลก ๆ (${d.length} หลัก)</b> เบอร์มือถือต้อง 10 หลัก เลขบัตรประชาชน 13 หลัก — เช็กอีกทีนะครับ`;
}

/* ลิงก์ตัวกลางสำหรับส่งแจ้งเตือนเข้า LINE
   **เก็บในเครื่องอย่างเดียว ไม่ขึ้นคลาวด์** ใครได้ลิงก์ไปก็ส่งข้อความเข้าไลน์ร้านได้ */
function setLineUrl(v){
  db.lineUrl = String(v || '').trim();
  lineErr = '';
  save(); render();
  toast(db.lineUrl ? 'บันทึกลิงก์แจ้งเตือน LINE แล้ว — ลองกดส่งข้อความทดสอบดู'
                   : 'เอาลิงก์แจ้งเตือน LINE ออกแล้ว — เหลือแจ้งเตือนในแอปเหมือนเดิม');
}

async function testLine(){
  if(!String(db.lineUrl || '').trim()){ toast('ยังไม่ได้ใส่ลิงก์แจ้งเตือน LINE'); return; }
  toast('กำลังส่ง…');
  const ok = await sendLine(`ทดสอบจาก${db.shopName || 'แอปร้าน'} — เห็นข้อความนี้แปลว่าใช้ได้แล้ว`);
  toast(ok ? 'ส่งแล้ว ลองเปิด LINE ดู' : 'ส่งไม่สำเร็จ — ' + lineErr);
  orderSetupDialog();
}

/* บอกตรง ๆ ว่าตอนนี้อยู่ตรงไหน และเหลือโควตาเท่าไหร่
   **โควตาหมดแล้ว LINE หยุดส่งเงียบ ๆ** ถ้าไม่นับให้ดู แม่ค้าจะนึกว่าวันนี้ไม่มีลูกค้าสั่ง */
function lineUrlHint(){
  if(!String(db.lineUrl || '').trim())
    return 'ยังไม่ได้ใส่ — ออเดอร์ใหม่จะเตือนแค่ในเครื่องนี้ · วิธีทำอยู่ในไฟล์ line-อ่านก่อน.md';
  const used = lineUsed();
  const left = LINE_MAX - used;
  const warn = left <= 0
    ? `<br><b>เดือนนี้ส่งครบ ${LINE_MAX} ข้อความแล้ว</b> แพ็กฟรีของ LINE จะไม่ส่งให้อีกจนขึ้นเดือนใหม่`
    : left <= LINE_NEAR
    ? `<br><b>ใกล้เต็มโควตาแล้ว</b> เหลืออีกราว ${left} ข้อความในเดือนนี้`
    : '';
  const bad = lineErr
    ? `<br><b style="color:var(--bad-ink)">ล่าสุดส่งไม่สำเร็จ:</b> ${esc(lineErr)}` : '';

async function toggleOrders(){
  const box = document.getElementById('cloudBox');
  if(box && !db.orderOn){
    const typed = String(box.value || '').trim();
    if(!typed){ toast('ใส่ชื่อโปรเจกต์ Firebase หรือ URL ของที่เก็บก่อนนะครับ'); return; }
    toast('กำลังหาที่เก็บออเดอร์…');
    const found = await resolveCloud(typed);
    if(!found){
      toast('หาที่เก็บไม่เจอ — เช็กชื่อโปรเจกต์ หรือสร้าง Realtime Database ก่อน');
      return;
    }
    try{ localStorage.setItem(CLOUD_KEY, found); }catch(e){}
    box.value = found;                       // โชว์ URL จริงที่หาเจอ จะได้ก๊อปไปใช้ที่อื่นได้
  }

  if(db.orderOn){
    db.orderOn = false; save(); stopOrderWatch();
    // ต้องบอกหน้าลูกค้าด้วย ไม่งั้นลูกค้ายังสั่งเข้ามาได้เรื่อย ๆ แต่ไม่มีใครเห็น
    // (publishMenuSoon ไม่ทำงานแล้วเพราะ orderOn เป็น 0 จึงต้องสั่งเองตรงนี้)
    try{ await publishMenu(); }catch(e){}
    dlg.close(); render();
    toast('หยุดรับออเดอร์จากลูกค้าแล้ว');
    return;
  }

  if(!cloudReady()){ toast('ใส่ที่เก็บออเดอร์ก่อนนะครับ'); return; }
  if(!db.menus.length){ toast('ตั้งเมนูกับราคาไว้ก่อน ลูกค้าถึงจะสั่งได้'); return; }

  if(!db.orderKey) db.orderKey = uid() + uid();   // รหัสช่องของร้าน เดายาก

  /* มีสองสวิตช์ที่คนละเรื่องกัน: "ร้านเปิดอยู่ไหม" กับ "รับออเดอร์ทางลิงก์ไหม"
     ถ้าเปิดรับออเดอร์ทั้งที่ร้านยังปิดอยู่ ลูกค้าจะเห็นว่า "ร้านปิดอยู่"
     แล้วแม่ค้างงว่าเปิดรับไปแล้วทำไมยังสั่งไม่ได้ — เปิดร้านให้เลย
     ไม่ถามซ้ำ เพราะคนที่กดเปิดรับออเดอร์ก็คือคนที่ตั้งใจจะขายอยู่แล้ว */
  const wasClosed = !db.shopOpen;
  if(wasClosed) db.shopOpen = 1;

  db.orderOn = true; save();
  try{ await publishMenu(); }
  catch(e){ db.orderOn = false; save(); toast('ต่อที่เก็บออเดอร์ไม่ติด ลองเช็ก URL อีกที'); return; }
  // ขออนุญาตเด้งแจ้งเตือนตรงนี้ เพราะเบราว์เซอร์ยอมให้ขอเฉพาะตอนที่คนกดปุ่มเอง
  // ไม่อนุญาตก็ไม่เป็นไร ยังมีเสียงกับแถบแดงในแอปเหมือนเดิม
  await askNotifyOK();
  seenOrders = null;
  startOrderWatch();
  dlg.close(); render();
  toast(wasClosed ? 'เปิดร้านและเปิดรับออเดอร์แล้ว — คัดลอกลิงก์ไปทำ QR ได้เลย'
                  : 'เปิดรับออเดอร์แล้ว — คัดลอกลิงก์ไปทำ QR ติดหน้าร้านได้เลย');
}

// ตัวอักษรแทนรายการในวงกลม — ข้ามสระหน้าของไทยเพื่อให้แต่ละรายการต่างกันจริง
function initial(name){
  const t = String(name || '').trim();
  if(!t) return '?';
  const m = t.match(/[^sเ-ไ]/);   // ตัวแรกที่ไม่ใช่ เ แ โ ใ ไ
  return (m ? m[0] : t[0]);
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function n(v){ const x = parseFloat(v); return isFinite(x) ? x : 0; }
// เจ้าของร้านคิดเป็นบาทเต็ม ไม่ได้คิดเป็นสตางค์ — แสดงทศนิยมเฉพาะตอนเงินน้อยกว่า 10 บาท
function baht(v){
  const x = n(v);
  // เลขกลม ๆ ไม่ต้องมีจุดทศนิยม (5 ไม่ใช่ 5.00) · เลขน้อยกว่า 10 ที่มีเศษค่อยโชว์สตางค์
  if(Number.isInteger(x)) return x.toLocaleString('th-TH');
  return Math.abs(x) < 10
    ? x.toLocaleString('th-TH',{minimumFractionDigits:2, maximumFractionDigits:2})
    : Math.round(x).toLocaleString('th-TH');
}
function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// ค่าที่ต้องไปอยู่ใน onclick="fn('...')" ต้องหนี ' และ \ ด้วย
// ไม่งั้นชื่อแบบ ไข่'พิเศษ จะทำให้สตริง JS ขาด ปุ่มกดไม่ติดแบบเงียบ ๆ
function jsq(s){
  return esc(String(s ?? '').replace(/[\r\n]+/g, ' ').replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
// เงินติดลบต้องเป็น -฿400 ไม่ใช่ ฿-400
function money(v){ const x = n(v); return (x < 0 ? '-฿' : '฿') + baht(Math.abs(x)); }

// ราคาต่อหน่วยมักเป็นเลขจุดทศนิยมยาว ๆ (0.0450) คนทั่วไปอ่านยาก
// ถ้าต่ำกว่า 1 บาทให้บอกเป็นสตางค์แทน
function perUnit(ing){
  const c = unitCost(ing), u = esc(ing.unit);
  if(c === 0) return 'ยังไม่ได้ใส่ราคา';
  if(c < 1) return `${u}ละ ${(c*100).toFixed(c < 0.1 ? 1 : 0)} สตางค์`;
  return `${u}ละ ${baht(c)} บาท`;
}

/* ===================== การคำนวณ ===================== */
const unitCost = ing => n(ing.packQty) > 0 ? n(ing.packPrice) / n(ing.packQty) : 0;
const findIng = id => db.ingredients.find(i => i.id === id);

function menuCost(m){
  return (m.items||[]).reduce((s,it) => {
    const ing = findIng(it.ingId);
    return s + (ing ? unitCost(ing) * n(it.qty) : 0);
  }, 0);
}
const profit = m => n(m.price) - menuCost(m);
const marginPct = m => n(m.price) > 0 ? profit(m) / n(m.price) * 100 : 0;
const suggestPrice = m => {
  const mg = n(db.targetMargin);
  return mg < 100 ? menuCost(m) / (1 - mg/100) : 0;
};

function fixedPerMonth(){
  const f = db.fixed;
  return n(f.rent)+n(f.electric)+n(f.gas)+n(f.water)+n(f.other) + n(f.labor)*n(f.days);
}
const fixedPerDay = () => n(db.fixed.days) > 0 ? fixedPerMonth() / n(db.fixed.days) : 0;

function avgProfit(){
  const list = db.menus.filter(m => n(m.price) > 0);
  if(!list.length) return 0;
  return list.reduce((s,m) => s + profit(m), 0) / list.length;
}
const breakEven = () => avgProfit() > 0 ? fixedPerDay() / avgProfit() : 0;

/* ภาพรวมทั้งร้านต่อวัน — คิดจากยอดขายโดยประมาณของแต่ละเมนู */
function daily(){
  let revenue = 0, food = 0, plates = 0;
  db.menus.forEach(m => {
    const q = n(m.qtyPerDay);
    if(q <= 0) return;
    plates  += q;
    revenue += n(m.price) * q;
    food    += menuCost(m) * q;
  });
  const fixed = fixedPerDay();
  const gross = revenue - food;          // กำไรก่อนหักค่าเช่า/ค่าไฟ
  const net   = gross - fixed;           // กำไรสุทธิจริง ๆ
  const perPlate = plates > 0 ? gross / plates : avgProfit();
  return {
    revenue, food, fixed, gross, net, plates, perPlate,
    need: perPlate > 0 ? fixed / perPlate : 0,   // ต้องขายกี่จานถึงคุ้ม
    month: net * n(db.fixed.days)
  };
}
const hasSales = () => db.menus.some(m => n(m.qtyPerDay) > 0);

// บอกสถานะเป็นคำ คนอ่านไม่ต้องตีความสีเอง
function statusWord(m){
  if(n(m.price) <= 0) return {word:'ยังไม่ได้ใส่ราคา', lv:'warn'};
  if(profit(m) < 0)   return {word:'ขาดทุน', lv:'bad'};
  const lv = level(marginPct(m));
  return {word: lv==='good' ? 'กำไรดี' : lv==='warn' ? 'กำไรพอใช้' : 'กำไรน้อย', lv};
}

// ระดับของกำไร: ถึงเป้า / ใกล้เป้า / ต่ำไป  — ใช้คู่กับตัวเลขเสมอ ไม่ให้สีสื่อความหมายลำพัง
// เกณฑ์ตามมาตรฐานร้านอาหารทั่วไป ไม่ผูกกับเป้าที่ผู้ใช้ตั้ง
// (เป้าที่ตั้งเอาไว้ใช้คำนวณ "ราคาที่แนะนำ" อย่างเดียว)
function level(mg){
  if(mg >= 60) return 'good';   // กำไรดี
  if(mg >= 45) return 'warn';   // พอใช้
  return 'bad';                 // น้อยไป
}

// ตัวเลขสำคัญของแต่ละแท็บ แสดงไว้บนสุดของหน้า
function headStat(){
  if(tab === 'sale') return null;      // หน้าขายใช้พื้นที่ทั้งหมดกับเมนูและบิล
  if(recipeDraft) return {k:'กำลังเลือกของที่ใช้', v:'', s:'ติ๊กของที่ใช้ แล้วใส่จำนวนต่อ 1 จาน'};

  // เตือนเรื่องบิลค้างเฉพาะตอนที่มีของอยู่ในบิลจริง ๆ
  // บิลเปล่าที่สร้างรอไว้ตอนเข้าแท็บขายไม่ใช่เรื่องที่ต้องขึ้นเตือนทุกหน้า
  if(order && orderCount() > 0)
    return {k:'มีบิลค้างอยู่', v: baht(orderTotal()), u:'บาท',
            s: `${orderCount()} จานในบิลนี้ · ยังไม่ได้รับเงิน`};
  if(tab === 'today') return null;    // การ์ดหลักบน Dashboard บอกอยู่แล้ว ไม่ต้องซ้ำ

  if(tab === 'hist') return null;     // การ์ดเดือนบอกครบแล้ว
  if(tab === 'money') return null;    // การ์ดรายจ่ายบอกครบแล้ว
  if(tab === 'setup') return null;    // การ์ดร้านบอกครบแล้ว
  if(tab === 'more'){
    return {k:'อื่น ๆ', v:'', s:'ของที่นาน ๆ ใช้ที'};
  }
  // ing / fixed / dash มีการ์ดสรุปจาก subHead() อยู่หัวหน้าแล้ว
  // ใส่ตัวเลขใหญ่ซ้ำอีกชั้นคือบอกเรื่องเดียวกันสามรอบ กินที่เปล่า ๆ
  if(tab === 'ing' || tab === 'fixed' || tab === 'orders') return null;
  if(tab === 'menu'){
    const ms = db.menus.filter(m => (m.items||[]).length);
    const avg = ms.length ? ms.reduce((a,m)=>a+marginPct(m),0)/ms.length : 0;
    if(openMenuId){
      const m = findMenu(openMenuId);
      // ยังไม่ได้บอกว่าเมนูนี้ใช้ของอะไร = ยังไม่รู้ต้นทุน ไม่ใช่กำไร 100%
      // ของเดิมขึ้น "กำไร 100% · ค่าของ 0" ซึ่งหลอกตา แม่ค้าอาจตั้งราคาผิดเพราะเชื่อเลขนี้
      if(m && !(m.items||[]).length)
        return {k:'กำไรของเมนูนี้', v:'–', u:'',
                s:'ยังไม่ได้ใส่ว่าเมนูนี้ใช้ของอะไรบ้าง เลยยังคิดต้นทุนไม่ได้'};
      if(m) return {k:'กำไรของเมนูนี้', v: n(m.price)>0 ? marginPct(m).toFixed(0) : '–', u:'%',
                    s: n(m.price)>0 ? `ขาย ${baht(m.price)} · ค่าของ ${baht(menuCost(m))} · เหลือ ${baht(profit(m))} บาท` : 'ยังไม่ได้ใส่ราคาขาย'};
    }
    return {k:'เมนูที่ขาย', v:String(db.menus.length), u:'เมนู',
            s: ms.length ? `กำไรเฉลี่ย ${avg.toFixed(0)}% ต่อจาน` : 'ยังไม่ได้ใส่ว่าแต่ละเมนูใช้ของอะไร'};
  }
  if(!db.menus.length) return {k:'ยินดีต้อนรับ', v:'', s:'เริ่มจากใส่ของที่ซื้อมา แล้วแอปจะคิดกำไรให้เอง'};
  if(!hasSales()) return {k:'ภาพรวมร้าน', v:'', s:'ใส่ยอดขายต่อวัน แล้วจะรู้ว่าเดือนนี้เหลือเท่าไหร่'};
  const d = daily();
  return {k: d.net>=0 ? 'กำไรสุทธิเดือนนี้' : 'ขาดทุนเดือนนี้',
          v: baht(Math.abs(d.month)), u:'บาท',
          s: d.net>=0 ? `วันละ ${baht(d.net)} บาท จากการขาย ${d.plates} จาน`
                      : `ขาดทุนวันละ ${baht(-d.net)} บาท — ต้องขายเพิ่ม`};
}

// หน้าที่ไม่ได้อยู่บนแถบเมนูล่าง — เข้าได้จากทางลัดหรือหน้าตั้งค่า
const PAGES = {
  ing:   ['','ของที่ซื้อมา','ing'],
  menu:  ['','เมนูและสูตร','menu'],
  fixed: ['','ต้นทุนคงที่','fixed'],
  dash:  ['','ภาพรวมร้าน','dash'],
  orders:['','ออเดอร์จากลูกค้า','cart'],
  more:  ['','อื่น ๆ','more']
};

/* เก็บกวาดสถานะที่เป็น "ของหน้าใดหน้าหนึ่ง" ตอนเปลี่ยนหน้า
   อยู่ใน render() ไม่ใช่ go() เพราะมีอีกหลายที่ในแอป (ปิดบิล สลับร้าน ลบร้าน ใส่เมนูชุด
   ล้างข้อมูล ใส่ข้อมูลตัวอย่าง) ที่เซ็ต tab เองแล้วเรียก render() ตรง ๆ
   ถ้าวางไว้ใน go() เส้นทางพวกนั้นจะข้ามการเก็บกวาดทั้งหมด แล้วสถานะเก่าจะตามไปโผล่หน้าอื่น */
function syncPageState(from, to){
  if(to !== 'today') homeQ = '';                       // คำค้นเป็นของหน้าแรก
  if(to !== 'menu'){ recipeDraft = null; openMenuId = null; }   // สูตร/เมนูที่เปิดค้าง เป็นของหน้าเมนู
  if(to === 'sale'){ if(!order) order = { lines: [] }; }        // เข้าหน้าขายมีบิลเปล่ารอเลย
  else if(order && !orderCount()) order = null;                 // บิลเปล่าไม่ตามไปหน้าอื่น
  // กลับเข้าหน้าแรกจากที่อื่น ให้เด้งมาที่วันนี้เสมอ ไม่ค้างอยู่วันที่เคยกดดูย้อนหลัง
  if(to === 'today' && from !== 'today') dashDay = dayKey();
}

function render(){
  if(tab !== shownTab) syncPageState(shownTab, tab);   // ต้องทำก่อนวาด ไม่งั้นหน้าใช้ค่าเก่า
  const t = TABS.find(x => x[0] === tab) || PAGES[tab] || ['','ภาพรวม','dash'];
  document.getElementById('pageTitle').textContent = t[3] || t[1];
  document.getElementById('appbarIc').innerHTML = icon(t[2] || 'dash', 19);
  const sub = document.getElementById('pageSub');
  const many = !isLocked() && store.shops.length > 1;
  sub.innerHTML = `<span>${esc(shopLine())}</span>`
    + (isLocked() ? '' : icon('down',13))
    + (many ? `<b>${store.shops.length} ร้าน</b>` : '');
  sub.classList.toggle('fixed', isLocked());
  sub.disabled = isLocked();
  sub.hidden = !shopLine();

  const hs = headStat();
  document.getElementById('headStat').innerHTML = !hs ? '' :
    `<div class="k">${hs.k}</div>` +
    (hs.v ? `<div class="v">${hs.v}${hs.u ? `<small>${hs.u}</small>` : ''}</div>` : '') +
    `<div class="s">${hs.s}</div>`;

  const pb = document.getElementById('pinBtn');
  pb.hidden = !hasPin();
  pb.classList.toggle('open', isAdmin());
  pb.title = isAdmin() ? 'ปลดล็อกอยู่ — แตะเพื่อล็อก' : 'ล็อกอยู่ — แตะเพื่อปลดล็อก';

  document.body.classList.toggle('hide-banner', tab === 'sale');

  const neg = tab === 'dash' && db.menus.length && hasSales() && daily().net < 0;
  document.getElementById('headStat').classList.toggle('is-bad', !!neg);

  // แถบเมนูสร้างครั้งเดียว แล้วแค่สลับคลาส ห้ามวาดใหม่ทุกรอบ
  // ถ้าวาดใหม่ ปุ่มที่นิ้วกดอยู่จะถูกทำลายทิ้งทันที :active เลยไม่มีโอกาสแสดง
  // และปุ่มใหม่เกิดมาพร้อมคลาส on อยู่แล้ว วงกลมจึงไม่มีอะไรให้ค่อย ๆ โตจาก
  const navEl = document.getElementById('tabsBottom');
  if(!navEl.dataset.built){
    /* ครอบปุ่มด้วย .navitem เพื่อให้กล่องเมนูย่อยเกาะตำแหน่งปุ่มของตัวเองได้
       บนมือถือ .navfly ถูก display:none ไว้ จึงไม่กินที่และไม่เปลี่ยนหน้าตาเดิมเลย */
    navEl.innerHTML = TABS.map(([k,l,ic]) => {
      const sub = NAV_SUB[k];
      return `<div class="navitem">
        <button type="button" data-tab="${k}" onclick="go('${k}')" aria-label="${l}">
          ${icon(ic,22)}<span>${l}</span></button>
        ${sub ? `<div class="navfly"><div class="navfly-h">${esc(sub[0])}</div>
          ${sub[1].map(([si,sn,sd,fn]) => `<button type="button" class="navfly-b" onclick="this.blur();${fn}">
            <span class="navfly-ic">${icon(si,17)}</span>
            <span class="navfly-t"><b>${esc(sn)}</b><i>${esc(sd)}</i></span>
          </button>`).join('')}</div>` : ''}
      </div>`;
    }).join('');
    navEl.dataset.built = '1';
  }
  navEl.querySelectorAll('button').forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle('on', on);
    b.setAttribute('aria-current', on ? 'page' : 'false');
  });

  renderBanner();
  document.getElementById('orderInbox').innerHTML = ordersBar();
  renderBell();

  // หัวใหญ่ใช้ทุกหน้า ยกเว้นหน้าขายที่ต้องการพื้นที่เต็มจอ
  const home = tab === 'today';
  // หัวใหญ่ใช้ทุกหน้ารวมหน้าขาย — เคยกันหน้าขายไว้เพราะคิดว่าเปลืองที่
  // แต่วัดจริงแล้วต่างกัน 4px (68 → 72) ไม่คุ้มกับการที่หน้าเดียวหน้าตาไม่เหมือนเพื่อน
  document.getElementById('appbar').classList.add('big');
  // ส่วนบนของหน้าแรก (ค้นหา ทางลัด แถบวัน สถานะ เมนูขายดี) โผล่เฉพาะแท็บแดชบอร์ด
  document.getElementById('homeTop').hidden = !home;
  if(home){
    renderHome();
  }else{
    const si = document.getElementById('searchQ');
    if(si) si.value = '';
  }

  const view = document.getElementById('view');
  view.innerHTML =
    tab==='sale'  ? viewPOS()   :
    tab==='today' ? viewToday() :
    tab==='setup' ? viewSetup() :
    tab==='hist'  ? viewHist()  :
    tab==='money' ? viewExpense() :
    tab==='menu'  ? viewMenu()  :
    tab==='ing'   ? viewIng()   :
    tab==='fixed' ? viewFixed() :
    tab==='dash'  ? viewDash()  :
    tab==='orders'? viewOrders(): viewMore();

  /* ถาดวันในหน้าย้อนหลังอยู่ใน #view ซึ่งถูกวาดใหม่ทั้งก้อนทุกรอบ
     ตำแหน่งที่เลื่อนค้างไว้หายไปอยู่แล้ว จึงต้องเลื่อนไปหาวันที่เลือกให้ใหม่ทุกครั้ง
     (ของหน้าแรกไม่ต้อง paintWeek() ดูแลเองและเก็บตำแหน่งที่แม่ค้าเลื่อนไว้) */
  centerWkRow(view.querySelector('.wk-row'), false);

  // เนื้อหาลอยขึ้นมาเฉพาะตอนเปลี่ยนหน้า
  // render() ถูกเรียกบ่อยมาก (กดบันทึก เปิด-ปิดร้าน สลับวัน) ถ้าเล่นทุกครั้งจะรำคาญ
  if(tab !== shownTab){
    // ทิศการเลื่อน คิดจากตำแหน่งของหน้าในโครงสร้าง
    //  · อยู่บนแถบล่างทั้งคู่   → เทียบลำดับซ้าย-ขวาบนแถบ
    //  · จากแถบล่างเข้าหน้าย่อย → เลื่อนมาจากขวา เหมือนเดินเข้าไปข้างใน
    //  · จากหน้าย่อยกลับออกมา   → เลื่อนมาจากซ้าย เหมือนถอยออก
    const at = k => TABS.findIndex(t => t[0] === k);
    const from = at(shownTab), to = at(tab);
    const cls = from === to            ? 'swap'
              : (from >= 0 && to >= 0) ? (to > from ? 'swap-r' : 'swap-l')
              : to < 0                 ? 'swap-r'      // เข้าไปข้างใน
              : from < 0               ? 'swap-l'      // ถอยออกมา
              :                          'swap';
    shownTab = tab;
    [view, document.getElementById('homeTop')].forEach(el => playSwap(el, cls));
  }
}
let shownTab = null;        // หน้าที่วาดไว้ล่าสุด ใช้ดูว่าเปลี่ยนหน้าหรือแค่วาดซ้ำ
const ADMIN_TABS = ['ing','fixed','dash','menu'];   // เครื่องมือของคนดูแล ไม่ใช่ของหน้าร้าน
// เปลี่ยนหน้า — การเก็บกวาดสถานะอยู่ใน syncPageState() ที่ render() เรียกให้เอง
function go(t){
  if(ADMIN_TABS.includes(t) && !adminOk(() => go(t))) return;
  tab = t; render(); window.scrollTo({top:0});
}

/* ข้อมูลเปลี่ยนยกชุด — สลับร้าน เพิ่ม/ลบร้าน ล้างข้อมูล ใส่ข้อมูลตัวอย่าง ใส่เมนูทั้งชุด
   กรณีพวกนี้ไม่ใช่แค่ย้ายแท็บ แต่ของเดิมทั้งหมดใช้ไม่ได้แล้ว
   ถ้าแค่เซ็ต tab แล้ว render() คำค้น วันที่ที่เลือกไว้ และตัวกรองของร้านเก่าจะตามมาโผล่
   (shownTab = null บังคับให้ syncPageState ทำงานเสมอ แม้แท็บปลายทางจะเป็นแท็บเดิม) */
function resetView(t){
  homeQ = ''; recipeDraft = null; openMenuId = null;
  order = null; orderOpen = false;
  dashDay = dayKey();
  histMonth = null; histSort = 'date'; histOnlyBig = false;
  posCat = null; posQ = ''; quickPick = false;
  tab = t; shownTab = null;
  render(); window.scrollTo({top:0});
}
